name: Set up manylinux Python and Rust
description: Select bundled CPython 3.12 and prepare Rust in the pinned manylinux images

runs:
  using: composite
  steps:
    - name: Select bundled Python and verify image tools
      shell: bash
      env:
        MANYLINUX_PYTHON_ROOT: /opt/python/cp312-cp312
      run: |
        set -euo pipefail
        "${MANYLINUX_PYTHON_ROOT}/bin/python" -c \
          'import sys; assert sys.version_info[:2] == (3, 12), sys.version'
        for tool in cc c++ make auditwheel patchelf; do
          command -v "${tool}" >/dev/null || {
            echo "::error::manylinux image is missing required tool: ${tool}"
            exit 1
          }
        done
        # Versions are pinned by the container digest. Exercise and record
        # the tools before exporting an environment for the wheel build.
        auditwheel --version
        patchelf --version
        echo "${MANYLINUX_PYTHON_ROOT}/bin" >> "${GITHUB_PATH}"
        {
          echo "PYO3_PYTHON=${MANYLINUX_PYTHON_ROOT}/bin/python"
          echo "LIBRARY_PATH=${MANYLINUX_PYTHON_ROOT}/lib"
          # HOME is the checkout; keep toolchain manifests outside the source
          # tree inspected by build_release_artifacts.py and cargo package.
          echo "CARGO_HOME=${RUNNER_TEMP}/cargo"
          echo "RUSTUP_HOME=${RUNNER_TEMP}/rustup"
        } >> "${GITHUB_ENV}"
    - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      with:
        # Match the existing nightly release builder.
        toolchain: "1.96.1"
