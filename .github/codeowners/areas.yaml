# CODEOWNERS-as-code taxonomy for ai-dynamo/aisimulate.

meta:
  catch_all: "@ai-dynamo/access-aisimulate-maintain"

areas:
  - label: maintainers
    github_team: "@ai-dynamo/access-aisimulate-maintain"
    path_globs:
      - AGENTS.md
      - CODE_OF_CONDUCT.md
      - DEVELOPMENT.md
      - LICENSE
      - THIRD_PARTY_NOTICES.md
      - README.md
      - SECURITY.md
      - CONTRIBUTING.md
      - CONTRIBUTORS.md
      - docs/
      - python/aisimulate/src/aisimulate/__init__.py
      - tests/conftest.py
  - label: forward-pass-engine
    github_team: "@ai-dynamo/aisimulate-forward-pass-engine-codeowners"
    path_globs:
      - crates/core/src/perfmodel/
      - crates/core/tests/perfmodel/
      - crates/core/parity_tests/perfmodel/
      - crates/core/perfmodel/
      - crates/tests/public-api/
      - python/aisimulate/
      - python/aisimulate/src/aisimulate/aic.py
      - tests/test_aic.py
  - label: sweeper
    github_team: "@ai-dynamo/aisimulate-sweeper-codeowners"
    path_globs:
      - python/aisimulate/src/aisimulate/sweeper/
      - docs/sweeper/
      - examples/sweeper/
      - tests/sweeper/
  - label: replay
    github_team: "@ai-dynamo/aisimulate-replay-codeowners"
    path_globs:
      - crates/core/examples/
      - crates/core/src/replay/
      - python/aisimulate/src/aisimulate/replay/
      - python/aisimulate/src/aisimulate/runner.py
      - python/aisimulate/src/aisimulate/traffic.py
      - tests/test_cli_config.py
      - tests/test_epd_cli.py
      - examples/cli/
      - tests/test_stack_discovery.py
      - tests/test_unified_cli.py
      - tests/test_unified_traffic_runtime.py
      - tests/test_host_offload_cli.py
      - tests/test_afd_*.py
      - tests/golden/afd-*
      - tests/test_g3_offload_cli.py
      - tests/test_runner.py
      - tests/test_traffic.py
      - tests/e2e/
  - label: mocker
    github_team: "@ai-dynamo/aisimulate-mocker-codeowners"
    path_globs:
      - crates/core/src/engine/
  - label: infra
    github_team: "@ai-dynamo/aisimulate-infra-codeowners"
    path_globs:
      - .github/
      - .dockerignore
      - .gitignore
      - CODEOWNERS
      - Cargo.lock
      - Cargo.toml
      - deny.toml
      - crates/core/Cargo.toml
      - crates/core/deny.toml
      - pytest.ini
      - scripts/
      - tests/test_aic_sync.py
      - tests/test_ci_workflow_contracts.py
      - tests/test_ci_qualification.py
      - tests/test_pages_site.py
      - tests/test_release_fpe.py
      - tests/test_e2e_accuracy_overview.py
      - tests/test_source_compliance.py

# More-specific shared entries are emitted after base area rules, preserving
# GitHub's last-match-wins behavior. As in AIConfigurator, the maintainer team
# stays visible on subsystem changes without requiring every listed team to
# approve: any listed code owner can satisfy GitHub's code-owner gate.
shared:
  # The full AIC product and estimator migration belongs to the Forward Pass
  # Engine area. Maintainers remain co-owners across the compatibility window.
  - glob: crates/core/src/perfmodel/
    owners: [forward-pass-engine, maintainers]
  - glob: crates/core/perfmodel/
    owners: [forward-pass-engine, maintainers]
  - glob: crates/core/parity_tests/perfmodel/
    owners: [forward-pass-engine, maintainers]
  - glob: crates/tests/public-api/
    owners: [forward-pass-engine, maintainers]
  - glob: python/aisimulate/
    owners: [forward-pass-engine, maintainers]
  - glob: docs/artifact-contract.md
    owners: [forward-pass-engine, maintainers]
  - glob: docs/aic-sync.md
    owners: [forward-pass-engine, infra, maintainers]
  - glob: tests/test_aic_sync.py
    owners: [infra, maintainers]
  - glob: tests/test_ci_workflow_contracts.py
    owners: [infra, maintainers]
  - glob: tests/test_pages_site.py
    owners: [infra, maintainers]
  - glob: tests/test_e2e_accuracy_overview.py
    owners: [forward-pass-engine, infra, maintainers]
  - glob: docs/core-api.md
    owners: [forward-pass-engine, maintainers]
  - glob: python/aisimulate/src/aisimulate/__init__.py
    owners: [forward-pass-engine, sweeper, replay, maintainers]
  - glob: python/aisimulate/src/aisimulate/aic.py
    owners: [forward-pass-engine, maintainers]
  - glob: tests/test_aic.py
    owners: [forward-pass-engine, maintainers]
  - glob: python/aisimulate/src/aisimulate/sweeper/
    owners: [sweeper, maintainers]
  - glob: docs/sweeper/
    owners: [sweeper, maintainers]
  - glob: examples/sweeper/
    owners: [sweeper, maintainers]
  - glob: tests/sweeper/
    owners: [sweeper, maintainers]
  - glob: crates/core/src/replay/
    owners: [replay, maintainers]
  - glob: crates/core/examples/
    owners: [replay, maintainers]
  - glob: python/aisimulate/src/aisimulate/replay/
    owners: [replay, maintainers]
  - glob: python/aisimulate/src/aisimulate/runner.py
    owners: [replay, maintainers]
  - glob: python/aisimulate/src/aisimulate/traffic.py
    owners: [replay, maintainers]
  - glob: tests/test_cli_config.py
    owners: [replay, sweeper, forward-pass-engine, maintainers]
  - glob: tests/test_epd_cli.py
    owners: [replay, sweeper, forward-pass-engine, maintainers]
  - glob: examples/cli/
    owners: [replay, sweeper, forward-pass-engine, maintainers]
  - glob: tests/test_stack_discovery.py
    owners: [replay, sweeper, maintainers]
  - glob: tests/test_unified_cli.py
    owners: [replay, sweeper, forward-pass-engine, maintainers]
  - glob: tests/test_unified_traffic_runtime.py
    owners: [replay, maintainers]
  - glob: tests/test_host_offload_cli.py
    owners: [replay, maintainers]
  - glob: tests/test_afd_*.py
    owners: [replay, sweeper, forward-pass-engine, maintainers]
  - glob: tests/golden/afd-*
    owners: [replay, sweeper, forward-pass-engine, maintainers]
  - glob: tests/test_g3_offload_cli.py
    owners: [replay, maintainers]
  - glob: tests/test_runner.py
    owners: [replay, maintainers]
  - glob: tests/test_traffic.py
    owners: [replay, maintainers]
  - glob: tests/e2e/
    owners: [replay, sweeper, forward-pass-engine, maintainers]
  - glob: crates/core/src/engine/
    owners: [mocker, maintainers]
  - glob: crates/core/src/engine/timing.rs
    owners: [mocker, forward-pass-engine, maintainers]
  - glob: crates/core/Cargo.toml
    owners: [mocker, replay, forward-pass-engine, infra, maintainers]
  - glob: crates/core/deny.toml
    owners: [mocker, replay, forward-pass-engine, infra, maintainers]
  - glob: crates/core/README.md
    owners: [mocker, replay, forward-pass-engine, maintainers]
  - glob: crates/core/src/lib.rs
    owners: [mocker, replay, forward-pass-engine, maintainers]
  - glob: crates/core/tests/
    owners: [mocker, replay, maintainers]
  - glob: crates/core/tests/perfmodel/
    owners: [forward-pass-engine, maintainers]
  - glob: crates/core/src/python.rs
    owners: [mocker, replay, forward-pass-engine, maintainers]
  - glob: Cargo.lock
    owners: [infra, maintainers]
  - glob: Cargo.toml
    owners: [infra, maintainers]
  - glob: deny.toml
    owners: [infra, maintainers]
  - glob: pytest.ini
    owners: [infra, maintainers]
  - glob: scripts/
    owners: [infra, maintainers]
  - glob: SECURITY.md
    owners: [infra, maintainers]
  - glob: AGENTS.md
    owners: [infra, maintainers]
  - glob: .coderabbit.yaml
    owners: [infra, maintainers]
  - glob: REVIEW.md
    owners: [infra, maintainers]
  - glob: DEVELOPMENT.md
    owners: [infra, maintainers]
  - glob: .gitattributes
    owners: [infra, maintainers]
  # Imported AIC repository metadata is inactive in this monorepo, but changes
  # still need Infra visibility. The active policy remains at the repository
  # root and is owned by AISimulate Infra plus maintainers below.
  - glob: python/aisimulate/.github/
    owners: [infra, maintainers]
  - glob: python/aisimulate/docker/
    owners: [infra, maintainers]
  - glob: python/aisimulate/.coderabbit.yaml
    owners: [infra, maintainers]
  - glob: python/aisimulate/.dockerignore
    owners: [infra, maintainers]
  - glob: python/aisimulate/.gitattributes
    owners: [infra, maintainers]
  - glob: python/aisimulate/.gitignore
    owners: [infra, maintainers]
  - glob: python/aisimulate/.pre-commit-config.yaml
    owners: [infra, maintainers]
  - glob: python/aisimulate/eslint.config.js
    owners: [infra, maintainers]
  - glob: python/aisimulate/pyproject.toml
    owners: [forward-pass-engine, sweeper, replay, mocker, infra, maintainers]
  - glob: python/aisimulate/pytest.ini
    owners: [infra, maintainers]
  - glob: python/aisimulate/uv.lock
    owners: [infra, maintainers]
  - glob: crates/tests/public-api/Cargo.toml
    owners: [forward-pass-engine, infra, maintainers]
  # Ownership policy changes are reviewed within AISimulate. DevOps is not a
  # code owner and is never required to approve a pull request.
  - glob: python/aisimulate/.github/codeowners/
    owners: [infra, maintainers]
  - glob: python/aisimulate/.github/workflows/codeowners.yml
    owners: [infra, maintainers]
  - glob: .github/codeowners/
    owners: [infra, maintainers]
  - glob: .github/workflows/codeowners.yml
    owners: [infra, maintainers]
  - glob: CODEOWNERS
    owners: [infra, maintainers]
