# CODEOWNERS-as-code taxonomy for ai-dynamo/aisimulate.

meta:
  catch_all: "@ai-dynamo/access-aisimulate-maintain"

areas:
  - label: maintainers
    github_team: "@ai-dynamo/access-aisimulate-maintain"
    path_globs:
      - LICENSE
      - README.md
      - CONTRIBUTORS.md
      - docs/migration.md
      - src/aisimulate/__init__.py
      - tests/conftest.py
  - label: forward-pass-engine
    github_team: "@ai-dynamo/aisimulate-forward-pass-engine-codeowners"
    path_globs:
      - src/aisimulate/aic.py
      - tests/test_aic.py
  - label: sweeper
    github_team: "@ai-dynamo/aisimulate-sweeper-codeowners"
    path_globs:
      - src/aisimulate/sweeper/
      - docs/sweeper/
      - examples/sweeper/
      - tests/sweeper/
  - label: replay
    github_team: "@ai-dynamo/aisimulate-replay-codeowners"
    path_globs:
      - crates/core/src/replay/
      - src/aisimulate/replay/
      - src/aisimulate/runner.py
      - src/aisimulate/traffic.py
      - tests/test_replay_cli.py
      - tests/test_runner.py
      - tests/test_traffic.py
  - label: mocker
    github_team: "@ai-dynamo/aisimulate-mocker-codeowners"
    path_globs:
      - crates/core/src/engine/
  - label: infra
    github_team: "@ai-dynamo/aisimulate-infra-codeowners"
    path_globs:
      - .github/
      - .gitignore
      - Cargo.lock
      - Cargo.toml
      - crates/python/Cargo.toml
      - pyproject.toml
  - label: devops
    github_team: "@ai-dynamo/devops"
    path_globs: []

# More-specific shared entries are emitted after base area rules, preserving
# GitHub's last-match-wins behavior. As in AIConfigurator, the maintainer team
# stays visible on subsystem changes without requiring every listed team to
# approve: any listed code owner can satisfy GitHub's code-owner gate.
shared:
  - glob: src/aisimulate/aic.py
    owners: [forward-pass-engine, maintainers]
  - glob: tests/test_aic.py
    owners: [forward-pass-engine, maintainers]
  - glob: src/aisimulate/sweeper/
    owners: [sweeper, maintainers]
  - glob: docs/sweeper/
    owners: [sweeper, maintainers]
  - glob: examples/sweeper/
    owners: [sweeper, maintainers]
  - glob: tests/sweeper/
    owners: [sweeper, maintainers]
  - glob: crates/core/src/replay/
    owners: [replay, maintainers]
  - glob: src/aisimulate/replay/
    owners: [replay, maintainers]
  - glob: src/aisimulate/runner.py
    owners: [replay, maintainers]
  - glob: src/aisimulate/traffic.py
    owners: [replay, maintainers]
  - glob: tests/test_replay_cli.py
    owners: [replay, maintainers]
  - glob: tests/test_runner.py
    owners: [replay, maintainers]
  - glob: tests/test_traffic.py
    owners: [replay, maintainers]
  - glob: crates/core/src/engine/
    owners: [mocker, maintainers]
  - glob: crates/core/src/engine/timing.rs
    owners: [mocker, forward-pass-engine, maintainers]
  - glob: crates/core/Cargo.toml
    owners: [mocker, replay, infra, maintainers]
  - glob: crates/core/README.md
    owners: [mocker, replay, maintainers]
  - glob: crates/core/src/lib.rs
    owners: [mocker, replay, maintainers]
  - glob: crates/core/tests/
    owners: [mocker, replay, maintainers]
  - glob: crates/python/src/
    owners: [mocker, replay, forward-pass-engine, maintainers]
  - glob: crates/python/Cargo.toml
    owners: [infra, maintainers]
  - glob: Cargo.lock
    owners: [infra, maintainers]
  - glob: Cargo.toml
    owners: [infra, maintainers]
  - glob: pyproject.toml
    owners: [infra, maintainers]
  # Ownership policy changes require DevOps review.
  - glob: .github/codeowners/
    owners: [devops]
  - glob: .github/workflows/codeowners.yml
    owners: [devops]
  - glob: CODEOWNERS
    owners: [devops]
