name: codeowners

# Keeps CODEOWNERS in sync with the declarative source and gates changes that
# would leave a path unowned. Team membership is managed separately.
on:
  pull_request:
    paths:
      - "**"
  push:
    branches: [main]
    paths:
      - "**"

# The workflow runs scripts from the PR diff, so keep its token read-only and
# out of the persisted git configuration.
permissions:
  contents: read

jobs:
  codeowners:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install pyyaml==6.0.3 pytest==8.4.2

      # GitHub prefers these locations over the generated root file. Either
      # one would silently shadow the managed policy.
      - name: Reject shadow CODEOWNERS files
        run: |
          if [[ -e .github/CODEOWNERS || -e docs/CODEOWNERS ]]; then
            echo "::error::The generated root CODEOWNERS must be the repository's only CODEOWNERS file."
            exit 1
          fi

      - name: Unit and repository policy tests
        run: |
          python -m pytest -c /dev/null .github/codeowners/test_*.py -v \
            -p no:cacheprovider \
            --override-ini="addopts=" \
            --override-ini="filterwarnings="

      # A policy edit can orphan any tracked path, so build_codeowners.py
      # automatically switches policy-changing PRs to a full-tree gate.
      - name: Validate coverage (diff-aware, PR)
        if: github.event_name == 'pull_request'
        run: |
          python .github/codeowners/build_codeowners.py \
            --areas .github/codeowners/areas.yaml \
            --repo . \
            --strict \
            --changed-only \
            --base ${{ github.event.pull_request.base.sha }}

      - name: Validate 100% coverage (strict, full tree)
        if: github.event_name != 'pull_request'
        run: |
          python .github/codeowners/build_codeowners.py \
            --areas .github/codeowners/areas.yaml \
            --repo . \
            --strict

      - name: Regenerate and check for drift
        run: |
          python .github/codeowners/emit_codeowners.py \
            --areas .github/codeowners/areas.yaml \
            --out CODEOWNERS \
            --external .github/codeowners/external_contributors.yaml \
            --contributors-out CONTRIBUTORS.md
          if [[ -n "$(git status --porcelain --untracked-files=all -- \
              CODEOWNERS CONTRIBUTORS.md)" ]]; then
            git diff -- CODEOWNERS CONTRIBUTORS.md || true
            git status --short --untracked-files=all -- CODEOWNERS CONTRIBUTORS.md
            echo "::error::Generated CODEOWNERS artifacts are out of date. Regenerate and commit every changed output."
            exit 1
          fi
