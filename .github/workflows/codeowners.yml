name: Velonix runner smoke test

on:
  workflow_dispatch:

permissions: {}

jobs:
  smoke:
    name: ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            expected_uname: x86_64
            runner: prod-aisimulate-default-amd64-v1
          - arch: arm64
            expected_uname: aarch64
            runner: prod-aisimulate-default-arm64-v1
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    container:
      image: 210086341041.dkr.ecr.us-west-2.amazonaws.com/dynamo-ci/aws/dynamo/actions-runner/actions-runner:2.336.0
      env:
        HOME: /__w/aisimulate/aisimulate
        USER: runner
    steps:
      - name: Validate architecture and scratch storage
        shell: sh
        env:
          EXPECTED_UNAME: ${{ matrix.expected_uname }}
        run: |
          set -eu
          actual_uname="$(uname -m)"
          test "${actual_uname}" = "${EXPECTED_UNAME}"
          test -d /scratch
          marker="/scratch/aisimulate-velonix-${GITHUB_RUN_ID}-${GITHUB_JOB}"
          printf 'ok\n' > "${marker}"
          test "$(cat "${marker}")" = "ok"
          rm "${marker}"
          printf 'runner=%s architecture=%s scratch=ok\n' \
            "${{ matrix.runner }}" "${actual_uname}"
