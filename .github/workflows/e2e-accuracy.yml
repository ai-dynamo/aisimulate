name: E2E Accuracy Matrix

on:
  schedule:
    # After the 08:00 UTC release build, without waiting for staging approval.
    - cron: "17 10 * * *"
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Full source commit to evaluate (must belong to the selected branch)
        required: true
        type: string
      branch:
        description: Evaluated main or release/* branch
        required: true
        default: main
        type: string

permissions:
  contents: read

# Every completed campaign keeps its own provenance; never cancel a release
# evaluation merely because a scheduled campaign starts.
concurrency:
  group: e2e-accuracy-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve exact accuracy source
    if: github.repository == 'ai-dynamo/aisimulate' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      matrix: ${{ steps.source.outputs.matrix }}
    steps:
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        id: source
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          EVALUATED_BRANCH: ${{ inputs.branch }}
        with:
          script: |
            const {createHash} = require('node:crypto');
            let sha = process.env.EXPECTED_SHA;
            let branch = process.env.EVALUATED_BRANCH;
            let nightlyRun = '';
            if (context.eventName === 'schedule') {
              sha = context.sha;
              branch = 'main';
              const {data} = await github.rest.actions.listWorkflowRuns({
                ...context.repo, workflow_id: 'nightly-ci.yml', head_sha: sha,
                branch: 'main', event: 'schedule', per_page: 10,
              });
              for (const run of data.workflow_runs) {
                if (run.head_sha !== sha || run.head_branch !== 'main' || run.event !== 'schedule' ||
                    run.path !== '.github/workflows/nightly-ci.yml' ||
                    run.repository.full_name !== context.repo.owner + '/' + context.repo.repo ||
                    run.head_repository.full_name !== run.repository.full_name) {
                  throw new Error('Untrusted nightly producer');
                }
                const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
                  ...context.repo, run_id: run.id, filter: 'latest', per_page: 100,
                });
                if (!jobs.some(job => job.name === 'Build artifacts (amd64)' && job.conclusion === 'success')) {
                  continue;
                }
                const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
                  ...context.repo, run_id: run.id, per_page: 100,
                });
                if (artifacts.some(artifact => artifact.name === 'nightly-dist-amd64' && !artifact.expired)) {
                  nightlyRun = String(run.id);
                  break;
                }
              }
              core.notice(nightlyRun ? `Reuse the exact wheel from nightly ${nightlyRun}.` :
                'No reusable wheel for this main SHA; build the exact revision.');
            }
            const entries = [{branch, sha, nightly_run: nightlyRun}];
            if (context.eventName === 'schedule') {
              const branches = await github.paginate(github.rest.repos.listBranches, {
                ...context.repo, per_page: 100,
              });
              for (const release of branches.filter(item => item.name.startsWith('release/'))
                .sort((a, b) => a.name.localeCompare(b.name))) {
                entries.push({branch: release.name, sha: release.commit.sha, nightly_run: ''});
              }
            }
            if (entries.length > 256) throw new Error('Accuracy matrix exceeds the 256-job limit');
            const keys = new Set();
            for (const entry of entries) {
              if (!/^[0-9a-f]{40}$/.test(entry.sha || '') ||
                  !(entry.branch === 'main' || /^release\/[A-Za-z0-9][A-Za-z0-9._/-]*$/.test(entry.branch || ''))) {
                throw new Error('Specify a full source SHA and main or release/* branch');
              }
              entry.artifact_key = createHash('sha256').update(entry.branch).digest('hex').slice(0, 16);
              if (keys.has(entry.artifact_key)) throw new Error('Duplicate accuracy branch artifact key');
              keys.add(entry.artifact_key);
            }
            core.setOutput('matrix', JSON.stringify({include: entries}));

  branches:
    name: E2E accuracy (${{ matrix.branch }})
    needs: resolve
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.resolve.outputs.matrix) }}
    uses: ./.github/workflows/e2e-accuracy-branch.yml
    permissions:
      contents: read
      actions: read
    with:
      sha: ${{ matrix.sha }}
      branch: ${{ matrix.branch }}
      artifact_key: ${{ matrix.artifact_key }}
      nightly_run: ${{ matrix.nightly_run }}
