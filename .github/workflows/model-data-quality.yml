name: Model Data Quality Gate

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: model-data-quality-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gate:
    name: Model Data Quality Gate (shadow)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Classify exact PR trees
        id: classify
        run: |
          python python/aisimulate/tools/model_data_gate/run.py \
            --base "$BASE_SHA" --head "$HEAD_SHA" --out model-data-quality --classify-only
          python - <<'PY'
          import json, os
          with open('model-data-quality/report.json') as stream:
              report = json.load(stream)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as stream:
              stream.write(f"applicable={str(report['applicable']).lower()}\n")
          PY
      - name: Install portable diagnostic dependencies
        if: steps.classify.outputs.applicable == 'true'
        run: python -m pip install pyarrow==23.0.1 pandas==2.3.3 numpy==2.4.2 pyyaml==6.0.3 tqdm==4.67.3 pytest==8.4.2 pytest-asyncio==1.2.0
      # The version-ordering test imports the native SDK and stays in the
      # existing Full CI application unit shard. This portable job builds no wheel.
      - name: Verify gate failure contracts
        if: steps.classify.outputs.applicable == 'true'
        run: >-
          python -m pytest -c pytest.ini --confcutdir=python/aisimulate/tests/unit/tools
          python/aisimulate/tests/unit/tools/test_model_data_gate.py
          python/aisimulate/tests/unit/tools/test_parquet_diff.py
          python/aisimulate/tests/unit/tools/test_check_cross_backend.py
          python/aisimulate/tests/unit/tools/test_prediction_regression_gate_compare.py
          python/aisimulate/tests/unit/tools/test_prediction_regression_gate_report.py
          --deselect=python/aisimulate/tests/unit/tools/test_prediction_regression_gate_report.py::test_version_sort_is_version_aware
      - name: Run shadow diagnostics
        if: steps.classify.outputs.applicable == 'true'
        id: shadow
        # Only the workflow rollout is nonblocking. The CLI, JSON and summary
        # retain FAIL/INCOMPLETE and a nonzero exit; there is no false green report.
        continue-on-error: true
        run: >-
          python python/aisimulate/tools/model_data_gate/run.py
          --base "$BASE_SHA" --head "$HEAD_SHA" --out model-data-quality
      - name: Publish conclusion
        if: always()
        run: |
          test -s model-data-quality/report.json
          test -s model-data-quality/summary.md
          cat model-data-quality/summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Retain exact comparison evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: model-data-quality-${{ github.event.pull_request.head.sha }}
          path: model-data-quality/
          if-no-files-found: error
          retention-days: 30
