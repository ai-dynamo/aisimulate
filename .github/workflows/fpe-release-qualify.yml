name: FPE Support Matrix (release)

on:
  workflow_call:
    inputs:
      release:
        description: Release version discovered from origin/release/<version>
        required: true
        type: string
      source_sha:
        description: Immutable release tip captured during branch discovery
        required: true
        type: string

permissions:
  contents: read

env:
  FPE_BRANCH: release/${{ inputs.release }}
  FPE_SOURCE_SHA: ${{ inputs.source_sha }}
  FPE_TOOLING_SHA: ${{ github.sha }}

jobs:
  prepare:
    name: Build and identify release FPE wheel
    if: github.ref == 'refs/heads/main'
    runs-on: prod-aisimulate-default-amd64-v1
    timeout-minutes: 30
    container:
      # Same pinned manylinux toolchain as the main FPE producer.
      image: quay.io/pypa/manylinux_2_28_x86_64@sha256:4dc41da7df20400310c80d162a2fe2d2c2f3d9734d8dec20f6b9843711618deb
    outputs:
      shards: ${{ steps.discover.outputs.shards }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.source_sha }}
          path: release-source
          persist-credentials: false
      - uses: ./.github/actions/setup-manylinux-python-rust
      - name: Build the unmodified release package once
        working-directory: release-source/python/aisimulate
        run: |
          python -m pip install maturin==1.15.0
          python -m maturin build --release --locked --auditwheel skip --out "${RUNNER_TEMP}/release-raw-wheel"
          auditwheel repair --plat manylinux_2_28_x86_64 \
            --wheel-dir "${GITHUB_WORKSPACE}/fpe-release-wheel" "${RUNNER_TEMP}"/release-raw-wheel/aisimulate-*.whl
      - name: Record release and tooling provenance
        run: python scripts/run_release_fpe.py record-wheel
      - name: Install the release's locked dependencies and exact wheel
        run: |
          python -m pip install uv==0.12.6
          uv sync --project release-source/python/aisimulate --locked --no-install-project --no-dev --python "$(command -v python)"
          uv pip install --python release-source/python/aisimulate/.venv/bin/python --no-deps fpe-release-wheel/*.whl
          uv pip check --python release-source/python/aisimulate/.venv/bin/python
      - id: discover
        name: Discover the release inventory through its verified wheel
        run: release-source/python/aisimulate/.venv/bin/python scripts/run_release_fpe.py discover
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: fpe-release-wheel-${{ inputs.release }}
          path: |
            fpe-release-wheel
            fpe-release-shards.json
          if-no-files-found: error
          retention-days: 7

  generate:
    name: Release FPE (${{ matrix.shard.system }}, ${{ matrix.shard.backend }})
    needs: prepare
    runs-on: prod-aisimulate-default-amd64-v1
    timeout-minutes: 480
    container:
      image: ${{ vars.CI_JOB_CONTAINER_IMAGE }}
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        shard: ${{ fromJSON(needs.prepare.outputs.shards) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.source_sha }}
          path: release-source
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: fpe-release-wheel-${{ inputs.release }}
          path: .
      - name: Install the release's locked dependencies and exact wheel
        run: |
          python -m pip install uv==0.12.6
          uv sync --project release-source/python/aisimulate --locked --no-install-project --no-dev --python "$(command -v python)"
          uv pip install --python release-source/python/aisimulate/.venv/bin/python --no-deps fpe-release-wheel/*.whl
          uv pip check --python release-source/python/aisimulate/.venv/bin/python
      - name: Probe the complete release shard
        env:
          FPE_SYSTEM: ${{ matrix.shard.system }}
          FPE_BACKEND: ${{ matrix.shard.backend }}
        run: |
          release-source/python/aisimulate/.venv/bin/python scripts/run_release_fpe.py probe \
            --system "${FPE_SYSTEM}" --backend "${FPE_BACKEND}" \
            --output-dir "fpe-release-results/${FPE_SYSTEM}/${FPE_BACKEND}" \
            --forward-model op_level --sdk-log-level ERROR --max-workers 8
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: fpe-release-results-${{ inputs.release }}@${{ matrix.shard.system }}-${{ matrix.shard.backend }}
          path: fpe-release-results/${{ matrix.shard.system }}/${{ matrix.shard.backend }}
          if-no-files-found: error
          retention-days: 7

  qualify:
    name: Qualify release FPE artifact
    needs: [prepare, generate]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.source_sha }}
          path: release-source
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: fpe-release-wheel-${{ inputs.release }}
          path: .
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: fpe-release-results-${{ inputs.release }}@*
          path: fpe-release-results
      - name: Require complete same-wheel coverage and all required probes
        run: python scripts/run_release_fpe.py package
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: fpe-support-matrix-web-release-${{ inputs.release }}
          path: fpe-release-web
          if-no-files-found: error
          retention-days: 90
