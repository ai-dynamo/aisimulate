name: FPE Support Matrix

on:
  workflow_call:
    inputs:
      pr_number:
        description: Explicit PR identity for an isolated PR qualification
        type: string
        default: ""
      expected_sha:
        required: true
        type: string
      source_branch:
        description: Source branch whose inventory is being qualified
        type: string
        default: main
      wheel_artifact:
        description: Nightly artifact containing the wheel, checksums, and provenance
        required: false
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      pr_number:
        description: Explicit PR identity for an isolated PR qualification
        type: string
        default: ""
      expected_sha:
        description: Exact source commit to qualify
        required: true
        type: string

permissions:
  contents: read

env:
  FPE_BRANCH: ${{ inputs.source_branch || 'main' }}
  FPE_SOURCE_SHA: ${{ inputs.expected_sha }}
  FPE_TOOLING_SHA: ${{ github.sha }}

jobs:
  prepare-wheel:
    environment: ${{ inputs.pr_number == '' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/')) && 'automated-release' || 'pr-wheel-staging' }}
    name: Prepare exact FPE wheel
    runs-on: prod-aisim-default-amd64-v1
    timeout-minutes: 30
    container:
      # quay.io/pypa/manylinux_2_28_x86_64:2026.08.24-1
      image: quay.io/pypa/manylinux_2_28_x86_64@sha256:4dc41da7df20400310c80d162a2fe2d2c2f3d9734d8dec20f6b9843711618deb
      env:
        HOME: /__w/aisim/aisim
        USER: runner
    outputs:
      wheel-sha256: ${{ steps.digest.outputs.sha256 }}
    steps:
      - name: Validate wheel storage context
        shell: bash
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          set -euo pipefail
          if [[ -n "${PR_NUMBER}" && ! "${PR_NUMBER}" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::pr_number must be an explicit positive PR number"
            exit 1
          fi
          if [[ "${GITHUB_REF}" == refs/heads/pull-request/* &&
                "${PR_NUMBER}" != "${GITHUB_REF#refs/heads/pull-request/}" ]]; then
            echo "::error::Set pr_number to the matching trusted copied-PR number"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.expected_sha }}
          path: release-source
          persist-credentials: false
      - name: Verify exact target
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: test -n "${EXPECTED_SHA}" && test "$(git -C release-source rev-parse HEAD)" = "${EXPECTED_SHA}"
      - uses: ./.github/actions/setup-manylinux-python-rust
        if: inputs.wheel_artifact == ''
      - name: Build one wheel for standalone qualification
        working-directory: release-source
        if: inputs.wheel_artifact == ''
        run: |
          python -m pip install --require-hashes -r "${GITHUB_WORKSPACE}/scripts/release/requirements.txt"
          builder=scripts/release/build_manylinux_wheel.py
          if [ ! -f "${builder}" ]; then builder=scripts/build_manylinux_wheel.py; fi
          python "${builder}" --output-dir ../fpe-wheel
      - uses: ./.github/actions/wheel-storage
        if: inputs.wheel_artifact != ''
        with:
          scope: ${{ inputs.pr_number != '' && 'pr' || ((github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/')) && 'official' || 'preview') }}
          pr-number: ${{ inputs.pr_number }}
          mode: download
          name: ${{ inputs.wheel_artifact }}
          path: fpe-wheel
          source-sha: ${{ inputs.expected_sha }}
          architecture: amd64
          url: ${{ vars.WHEEL_STORAGE_URL }}
          repo: ${{ vars.WHEEL_STORAGE_REPO }}
          token: ${{ secrets.ARTIFACTORY_TOKEN }}
      - name: Verify nightly artifact checksums and source
        if: inputs.wheel_artifact != ''
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          (cd fpe-wheel && sha256sum --check --strict SHA256SUMS.txt)
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          provenance = json.loads(Path("fpe-wheel/provenance.json").read_text())
          if provenance["commit"] != os.environ["EXPECTED_SHA"]:
              raise SystemExit("nightly artifact belongs to a different source commit")
          PY
      - name: Record source and current qualification tooling
        run: /opt/python/cp312-cp312/bin/python scripts/fpe/run_release_fpe.py record-wheel --wheel-dir fpe-wheel
      - id: digest
        name: Record the single wheel identity
        run: |
          python3 - <<'PY'
          import hashlib, os
          from pathlib import Path
          from scripts.release.package_identity import wheels as product_wheels
          wheels = product_wheels(Path("fpe-wheel"))
          if len(wheels) != 1:
              raise SystemExit("expected exactly one AISim wheel")
          digest = hashlib.sha256(wheels[0].read_bytes()).hexdigest()
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"sha256={digest}\n")
          PY
      - uses: ./.github/actions/wheel-storage
        with:
          scope: ${{ inputs.pr_number != '' && 'pr' || ((github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/')) && 'official' || 'preview') }}
          pr-number: ${{ inputs.pr_number }}
          mode: upload
          name: fpe-qualified-wheel
          path: |
            fpe-wheel/*.whl
            fpe-wheel/provenance.json
          source-sha: ${{ inputs.expected_sha }}
          architecture: amd64
          url: ${{ vars.WHEEL_STORAGE_URL }}
          repo: ${{ vars.WHEEL_STORAGE_REPO }}
          token: ${{ secrets.ARTIFACTORY_TOKEN }}
          retention-days: 7

  discover-shards:
    environment: ${{ inputs.pr_number == '' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/')) && 'automated-release' || 'pr-wheel-staging' }}
    name: Discover matrix shards
    needs: prepare-wheel
    runs-on: ubuntu-24.04
    outputs:
      shards: ${{ steps.shards.outputs.shards }}
      required-probes: ${{ steps.shards.outputs.required_probes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.expected_sha }}
          path: release-source
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - uses: ./.github/actions/wheel-storage
        with:
          scope: ${{ inputs.pr_number != '' && 'pr' || ((github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/')) && 'official' || 'preview') }}
          pr-number: ${{ inputs.pr_number }}
          mode: download
          name: fpe-qualified-wheel
          path: fpe-wheel
          source-sha: ${{ inputs.expected_sha }}
          architecture: amd64
          url: ${{ vars.WHEEL_STORAGE_URL }}
          repo: ${{ vars.WHEEL_STORAGE_REPO }}
          token: ${{ secrets.ARTIFACTORY_TOKEN }}
      - name: Install the exact wheel for live inventory discovery
        env:
          FPE_WHEEL_SHA256: ${{ needs.prepare-wheel.outputs.wheel-sha256 }}
        run: |
          echo "${FPE_WHEEL_SHA256}  $(echo fpe-wheel/*.whl)" | sha256sum --check --strict
          python -m pip install --force-reinstall fpe-wheel/*.whl
      - id: shards
        name: Read selected-source inventory with current qualification tooling
        run: python scripts/fpe/run_release_fpe.py discover --wheel-dir fpe-wheel

  generate:
    environment: ${{ inputs.pr_number == '' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/')) && 'automated-release' || 'pr-wheel-staging' }}
    name: FPE matrix (${{ matrix.shard.system }}, ${{ matrix.shard.backend }})
    needs: [discover-shards, prepare-wheel]
    runs-on: prod-aisim-default-amd64-v1
    timeout-minutes: 480
    container:
      image: ${{ vars.CI_JOB_CONTAINER_IMAGE }}
      env:
        HOME: /__w/aisim/aisim
        USER: runner
    strategy:
      fail-fast: false
      # Match the repository's 20-runner AMD64 pool ceiling.
      max-parallel: 20
      matrix:
        shard: ${{ fromJSON(needs.discover-shards.outputs.shards) }}
    env:
      FPE_WHEEL_SHA256: ${{ needs.prepare-wheel.outputs.wheel-sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.expected_sha }}
          path: release-source
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - uses: ./.github/actions/wheel-storage
        with:
          scope: ${{ inputs.pr_number != '' && 'pr' || ((github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/')) && 'official' || 'preview') }}
          pr-number: ${{ inputs.pr_number }}
          mode: download
          name: fpe-qualified-wheel
          path: fpe-wheel
          source-sha: ${{ inputs.expected_sha }}
          architecture: amd64
          url: ${{ vars.WHEEL_STORAGE_URL }}
          repo: ${{ vars.WHEEL_STORAGE_REPO }}
          token: ${{ secrets.ARTIFACTORY_TOKEN }}
      - name: Verify and install the qualified wheel
        run: |
          echo "${FPE_WHEEL_SHA256}  $(echo fpe-wheel/*.whl)" | sha256sum --check --strict
          python -m pip install --force-reinstall fpe-wheel/*.whl
          python -m pip check
          python - <<'PY'
          from scripts.release.package_identity import installed_distribution
          from pathlib import Path
          from aisim import _runtime
          dist = installed_distribution()
          runtime = Path(_runtime.__file__).resolve()
          owned = {Path(dist.locate_file(p)).resolve() for p in dist.files or ()
                   if str(p).startswith("aisim/_runtime.")}
          if runtime not in owned:
              raise SystemExit(f"native runtime is not owned by the installed AISim wheel: {runtime}")
          print(runtime)
          PY
      - name: Generate strict-native op-level coverage through the FPE SDK
        env:
          FPE_SYSTEM: ${{ matrix.shard.system }}
          FPE_BACKEND: ${{ matrix.shard.backend }}
        run: |
          python scripts/fpe/run_release_fpe.py probe --wheel-dir fpe-wheel \
            --system "${FPE_SYSTEM}" --backend "${FPE_BACKEND}" \
            --output-dir "fpe-support-matrix/${FPE_SYSTEM}/${FPE_BACKEND}" \
            --forward-model op_level --sdk-log-level ERROR --max-workers 8
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: fpe-support-matrix-${{ matrix.shard.system }}-${{ matrix.shard.backend }}
          path: fpe-support-matrix/${{ matrix.shard.system }}/${{ matrix.shard.backend }}
          if-no-files-found: error
          retention-days: 7

  build-web-matrix:
    environment: ${{ inputs.pr_number == '' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/')) && 'automated-release' || 'pr-wheel-staging' }}
    name: Qualify and build FPE support matrix
    needs: [generate, discover-shards, prepare-wheel]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.expected_sha }}
          path: release-source
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: fpe-support-matrix-*
          path: fpe-support-matrix
      - uses: ./.github/actions/wheel-storage
        with:
          scope: ${{ inputs.pr_number != '' && 'pr' || ((github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/')) && 'official' || 'preview') }}
          pr-number: ${{ inputs.pr_number }}
          mode: download
          name: fpe-qualified-wheel
          path: fpe-wheel
          source-sha: ${{ inputs.expected_sha }}
          architecture: amd64
          url: ${{ vars.WHEEL_STORAGE_URL }}
          repo: ${{ vars.WHEEL_STORAGE_REPO }}
          token: ${{ secrets.ARTIFACTORY_TOKEN }}
      - name: Require complete same-wheel reports and native sentinels
        env:
          EXPECTED_SHARDS: ${{ needs.discover-shards.outputs.shards }}
          EXPECTED_PROBES: ${{ needs.discover-shards.outputs.required-probes }}
        run: |
          printf '%s\n' "${EXPECTED_SHARDS}" > fpe-release-shards.json
          printf '%s\n' "${EXPECTED_PROBES}" > fpe-release-probes.json
          python3 scripts/fpe/run_release_fpe.py package --wheel-dir fpe-wheel \
            --reports fpe-support-matrix --destination fpe-nightly-web
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: fpe-support-matrix-web
          path: fpe-nightly-web
          if-no-files-found: error
          # Pages reuses the latest qualified snapshot on documentation pushes.
          retention-days: 90
