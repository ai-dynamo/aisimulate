name: FPE Support Matrix

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fpe-support-matrix-${{ github.ref }}
  cancel-in-progress: false

jobs:
  discover-shards:
    name: Discover matrix shards
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.shards.outputs.value }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: shards
        name: Read system/backend identities from the curated matrix
        run: |
          value=$(python - <<'PY'
          import csv
          import json
          from pathlib import Path

          root = Path("python/aisimulate/src/aiconfigurator_core/systems/support_matrix")
          index = json.loads((root / "index.json").read_text(encoding="utf-8"))
          shards = set()
          for filename in index["files"]:
              with (root / filename).open(newline="", encoding="utf-8") as handle:
                  for row in csv.DictReader(handle):
                      shards.add((row["System"], row["Backend"]))
          print(
              json.dumps(
                  [{"system": system, "backend": backend} for system, backend in sorted(shards)],
                  separators=(",", ":"),
              )
          )
          PY
          )
          echo "value=${value}" >> "${GITHUB_OUTPUT}"

  generate:
    name: FPE matrix (${{ matrix.shard.system }}, ${{ matrix.shard.backend }})
    needs: discover-shards
    runs-on: prod-aisimulate-default-amd64-v1
    timeout-minutes: 480
    container:
      # Keep in sync with the amd64 Nightly CI image. The repository-specific
      # runner policy requires every self-hosted job to use a container.
      image: quay.io/pypa/manylinux_2_28_x86_64@sha256:4dc41da7df20400310c80d162a2fe2d2c2f3d9734d8dec20f6b9843711618deb
      env:
        HOME: /__w/aisimulate/aisimulate
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        shard: ${{ fromJSON(needs.discover-shards.outputs.shards) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: "1.98.0"
      - name: Install AISimulate from this source SHA
        run: |
          python -m pip install \
            --require-hashes \
            --requirement .github/nightly/build-requirements.txt
          python -m pip install --no-build-isolation './python/aisimulate'
      - name: Generate strict-native op-level coverage through the FPE SDK
        run: |
          python python/aisimulate/tools/support_matrix/generate_fpe_support_matrix.py \
            --system "${{ matrix.shard.system }}" \
            --backend "${{ matrix.shard.backend }}" \
            --output-dir "fpe-support-matrix/${{ matrix.shard.system }}/${{ matrix.shard.backend }}" \
            --forward-model op_level \
            --sdk-log-level ERROR \
            --max-workers 8
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fpe-support-matrix-${{ matrix.shard.system }}-${{ matrix.shard.backend }}
          path: fpe-support-matrix/${{ matrix.shard.system }}/${{ matrix.shard.backend }}
          if-no-files-found: error
          retention-days: 7

  build-web-matrix:
    name: Build FPE support-matrix CSVs
    needs: generate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: fpe-support-matrix-*
          path: fpe-support-matrix
      - name: Build the deterministic split web matrix
        run: |
          python python/aisimulate/tools/support_matrix/build_fpe_support_matrix.py \
            fpe-support-matrix \
            --output-dir python/aisimulate/src/aiconfigurator_core/systems/fpe_support_matrix
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fpe-support-matrix-web
          path: |
            python/aisimulate/docs/fpe-support-matrix/index.html
            python/aisimulate/src/aiconfigurator_core/systems/fpe_support_matrix
          if-no-files-found: error
