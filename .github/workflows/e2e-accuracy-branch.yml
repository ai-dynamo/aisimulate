name: E2E Accuracy Branch

on:
  workflow_call:
    secrets:
      HF_READ_AISIM_INFX_CACHE:
        required: true
    inputs:
      sha:
        required: true
        type: string
      branch:
        required: true
        type: string
      artifact_key:
        required: true
        type: string
      nightly_run:
        required: true
        type: string
      configuration_mode:
        required: false
        default: estimated
        type: string
      agentx_campaign_catalog:
        required: false
        default: ''
        type: string
      agentx_revision:
        required: false
        default: ''
        type: string
      preview:
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  # Download the wheel artifact produced by the wheel job in this run.
  actions: read

jobs:
  wheel:
    name: Prepare exact accuracy wheel
    runs-on: prod-aisim-default-amd64-v1
    timeout-minutes: 120
    permissions:
      contents: read
      # Download the cross-run nightly-dist-amd64 artifact.
      actions: read
    container:
      # Same manylinux builder as the FPE matrix.
      image: quay.io/pypa/manylinux_2_28_x86_64@sha256:4dc41da7df20400310c80d162a2fe2d2c2f3d9734d8dec20f6b9843711618deb
    outputs:
      sha256: ${{ steps.verify.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.sha }}
          path: source
          fetch-depth: 0
          persist-credentials: false
      - name: Verify source belongs to the evaluated branch
        env:
          EXPECTED_SHA: ${{ inputs.sha }}
          EVALUATED_BRANCH: ${{ inputs.branch }}
        run: |
          test "$(git -C source rev-parse HEAD)" = "${EXPECTED_SHA}"
          git -C source merge-base --is-ancestor "${EXPECTED_SHA}" "refs/remotes/origin/${EVALUATED_BRANCH}"
          test -z "$(git -C source status --porcelain)"
      - uses: ./.github/actions/setup-manylinux-python-rust
        if: inputs.nightly_run == ''
      - name: Build the exact revision when no reusable wheel exists
        if: inputs.nightly_run == ''
        run: |
          python -m pip install --require-hashes -r scripts/release/requirements.txt
          # Historical release revisions retain their original script layout.
          builder=source/scripts/release/build_manylinux_wheel.py
          if [ ! -f "${builder}" ]; then builder=source/scripts/build_manylinux_wheel.py; fi
          python "${builder}" --output-dir "${RUNNER_TEMP}/accuracy-wheel"
          test -z "$(git -C source status --porcelain)"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        if: inputs.nightly_run != ''
        with:
          name: nightly-dist-amd64
          path: ${{ runner.temp }}/accuracy-wheel
          run-id: ${{ inputs.nightly_run }}
          github-token: ${{ github.token }}
      - name: Verify wheel checksum and nightly producer revision
        id: verify
        env:
          EXPECTED_SHA: ${{ inputs.sha }}
          NIGHTLY_RUN: ${{ inputs.nightly_run }}
        run: |
          /opt/python/cp312-cp312/bin/python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          directory = Path(os.environ['RUNNER_TEMP']) / 'accuracy-wheel'
          from scripts.release.package_identity import wheels as product_wheels
          wheels = product_wheels(directory)
          if len(wheels) != 1:
              raise SystemExit('expected one unified wheel')
          wheel = wheels[0]
          digest = hashlib.sha256(wheel.read_bytes()).hexdigest()
          if os.environ['NIGHTLY_RUN']:
              provenance = json.loads((directory / 'provenance.json').read_text())
              if (provenance['commit'] != os.environ['EXPECTED_SHA'] or
                  provenance['repository'] != 'ai-dynamo/aisim' or
                  provenance['event'] != 'schedule' or provenance['ref'] != 'refs/heads/main' or
                  provenance['arch'] != 'amd64' or provenance['artifacts'][wheel.name] != digest):
                  raise SystemExit('nightly wheel provenance mismatch')
              checksums = dict(line.split(maxsplit=1)[::-1] for line in (directory / 'SHA256SUMS.txt').read_text().splitlines())
              for name in (wheel.name, 'provenance.json'):
                  if hashlib.sha256((directory / name).read_bytes()).hexdigest() != checksums[name]:
                      raise SystemExit('nightly artifact checksum mismatch')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as stream:
              stream.write(f'sha256={digest}\n')
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: e2e-accuracy-wheel-${{ inputs.artifact_key }}
          path: ${{ runner.temp }}/accuracy-wheel/*.whl
          overwrite: true
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  measurements:
    name: Prepare shared E2E measurements
    timeout-minutes: 120
    runs-on: prod-aisim-default-amd64-v1
    container:
      image: ${{ vars.CI_JOB_CONTAINER_IMAGE }}
      env:
        HOME: /__w/aisim/aisim
        USER: runner
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Install the CPU campaign environment
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ca-certificates libgomp1
          python -m venv "${RUNNER_TEMP}/accuracy-venv"
          echo "${RUNNER_TEMP}/accuracy-venv/bin" >> "${GITHUB_PATH}"
      - name: Install measurement tooling
        run: python -m pip install --require-hashes -r scripts/e2e_accuracy/requirements.txt
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: e2e-accuracy-dataset
          path: ${{ runner.temp }}/accuracy-dataset
      - name: Fetch checksum-pinned private HF measurements
        env:
          HF_TOKEN: ${{ secrets.HF_READ_AISIM_INFX_CACHE }}
          HF_HOME: ${{ runner.temp }}/accuracy-hf
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python scripts/e2e_accuracy/fetch_accuracy_measurements.py \
            --manifest "${RUNNER_TEMP}/accuracy-dataset/e2e-accuracy-dataset.json" --output "${RUNNER_TEMP}/accuracy-measurements"
      - name: Encrypt private measurements
        env:
          HF_TOKEN: ${{ secrets.HF_READ_AISIM_INFX_CACHE }}
        run: python scripts/e2e_accuracy/private_artifacts.py seal "${RUNNER_TEMP}/accuracy-measurements" "${RUNNER_TEMP}/accuracy-measurements-encrypted"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: e2e-accuracy-measurements-${{ inputs.artifact_key }}
          path: ${{ runner.temp }}/accuracy-measurements-encrypted/
          overwrite: true
          if-no-files-found: error
          retention-days: 7

  shards:
    name: Evaluate E2E shard ${{ matrix.shard }} (${{ inputs.artifact_key }})
    needs: [wheel, measurements]
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0, 1, 2, 3]
    runs-on: prod-aisim-default-amd64-v1
    timeout-minutes: 360
    container:
      # The runner executes as non-root; use its sudo-enabled CI image.
      image: ${{ vars.CI_JOB_CONTAINER_IMAGE }}
      env:
        HOME: /__w/aisim/aisim
        USER: runner
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      RAYON_NUM_THREADS: '1'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Install the CPU campaign environment
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgomp1
          python -m venv "${RUNNER_TEMP}/accuracy-venv"
          echo "${RUNNER_TEMP}/accuracy-venv/bin" >> "${GITHUB_PATH}"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: e2e-accuracy-wheel-${{ inputs.artifact_key }}
          path: ${{ runner.temp }}/accuracy-wheel
      - name: Install the exact wheel shared by both predictors
        env:
          WHEEL_SHA256: ${{ needs.wheel.outputs.sha256 }}
        run: |
          echo "${WHEEL_SHA256}  $(echo "${RUNNER_TEMP}"/accuracy-wheel/*.whl)" | sha256sum --check --strict
          python -m pip install "${RUNNER_TEMP}"/accuracy-wheel/*.whl
          python -m pip install --require-hashes -r scripts/e2e_accuracy/requirements.txt
          python -m pip check
          python - <<'PYCODE'
          import os, sys
          from pathlib import Path
          from scripts.e2e_accuracy.run_e2e_accuracy import wheel_identity
          wheel = next((Path(os.environ['RUNNER_TEMP']) / 'accuracy-wheel').glob('*.whl'))
          print(wheel_identity(wheel))
          PYCODE
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: e2e-accuracy-dataset
          path: ${{ runner.temp }}/accuracy-dataset
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: e2e-accuracy-measurements-${{ inputs.artifact_key }}
          path: ${{ runner.temp }}/accuracy-measurements-encrypted
      - name: Decrypt private measurements
        env:
          HF_TOKEN: ${{ secrets.HF_READ_AISIM_INFX_CACHE }}
        run: python scripts/e2e_accuracy/private_artifacts.py open "${RUNNER_TEMP}/accuracy-measurements-encrypted" "${RUNNER_TEMP}/accuracy-measurements"
      - name: Run both predictors for this shard
        shell: bash
        env:
          SHARD_INDEX: ${{ matrix.shard }}
          EXPECTED_SHA: ${{ inputs.sha }}
          EVALUATED_BRANCH: ${{ inputs.branch }}
          PREVIEW: ${{ inputs.preview }}
          CONFIGURATION_MODE: ${{ inputs.configuration_mode }}
          GH_TOKEN: ${{ github.token }}
        run: |
          preview_args=()
          if [[ "${PREVIEW}" == 'true' ]]; then preview_args+=(--preview); fi
          python scripts/e2e_accuracy/run_e2e_accuracy.py \
            --tables "${RUNNER_TEMP}/accuracy-measurements/tables.json" \
            --manifest "${RUNNER_TEMP}/accuracy-dataset/e2e-accuracy-dataset.json" \
            --wheel "${RUNNER_TEMP}"/accuracy-wheel/*.whl \
            --commit "${EXPECTED_SHA}" --branch "${EVALUATED_BRANCH}" \
            --run-id "${GITHUB_RUN_ID}" --run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --source-cache "${RUNNER_TEMP}/accuracy-source" --evidence "${RUNNER_TEMP}/accuracy-evidence" \
            --configuration-mode "${CONFIGURATION_MODE}" --fetch-runtime-evidence \
            --shard-index "${SHARD_INDEX}" --shard-count 4 \
            --workers 2 --point-timeout 180 --output "${RUNNER_TEMP}/accuracy-shard" "${preview_args[@]}"
      - name: Require a complete shard after the predictor exits
        env:
          SHARD_INDEX: ${{ matrix.shard }}
        run: test -s "${RUNNER_TEMP}/accuracy-shard/shard-${SHARD_INDEX}.json"
      - name: Encrypt private shard outputs and checkpoints
        if: always()
        env:
          HF_TOKEN: ${{ secrets.HF_READ_AISIM_INFX_CACHE }}
        run: |
          for kind in shard evidence; do
            if test -d "${RUNNER_TEMP}/accuracy-${kind}"; then
              python scripts/e2e_accuracy/private_artifacts.py seal "${RUNNER_TEMP}/accuracy-${kind}" "${RUNNER_TEMP}/accuracy-${kind}-encrypted"
            fi
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: e2e-accuracy-results-${{ inputs.artifact_key }}-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/accuracy-shard-encrypted/
          overwrite: true
          if-no-files-found: error
          retention-days: 7
      - name: Preserve completed point checkpoints even on failure
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: e2e-accuracy-checkpoints-${{ inputs.artifact_key }}-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/accuracy-evidence-encrypted/results.jsonl.enc
          overwrite: true
          if-no-files-found: warn
          retention-days: 7
      - name: Preserve PR preview evidence for local diagnosis
        if: always() && inputs.preview
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: e2e-accuracy-preview-evidence-${{ inputs.artifact_key }}-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/accuracy-evidence-encrypted/
          if-no-files-found: warn
          overwrite: true
          retention-days: 7

  campaign:
    name: Qualify E2E accuracy (${{ inputs.artifact_key }})
    needs: [wheel, shards]
    timeout-minutes: 30
    runs-on: prod-aisim-default-amd64-v1
    container:
      image: ${{ vars.CI_JOB_CONTAINER_IMAGE }}
      env:
        HOME: /__w/aisim/aisim
        USER: runner
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Install aggregation tooling
        run: |
          python -m venv "${RUNNER_TEMP}/accuracy-venv"
          echo "${RUNNER_TEMP}/accuracy-venv/bin" >> "${GITHUB_PATH}"
          "${RUNNER_TEMP}/accuracy-venv/bin/python" -m pip install --require-hashes -r scripts/e2e_accuracy/requirements.txt
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: e2e-accuracy-dataset
          path: ${{ runner.temp }}/accuracy-dataset
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: e2e-accuracy-results-${{ inputs.artifact_key }}-shard-*
          path: ${{ runner.temp }}/accuracy-shards-encrypted
          merge-multiple: true
      - name: Decrypt private shard results
        env:
          HF_TOKEN: ${{ secrets.HF_READ_AISIM_INFX_CACHE }}
        run: python scripts/e2e_accuracy/private_artifacts.py open "${RUNNER_TEMP}/accuracy-shards-encrypted" "${RUNNER_TEMP}/accuracy-shards"
      - name: Verify every shard and qualify the complete cohort
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.sha }}
          EVALUATED_BRANCH: ${{ inputs.branch }}
          WHEEL_SHA256: ${{ needs.wheel.outputs.sha256 }}
          PREVIEW: ${{ inputs.preview }}
          CONFIGURATION_MODE: ${{ inputs.configuration_mode }}
        run: |
          preview_args=()
          if [[ "${PREVIEW}" == 'true' ]]; then preview_args+=(--preview); fi
          python scripts/e2e_accuracy/run_e2e_accuracy.py merge \
            --shards "${RUNNER_TEMP}/accuracy-shards" --shard-count 4 \
            --manifest "${RUNNER_TEMP}/accuracy-dataset/e2e-accuracy-dataset.json" \
            --wheel-sha256 "${WHEEL_SHA256}" \
            --commit "${EXPECTED_SHA}" --branch "${EVALUATED_BRANCH}" \
            --run-id "${GITHUB_RUN_ID}" --run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --configuration-mode "${CONFIGURATION_MODE}" \
            --output "${RUNNER_TEMP}/accuracy-public" "${preview_args[@]}"
      - name: Report advisory accuracy and coverage
        run: |
          python - <<'PY' >> "${GITHUB_STEP_SUMMARY}"
          import json, os
          from pathlib import Path
          summary = json.loads((Path(os.environ['RUNNER_TEMP']) / 'accuracy-public/summary.json').read_text())
          print('## E2E accuracy (advisory)\n')
          print('Evaluated revision:', summary['snapshot']['evaluated_revision'])
          print('Measurements:', summary['snapshot']['release_tag'])
          print('\n```json\n' + json.dumps(summary['totals'], indent=2) + '\n```')
          print('\nConfiguration evidence:', summary['snapshot']['campaign'].get('configuration', 'not recorded'))
          print('\nCampaign outcomes:', summary['snapshot']['campaign']['outcomes'])
          print('\nMeasurement exclusions:', summary['snapshot']['campaign']['measurement_filter_counts'])
          print('\nPrediction exclusions:', summary['snapshot']['campaign']['exclusion_reasons'])
          print('\nAccuracy values do not gate release staging. Incomplete campaigns cannot publish.')
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ inputs.preview && 'e2e-accuracy-preview' || 'e2e-accuracy-web' }}-${{ inputs.artifact_key }}
          overwrite: true
          # A single directory lets the container hook remap the entire path.
          path: ${{ runner.temp }}/accuracy-public/
          if-no-files-found: error
          retention-days: 90

  agentx:
    name: Evaluate AgentX shard ${{ matrix.shard }} (${{ inputs.artifact_key }})
    needs: wheel
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        shard: [0, 1]
    runs-on: prod-aisim-default-amd64-v1
    timeout-minutes: 360
    container:
      image: ${{ vars.CI_JOB_CONTAINER_IMAGE }}
      env:
        HOME: /__w/aisim/aisim
        USER: runner
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      RAYON_NUM_THREADS: '1'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Install the CPU campaign environment
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgomp1
          python -m venv "${RUNNER_TEMP}/agentx-venv"
          echo "${RUNNER_TEMP}/agentx-venv/bin" >> "${GITHUB_PATH}"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: e2e-accuracy-wheel-${{ inputs.artifact_key }}
          path: ${{ runner.temp }}/agentx-wheel
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: e2e-accuracy-dataset
          path: ${{ runner.temp }}/agentx-dataset
      - name: Install the exact evaluated wheel
        env:
          WHEEL_SHA256: ${{ needs.wheel.outputs.sha256 }}
        run: |
          echo "${WHEEL_SHA256}  $(echo "${RUNNER_TEMP}"/agentx-wheel/*.whl)" | sha256sum --check --strict
          python -m pip install "${RUNNER_TEMP}"/agentx-wheel/*.whl
          python -m pip install --require-hashes -r scripts/e2e_accuracy/requirements.txt
      - name: Fetch frozen AgentX inputs and replay one point at a time
        shell: bash
        env:
          HF_TOKEN: ${{ secrets.HF_READ_AISIM_INFX_CACHE }}
          HF_HOME: ${{ runner.temp }}/agentx-hf
          EXPECTED_SHA: ${{ inputs.sha }}
          EVALUATED_BRANCH: ${{ inputs.branch }}
          WHEEL_SHA256: ${{ needs.wheel.outputs.sha256 }}
          PREVIEW: ${{ inputs.preview }}
          SHARD_INDEX: ${{ matrix.shard }}
          AGENTX_REVISION: ${{ inputs.agentx_revision }}
          AGENTX_CAMPAIGN_CATALOG: ${{ inputs.agentx_campaign_catalog }}
        run: |
          revision=$(python -c 'import json,os; print(json.load(open(os.environ["RUNNER_TEMP"]+"/agentx-dataset/e2e-accuracy-dataset.json"))["revision"])')
          revision="${AGENTX_REVISION:-$revision}"
          fetch_args=()
          if [[ "$PREVIEW" == true ]]; then fetch_args+=(--preview); fi
          if [[ -n "$AGENTX_CAMPAIGN_CATALOG" ]]; then fetch_args+=(--campaign-catalog "$AGENTX_CAMPAIGN_CATALOG"); fi
          python scripts/e2e_accuracy/run_agentx_accuracy.py fetch --revision "$revision" --output "${RUNNER_TEMP}/agentx-inputs" "${fetch_args[@]}"
          preview_args=()
          if [[ "$PREVIEW" == true ]]; then preview_args+=(--preview); fi
          python scripts/e2e_accuracy/run_agentx_accuracy.py run \
            --inputs "${RUNNER_TEMP}/agentx-inputs" --output "${RUNNER_TEMP}/agentx-results" \
            --revision "$revision" --commit "$EXPECTED_SHA" --branch "$EVALUATED_BRANCH" \
            --wheel "${RUNNER_TEMP}"/agentx-wheel/*.whl --wheel-sha256 "$WHEEL_SHA256" \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --shard-index "$SHARD_INDEX" --shard-count 2 "${preview_args[@]}"
          cp "${RUNNER_TEMP}/agentx-inputs/catalog/e2e/agentx.json" "${RUNNER_TEMP}/agentx-results/catalog.json"
      - name: Encrypt private AgentX results
        if: always()
        env:
          HF_TOKEN: ${{ secrets.HF_READ_AISIM_INFX_CACHE }}
        run: |
          if test -d "${RUNNER_TEMP}/agentx-results"; then
            python scripts/e2e_accuracy/private_artifacts.py seal "${RUNNER_TEMP}/agentx-results" "${RUNNER_TEMP}/agentx-encrypted"
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: agentx-private-${{ inputs.artifact_key }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/agentx-encrypted/
          if-no-files-found: error
          retention-days: 7

  qualify-agentx:
    name: Qualify AgentX accuracy (${{ inputs.artifact_key }})
    needs: agentx
    runs-on: prod-aisim-default-amd64-v1
    timeout-minutes: 30
    container:
      image: ${{ vars.CI_JOB_CONTAINER_IMAGE }}
      env:
        HOME: /__w/aisim/aisim
        USER: runner
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Install qualification tooling
        run: |
          python -m venv "${RUNNER_TEMP}/agentx-venv"
          echo "${RUNNER_TEMP}/agentx-venv/bin" >> "${GITHUB_PATH}"
          "${RUNNER_TEMP}/agentx-venv/bin/python" -m pip install --require-hashes -r scripts/e2e_accuracy/requirements.txt
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: agentx-private-${{ inputs.artifact_key }}-*
          path: ${{ runner.temp }}/agentx-encrypted
          merge-multiple: true
      - name: Verify complete cohort and export public numerical evidence
        shell: bash
        env:
          PREVIEW: ${{ inputs.preview }}
          AGENTX_CAMPAIGN_CATALOG: ${{ inputs.agentx_campaign_catalog }}
          HF_TOKEN: ${{ secrets.HF_READ_AISIM_INFX_CACHE }}
        run: |
          python scripts/e2e_accuracy/private_artifacts.py open "${RUNNER_TEMP}/agentx-encrypted" "${RUNNER_TEMP}/agentx-results"
          revision=$(python -c 'import json,os; print(json.load(open(os.environ["RUNNER_TEMP"]+"/agentx-results/shard-0.json"))["snapshot"]["dataset_revision"])')
          fetch_args=()
          if [[ "$PREVIEW" == true ]]; then fetch_args+=(--preview); fi
          if [[ -n "$AGENTX_CAMPAIGN_CATALOG" ]]; then fetch_args+=(--campaign-catalog "$AGENTX_CAMPAIGN_CATALOG"); fi
          python scripts/e2e_accuracy/run_agentx_accuracy.py fetch --metadata-only \
            --revision "$revision" --output "${RUNNER_TEMP}/agentx-inputs" "${fetch_args[@]}"
          python scripts/e2e_accuracy/run_agentx_accuracy.py qualify \
            --inputs "${RUNNER_TEMP}/agentx-inputs" --shards "${RUNNER_TEMP}/agentx-results" \
            --shard-count 2 --output "${RUNNER_TEMP}/agentx-public"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ inputs.preview && 'e2e-agentx-preview' || 'e2e-agentx-web' }}-${{ inputs.artifact_key }}
          path: ${{ runner.temp }}/agentx-public/
          if-no-files-found: error
          retention-days: 90
