# 77fd0773407b3683d8a671fe24a30a7110651b64; modified as a reusable AISim Full CI gate.
# Source: https://github.com/ai-dynamo/AIConfigurator/tree/77fd0773407b3683d8a671fe24a30a7110651b64

name: Collector Data Check

on:
  workflow_call:
    inputs:
      expected_sha:
        description: Exact commit that Full CI expects this workflow to validate
        required: false
        type: string
        default: ""
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Manual and reusable invocations are isolated and never cancel one another.
  group: collector-data-${{ github.run_id }}

jobs:
  check:
    name: Check collector data
    runs-on: prod-aisim-default-amd64-v1
    timeout-minutes: 20
    container:
      image: ${{ vars.CI_JOB_CONTAINER_IMAGE }}
      env:
        HOME: /__w/aisim/aisim
        USER: runner
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.expected_sha || github.sha }}
          persist-credentials: false
      - name: Verify exact target
        env:
          TARGET_SHA: ${{ inputs.expected_sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$(git rev-parse "${TARGET_SHA}^{commit}")"
      - uses: ./.github/actions/setup-python-rust
        with:
          python-version: "3.13"
      - name: Install AISim and development dependencies
        run: python -m pip install './python/aisim[dev]'
      - name: Check Collector V3 data invariants
        working-directory: python/aisim
        run: python tools/perf_database/check_collector_data.py
      - name: Check op-backend facts registry
        working-directory: python/aisim
        run: python tools/perf_database/backend_facts.py --check

  cross-backend-consistency:
    name: Perf data sanity (informational)
    runs-on: prod-aisim-default-amd64-v1
    timeout-minutes: 25
    continue-on-error: true
    container:
      image: ${{ vars.CI_JOB_CONTAINER_IMAGE }}
      env:
        HOME: /__w/aisim/aisim
        USER: runner
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.expected_sha || github.sha }}
          persist-credentials: false
      - name: Verify exact target
        env:
          TARGET_SHA: ${{ inputs.expected_sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$(git rev-parse "${TARGET_SHA}^{commit}")"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
      - name: Install check dependencies
        run: python -m pip install pandas pyarrow numpy pyyaml 'tqdm>=4.0.0'
      - name: Run cross-backend consistency checks
        working-directory: python/aisim
        run: |
          python tools/perf_database/check_cross_backend.py --workers 4 \
            --out-md cross-backend-consistency.md \
            --out-json cross-backend-consistency.json
      - name: Add triage summary
        if: always()
        working-directory: python/aisim
        run: |
          if [ -f cross-backend-consistency.md ]; then
            sed -n '/^# Perf data sanity/,/^## Layer 1/p' cross-backend-consistency.md \
              | sed '$d' >> "${GITHUB_STEP_SUMMARY}"
          fi
      - name: Upload consistency report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cross-backend-consistency
          path: |
            python/aisim/cross-backend-consistency.md
            python/aisim/cross-backend-consistency.json
          if-no-files-found: ignore
          retention-days: 30
