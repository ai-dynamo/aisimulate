name: README command checks
on:
  workflow_call:
    inputs:
      daily:
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  commands:
    name: README / ${{ matrix.profile }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.daily && '[{"profile":"development","os":"ubuntu-latest"},{"profile":"release","os":"ubuntu-latest"},{"profile":"dynamo","os":"ubuntu-latest"},{"profile":"macos","os":"macos-14"}]' || '[{"profile":"source","os":"ubuntu-latest"},{"profile":"dynamo","os":"ubuntu-latest"}]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 330
    env:
      HF_HUB_DISABLE_IMPLICIT_TOKEN: '1'
      HF_HUB_DISABLE_XET: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: '1.98.0'
      - name: Fetch historical test baseline
        run: git fetch origin d066e918705b98e2d55eed55743ce8d225f129ea
      - name: Install harness dependencies
        run: python -m pip install uv psutil PyYAML pytest
      - name: Check harness and reporting contracts
        run: |
          python -m pytest -c /dev/null -p no:cacheprovider scripts/test_readme_commands.py scripts/test_readme_report.py
          python scripts/check_readme_commands.py --validate
      - name: Execute README commands
        env:
          PROFILE: ${{ matrix.profile }}
        run: >-
          python scripts/check_readme_commands.py
          --profile "$PROFILE"
          --workspace "$RUNNER_TEMP/readme-$PROFILE"
          --output "readme-results/$PROFILE"
      - name: Preserve command evidence even after failure
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: readme-${{ matrix.profile }}
          path: readme-results/
          if-no-files-found: error
          retention-days: 30
