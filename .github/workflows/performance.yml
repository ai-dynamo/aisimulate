name: PR 585 cold-query isolation (diagnostic)

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to compare
        required: true
        type: number
      expected_sha:
        description: Reviewed diagnostic branch commit (full SHA)
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-585-cold-diagnostic-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  select:
    name: Select Forward Performance
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      number: ${{ steps.scope.outputs.number }}
      head_sha: ${{ steps.scope.outputs.head_sha }}
      base_ref: ${{ steps.scope.outputs.base_ref }}
      run_comparison: ${{ steps.scope.outputs.run_comparison }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Select from the complete PR change set
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          test "${PR_NUMBER}" = "585"
          test "${GITHUB_SHA}" = "${EXPECTED_SHA}"
          python scripts/performance/select_forward_perf.py

  compare:
    needs: select
    if: needs.select.outputs.run_comparison == 'true'
    name: Collect balanced cold-query diagnostic
    runs-on: prod-aisimulate-default-amd64-v1
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    container:
      image: ${{ vars.CI_JOB_CONTAINER_IMAGE }}
      env:
        HOME: /__w/aisimulate/aisimulate
        USER: runner
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12.16"

      - name: Configure Python linker path
        run: echo "LIBRARY_PATH=${pythonLocation}/lib" >> "${GITHUB_ENV}"

      - name: Install native build toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends build-essential util-linux

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: "1.99.1"

      - name: Install wheel builder
        run: python -m pip install --require-hashes -r scripts/release/requirements.txt

      - name: Prepare exact revisions
        id: revisions
        env:
          PR_HEAD_SHA: ${{ needs.select.outputs.head_sha }}
          BASE_REF: ${{ needs.select.outputs.base_ref }}
        run: |
          set -euo pipefail
          actual_head="$(git rev-parse HEAD)"
          if [[ "${actual_head}" != "${GITHUB_SHA}" ]]; then
            echo "checked out ${actual_head}, expected diagnostic source ${GITHUB_SHA}" >&2
            exit 1
          fi
          base_tip="$(git rev-parse "refs/remotes/origin/${BASE_REF}")"
          base_sha="$(git merge-base "${PR_HEAD_SHA}" "${base_tip}")"
          if [[ "${base_sha}" != "912e91755a23a79724426a0301f3ab157086be2f" ||
                "${PR_HEAD_SHA}" != "a75c4a62cba4e734395d26885afbcf9a5fa8cb83" ]]; then
            echo "the reviewed diagnostic only applies to the pinned base/head pair" >&2
            exit 1
          fi

          gate_path="python/aisimulate/tools/forward_perf_gate"
          skip_reason=""
          for revision_label in base head; do
            if [[ "${revision_label}" == "base" ]]; then
              revision="${base_sha}"
            else
              revision="${PR_HEAD_SHA}"
            fi
            for gate_file in __init__.py run.py worker.py; do
              if ! git cat-file -e "${revision}:${gate_path}/${gate_file}" 2>/dev/null; then
                skip_reason="${revision_label} revision \`${revision}\` does not contain the complete forward-performance gate"
                break 2
              fi
            done
          done

          if [[ -z "${skip_reason}" ]]; then
            base_protocol="$(
              git show "${base_sha}:${gate_path}/__init__.py" 2>/dev/null |
                sed -nE 's/^PROTOCOL_VERSION[[:space:]]*=[[:space:]]*([0-9]+)[[:space:]]*$/\1/p'
            )"
            head_protocol="$(
              git show "${PR_HEAD_SHA}:${gate_path}/__init__.py" 2>/dev/null |
                sed -nE 's/^PROTOCOL_VERSION[[:space:]]*=[[:space:]]*([0-9]+)[[:space:]]*$/\1/p'
            )"
            if [[ ! "${base_protocol}" =~ ^[0-9]+$ ]]; then
              skip_reason="could not read PROTOCOL_VERSION from base revision \`${base_sha}\`"
            elif [[ ! "${head_protocol}" =~ ^[0-9]+$ ]]; then
              skip_reason="could not read PROTOCOL_VERSION from head revision \`${PR_HEAD_SHA}\`"
            elif [[ "${base_protocol}" != "${head_protocol}" ]]; then
              skip_reason="protocol versions differ: base is ${base_protocol}, head is ${head_protocol}"
            fi
          fi

          if [[ -n "${skip_reason}" ]]; then
            echo "diagnostic cannot run: ${skip_reason}" >&2
            exit 1
          fi

          git worktree prune

          run_root="${RUNNER_TEMP}/forward-perf-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          base_src="${run_root}/base-src"
          head_src="${run_root}/head-src"
          mkdir -p "${run_root}"

          {
            echo "BASE_SHA=${base_sha}"
            echo "HEAD_SHA=${PR_HEAD_SHA}"
            echo "BASE_SRC=${base_src}"
            echo "HEAD_SRC=${head_src}"
            echo "BASE_DIST=${run_root}/base-dist"
            echo "HEAD_DIST=${run_root}/head-dist"
            echo "BASE_VENV=${run_root}/base-venv"
            echo "HEAD_VENV=${run_root}/head-venv"
            echo "CONTROL_VENV=${run_root}/control-venv"
            echo "RESULTS_DIR=${run_root}/results"
          } >> "${GITHUB_ENV}"

          git worktree add --detach "${base_src}" "${base_sha}"
          git worktree add --detach "${head_src}" "${PR_HEAD_SHA}"
          echo "run_comparison=true" >> "${GITHUB_OUTPUT}"

      - name: Build and install both revisions
        id: build
        if: steps.revisions.outputs.run_comparison == 'true'
        run: |
          set -euo pipefail
          mkdir -p "${BASE_DIST}" "${HEAD_DIST}"
          (
            cd "${BASE_SRC}/python/aisimulate"
            CARGO_TARGET_DIR="${RUNNER_TEMP}/forward-perf-base-target" \
              python -m maturin build --release --locked --out "${BASE_DIST}"
          )
          (
            cd "${HEAD_SRC}/python/aisimulate"
            CARGO_TARGET_DIR="${RUNNER_TEMP}/forward-perf-head-target" \
              python -m maturin build --release --locked --out "${HEAD_DIST}"
          )
          python -m venv "${BASE_VENV}"
          python -m venv "${HEAD_VENV}"
          python -m venv "${CONTROL_VENV}"
          "${BASE_VENV}/bin/python" -m pip install "${BASE_DIST}"/*.whl
          "${HEAD_VENV}/bin/python" -m pip install "${HEAD_DIST}"/*.whl
          "${CONTROL_VENV}/bin/python" -m pip install "${BASE_DIST}"/*.whl

      - name: Collect crossed traversal/order and same-revision controls
        if: steps.revisions.outputs.run_comparison == 'true'
        run: |
          set -euo pipefail
          unset PYTHONPATH
          "${BASE_VENV}/bin/python" \
            scripts/performance/diagnose_pr585_cold_queries.py \
            --base-source "${BASE_SRC}" \
            --head-source "${HEAD_SRC}" \
            --base-wheel "${BASE_DIST}"/*.whl \
            --head-wheel "${HEAD_DIST}"/*.whl \
            --base-python "${BASE_VENV}/bin/python" \
            --head-python "${HEAD_VENV}/bin/python" \
            --control-python "${CONTROL_VENV}/bin/python" \
            --output-dir "${RESULTS_DIR}"

      - name: Publish diagnostic summary
        if: always() && steps.revisions.outputs.run_comparison == 'true'
        run: |
          if [[ -f "${RESULTS_DIR}/summary.md" ]]; then
            cat "${RESULTS_DIR}/summary.md" >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Upload benchmark artifacts
        if: always() && steps.revisions.outputs.run_comparison == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr585-cold-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.RESULTS_DIR }}
          if-no-files-found: warn
          retention-days: 30

      - name: Remove benchmark worktrees
        if: always()
        run: |
          if [[ -n "${BASE_SRC:-}" ]]; then
            git worktree remove --force "${BASE_SRC}" || true
          fi
          if [[ -n "${HEAD_SRC:-}" ]]; then
            git worktree remove --force "${HEAD_SRC}" || true
          fi
          git worktree prune || true
