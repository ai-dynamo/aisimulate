name: Forward Prediction Performance (advisory)

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to compare
        required: true
        type: number
  push:
    # Velonix admits canonical pushes, not untrusted pull_request events.
    branches:
      - "pull-request/*"
    paths:
      # Keep this filter aligned with the measured Rust and Python call path.
      - ".github/workflows/performance.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/core/Cargo.toml"
      - "crates/core/src/lib.rs"
      - "crates/core/src/python.rs"
      - "crates/core/src/engine/**"
      - "crates/core/src/perfmodel/**"
      - "python/aisimulate/pyproject.toml"
      - "python/aisimulate/src/aisimulate/__init__.py"
      - "python/aisimulate/src/aiconfigurator/sdk/**"
      - "python/aisimulate/src/aiconfigurator_core/*.py"
      - "python/aisimulate/src/aiconfigurator_core/sdk/**"
      - "python/aisimulate/src/aiconfigurator_core/model_configs/Qwen--Qwen3-32B_config.json"
      - "python/aisimulate/src/aiconfigurator_core/model_configs/Qwen--Qwen3-235B-A22B_config.json"
      - "python/aisimulate/src/aiconfigurator_core/model_configs/deepseek-ai--DeepSeek-V3.2_config.json"
      - "python/aisimulate/src/aiconfigurator_core/model_configs/deepseek-ai--DeepSeek-V4-Flash_config.json"
      - "python/aisimulate/src/aiconfigurator_core/model_configs/Qwen--Qwen3.5-397B-A17B_config.json"
      - "python/aisimulate/src/aiconfigurator_core/model_configs/openai--gpt-oss-120b_config.json"
      - "python/aisimulate/src/aiconfigurator_core/model_configs/nvidia--NVIDIA-Nemotron-3-Super-120B-A12B-FP8_config.json"
      - "python/aisimulate/src/aiconfigurator_core/systems/*.yaml"
      - "python/aisimulate/src/aiconfigurator_core/systems/support_matrix/**"
      - "python/aisimulate/src/aiconfigurator_core/systems/fpe_support_matrix/**"
      - "python/aisimulate/src/aiconfigurator_core/systems/data/b200_sxm/**"
      - "python/aisimulate/src/aiconfigurator_core/systems/data/h100_sxm/**"
      - "python/aisimulate/tools/forward_perf_gate/**"
      - "python/aisimulate/tools/prediction_regression_gate/grid.py"

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && format('pull-request/{0}', inputs.pr_number) || github.ref_name }}
  cancel-in-progress: true

jobs:
  compare:
    name: Forward Prediction Performance (advisory)
    runs-on: prod-aisimulate-default-amd64-v1
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    container:
      image: ${{ vars.CI_JOB_CONTAINER_IMAGE }}
      env:
        HOME: /__w/aisimulate/aisimulate
        USER: runner
    steps:
      - name: Resolve pull request
        id: pr
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            let number;
            if (context.eventName === 'workflow_dispatch') {
              number = Number(context.payload.inputs.pr_number);
            } else {
              const match = context.ref.match(/^refs\/heads\/pull-request\/(\d+)$/);
              if (!match) {
                core.setFailed(`Cannot resolve a PR number from ${context.ref}`);
                return;
              }
              number = Number(match[1]);
            }
            const {data: pull} = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: number,
            });
            let headSha = context.sha;
            if (context.eventName === 'workflow_dispatch') {
              const {data: canonical} = await github.rest.git.getRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `heads/pull-request/${number}`,
              });
              headSha = canonical.object.sha;
            }
            core.setOutput('number', String(number));
            core.setOutput('head_sha', headSha);
            core.setOutput('base_ref', pull.base.ref);

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.pr.outputs.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Configure Python linker path
        run: echo "LIBRARY_PATH=${pythonLocation}/lib" >> "${GITHUB_ENV}"

      - name: Install native build toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends build-essential util-linux

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable

      - name: Install wheel builder
        run: python -m pip install 'maturin>=1.12,<2'

      - name: Prepare exact revisions
        id: revisions
        env:
          PR_HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          BASE_REF: ${{ steps.pr.outputs.base_ref }}
        run: |
          set -euo pipefail
          actual_head="$(git rev-parse HEAD)"
          if [[ "${actual_head}" != "${PR_HEAD_SHA}" ]]; then
            echo "checked out ${actual_head}, expected PR head ${PR_HEAD_SHA}" >&2
            exit 1
          fi
          base_tip="$(git rev-parse "refs/remotes/origin/${BASE_REF}")"
          base_sha="$(git merge-base "${PR_HEAD_SHA}" "${base_tip}")"

          gate_path="python/aisimulate/tools/forward_perf_gate"
          skip_reason=""
          for revision_label in base head; do
            if [[ "${revision_label}" == "base" ]]; then
              revision="${base_sha}"
            else
              revision="${PR_HEAD_SHA}"
            fi
            for gate_file in __init__.py run.py worker.py; do
              if ! git cat-file -e "${revision}:${gate_path}/${gate_file}" 2>/dev/null; then
                skip_reason="${revision_label} revision \`${revision}\` does not contain the complete forward-performance gate"
                break 2
              fi
            done
          done

          if [[ -z "${skip_reason}" ]]; then
            base_protocol="$(
              git show "${base_sha}:${gate_path}/__init__.py" 2>/dev/null |
                sed -nE 's/^PROTOCOL_VERSION[[:space:]]*=[[:space:]]*([0-9]+)[[:space:]]*$/\1/p'
            )"
            head_protocol="$(
              git show "${PR_HEAD_SHA}:${gate_path}/__init__.py" 2>/dev/null |
                sed -nE 's/^PROTOCOL_VERSION[[:space:]]*=[[:space:]]*([0-9]+)[[:space:]]*$/\1/p'
            )"
            if [[ ! "${base_protocol}" =~ ^[0-9]+$ ]]; then
              skip_reason="could not read PROTOCOL_VERSION from base revision \`${base_sha}\`"
            elif [[ ! "${head_protocol}" =~ ^[0-9]+$ ]]; then
              skip_reason="could not read PROTOCOL_VERSION from head revision \`${PR_HEAD_SHA}\`"
            elif [[ "${base_protocol}" != "${head_protocol}" ]]; then
              skip_reason="protocol versions differ: base is ${base_protocol}, head is ${head_protocol}"
            fi
          fi

          if [[ -n "${skip_reason}" ]]; then
            echo "run_comparison=false" >> "${GITHUB_OUTPUT}"
            {
              echo "## Forward Prediction Performance (advisory)"
              echo
              echo "**SKIPPED** — ${skip_reason}."
              echo
              echo "Head \`${PR_HEAD_SHA}\` was not benchmarked."
            } >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi

          git worktree prune

          run_root="${RUNNER_TEMP}/forward-perf-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          base_src="${run_root}/base-src"
          head_src="${run_root}/head-src"
          mkdir -p "${run_root}"

          {
            echo "BASE_SHA=${base_sha}"
            echo "HEAD_SHA=${PR_HEAD_SHA}"
            echo "BASE_SRC=${base_src}"
            echo "HEAD_SRC=${head_src}"
            echo "BASE_DIST=${run_root}/base-dist"
            echo "HEAD_DIST=${run_root}/head-dist"
            echo "BASE_VENV=${run_root}/base-venv"
            echo "HEAD_VENV=${run_root}/head-venv"
            echo "RESULTS_DIR=${run_root}/results"
          } >> "${GITHUB_ENV}"

          git worktree add --detach "${base_src}" "${base_sha}"
          git worktree add --detach "${head_src}" "${PR_HEAD_SHA}"
          echo "run_comparison=true" >> "${GITHUB_OUTPUT}"

      - name: Build and install both revisions
        if: steps.revisions.outputs.run_comparison == 'true'
        run: |
          set -euo pipefail
          mkdir -p "${BASE_DIST}" "${HEAD_DIST}"
          (
            cd "${BASE_SRC}/python/aisimulate"
            CARGO_TARGET_DIR="${RUNNER_TEMP}/forward-perf-base-target" \
              python -m maturin build --release --out "${BASE_DIST}"
          )
          (
            cd "${HEAD_SRC}/python/aisimulate"
            CARGO_TARGET_DIR="${RUNNER_TEMP}/forward-perf-head-target" \
              python -m maturin build --release --out "${HEAD_DIST}"
          )
          python -m venv "${BASE_VENV}"
          python -m venv "${HEAD_VENV}"
          "${BASE_VENV}/bin/python" -m pip install "${BASE_DIST}"/aisimulate-*.whl
          "${HEAD_VENV}/bin/python" -m pip install "${HEAD_DIST}"/aisimulate-*.whl

      - name: Run paired benchmark
        if: steps.revisions.outputs.run_comparison == 'true'
        run: |
          set -euo pipefail
          "${BASE_VENV}/bin/python" \
            "${BASE_SRC}/python/aisimulate/tools/forward_perf_gate/run.py" \
            --base-python "${BASE_VENV}/bin/python" \
            --base-worker "${BASE_SRC}/python/aisimulate/tools/forward_perf_gate/worker.py" \
            --base-revision "${BASE_SHA}" \
            --head-python "${HEAD_VENV}/bin/python" \
            --head-worker "${HEAD_SRC}/python/aisimulate/tools/forward_perf_gate/worker.py" \
            --head-revision "${HEAD_SHA}" \
            --output-dir "${RESULTS_DIR}"

      - name: Publish summary and annotations
        if: always() && steps.revisions.outputs.run_comparison == 'true'
        run: |
          if [[ -f "${RESULTS_DIR}/summary.md" ]]; then
            cat "${RESULTS_DIR}/summary.md" >> "${GITHUB_STEP_SUMMARY}"
          fi
          if [[ -s "${RESULTS_DIR}/annotations.txt" ]]; then
            blocker_count="$(grep -c . "${RESULTS_DIR}/annotations.txt")"
            echo "::error::Forward-prediction performance found ${blocker_count} blocker(s); see the job summary and artifact for details."
          fi

      - name: Upload benchmark artifacts
        if: always() && steps.revisions.outputs.run_comparison == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: forward-prediction-performance-pr-${{ steps.pr.outputs.number }}
          path: ${{ env.RESULTS_DIR }}
          if-no-files-found: warn
          retention-days: 30

      - name: Remove benchmark worktrees
        if: always()
        run: |
          if [[ -n "${BASE_SRC:-}" ]]; then
            git worktree remove --force "${BASE_SRC}" || true
          fi
          if [[ -n "${HEAD_SRC:-}" ]]; then
            git worktree remove --force "${HEAD_SRC}" || true
          fi
          git worktree prune || true
