name: Simulation Performance (advisory)
run-name: 'SGLang KV routing backtest: #397 fixed head versus slow merge base'
'on':
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: simulation-kv-backtest-397-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    name: Build simulation wheel (${{ matrix.side }})
    runs-on: prod-aisimulate-default-amd64-v1
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
        - side: base
          sha: 988edba8732af6f45990d0cb567c001119121566
        - side: head
          sha: 9093044260aa703c7e231ea54021940083843ada
    defaults:
      run:
        shell: bash
    container:
      image: ${{ vars.CI_JOB_CONTAINER_IMAGE }}
      env:
        HOME: /__w/aisimulate/aisimulate
        USER: runner
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ matrix.sha }}
        path: source
        persist-credentials: false
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: '3.12'
    - name: Configure Python linker path
      run: echo "LIBRARY_PATH=${pythonLocation}/lib" >> "${GITHUB_ENV}"
    - name: Select pinned Dynamo source
      run: python -c 'from scripts.build_simulation_dynamo import DYNAMO_REVISION; print("DYNAMO_SHA=" + DYNAMO_REVISION)'
        >> "${GITHUB_ENV}"
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: ai-dynamo/dynamo
        ref: ${{ env.DYNAMO_SHA }}
        path: dynamo
        persist-credentials: false
    - name: Install native build toolchain
      run: bash scripts/ci_install_build_tools.sh
    - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
      with:
        toolchain: 1.99.0
    - name: Install wheel builder
      run: |
        python -m pip install 'maturin>=1.12,<2' 'uv==0.11.3' 'hatchling==1.27.0'
        as_root=()
        if [[ "$(id -u)" != 0 ]]; then as_root=(sudo); fi
        "${as_root[@]}" apt-get update
        "${as_root[@]}" apt-get install --yes --no-install-recommends protobuf-compiler libprotobuf-dev clang libclang-dev pkg-config libssl-dev libudev-dev cmake unzip
    - name: Build exact revision
      env:
        SOURCE_SHA: ${{ matrix.sha }}
        BUILD_SIDE: ${{ matrix.side }}
        BUILD_CONTAINER: ${{ vars.CI_JOB_CONTAINER_IMAGE }}
      run: |
        set -euo pipefail
        started="$(date +%s)"
        test "$(git -C source rev-parse HEAD)" = "${SOURCE_SHA}"
        export CARGO_TARGET_DIR="${RUNNER_TEMP}/simulation-perf-target"
        (
          cd source/python/aisimulate
          python -m maturin build --release --locked --out "${RUNNER_TEMP}/wheel"
        )
        uv export --project source/python/aisimulate --frozen --no-dev --no-emit-project \
          --format requirements-txt --output-file "${RUNNER_TEMP}/wheel/requirements.txt"
        python scripts/build_simulation_dynamo.py source dynamo "${RUNNER_TEMP}/wheel"
        cp scripts/simulation_dynamo_requirements.txt "${RUNNER_TEMP}/wheel/dynamo-requirements.txt"
        export BUILD_SECONDS=$(( $(date +%s) - started ))
        python scripts/simulation_perf_artifact.py record "${RUNNER_TEMP}/wheel" \
          "${BUILD_SIDE}" "${SOURCE_SHA}" source
    - name: Upload exact wheel
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: simulation-wheel-${{ matrix.side }}-${{ matrix.sha }}
        path: ${{ runner.temp }}/wheel
        if-no-files-found: error
        retention-days: 30
  compare:
    needs:
    - build
    name: Simulation Performance (advisory)
    runs-on: prod-aisimulate-default-amd64-v1
    timeout-minutes: 75
    defaults:
      run:
        shell: bash
    container:
      image: ${{ vars.CI_JOB_CONTAINER_IMAGE }}
      env:
        HOME: /__w/aisimulate/aisimulate
        USER: runner
    env:
      BASE_SHA: 988edba8732af6f45990d0cb567c001119121566
      HEAD_SHA: 9093044260aa703c7e231ea54021940083843ada
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ github.sha }}
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: '3.12'
    - name: Prepare comparison environments
      run: |
        set -euo pipefail
        git worktree prune

        run_root="${RUNNER_TEMP}/simulation-perf-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
        base_src="${run_root}/base-src"
        head_src="${run_root}/head-src"
        mkdir -p "${run_root}"

        {
          echo "BASE_SRC=${base_src}"
          echo "HEAD_SRC=${head_src}"
          echo "BASE_DIST=${run_root}/base-dist"
          echo "HEAD_DIST=${run_root}/head-dist"
          echo "BASE_VENV=${run_root}/base-venv"
          echo "HEAD_VENV=${run_root}/head-venv"
          echo "RESULTS_DIR=${run_root}/results"
        } >> "${GITHUB_ENV}"

        git worktree add --detach "${base_src}" "${BASE_SHA}"
        git worktree add --detach "${head_src}" "${HEAD_SHA}"

        # Overlay only the benchmark adapter. Installed runtime wheels retain exact source identities.
        mkdir -p "${run_root}/results/provenance"
        git merge-base --is-ancestor "${HEAD_SHA}" "${BASE_SHA}"
        git diff --exit-code "${BASE_SHA}" "${HEAD_SHA}" -- Cargo.lock python/aisimulate/uv.lock
        for source in "${base_src}" "${head_src}"; do
          git -C "${source}" diff --exit-code HEAD
          git archive "${GITHUB_SHA}" python/aisimulate/tools/simulation_perf_gate | tar -x -C "${source}"
        done
        git diff "${BASE_SHA}" "${HEAD_SHA}" > "${run_root}/results/provenance/candidate.patch"
        git -C "${base_src}" diff HEAD > "${run_root}/results/provenance/base-adapter.patch"
        git -C "${head_src}" diff HEAD > "${run_root}/results/provenance/head-adapter.patch"
        echo "${GITHUB_SHA}" > "${run_root}/results/provenance/adapter-revision.txt"
        cp BACKTEST.md "${run_root}/results/provenance/BACKTEST.md"
    - name: Download base wheel
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: simulation-wheel-base-988edba8732af6f45990d0cb567c001119121566
        path: ${{ env.BASE_DIST }}
    - name: Download head wheel
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: simulation-wheel-head-9093044260aa703c7e231ea54021940083843ada
        path: ${{ env.HEAD_DIST }}
    - name: Verify and install both artifacts
      id: install
      run: |
        set -euo pipefail
        command -v taskset
        python scripts/simulation_perf_artifact.py verify \
          --base-dir "${BASE_DIST}" --base-sha "${BASE_SHA}" \
          --head-dir "${HEAD_DIST}" --head-sha "${HEAD_SHA}"
        started="$(date +%s)"
        mkdir -p "${RESULTS_DIR}/provenance"
        for side in base head; do
          if [[ "${side}" == "base" ]]; then
            dist="${BASE_DIST}"
            venv="${BASE_VENV}"
          else
            dist="${HEAD_DIST}"
            venv="${HEAD_VENV}"
          fi
          python -m venv "${venv}"
          "${venv}/bin/python" -m pip install --require-hashes -r "${dist}/requirements.txt"
          "${venv}/bin/python" -m pip install --require-hashes -r "${dist}/dynamo-requirements.txt"
          "${venv}/bin/python" -m pip install --no-deps "${dist}"/*.whl
          cp "${dist}/requirements.txt" "${RESULTS_DIR}/provenance/${side}-requirements.txt"
          cp "${dist}/dynamo-requirements.txt" "${RESULTS_DIR}/provenance/${side}-dynamo-requirements.txt"
          cp "${dist}/dynamo-build.patch" "${RESULTS_DIR}/provenance/${side}-dynamo-build.patch"
          cp "${dist}/provenance.json" "${RESULTS_DIR}/provenance/${side}-build.json"
          "${venv}/bin/python" -c 'import aisimulate._runtime, dynamo._core, dynamo.replay.simulation; print(aisimulate._runtime.__file__); print(dynamo._core.__file__); print(dynamo.replay.simulation.__file__)' \
            > "${RESULTS_DIR}/provenance/${side}-imports.txt"
          "${venv}/bin/python" -m pip freeze > "${RESULTS_DIR}/provenance/${side}-packages.txt"
        done
        echo "$(( $(date +%s) - started ))" > "${RESULTS_DIR}/provenance/install-seconds.txt"
    - name: Run paired benchmark
      run: |
        set -euo pipefail
        status=0
        "${BASE_VENV}/bin/python" \
          "${BASE_SRC}/python/aisimulate/tools/simulation_perf_gate/run.py" \
          --base-python "${BASE_VENV}/bin/python" \
          --base-worker "${BASE_SRC}/python/aisimulate/tools/simulation_perf_gate/worker.py" \
          --base-revision "${BASE_SHA}" \
          --head-python "${HEAD_VENV}/bin/python" \
          --head-worker "${HEAD_SRC}/python/aisimulate/tools/simulation_perf_gate/worker.py" \
          --head-revision "${HEAD_SHA}" \
          --case agentx-sglang-disaggregated \
          --output-dir "${RESULTS_DIR}" || status=$?
        test "${status}" -le 1
        python - <<'PY'
        import json, os
        from pathlib import Path
        results = json.loads((Path(os.environ["RESULTS_DIR"]) / "comparison.json").read_text())
        assert len(results) == 1, results
        assert results[0]["classification"] == "PERFORMANCE_REGRESSION", results
        print("The existing threshold detected the restored #397 cost.")
        PY
    - name: Publish summary and annotations
      if: always()
      run: |
        for result in "${RESULTS_DIR}" "${RESULTS_DIR}"/qualification-*; do
          if [[ -f "${result}/summary.md" ]]; then
            cat "${result}/summary.md" >> "${GITHUB_STEP_SUMMARY}"
          fi
          if [[ -s "${result}/annotations.txt" ]]; then
            echo "::error::Simulation performance needs review; see the summary and artifact."
          fi
        done
    - name: Upload benchmark artifacts
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: simulation-kv-routing-backtest-397
        path: ${{ env.RESULTS_DIR }}
        if-no-files-found: error
        retention-days: 30
    - name: Remove benchmark worktrees
      if: always()
      run: |
        if [[ -n "${BASE_SRC:-}" ]]; then
          git worktree remove --force "${BASE_SRC}" || true
        fi
        if [[ -n "${HEAD_SRC:-}" ]]; then
          git worktree remove --force "${HEAD_SRC}" || true
        fi
        git worktree prune || true
