name: Main branch nightly CI

# Nightly build of the approved AISimulate release artifacts — the
# `aisimulate` wheel and the `aisimulate-core` crate — plus a strict-native
# FPE support-matrix refresh at the same source SHA. The GitLab publish
# trigger waits for the matrix refresh, and a failed refresh fails the run,
# so consumers (who resolve the newest successful run) never advance to a
# nightly whose matrix did not refresh. Release artifacts are built via
# scripts/build_release_artifacts.py, the artifact contract's only sanctioned
# entry point. Isolated compliance jobs gate artifact production. The build
# uses hash-pinned tooling and lockfile-resolved crates, then checksum-binds the
# wheel in the Artifactory handoff area. Dependency installation and smoke tests
# run later without build credentials. GitHub stores non-wheel provenance,
# dependency inventories, and license evidence; no Actions artifact contains a
# wheel.
#
# Versioning: every run stamps the tree with scripts/apply_dev_version.py —
# wheels get `<base>.devYYYYMMDD` (the ai-dynamo/dynamo nightly convention),
# the crate `<base>-dev.YYYYMMDD` (dotted so SemVer orders the date
# numerically). The date is computed once in the guard job so both arch
# legs agree across a UTC midnight.
#
# Handoff and staging: build jobs upload wheels to the internal PyPI repo under
# nightly/<run_id>/handoff/<arch>/ with the narrow
# `pr-wheel-staging` environment. Smoke and FPE jobs pull the exact wheel from
# there and verify its source SHA and checksum. After those checks pass, the
# stage job uploads the wheels to the final nightly/<run_id>/ path and the crate
# to the internal Cargo repo. Final staging remains gated by the
# `automated-release` environment.
#
# Environment prerequisite: allow `main` on `pr-wheel-staging`, and create
# `automated-release` BEFORE merging. A referenced-but-missing environment is
# auto-created UNPROTECTED. Store the Artifactory values as environment secrets
# only (repo-level secrets would flow to modified workflow copies on
# pull-request/* refs). The URL and PyPI repository must identify the same
# handoff store in both environments; their tokens have different privileges.
# Scheduled first attempts run unattended; any other trigger or re-run must
# pass the `manual-release-approver` gate before the handoff begins. Final
# promotion uses the stronger `automated-release` environment only after smoke,
# FPE, and compliance validation complete.
#
# Runs on the repository-specific self-hosted runners (OPS-8249). Jobs run
# in pinned manylinux_2_28 containers: the default runner image has no C
# compiler (run 33052185267), and manylinux also fixes the wheels' glibc
# floor at 2.28 — the AIC platform-wheel precedent. quay.io reachability
# and registry egress from this runner set are first exercised here.

on:
  schedule:
    # 08:00 UTC daily, matching the ai-dynamo org nightly convention.
    - cron: "0 8 * * *"
  # Manual runs build and stage only, gated by manual-release-approver.
  # Dispatch from main so old release sources use the current workflow.
  workflow_dispatch:
    inputs:
      commit_sha:
        description: >-
          Full commit SHA to build and stage; must be on main or release/*.
          Dispatch from main. Empty builds main at dispatch time. No public publish.
        required: false
        default: ""
        type: string

# Read-only default token; only the guard job adds actions:read.
permissions:
  contents: read

# Scheduled runs get their own group so a manual run parked at the approval
# gate can never block the cron; staging paths are keyed by run_id, so
# concurrent runs cannot collide. Superseded manual runs are cancelled.
concurrency:
  group: nightly-ci-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

jobs:
  changes-guard:
    name: Resolve target and skip unchanged nightlies
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      should-build: ${{ steps.decide.outputs.should-build }}
      dev-date: ${{ steps.version.outputs.dev-date }}
      target-sha: ${{ steps.target.outputs.sha }}
      target-ref: ${{ steps.target.outputs.ref }}
    steps:
      # Runs with no secrets and no environment. Every manual target —
      # including main's own tip — must lie on main or a release/* branch.
      - name: Resolve and validate the target commit
        id: target
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          REQUESTED_SHA: ${{ inputs.commit_sha }}
        with:
          script: |
            if (context.eventName === 'schedule') {
              core.setOutput('sha', context.sha);
              core.setOutput('ref', context.ref);
              return;
            }
            if (context.ref !== 'refs/heads/main') {
              core.setFailed('Dispatch from main; use commit_sha to select release source');
              return;
            }
            const requested = (process.env.REQUESTED_SHA || '').trim() || context.sha;
            if (!/^[0-9a-f]{40}$/.test(requested)) {
              core.setFailed('commit_sha must be a full 40-hex commit SHA');
              return;
            }
            const branches = (await github.paginate(
              github.rest.repos.listBranches, {...context.repo, per_page: 100}))
              .map(b => b.name)
              .filter(n => n === 'main' || n.startsWith('release/'));
            for (const branch of branches) {
              try {
                const {data} = await github.rest.repos.compareCommitsWithBasehead({
                  ...context.repo, basehead: `${requested}...${branch}`});
                // ahead/identical: the branch tip contains the requested commit.
                if (data.status === 'ahead' || data.status === 'identical') {
                  const {data: commit} = await github.rest.repos.getCommit(
                    {...context.repo, ref: requested});
                  core.notice(`Building ${requested} on ${branch}: ` +
                    `${commit.commit.committer.date} ` +
                    `"${commit.commit.message.split('\n')[0]}"`);
                  core.setOutput('sha', requested);
                  core.setOutput('ref', `refs/heads/${branch}`);
                  return;
                }
              } catch (error) {
                // A missing comparison may mean the commit is unknown;
                // authentication, rate-limit, and server failures are fatal.
                if (error.status !== 404) throw error;
              }
            }
            core.setFailed('commit_sha is not on main or any release/* branch');
      # Computed once here so both arch legs stamp the same date even if the
      # run crosses a UTC midnight.
      - name: Compute nightly version date
        id: version
        run: echo "dev-date=$(date -u +%Y%m%d)" >> "${GITHUB_OUTPUT}"

      - name: Compare HEAD with the last successful nightly
        id: decide
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            // Only scheduled runs dedup; other events always build.
            if (context.eventName !== 'schedule') {
              core.setOutput('should-build', 'true');
              return;
            }
            try {
              const runs = await github.rest.actions.listWorkflowRuns({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'nightly-ci.yml',
                branch: 'main',
                // Dispatch runs pin older SHAs; only prior crons may dedup.
                event: 'schedule',
                status: 'success',
                per_page: 1,
              });
              const last = runs.data.workflow_runs[0];
              if (last && last.head_sha === context.sha) {
                core.notice(
                  `No new commits since successful run ${last.html_url}; skipping.`,
                );
                core.setOutput('should-build', 'false');
                return;
              }
            } catch (error) {
              // Fail open: a guard outage must never block the nightly.
              core.warning(`Could not query previous runs (${error.message}); building.`);
            }
            core.setOutput('should-build', 'true');

  # Only the FIRST attempt of a scheduled run is unattended. Any other
  # trigger, and any re-run (run_attempt > 1, including re-runs of the
  # cron), stops here until a manual-release-approver required reviewer
  # (the ops team) approves. The environment holds no secrets — it exists
  # only as a gate.
  manual-approval:
    name: Approve manual trigger or re-run
    needs: changes-guard
    if: >-
      needs.changes-guard.outputs.should-build == 'true' &&
      (github.event_name != 'schedule' || github.run_attempt != '1')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: manual-release-approver
    outputs:
      approved-attempt: ${{ steps.approval.outputs.run-attempt }}
    steps:
      - name: Record approval
        id: approval
        run: |
          echo "approved (event ${GITHUB_EVENT_NAME}, attempt ${GITHUB_RUN_ATTEMPT})"
          echo "run-attempt=${GITHUB_RUN_ATTEMPT}" >> "${GITHUB_OUTPUT}"

  python-compliance:
    name: Python Dependency Licenses (${{ matrix.arch }}, ${{ matrix.python-version }})
    # No release environment or build artifacts are available to dependency
    # build hooks. Both architectures must pass before staging can start.
    needs: [changes-guard, manual-approval]
    # Dependency installation uses production runners, so manual runs and
    # retries need approval before even this isolated compliance work starts.
    # !cancelled() allows the skipped approval ancestor on scheduled first runs.
    if: >-
      !cancelled() &&
      needs.changes-guard.outputs.should-build == 'true' &&
      ((github.event_name == 'schedule' && github.run_attempt == '1') ||
      (needs.manual-approval.result == 'success' &&
      needs.manual-approval.outputs.approved-attempt == github.run_attempt))
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: prod-aisimulate-default-${{ matrix.arch }}-v1
    timeout-minutes: 15
    container:
      image: ${{ vars.CI_JOB_CONTAINER_IMAGE }}
      env:
        HOME: /__w/aisimulate/aisimulate
        USER: runner
    steps:
      # Keep the license policy/tooling at the workflow revision. Older
      # release sources need only their package manifest, not this helper.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.changes-guard.outputs.target-sha }}
          path: source
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check Python dependency licenses
        env:
          MATRIX_ARCH: ${{ matrix.arch }}
          PYTHON_SERIES: ${{ matrix.python-version }}
        run: |
          python -m venv "${RUNNER_TEMP}/venv-licenses"
          python scripts/check_python_licenses.py \
            --pyproject source/python/aisimulate/pyproject.toml \
            --python "${RUNNER_TEMP}/venv-licenses/bin/python" \
            --inventory "${RUNNER_TEMP}/python-inventory/${MATRIX_ARCH}-${PYTHON_SERIES}.csv"
      - name: Preserve the dependency inventory as data
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-python-inventory-${{ matrix.arch }}-${{ matrix.python-version }}
          path: ${{ runner.temp }}/python-inventory/*.csv
          if-no-files-found: error
          retention-days: 30
          overwrite: true

  build-artifacts:
    name: Build artifacts (${{ matrix.arch }})
    needs: [changes-guard, manual-approval, python-compliance]
    # Runs unattended only on a scheduled first attempt; otherwise requires
    # an explicit approval. "Re-run failed jobs" cannot revive a skipped
    # approval, so it fails closed — use "Re-run all jobs" to get the gate.
    if: >-
      !cancelled() &&
      needs.changes-guard.outputs.should-build == 'true' &&
      needs.python-compliance.result == 'success' &&
      ((github.event_name == 'schedule' && github.run_attempt == '1') ||
      (needs.manual-approval.result == 'success' &&
      needs.manual-approval.outputs.approved-attempt == github.run_attempt))
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: prod-aisimulate-default-amd64-v1
            rust_target: x86_64-unknown-linux-gnu
            rustup_init_sha256: 4acc9acc76d5079515b46346a485974457b5a79893cfb01112423c89aeb5aa10
            uv_target: x86_64-unknown-linux-gnu
            uv_sha256: 8681d8921e7d520fb368991dcf5f9c1905b80f5bf2a265a0ed085c8d8e342477
            # quay.io/pypa/manylinux_2_28_x86_64:2026.08.24-1
            container_image: quay.io/pypa/manylinux_2_28_x86_64@sha256:4dc41da7df20400310c80d162a2fe2d2c2f3d9734d8dec20f6b9843711618deb
          - arch: arm64
            runner: prod-aisimulate-default-arm64-v1
            rust_target: aarch64-unknown-linux-gnu
            rustup_init_sha256: 9732d6c5e2a098d3521fca8145d826ae0aaa067ef2385ead08e6feac88fa5792
            uv_target: aarch64-unknown-linux-gnu
            uv_sha256: d58030acd26159499ac82f32da12d1b3c12a3a1bfc414232d9082070c03e128d
            # quay.io/pypa/manylinux_2_28_aarch64:2026.08.24-1
            container_image: quay.io/pypa/manylinux_2_28_aarch64@sha256:29a6ceb78de5b00494e6e7456a72782a4cb54238de102e7491d15fe47789b4d1
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    environment: pr-wheel-staging
    permissions:
      contents: read
    outputs:
      wheel-version: ${{ steps.verify.outputs.wheel-version }}
    container:
      # Digest-pinned manylinux_2_28: ships the C toolchain the native build
      # needs and audit-tags wheels at glibc 2.28 — also the minimum glibc
      # for the runner's node24-based actions.
      image: ${{ matrix.container_image }}
      env:
        HOME: /__w/aisimulate/aisimulate
    defaults:
      run:
        shell: bash
    env:
      UV_VERSION: "0.12.6"
      RUSTUP_VERSION: "1.29.0"
      RUST_TOOLCHAIN: "1.98.0"
      PYTHON_SERIES: "3.12"
      # The abi3 wheel claims every Python in requires-python; prove each one.
      PYTHON_SERIES_LIST: "3.11 3.12 3.13"
      # Use uv's managed interpreter (not the image's python) and ignore any
      # uv.toml discovered in the workspace.
      UV_PYTHON_PREFERENCE: only-managed
      UV_NO_CONFIG: "1"
      DEV_DATE: ${{ needs.changes-guard.outputs.dev-date }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.changes-guard.outputs.target-sha }}
          persist-credentials: false

      # HOME above is the checked-out workspace: anything written there
      # trips check_manifests()'s repo-wide manifest scan and dirties the
      # tree `cargo package --allow-dirty` snapshots. TMPDIR redirect keeps
      # the multi-GB crate verify build off container-overlay /tmp.
      - name: Isolate toolchain paths outside the workspace
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/tmp"
          {
            echo "TOOLS_DIR=${RUNNER_TEMP}/tools"
            echo "DIST_DIR=${RUNNER_TEMP}/nightly-dist"
            echo "CARGO_HOME=${RUNNER_TEMP}/cargo"
            echo "RUSTUP_HOME=${RUNNER_TEMP}/rustup"
            echo "UV_CACHE_DIR=${RUNNER_TEMP}/uv-cache"
            echo "UV_PYTHON_INSTALL_DIR=${RUNNER_TEMP}/uv-python"
            echo "TMPDIR=${RUNNER_TEMP}/tmp"
          } >> "${GITHUB_ENV}"

      # Inventory the image's tools before failing, so a bad image yields a
      # complete diagnosis in one run, then fail fast unless the C toolchain
      # the native build needs (zstd-sys, blake3, cdylib link) works.
      - name: Preflight image toolchain
        run: |
          set -euo pipefail
          for tool in cc gcc clang curl tar sha256sum git python3; do
            if path="$(command -v "${tool}" 2>/dev/null)"; then
              echo "found   ${tool} -> ${path}"
            else
              echo "missing ${tool}"
            fi
          done
          for tool in cc curl tar sha256sum; do
            command -v "${tool}" >/dev/null 2>&1 || {
              echo "::error::runner image is missing required tool: ${tool}"
              exit 1
            }
          done
          printf 'int main(void){return 0;}\n' > "${RUNNER_TEMP}/preflight.c"
          cc "${RUNNER_TEMP}/preflight.c" -o "${RUNNER_TEMP}/preflight"
          "${RUNNER_TEMP}/preflight"

      - name: Install uv (checksum-verified)
        env:
          UV_TARGET: ${{ matrix.uv_target }}
          UV_SHA256: ${{ matrix.uv_sha256 }}
        run: |
          set -euo pipefail
          mkdir -p "${TOOLS_DIR}"
          archive="${TOOLS_DIR}/uv.tar.gz"
          # -q must be curl's first argument: HOME is the workspace, so this
          # ignores any repo-root .curlrc.
          curl -q --fail --location --silent --show-error --retry 3 \
            --output "${archive}" \
            "https://github.com/astral-sh/uv/releases/download/${UV_VERSION}/uv-${UV_TARGET}.tar.gz"
          echo "${UV_SHA256}  ${archive}" | sha256sum --check
          tar -xzf "${archive}" -C "${TOOLS_DIR}" --strip-components=1
          rm "${archive}"
          echo "${TOOLS_DIR}" >> "${GITHUB_PATH}"
          "${TOOLS_DIR}/uv" --version

      - name: Install Rust toolchain (checksum-verified rustup)
        env:
          RUST_TARGET: ${{ matrix.rust_target }}
          RUSTUP_INIT_SHA256: ${{ matrix.rustup_init_sha256 }}
        run: |
          set -euo pipefail
          rustup_init="${TOOLS_DIR}/rustup-init"
          curl -q --fail --location --silent --show-error --retry 3 \
            --output "${rustup_init}" \
            "https://static.rust-lang.org/rustup/archive/${RUSTUP_VERSION}/${RUST_TARGET}/rustup-init"
          echo "${RUSTUP_INIT_SHA256}  ${rustup_init}" | sha256sum --check
          chmod 0755 "${rustup_init}"
          "${rustup_init}" -y --no-modify-path --profile minimal \
            --default-toolchain "${RUST_TOOLCHAIN}"
          rm "${rustup_init}"
          echo "${CARGO_HOME}/bin" >> "${GITHUB_PATH}"
          "${CARGO_HOME}/bin/cargo" --version

      - name: Create build environment
        run: |
          set -euo pipefail
          uv venv --python "${PYTHON_SERIES}" "${TOOLS_DIR}/venv-build"
          uv pip install \
            --python "${TOOLS_DIR}/venv-build/bin/python" \
            --require-hashes \
            --requirements .github/nightly/build-requirements.txt
          "${TOOLS_DIR}/venv-build/bin/python" -m maturin --version

      - name: Stamp nightly dev version
        run: |
          set -euo pipefail
          "${TOOLS_DIR}/venv-build/bin/python" scripts/apply_dev_version.py ".dev${DEV_DATE}"

      - name: Validate release manifests
        run: |
          set -euo pipefail
          "${TOOLS_DIR}/venv-build/bin/python" scripts/build_release_artifacts.py --check-only

      - name: Build release artifacts
        run: |
          set -euo pipefail
          "${TOOLS_DIR}/venv-build/bin/python" scripts/build_release_artifacts.py \
            --output-dir "${DIST_DIR}"

      - name: Drop duplicate crate (non-amd64 legs)
        if: matrix.arch != 'amd64'
        run: |
          set -euo pipefail
          # The .crate is arch-independent source; the amd64 leg's copy is
          # canonical, so drop this leg's duplicate before upload.
          rm "${DIST_DIR}"/aisimulate-core-*.crate

      # The wheel's name is a contract: stamped dev version (catches a
      # silent stamping failure) and cp311-abi3-manylinux_2_28 tags for this
      # arch (catches a build-container regression that would mistag wheels).
      - name: Verify wheel name, tags, and stamped version
        id: verify
        env:
          UV_TARGET: ${{ matrix.uv_target }}
        run: |
          set -euo pipefail
          [[ "${DEV_DATE}" =~ ^[0-9]{8}$ ]] || { echo "::error::bad DEV_DATE"; exit 1; }
          plat="${UV_TARGET%%-*}"
          wheel="$(basename "${DIST_DIR}"/aisimulate-*.whl)"
          [[ "${wheel}" == aisimulate-*.dev"${DEV_DATE}"-cp311-abi3-manylinux_2_28_"${plat}".whl ]] || {
            echo "::error::unexpected wheel name: ${wheel}"
            exit 1
          }
          version="${wheel#aisimulate-}"
          version="${version%%-*}"
          echo "EXPECTED_VERSION=${version}" >> "${GITHUB_ENV}"
          echo "wheel-version=${version}" >> "${GITHUB_OUTPUT}"
          echo "wheel OK: ${wheel} (version ${version})"

      - name: Write checksums and provenance
        env:
          MATRIX_ARCH: ${{ matrix.arch }}
          CONTAINER_IMAGE: ${{ matrix.container_image }}
          MATRIX_RUNNER: ${{ matrix.runner }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_WORKFLOW_REF: ${{ github.workflow_ref }}
          GH_REF: ${{ needs.changes-guard.outputs.target-ref }}
          GH_SHA: ${{ needs.changes-guard.outputs.target-sha }}
          GH_RUN_ID: ${{ github.run_id }}
          GH_RUN_ATTEMPT: ${{ github.run_attempt }}
          GH_EVENT_NAME: ${{ github.event_name }}
          GH_SERVER_URL: ${{ github.server_url }}
        run: |
          set -euo pipefail
          (cd "${DIST_DIR}" && sha256sum -- * > SHA256SUMS.txt)
          "${TOOLS_DIR}/venv-build/bin/python" - <<'EOF'
          import importlib.metadata as metadata
          import json
          import os
          import platform
          import tomllib
          from datetime import datetime, timezone
          from pathlib import Path

          dist = Path(os.environ["DIST_DIR"])
          pyproject = Path("python/aisimulate/pyproject.toml")
          version = tomllib.loads(pyproject.read_text())["project"]["version"]
          provenance = {
              "version": version,
              "repository": os.environ["GH_REPOSITORY"],
              "workflow_ref": os.environ["GH_WORKFLOW_REF"],
              "ref": os.environ["GH_REF"],
              "commit": os.environ["GH_SHA"],
              "run_url": (
                  f"{os.environ['GH_SERVER_URL']}/{os.environ['GH_REPOSITORY']}"
                  f"/actions/runs/{os.environ['GH_RUN_ID']}"
                  f"/attempts/{os.environ['GH_RUN_ATTEMPT']}"
              ),
              "event": os.environ["GH_EVENT_NAME"],
              "arch": os.environ["MATRIX_ARCH"],
              "runner_label": os.environ["MATRIX_RUNNER"],
              "container_image": os.environ["CONTAINER_IMAGE"],
              "built_at_utc": datetime.now(timezone.utc).isoformat(),
              "toolchain": {
                  "python": platform.python_version(),
                  "rust": os.environ["RUST_TOOLCHAIN"],
                  "uv": os.environ["UV_VERSION"],
                  "maturin": metadata.version("maturin"),
              },
              "artifacts": {
                  line.split(maxsplit=1)[1]: line.split(maxsplit=1)[0]
                  for line in (dist / "SHA256SUMS.txt").read_text().splitlines()
                  if not line.endswith("SHA256SUMS.txt")
              },
          }
          (dist / "provenance.json").write_text(json.dumps(provenance, indent=2) + "\n")
          EOF
          # Cover provenance.json too, so the smoke and staging jobs'
          # `sha256sum --check` verifies every file crossing the artifact store.
          (cd "${DIST_DIR}" && sha256sum provenance.json >> SHA256SUMS.txt)
          {
            echo "### Nightly artifacts (${MATRIX_ARCH})"
            echo '```'
            cat "${DIST_DIR}/SHA256SUMS.txt"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

      # Capture trusted crate metadata before transferring the wheel.
      - name: Capture the locked crate inventory
        if: matrix.arch == 'amd64'
        run: cargo metadata --locked --format-version 1 > "${RUNNER_TEMP}/cargo-metadata.json"
      - name: Preserve crate inventory for compliance evidence
        if: matrix.arch == 'amd64'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-crate-inventory
          path: ${{ runner.temp }}/cargo-metadata.json
          if-no-files-found: error
          retention-days: 30
          overwrite: true

      - name: Checkout the current Artifactory transfer helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          path: .workflow-tools
          persist-credentials: false
          sparse-checkout: python/aisimulate/tools/artifactory_wheel_handoff.sh
          sparse-checkout-cone-mode: false

      - name: Stage wheel for downstream jobs in Artifactory
        env:
          ARTIFACTORY_URL: ${{ secrets.ARTIFACTORY_URL }}
          ARTIFACTORY_TOKEN: ${{ secrets.ARTIFACTORY_TOKEN }}
          ARTIFACTORY_PYPI_REPO_NAME: ${{ secrets.ARTIFACTORY_PYPI_REPO_NAME }}
          ARTIFACTORY_SUBPATH: nightly/${{ github.run_id }}/handoff/${{ matrix.arch }}
          WHEEL_SOURCE_SHA: ${{ needs.changes-guard.outputs.target-sha }}
        run: bash .workflow-tools/python/aisimulate/tools/artifactory_wheel_handoff.sh upload "${DIST_DIR}"

      - name: Upload non-wheel build evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-build-metadata-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/nightly-dist/*
            !${{ runner.temp }}/nightly-dist/*.whl
          if-no-files-found: error
          # The crate is already compressed; skip recompression.
          compression-level: 0
          # Matches the Dynamo nightly compliance policy's 30-day window.
          retention-days: 30
          overwrite: true

  # Installing the wheel pulls its unpinned PyPI dependency tree — untrusted
  # code that must not share a job with artifact production, so this runs
  # after the wheel is immutable in the Artifactory handoff area. A red smoke job
  # fails the run, the signal staging consumers gate on.
  smoke-test:
    name: Smoke-test wheel (${{ matrix.arch }})
    needs: [changes-guard, build-artifacts]
    environment: pr-wheel-staging
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: prod-aisimulate-default-amd64-v1
            uv_target: x86_64-unknown-linux-gnu
            uv_sha256: 8681d8921e7d520fb368991dcf5f9c1905b80f5bf2a265a0ed085c8d8e342477
            # quay.io/pypa/manylinux_2_28_x86_64:2026.08.24-1
            container_image: quay.io/pypa/manylinux_2_28_x86_64@sha256:4dc41da7df20400310c80d162a2fe2d2c2f3d9734d8dec20f6b9843711618deb
          - arch: arm64
            runner: prod-aisimulate-default-arm64-v1
            uv_target: aarch64-unknown-linux-gnu
            uv_sha256: d58030acd26159499ac82f32da12d1b3c12a3a1bfc414232d9082070c03e128d
            # quay.io/pypa/manylinux_2_28_aarch64:2026.08.24-1
            container_image: quay.io/pypa/manylinux_2_28_aarch64@sha256:29a6ceb78de5b00494e6e7456a72782a4cb54238de102e7491d15fe47789b4d1
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    container:
      image: ${{ matrix.container_image }}
      env:
        HOME: /__w/aisimulate/aisimulate
    defaults:
      run:
        shell: bash
    env:
      UV_VERSION: "0.12.6"
      # The abi3 wheel claims every Python in requires-python; prove each one.
      PYTHON_SERIES_LIST: "3.11 3.12 3.13"
      UV_PYTHON_PREFERENCE: only-managed
      UV_NO_CONFIG: "1"
      DEV_DATE: ${{ needs.changes-guard.outputs.dev-date }}
    steps:
      # Only the transfer helper is checked out. The package source tree stays
      # absent so it cannot shadow the wheel during the untrusted dependency
      # install below.
      - name: Isolate toolchain paths outside the workspace
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/tmp"
          {
            echo "TOOLS_DIR=${RUNNER_TEMP}/tools"
            echo "DIST_DIR=${RUNNER_TEMP}/nightly-dist"
            echo "UV_CACHE_DIR=${RUNNER_TEMP}/uv-cache"
            echo "UV_PYTHON_INSTALL_DIR=${RUNNER_TEMP}/uv-python"
            echo "TMPDIR=${RUNNER_TEMP}/tmp"
          } >> "${GITHUB_ENV}"

      - name: Checkout the Artifactory transfer helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: python/aisimulate/tools/artifactory_wheel_handoff.sh
          sparse-checkout-cone-mode: false

      - name: Download non-wheel build evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nightly-build-metadata-${{ matrix.arch }}
          path: ${{ runner.temp }}/nightly-dist

      - name: Fetch the built wheel from Artifactory
        env:
          ARTIFACTORY_URL: ${{ secrets.ARTIFACTORY_URL }}
          ARTIFACTORY_TOKEN: ${{ secrets.ARTIFACTORY_TOKEN }}
          ARTIFACTORY_PYPI_REPO_NAME: ${{ secrets.ARTIFACTORY_PYPI_REPO_NAME }}
          ARTIFACTORY_SUBPATH: nightly/${{ github.run_id }}/handoff/${{ matrix.arch }}
          EXPECTED_WHEEL_SOURCE_SHA: ${{ needs.changes-guard.outputs.target-sha }}
        run: bash python/aisimulate/tools/artifactory_wheel_handoff.sh download "${DIST_DIR}"

      - name: Install uv (checksum-verified)
        env:
          UV_TARGET: ${{ matrix.uv_target }}
          UV_SHA256: ${{ matrix.uv_sha256 }}
        run: |
          set -euo pipefail
          mkdir -p "${TOOLS_DIR}"
          archive="${TOOLS_DIR}/uv.tar.gz"
          curl -q --fail --location --silent --show-error --retry 3 \
            --output "${archive}" \
            "https://github.com/astral-sh/uv/releases/download/${UV_VERSION}/uv-${UV_TARGET}.tar.gz"
          echo "${UV_SHA256}  ${archive}" | sha256sum --check
          tar -xzf "${archive}" -C "${TOOLS_DIR}" --strip-components=1
          rm "${archive}"
          echo "${TOOLS_DIR}" >> "${GITHUB_PATH}"
          "${TOOLS_DIR}/uv" --version

      - name: Verify artifact checksums
        run: |
          set -euo pipefail
          (cd "${DIST_DIR}" && sha256sum --check --strict SHA256SUMS.txt)

      # The wheel's name is a contract: stamped dev version (catches a
      # silent stamping failure) and cp311-abi3-manylinux_2_28 tags for this
      # arch (catches a build-container regression that would mistag wheels).
      # The parsed version is re-asserted against installed metadata below.
      - name: Verify wheel name, tags, and stamped version
        env:
          UV_TARGET: ${{ matrix.uv_target }}
        run: |
          set -euo pipefail
          [[ "${DEV_DATE}" =~ ^[0-9]{8}$ ]] || { echo "::error::bad DEV_DATE"; exit 1; }
          plat="${UV_TARGET%%-*}"
          wheel="$(basename "${DIST_DIR}"/aisimulate-*.whl)"
          [[ "${wheel}" == aisimulate-*.dev"${DEV_DATE}"-cp311-abi3-manylinux_2_28_"${plat}".whl ]] || {
            echo "::error::unexpected wheel name: ${wheel}"
            exit 1
          }
          version="${wheel#aisimulate-}"
          version="${version%%-*}"
          echo "EXPECTED_VERSION=${version}" >> "${GITHUB_ENV}"
          echo "wheel OK: ${wheel} (version ${version})"

      - name: Smoke-test the wheel on every supported Python
        run: |
          set -euo pipefail
          cat > "${TOOLS_DIR}/smoke_asserts.py" <<'EOF'
          import importlib.metadata as metadata
          import os

          import aiconfigurator
          import aiconfigurator_core
          import aisimulate
          import aisimulate_core

          expected = os.environ["EXPECTED_VERSION"]
          assert (
              aisimulate.__version__
              == aisimulate_core.__version__
              == metadata.version("aisimulate")
              == expected
          ), (aisimulate.__version__, expected)
          installed = {dist.metadata["Name"].lower() for dist in metadata.distributions()}
          forbidden = {"aisimulate-core", "aiconfigurator", "aiconfigurator-core"}
          assert installed.isdisjoint(forbidden), installed & forbidden
          EOF
          for series in ${PYTHON_SERIES_LIST}; do
            venv="${TOOLS_DIR}/venv-smoke-${series}"
            uv venv --python "${series}" "${venv}"
            uv pip install --python "${venv}/bin/python" "${DIST_DIR}"/aisimulate-*.whl
            uv pip check --python "${venv}/bin/python"
            "${venv}/bin/python" "${TOOLS_DIR}/smoke_asserts.py"
            "${venv}/bin/aisimulate" --help
            "${venv}/bin/aiconfigurator" version
            echo "smoke OK on Python ${series}"
          done

  # Uploads the smoke-tested wheels and crate to internal Artifactory under
  # nightly/<run_id>/, checksum-verified before upload and server-side on
  # PUT. Runs only on main (never on pull-request/* copies, which contain
  # unreviewed PR content), behind the protected environment that scopes the
  # ARTIFACTORY_* secrets. Scheduled runs additionally require FPE success.
  stage-artifactory:
    name: Stage and verify Artifactory wheel (${{ matrix.arch }})
    needs: [changes-guard, build-artifacts, smoke-test, fpe-support-matrix, license-evidence]
    if: >-
      !cancelled() &&
      github.ref == 'refs/heads/main' &&
      needs.build-artifacts.result == 'success' &&
      needs.smoke-test.result == 'success' &&
      (github.event_name != 'schedule' || needs.fpe-support-matrix.result == 'success') &&
      needs.license-evidence.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: prod-aisimulate-default-amd64-v1
            uv_target: x86_64-unknown-linux-gnu
            uv_sha256: 8681d8921e7d520fb368991dcf5f9c1905b80f5bf2a265a0ed085c8d8e342477
            container_image: quay.io/pypa/manylinux_2_28_x86_64@sha256:4dc41da7df20400310c80d162a2fe2d2c2f3d9734d8dec20f6b9843711618deb
          - arch: arm64
            runner: prod-aisimulate-default-arm64-v1
            uv_target: aarch64-unknown-linux-gnu
            uv_sha256: d58030acd26159499ac82f32da12d1b3c12a3a1bfc414232d9082070c03e128d
            container_image: quay.io/pypa/manylinux_2_28_aarch64@sha256:29a6ceb78de5b00494e6e7456a72782a4cb54238de102e7491d15fe47789b4d1
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    environment: automated-release
    container:
      image: ${{ matrix.container_image }}
      env:
        HOME: /__w/aisimulate/aisimulate
    defaults:
      run:
        shell: bash
    env:
      ARTIFACTORY_PYPI_REPO: ${{ secrets.ARTIFACTORY_PYPI_REPO_NAME }}
      ARTIFACTORY_CARGO_REPO: ${{ secrets.ARTIFACTORY_CARGO_REPO_NAME }}
      UV_VERSION: "0.12.6"
      PYTHON_SERIES_LIST: "3.11 3.12 3.13"
      UV_PYTHON_PREFERENCE: only-managed
      UV_NO_CONFIG: "1"
      DEV_DATE: ${{ needs.changes-guard.outputs.dev-date }}
    steps:
      - name: Checkout the Artifactory transfer helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: python/aisimulate/tools/artifactory_wheel_handoff.sh
          sparse-checkout-cone-mode: false

      - name: Prepare staging directory
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/stage" "${RUNNER_TEMP}/staged-dist" "${RUNNER_TEMP}/tools"
          {
            echo "STAGE_DIR=${RUNNER_TEMP}/stage"
            echo "FETCH_DIR=${RUNNER_TEMP}/staged-dist"
            echo "TOOLS_DIR=${RUNNER_TEMP}/tools"
            echo "UV_CACHE_DIR=${RUNNER_TEMP}/uv-cache"
            echo "UV_PYTHON_INSTALL_DIR=${RUNNER_TEMP}/uv-python"
          } >> "${GITHUB_ENV}"

      - name: Download non-wheel build evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nightly-build-metadata-${{ matrix.arch }}
          path: ${{ runner.temp }}/stage

      - name: Fetch wheels from Artifactory
        env:
          ARTIFACTORY_URL: ${{ secrets.ARTIFACTORY_URL }}
          ARTIFACTORY_TOKEN: ${{ secrets.ARTIFACTORY_TOKEN }}
          ARTIFACTORY_PYPI_REPO_NAME: ${{ secrets.ARTIFACTORY_PYPI_REPO_NAME }}
          EXPECTED_WHEEL_SOURCE_SHA: ${{ needs.changes-guard.outputs.target-sha }}
        run: |
          export ARTIFACTORY_SUBPATH="nightly/${GITHUB_RUN_ID}/handoff/${{ matrix.arch }}"
          bash python/aisimulate/tools/artifactory_wheel_handoff.sh download "${STAGE_DIR}"

      - name: Verify checksums and assemble upload set
        env:
          GH_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          # nightly/<run_id>/ — the ai-dynamo staging path convention.
          echo "STAGE_SUBPATH=nightly/${GH_RUN_ID}" >> "${GITHUB_ENV}"
          (cd "${STAGE_DIR}" && sha256sum --check --strict SHA256SUMS.txt)
          wheels=("${STAGE_DIR}"/*.whl)
          [ "${#wheels[@]}" -eq 1 ] || { echo "::error::expected one wheel"; exit 1; }
          if [ "${{ matrix.arch }}" = amd64 ]; then
            crates=("${STAGE_DIR}"/*.crate)
            [ "${#crates[@]}" -eq 1 ] || { echo "::error::expected one crate"; exit 1; }
          fi

      - name: Upload to Artifactory
        env:
          ARTIFACTORY_URL: ${{ secrets.ARTIFACTORY_URL }}
          ARTIFACTORY_TOKEN: ${{ secrets.ARTIFACTORY_TOKEN }}
          ARTIFACTORY_PYPI_REPO: ${{ secrets.ARTIFACTORY_PYPI_REPO_NAME }}
          ARTIFACTORY_CARGO_REPO: ${{ secrets.ARTIFACTORY_CARGO_REPO_NAME }}
          MATRIX_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          for name in ARTIFACTORY_URL ARTIFACTORY_TOKEN \
                      ARTIFACTORY_PYPI_REPO ARTIFACTORY_CARGO_REPO; do
            [ -n "${!name}" ] || { echo "::error::secret ${name} is not configured"; exit 1; }
          done
          subpath="${STAGE_SUBPATH}"
          [ -n "${subpath}" ] || { echo "::error::STAGE_SUBPATH not set"; exit 1; }
          put() {
            local file="$1" repo="$2" label="$3"
            local sha url existing
            sha="$(sha256sum "${file}" | cut -d' ' -f1)"
            url="${ARTIFACTORY_URL%/}/${repo}/${subpath}/$(basename "${file}")"
            # Re-runs reuse the same run_id path and the deploy-only token
            # cannot overwrite, so make staging idempotent: skip files a
            # prior attempt already uploaded (verified byte-identical via
            # the server's checksum) and fail loudly on a real mismatch.
            existing="$(curl -q --silent --head \
              -H "Authorization: Bearer ${ARTIFACTORY_TOKEN}" "${url}" \
              | tr -d '\r' | awk 'tolower($1)=="x-checksum-sha256:" {print $2}')"
            if [ "${existing}" = "${sha}" ]; then
              echo "already staged (${label}): $(basename "${file}")"
              return 0
            fi
            if [ -n "${existing}" ]; then
              echo "::error::${label} file exists with a different checksum: $(basename "${file}")"
              return 1
            fi
            echo "uploading $(basename "${file}") -> ${label} repo"
            # --retry covers timeouts and retryable HTTP codes; the image's
            # curl (7.61, AlmaLinux 8) predates --retry-all-errors. Hard
            # network failures are recovered by re-running the failed job,
            # which skips already-staged files via the probe above.
            curl -q --fail --silent --show-error --retry 3 \
              --output /dev/null \
              -H "Authorization: Bearer ${ARTIFACTORY_TOKEN}" \
              -H "X-Checksum-Sha256: ${sha}" \
              --upload-file "${file}" \
              "${url}"
            echo "staged (${label}): $(basename "${file}")"
          }
          cd "${STAGE_DIR}"
          if [ "${MATRIX_ARCH}" = "amd64" ]; then
            for file in *.crate; do
              put "${file}" "${ARTIFACTORY_CARGO_REPO}" cargo
            done
          fi
          for file in *.whl; do
            put "${file}" "${ARTIFACTORY_PYPI_REPO}" pypi
          done
          {
            echo "### Staged to Artifactory (${MATRIX_ARCH})"
            echo "Subpath: \`${subpath}/\`"
            echo '```'
            ls -l
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

      # The deploy token is scoped to this download-only step; the smoke
      # test below installs unpinned dependencies and runs their code, so it
      # must not inherit the credential.
      - name: Fetch the staged wheel back from Artifactory
        env:
          ARTIFACTORY_URL: ${{ secrets.ARTIFACTORY_URL }}
          ARTIFACTORY_TOKEN: ${{ secrets.ARTIFACTORY_TOKEN }}
          ARTIFACTORY_PYPI_REPO: ${{ secrets.ARTIFACTORY_PYPI_REPO_NAME }}
        run: |
          set -euo pipefail
          wheel="$(basename "${STAGE_DIR}"/aisimulate-*.whl)"
          curl -q --fail --silent --show-error --retry 3 \
            -H "Authorization: Bearer ${ARTIFACTORY_TOKEN}" \
            --output "${FETCH_DIR}/${wheel}" \
            "${ARTIFACTORY_URL%/}/${ARTIFACTORY_PYPI_REPO}/${STAGE_SUBPATH}/${wheel}"
          built_sha="$(sha256sum "${STAGE_DIR}/${wheel}" | cut -d' ' -f1)"
          staged_sha="$(sha256sum "${FETCH_DIR}/${wheel}" | cut -d' ' -f1)"
          [ "${staged_sha}" = "${built_sha}" ] || {
            echo "::error::staged wheel differs from the built wheel: ${wheel}"
            exit 1
          }
          echo "fetched ${wheel} (checksum matches the build)"

      - name: Install uv (checksum-verified)
        env:
          UV_TARGET: ${{ matrix.uv_target }}
          UV_SHA256: ${{ matrix.uv_sha256 }}
        run: |
          set -euo pipefail
          archive="${TOOLS_DIR}/uv.tar.gz"
          curl -q --fail --location --silent --show-error --retry 3 \
            --output "${archive}" \
            "https://github.com/astral-sh/uv/releases/download/${UV_VERSION}/uv-${UV_TARGET}.tar.gz"
          echo "${UV_SHA256}  ${archive}" | sha256sum --check
          tar -xzf "${archive}" -C "${TOOLS_DIR}" --strip-components=1
          rm "${archive}"
          echo "${TOOLS_DIR}" >> "${GITHUB_PATH}"
          "${TOOLS_DIR}/uv" --version

      - name: Verify staged wheel name and version
        env:
          UV_TARGET: ${{ matrix.uv_target }}
        run: |
          set -euo pipefail
          [[ "${DEV_DATE}" =~ ^[0-9]{8}$ ]] || { echo "::error::bad DEV_DATE"; exit 1; }
          plat="${UV_TARGET%%-*}"
          wheel="$(basename "${FETCH_DIR}"/aisimulate-*.whl)"
          [[ "${wheel}" == aisimulate-*.dev"${DEV_DATE}"-cp311-abi3-manylinux_2_28_"${plat}".whl ]] || {
            echo "::error::unexpected wheel name: ${wheel}"
            exit 1
          }
          version="${wheel#aisimulate-}"
          version="${version%%-*}"
          echo "EXPECTED_VERSION=${version}" >> "${GITHUB_ENV}"

      # Re-run the smoke contract against the final promoted bytes. The token
      # is scoped to the prior download step and is not exposed here.
      - name: Smoke-test the staged wheel on every supported Python
        run: |
          set -euo pipefail
          wheel="$(basename "${FETCH_DIR}"/aisimulate-*.whl)"
          cat > "${TOOLS_DIR}/smoke_asserts.py" <<'EOF'
          import importlib.metadata as metadata
          import os

          import aiconfigurator
          import aiconfigurator_core
          import aisimulate
          import aisimulate_core

          expected = os.environ["EXPECTED_VERSION"]
          assert (
              aisimulate.__version__
              == aisimulate_core.__version__
              == metadata.version("aisimulate")
              == expected
          ), (aisimulate.__version__, expected)
          installed = {dist.metadata["Name"].lower() for dist in metadata.distributions()}
          forbidden = {"aisimulate-core", "aiconfigurator", "aiconfigurator-core"}
          assert installed.isdisjoint(forbidden), installed & forbidden
          EOF
          for series in ${PYTHON_SERIES_LIST}; do
            venv="${TOOLS_DIR}/venv-smoke-${series}"
            uv venv --python "${series}" "${venv}"
            uv pip install --python "${venv}/bin/python" "${FETCH_DIR}/${wheel}"
            uv pip check --python "${venv}/bin/python"
            "${venv}/bin/python" "${TOOLS_DIR}/smoke_asserts.py"
            "${venv}/bin/aisimulate" --help
            "${venv}/bin/aiconfigurator" version
            echo "smoke OK on Python ${series}"
          done

  # Read dependency inventories as data in a fresh job; no runtime imports
  # share a process or filesystem with the GitHub token used for the prior diff.
  license-evidence:
    name: License compliance evidence
    needs: [build-artifacts, python-compliance]
    # !cancelled(): the implicit success() also inspects the transitively
    # needed manual-approval job, which is skipped on scheduled runs.
    if: >-
      !cancelled() &&
      needs.build-artifacts.result == 'success' &&
      needs.python-compliance.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: nightly-python-inventory-*
          merge-multiple: true
          path: ${{ runner.temp }}/license-artifacts/python
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nightly-crate-inventory
          path: ${{ runner.temp }}/license-artifacts
      - name: Generate license compliance evidence
        env:
          GH_API_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          outdir="${RUNNER_TEMP}/license-artifacts"
          mkdir -p "${outdir}"
          python3 - "${outdir}" <<'EOF'
          import csv, glob, io, json, os, sys, urllib.request, zipfile

          outdir = sys.argv[1]
          rows = []
          for filename in sorted(glob.glob(f"{outdir}/python/*.csv")):
              with open(filename, newline="") as f:
                  for r in csv.DictReader(f):
                      rows.append({"dependency_type": "python", "name": r["Name"],
                                   "version": r["Version"], "spdx_license": r["License"]})
          if not rows:
              raise SystemExit("missing Python dependency inventories")
          with open(f"{outdir}/cargo-metadata.json") as f:
              meta = json.load(f)
          workspace = set(meta.get("workspace_members") or [])
          for p in meta["packages"]:
              if p.get("id") in workspace:
                  continue
              rows.append({"dependency_type": "crate", "name": p["name"],
                           "version": p["version"],
                           "spdx_license": p.get("license") or "UNKNOWN"})
          def identity(row):
              return row["dependency_type"], row["name"], row["version"]

          inventory = {}
          for row in rows:
              key = identity(row)
              if key in inventory and inventory[key] != row:
                  raise SystemExit("conflicting license metadata for one dependency version")
              inventory[key] = row
          rows = [inventory[key] for key in sorted(inventory)]
          fields = ["dependency_type", "name", "version", "spdx_license"]
          with open(f"{outdir}/deps.csv", "w", newline="") as f:
              w = csv.DictWriter(f, fieldnames=fields)
              w.writeheader()
              w.writerows(rows)

          def prior_deps():
              token = os.environ["GH_API_TOKEN"]
              repo = os.environ["GITHUB_REPOSITORY"]
              current = os.environ["GITHUB_RUN_ID"]
              def get(url):
                  req = urllib.request.Request(url, headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json"})
                  return urllib.request.urlopen(req, timeout=30)
              with get(
                  f"https://api.github.com/repos/{repo}/actions/workflows/"
                  "nightly-ci.yml/runs?branch=main&event=schedule&status=success&per_page=10") as response:
                  runs = json.load(response)
              for run in runs.get("workflow_runs", []):
                  if str(run["id"]) == current:
                      continue
                  with get(run["artifacts_url"]) as response:
                      arts = json.load(response)
                  for a in arts.get("artifacts", []):
                      if "license" not in a["name"] or a.get("expired"):
                          continue
                      with get(a["archive_download_url"]) as response:
                          data = response.read()
                      with zipfile.ZipFile(io.BytesIO(data)) as zf:
                          for n in zf.namelist():
                              if os.path.basename(n) == "deps.csv":
                                  with io.TextIOWrapper(zf.open(n)) as stream:
                                      reader = csv.DictReader(stream)
                                      return {identity(r): r for r in reader}
              return None

          try:
              prior = prior_deps()
          except Exception as exc:
              print(f"::warning::prior-artifact lookup failed ({exc}); "
                    "deps-diff.csv lists every dependency as added")
              prior = None
          prior = prior or {}
          current = {identity(r): r for r in rows}
          dfields = ["change"] + fields + ["prior_version", "prior_spdx_license"]
          drows = []
          for key in sorted(set(current) | set(prior)):
              c, p = current.get(key), prior.get(key)
              if c and not p:
                  drows.append({"change": "added", **c,
                                "prior_version": "", "prior_spdx_license": ""})
              elif p and not c:
                  drows.append({"change": "removed",
                                "dependency_type": p["dependency_type"],
                                "name": p["name"], "version": "",
                                "spdx_license": "",
                                "prior_version": p["version"],
                                "prior_spdx_license": p["spdx_license"]})
              elif (c["version"] != p["version"]
                    or c["spdx_license"] != p["spdx_license"]):
                  drows.append({"change": "changed", **c,
                                "prior_version": p["version"],
                                "prior_spdx_license": p["spdx_license"]})
          with open(f"{outdir}/deps-diff.csv", "w", newline="") as f:
              w = csv.DictWriter(f, fieldnames=dfields)
              w.writeheader()
              w.writerows(drows)
          print(f"deps.csv: {len(rows)} rows; deps-diff.csv: {len(drows)} rows")
          EOF

      # Constant name + overwrite so a re-run replaces the evidence instead
      # of failing on a duplicate (or, across a UTC midnight, leaving two
      # "license" artifacts that would abort the OSRB attach's auto-select).
      - name: Upload license compliance artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: license-artifacts
          path: ${{ runner.temp }}/license-artifacts/deps*.csv
          retention-days: 30
          if-no-files-found: error
          overwrite: true

  # Refresh strict-native op-level FPE coverage at the exact nightly source
  # SHA and with the same amd64 wheel verified against Artifactory.
  # The GitLab publish trigger below requires this to succeed, and a failed
  # refresh fails the scheduled run, so consumers never advance to it.
  # Manual dispatch is build/stage-only; older release sources can lack this
  # qualification harness. Release qualification has its own current harness
  # in release-nightly-ci.yml and does not certify these manually staged wheels.
  fpe-support-matrix:
    name: FPE Support Matrix (main)
    needs: [changes-guard, build-artifacts]
    # !cancelled(): the implicit success() also inspects the transitively
    # needed manual-approval job, which is skipped on scheduled runs.
    if: >-
      !cancelled() &&
      github.event_name == 'schedule' &&
      needs.changes-guard.outputs.should-build == 'true' &&
      needs.build-artifacts.result == 'success'
    permissions:
      contents: read
    uses: ./.github/workflows/fpe-support-matrix.yml
    with:
      expected_sha: ${{ needs.changes-guard.outputs.target-sha }}
      provenance_artifact: nightly-build-metadata-amd64
      wheel_subpath: nightly/${{ github.run_id }}/handoff/amd64

  # Security scanning runs in the internal GitLab release-automation
  # pipeline, the same split dynamo uses: GitHub stages the artifacts, then
  # fires the internal pipeline that scans them. Scan findings stay inside
  # GitLab and never appear in these logs. The job is variable-gated so
  # nightlies stay green until the GitLab pipeline and the runner-group
  # access exist; flip GITLAB_SECURITY_TRIGGER_ENABLED to activate.
  trigger-gitlab-security:
    name: Trigger GitLab security pipeline
    needs: [changes-guard, manual-approval, build-artifacts, fpe-support-matrix, license-evidence, stage-artifactory]
    # Same unattended-vs-approved split as build-artifacts, so re-running
    # only this job cannot fire an unapproved publish. The FPE refresh must
    # have succeeded before anything advances to the internal pipeline.
    # Manual targets share the date-based version namespace, so they must
    # never enter this public nightly publisher, even after approval.
    if: >-
      !cancelled() &&
      needs.build-artifacts.result == 'success' &&
      needs.fpe-support-matrix.result == 'success' &&
      needs.license-evidence.result == 'success' &&
      needs.stage-artifactory.result == 'success' &&
      github.event_name == 'schedule' && github.ref == 'refs/heads/main' &&
      (github.run_attempt == '1' ||
      (needs.manual-approval.result == 'success' &&
      needs.manual-approval.outputs.approved-attempt == github.run_attempt)) &&
      vars.GITLAB_SECURITY_TRIGGER_ENABLED == 'true'
    # gitlab-master is on-prem and unreachable (even for DNS) from the
    # AWS-hosted repo runners; these on-prem runners are the sanctioned path.
    runs-on:
      group: gitlab_ci_runners
    timeout-minutes: 10
    environment: automated-release
    steps:
      # Start the nightly Slack thread; the GitLab pipeline's slack jobs
      # reply to it via the forwarded SLACK_THREAD_TS/SLACK_CHANNEL_ID
      # (dynamo's pattern). Best-effort: a Slack outage must not block the
      # security pipeline — GitLab then starts its own thread.
      - name: Start the Slack thread
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_RELEASE_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_RELEASE_CHANNEL_ID }}
          WHEEL_VERSION: ${{ needs.build-artifacts.outputs.wheel-version }}
        run: |
          set -euo pipefail
          SLACK_THREAD_TS=""
          if [ -n "${SLACK_BOT_TOKEN}" ] && [ -n "${SLACK_CHANNEL_ID}" ]; then
            payload=$(jq -n --arg channel "${SLACK_CHANNEL_ID}" \
              --arg text ":crescent_moon: *AISimulate nightly* \`${WHEEL_VERSION}\` — artifacts built, smoked, and staged; internal security pipeline starting. <${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}|GitHub run>" \
              '{channel: $channel, text: $text}')
            SLACK_THREAD_TS=$(curl -sS --max-time 15 --retry 2 \
              -X POST https://slack.com/api/chat.postMessage \
              -H "Authorization: Bearer ${SLACK_BOT_TOKEN}" \
              -H "Content-Type: application/json; charset=utf-8" \
              --data "${payload}" | jq -r '.ts // empty' || true)
            [ -n "${SLACK_THREAD_TS}" ] || \
              echo "::warning::Slack thread start failed; GitLab will start its own thread"
          fi
          echo "SLACK_THREAD_TS=${SLACK_THREAD_TS}" >> "${GITHUB_ENV}"

      - name: Trigger internal security scan
        env:
          GITLAB_TRIGGER_TOKEN: ${{ secrets.GITLAB_TRIGGER_TOKEN }}
          GITLAB_PIPELINE_URL: ${{ secrets.GITLAB_PIPELINE_URL }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_RELEASE_CHANNEL_ID }}
          GH_RUN_ID: ${{ github.run_id }}
          GH_SHA: ${{ needs.changes-guard.outputs.target-sha }}
          WHEEL_VERSION: ${{ needs.build-artifacts.outputs.wheel-version }}
        run: |
          set -euo pipefail
          for name in GITLAB_TRIGGER_TOKEN GITLAB_PIPELINE_URL WHEEL_VERSION; do
            [ -n "${!name}" ] || { echo "::error::${name} is not available"; exit 1; }
          done
          # Variable names follow the release-automation root pipeline's
          # contract (PROJECT routes to projects/aisimulate.yml there).
          # The response is discarded: it names internal pipeline URLs.
          # Preflight requires a dated NIGHTLY_TAG for nightly runs.
          nightly_tag="nightly-${WHEEL_VERSION##*.dev}-${GH_SHA:0:7}"
          curl -q --fail --silent --show-error --retry 3 --output /dev/null \
            -F "token=${GITLAB_TRIGGER_TOKEN}" \
            -F "ref=main" \
            -F "variables[PROJECT]=aisimulate" \
            -F "variables[PIPELINE_TYPE]=security" \
            -F "variables[RELEASE_TYPE]=nightly" \
            -F "variables[NIGHTLY_TAG]=${nightly_tag}" \
            -F "variables[WHEEL_VERSION]=${WHEEL_VERSION}" \
            -F "variables[GITHUB_RUN_ID]=${GH_RUN_ID}" \
            -F "variables[COMMIT_SHA]=${GH_SHA}" \
            -F "variables[SLACK_THREAD_TS]=${SLACK_THREAD_TS}" \
            -F "variables[SLACK_CHANNEL_ID]=${SLACK_CHANNEL_ID}" \
            -F "variables[DRY_RUN]=false" \
            "${GITLAB_PIPELINE_URL}"
          echo "internal security pipeline triggered"

  # Failure-only alert to the automation Slack channel, modeled on dynamo's
  # notify-slack.yml. Mentions come from the SLACK_NOTIFY_MENTIONS repo
  # variable: comma-separated Slack IDs — U*/W* member IDs become <@id>,
  # S* usergroup IDs become <!subteam^id>, anything else is passed through.
  # The webhook is a repo-level secret (not an environment secret) so the
  # alert still fires when an environment-gated job failed or never ran.
  notify-slack:
    name: Notify Slack
    if: always()
    needs: [changes-guard, manual-approval, python-compliance, build-artifacts, license-evidence, fpe-support-matrix, stage-artifactory, trigger-gitlab-security]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - name: Collect failed jobs
        id: failed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MENTION_IDS: ${{ vars.SLACK_NOTIFY_MENTIONS }}
        run: |
          set -euo pipefail
          curl -sS --fail --retry 3 --retry-all-errors --retry-delay 3 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs?per_page=100" \
            > jobs.json
          FAILED_JOBS=$(jq -r '(.jobs // [])[]
            | select(.conclusion == "failure" or .conclusion == "timed_out")
            | ":failed: " + .name + "\\n"' jobs.json | tr -d '\n')
          {
            echo "FAILED_JOBS<<EOF"
            echo "${FAILED_JOBS}"
            echo "EOF"
          } >> "${GITHUB_ENV}"
          mentions=""
          IFS=',' read -ra ids <<< "${MENTION_IDS:-}"
          for id in "${ids[@]:-}"; do
            id="$(echo "${id}" | tr -d '[:space:]')"
            [ -n "${id}" ] || continue
            case "${id}" in
              U*|W*) mentions="${mentions} <@${id}>" ;;
              S*)    mentions="${mentions} <!subteam^${id}>" ;;
              *)     mentions="${mentions} ${id}" ;;
            esac
          done
          echo "MENTION_TEXT=${mentions:+${mentions} }please investigate and drive to closure." >> "${GITHUB_ENV}"
          if [ -n "$(echo "${FAILED_JOBS}" | tr -d '[:space:]')" ]; then
            echo "has_failures=true" >> "${GITHUB_OUTPUT}"
          else
            echo "has_failures=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Notify Slack
        if: steps.failed.outputs.has_failures == 'true'
        uses: slackapi/slack-github-action@91efab103c0de0a537f72a35f6b8cda0ee76bf0a # v2.1.1
        with:
          webhook: ${{ secrets.SLACK_NOTIFY_NIGHTLY_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            blocks:
              - type: "section"
                text:
                  type: mrkdwn
                  text: ":alert: *AISimulate Nightly CI Failure*"
              - type: "section"
                text:
                  type: mrkdwn
                  text: "<https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|Workflow Summary>"
              - type: "section"
                text:
                  type: mrkdwn
                  text: "${{ env.FAILED_JOBS }}"
              - type: "section"
                text:
                  type: mrkdwn
                  text: "${{ env.MENTION_TEXT }}"
