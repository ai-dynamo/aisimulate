name: Nightly artifacts

# Nightly build of the approved AISimulate release artifacts — the
# `aisimulate` wheel and the `aisimulate-core` crate — via
# scripts/build_release_artifacts.py, the artifact contract's only sanctioned
# entry point. The build job runs only hash-pinned tooling and
# lockfile-resolved crates; the wheel's unpinned PyPI dependency tree is
# installed in a separate smoke job after the artifacts are stored.
#
# Consumer contract: staging must pick the newest successful scheduled run
# on refs/heads/main that uploaded artifacts. Guard-skipped nights succeed
# with zero artifacts. provenance.json records ref and event for filtering.
#
# Out of scope: publishing/staging (OPS-8259) and nightly dev-version
# stamping (AIC-1463, under the OPS-7963 umbrella) — artifacts carry the
# manifest version verbatim.
#
# Runs on the repo's Velonix runners (OPS-8249) in the image proven by
# ci/validate-velonix-runners. That test exercised no network egress and no
# compilers, so registry endpoints and the C toolchain are first used here.
# manylinux build images are unproven on these runners, so the wheel's glibc
# floor tracks this image.

on:
  schedule:
    # 08:00 UTC daily, matching the ai-dynamo org nightly convention.
    - cron: "0 8 * * *"
  # TEMPORARY — TESTING ONLY, REVERT BEFORE MERGE: exercises this workflow on
  # copy-pr-bot refs. Velonix runner admission (admit-job.sh) only approves
  # push events on pull-request/* refs, not personal branches. The production
  # trigger is the schedule.
  push:
    branches: ["pull-request/*"]

# Read-only default token; only the guard job adds actions:read.
permissions:
  contents: read

concurrency:
  group: nightly-ci
  cancel-in-progress: false

jobs:
  changes-guard:
    name: Skip when main is unchanged
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      should-build: ${{ steps.decide.outputs.should-build }}
    steps:
      - name: Compare HEAD with the last successful nightly
        id: decide
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            // Only scheduled runs dedup; test pushes always build.
            if (context.eventName !== 'schedule') {
              core.setOutput('should-build', 'true');
              return;
            }
            try {
              const runs = await github.rest.actions.listWorkflowRuns({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'nightly-ci.yml',
                branch: 'main',
                status: 'success',
                per_page: 1,
              });
              const last = runs.data.workflow_runs[0];
              if (last && last.head_sha === context.sha) {
                core.notice(
                  `No new commits since successful run ${last.html_url}; skipping.`,
                );
                core.setOutput('should-build', 'false');
                return;
              }
            } catch (error) {
              // Fail open: a guard outage must never block the nightly.
              core.warning(`Could not query previous runs (${error.message}); building.`);
            }
            core.setOutput('should-build', 'true');

  build-artifacts:
    name: Build artifacts (${{ matrix.arch }})
    needs: changes-guard
    if: needs.changes-guard.outputs.should-build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: prod-aisimulate-default-amd64-v1
            rust_target: x86_64-unknown-linux-gnu
            rustup_init_sha256: 4acc9acc76d5079515b46346a485974457b5a79893cfb01112423c89aeb5aa10
            uv_target: x86_64-unknown-linux-gnu
            uv_sha256: 8681d8921e7d520fb368991dcf5f9c1905b80f5bf2a265a0ed085c8d8e342477
          - arch: arm64
            runner: prod-aisimulate-default-arm64-v1
            rust_target: aarch64-unknown-linux-gnu
            rustup_init_sha256: 9732d6c5e2a098d3521fca8145d826ae0aaa067ef2385ead08e6feac88fa5792
            uv_target: aarch64-unknown-linux-gnu
            uv_sha256: d58030acd26159499ac82f32da12d1b3c12a3a1bfc414232d9082070c03e128d
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    container:
      # Image proven on this runner set by ci/validate-velonix-runners. The
      # tag is mutable and its digest is not readable in-job, so the image
      # reference is recorded in provenance.json; digest pinning is pending.
      image: 210086341041.dkr.ecr.us-west-2.amazonaws.com/dynamo-ci/aws/dynamo/actions-runner/actions-runner:2.336.0
      env:
        HOME: /__w/aisimulate/aisimulate
        USER: runner
    defaults:
      run:
        shell: bash
    env:
      UV_VERSION: "0.12.6"
      RUSTUP_VERSION: "1.29.0"
      RUST_TOOLCHAIN: "1.98.0"
      PYTHON_SERIES: "3.12"
      # Use uv's managed interpreter (not the image's python) and ignore any
      # uv.toml discovered in the workspace.
      UV_PYTHON_PREFERENCE: only-managed
      UV_NO_CONFIG: "1"
      # Keep in sync with container.image above; recorded in provenance.json.
      CONTAINER_IMAGE: 210086341041.dkr.ecr.us-west-2.amazonaws.com/dynamo-ci/aws/dynamo/actions-runner/actions-runner:2.336.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # HOME above is the checked-out workspace: anything written there
      # trips check_manifests()'s repo-wide manifest scan and dirties the
      # tree `cargo package --allow-dirty` snapshots. TMPDIR redirect keeps
      # the multi-GB crate verify build off container-overlay /tmp.
      - name: Isolate toolchain paths outside the workspace
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/tmp"
          {
            echo "TOOLS_DIR=${RUNNER_TEMP}/tools"
            echo "DIST_DIR=${RUNNER_TEMP}/nightly-dist"
            echo "CARGO_HOME=${RUNNER_TEMP}/cargo"
            echo "RUSTUP_HOME=${RUNNER_TEMP}/rustup"
            echo "UV_CACHE_DIR=${RUNNER_TEMP}/uv-cache"
            echo "UV_PYTHON_INSTALL_DIR=${RUNNER_TEMP}/uv-python"
            echo "TMPDIR=${RUNNER_TEMP}/tmp"
          } >> "${GITHUB_ENV}"

      # Fail fast if the image lacks the C toolchain the native build needs
      # (zstd-sys, blake3, cdylib link) — unproven by the Velonix smoke test.
      # If this trips, the runner image needs the toolchain added.
      - name: Preflight image toolchain
        run: |
          set -euo pipefail
          for tool in cc curl tar sha256sum; do
            command -v "${tool}"
          done
          printf 'int main(void){return 0;}\n' > "${RUNNER_TEMP}/preflight.c"
          cc "${RUNNER_TEMP}/preflight.c" -o "${RUNNER_TEMP}/preflight"
          "${RUNNER_TEMP}/preflight"

      - name: Install uv (checksum-verified)
        env:
          UV_TARGET: ${{ matrix.uv_target }}
          UV_SHA256: ${{ matrix.uv_sha256 }}
        run: |
          set -euo pipefail
          mkdir -p "${TOOLS_DIR}"
          archive="${TOOLS_DIR}/uv.tar.gz"
          # -q must be curl's first argument: HOME is the workspace, so this
          # ignores any repo-root .curlrc.
          curl -q --fail --location --silent --show-error --retry 3 \
            --output "${archive}" \
            "https://github.com/astral-sh/uv/releases/download/${UV_VERSION}/uv-${UV_TARGET}.tar.gz"
          echo "${UV_SHA256}  ${archive}" | sha256sum --check
          tar -xzf "${archive}" -C "${TOOLS_DIR}" --strip-components=1
          rm "${archive}"
          echo "${TOOLS_DIR}" >> "${GITHUB_PATH}"
          "${TOOLS_DIR}/uv" --version

      - name: Install Rust toolchain (checksum-verified rustup)
        env:
          RUST_TARGET: ${{ matrix.rust_target }}
          RUSTUP_INIT_SHA256: ${{ matrix.rustup_init_sha256 }}
        run: |
          set -euo pipefail
          rustup_init="${TOOLS_DIR}/rustup-init"
          curl -q --fail --location --silent --show-error --retry 3 \
            --output "${rustup_init}" \
            "https://static.rust-lang.org/rustup/archive/${RUSTUP_VERSION}/${RUST_TARGET}/rustup-init"
          echo "${RUSTUP_INIT_SHA256}  ${rustup_init}" | sha256sum --check
          chmod 0755 "${rustup_init}"
          "${rustup_init}" -y --no-modify-path --profile minimal \
            --default-toolchain "${RUST_TOOLCHAIN}"
          rm "${rustup_init}"
          echo "${CARGO_HOME}/bin" >> "${GITHUB_PATH}"
          "${CARGO_HOME}/bin/cargo" --version

      - name: Create build environment
        run: |
          set -euo pipefail
          uv venv --python "${PYTHON_SERIES}" "${TOOLS_DIR}/venv-build"
          uv pip install \
            --python "${TOOLS_DIR}/venv-build/bin/python" \
            --require-hashes \
            --requirements .github/nightly/build-requirements.txt
          "${TOOLS_DIR}/venv-build/bin/python" -m maturin --version

      - name: Validate release manifests
        run: |
          set -euo pipefail
          "${TOOLS_DIR}/venv-build/bin/python" scripts/build_release_artifacts.py --check-only

      - name: Build release artifacts
        run: |
          set -euo pipefail
          "${TOOLS_DIR}/venv-build/bin/python" scripts/build_release_artifacts.py \
            --output-dir "${DIST_DIR}"

      - name: Drop duplicate crate (non-amd64 legs)
        if: matrix.arch != 'amd64'
        run: |
          set -euo pipefail
          # The .crate is arch-independent source; the amd64 leg's copy is
          # canonical, so drop this leg's duplicate before upload.
          rm "${DIST_DIR}"/aisimulate-core-*.crate

      - name: Write checksums and provenance
        env:
          MATRIX_ARCH: ${{ matrix.arch }}
          MATRIX_RUNNER: ${{ matrix.runner }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_WORKFLOW_REF: ${{ github.workflow_ref }}
          GH_REF: ${{ github.ref }}
          GH_SHA: ${{ github.sha }}
          GH_RUN_ID: ${{ github.run_id }}
          GH_RUN_ATTEMPT: ${{ github.run_attempt }}
          GH_EVENT_NAME: ${{ github.event_name }}
          GH_SERVER_URL: ${{ github.server_url }}
        run: |
          set -euo pipefail
          (cd "${DIST_DIR}" && sha256sum -- * > SHA256SUMS.txt)
          "${TOOLS_DIR}/venv-build/bin/python" - <<'EOF'
          import importlib.metadata as metadata
          import json
          import os
          import platform
          from datetime import datetime, timezone
          from pathlib import Path

          dist = Path(os.environ["DIST_DIR"])
          provenance = {
              "repository": os.environ["GH_REPOSITORY"],
              "workflow_ref": os.environ["GH_WORKFLOW_REF"],
              "ref": os.environ["GH_REF"],
              "commit": os.environ["GH_SHA"],
              "run_url": (
                  f"{os.environ['GH_SERVER_URL']}/{os.environ['GH_REPOSITORY']}"
                  f"/actions/runs/{os.environ['GH_RUN_ID']}"
                  f"/attempts/{os.environ['GH_RUN_ATTEMPT']}"
              ),
              "event": os.environ["GH_EVENT_NAME"],
              "arch": os.environ["MATRIX_ARCH"],
              "runner_label": os.environ["MATRIX_RUNNER"],
              "container_image": os.environ["CONTAINER_IMAGE"],
              "built_at_utc": datetime.now(timezone.utc).isoformat(),
              "toolchain": {
                  "python": platform.python_version(),
                  "rust": os.environ["RUST_TOOLCHAIN"],
                  "uv": os.environ["UV_VERSION"],
                  "maturin": metadata.version("maturin"),
              },
              "artifacts": {
                  line.split(maxsplit=1)[1]: line.split(maxsplit=1)[0]
                  for line in (dist / "SHA256SUMS.txt").read_text().splitlines()
                  if not line.endswith("SHA256SUMS.txt")
              },
          }
          (dist / "provenance.json").write_text(json.dumps(provenance, indent=2) + "\n")
          EOF
          {
            echo "### Nightly artifacts (${MATRIX_ARCH})"
            echo '```'
            cat "${DIST_DIR}/SHA256SUMS.txt"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-dist-${{ matrix.arch }}
          path: ${{ runner.temp }}/nightly-dist/*
          if-no-files-found: error
          # Wheels and crates are already compressed; skip recompression.
          compression-level: 0
          # Matches the Dynamo nightly compliance policy's 30-day window.
          retention-days: 30

  # Installing the wheel pulls its unpinned PyPI dependency tree — untrusted
  # code that must not share a job with artifact production, so this runs
  # after the artifacts are immutable in the artifact store. A red smoke job
  # fails the run, the signal staging consumers gate on.
  smoke-test:
    name: Smoke-test wheel (${{ matrix.arch }})
    needs: build-artifacts
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: prod-aisimulate-default-amd64-v1
            uv_target: x86_64-unknown-linux-gnu
            uv_sha256: 8681d8921e7d520fb368991dcf5f9c1905b80f5bf2a265a0ed085c8d8e342477
          - arch: arm64
            runner: prod-aisimulate-default-arm64-v1
            uv_target: aarch64-unknown-linux-gnu
            uv_sha256: d58030acd26159499ac82f32da12d1b3c12a3a1bfc414232d9082070c03e128d
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    container:
      image: 210086341041.dkr.ecr.us-west-2.amazonaws.com/dynamo-ci/aws/dynamo/actions-runner/actions-runner:2.336.0
      env:
        HOME: /__w/aisimulate/aisimulate
        USER: runner
    defaults:
      run:
        shell: bash
    env:
      UV_VERSION: "0.12.6"
      PYTHON_SERIES: "3.12"
      UV_PYTHON_PREFERENCE: only-managed
      UV_NO_CONFIG: "1"
    steps:
      # No checkout: this job needs only the stored artifact, keeping the
      # untrusted dependency install away from repo content.
      - name: Isolate toolchain paths outside the workspace
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/tmp"
          {
            echo "TOOLS_DIR=${RUNNER_TEMP}/tools"
            echo "DIST_DIR=${RUNNER_TEMP}/nightly-dist"
            echo "UV_CACHE_DIR=${RUNNER_TEMP}/uv-cache"
            echo "UV_PYTHON_INSTALL_DIR=${RUNNER_TEMP}/uv-python"
            echo "TMPDIR=${RUNNER_TEMP}/tmp"
          } >> "${GITHUB_ENV}"

      - name: Download built artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nightly-dist-${{ matrix.arch }}
          path: ${{ runner.temp }}/nightly-dist

      - name: Install uv (checksum-verified)
        env:
          UV_TARGET: ${{ matrix.uv_target }}
          UV_SHA256: ${{ matrix.uv_sha256 }}
        run: |
          set -euo pipefail
          mkdir -p "${TOOLS_DIR}"
          archive="${TOOLS_DIR}/uv.tar.gz"
          curl -q --fail --location --silent --show-error --retry 3 \
            --output "${archive}" \
            "https://github.com/astral-sh/uv/releases/download/${UV_VERSION}/uv-${UV_TARGET}.tar.gz"
          echo "${UV_SHA256}  ${archive}" | sha256sum --check
          tar -xzf "${archive}" -C "${TOOLS_DIR}" --strip-components=1
          rm "${archive}"
          echo "${TOOLS_DIR}" >> "${GITHUB_PATH}"
          "${TOOLS_DIR}/uv" --version

      - name: Verify artifact checksums
        run: |
          set -euo pipefail
          (cd "${DIST_DIR}" && sha256sum --check --strict SHA256SUMS.txt)

      - name: Smoke-test the wheel
        run: |
          set -euo pipefail
          uv venv --python "${PYTHON_SERIES}" "${TOOLS_DIR}/venv-smoke"
          smoke_python="${TOOLS_DIR}/venv-smoke/bin/python"
          uv pip install --python "${smoke_python}" "${DIST_DIR}"/aisimulate-*.whl
          uv pip check --python "${smoke_python}"
          "${smoke_python}" - <<'EOF'
          import importlib.metadata as metadata

          import aiconfigurator
          import aiconfigurator_core
          import aisimulate
          import aisimulate_core

          assert (
              aisimulate.__version__
              == aisimulate_core.__version__
              == metadata.version("aisimulate")
          )
          installed = {dist.metadata["Name"].lower() for dist in metadata.distributions()}
          forbidden = {"aisimulate-core", "aiconfigurator", "aiconfigurator-core"}
          assert installed.isdisjoint(forbidden), installed & forbidden
          EOF
          "${TOOLS_DIR}/venv-smoke/bin/aisimulate" --help
          "${TOOLS_DIR}/venv-smoke/bin/aiconfigurator" version
