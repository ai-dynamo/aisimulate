name: Optional Dynamo Policy

# Full CI supplies the existing reviewed/admitted exact-SHA prerequisite.
on:
  workflow_call:
    inputs:
      expected_sha:
        required: true
        type: string

permissions:
  contents: read

jobs:
  native-and-cli:
    name: Native policy and installed CLI
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EXPECTED_SHA: ${{ inputs.expected_sha }}
      CARGO_BUILD_JOBS: "2"
      RUSTUP_TOOLCHAIN: "1.96.1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.expected_sha }}
          persist-credentials: false
      - name: Verify exact target
        run: test "$(git rev-parse HEAD)" = "${EXPECTED_SHA}"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: "1.96.1"
      - name: Check paired package contracts
        run: |
          python scripts/check_packaged_legal_files.py
          python -m unittest discover -s scripts/tests -p test_dynamo_policy_packaging.py
      - name: Build matching locked wheels
        run: |
          python -m pip install 'maturin>=1.12,<2'
          python scripts/build_dynamo_policy.py --debug --output-dir policy-wheels
      - name: Install matching wheels into a clean environment
        run: |
          python -m venv policy-smoke
          policy-smoke/bin/python -m pip install policy-wheels/*.whl pytest==8.4.2
          policy-smoke/bin/python -m pip check
      - name: Test native policy lifecycle
        run: cargo test -p aisimulate-dynamo-policy --locked
      - name: Test installed adapter and real YAML CLI
        run: >-
          policy-smoke/bin/python -m pytest -c /dev/null -q -p no:cacheprovider
          --confcutdir=python/aisimulate-dynamo-policy/tests
          python/aisimulate-dynamo-policy/tests
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: optional-dynamo-policy-wheel-manifest
          path: policy-wheels/manifest.json
          if-no-files-found: error
