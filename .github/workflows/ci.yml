# The Rust feature-mode, Python compatibility, engine-regression, and
# aggregate jobs were adapted from NVIDIA AIConfigurator at commit
# 77fd0773407b3683d8a671fe24a30a7110651b64.
name: Full CI

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact reviewed commit required for this run
        required: true
        type: string
  push:
    # Keep trusted copy-pr-bot branches as an automatic coverage backstop until
    # the main ruleset requires the exact-SHA Full CI checks. Reviewed PR
    # validation may also be admitted explicitly through workflow_dispatch.
    branches:
      - main
      - "pull-request/*"
      - "release/*"

permissions:
  contents: read

jobs:
  verify-target:
    name: Verify Exact Target
    runs-on: ubuntu-latest
    env:
      EXPECTED_SHA: ${{ inputs.expected_sha }}
      RUN_SHA: ${{ github.sha }}
    steps:
      - name: Reject a mismatched requested commit
        shell: bash
        run: |
          if [[ -n "${EXPECTED_SHA}" && "${EXPECTED_SHA}" != "${RUN_SHA}" ]]; then
            echo "::error::expected ${EXPECTED_SHA}, but workflow is pinned to ${RUN_SHA}"
            exit 1
          fi

  fast-ci:
    name: Fast CI
    needs: verify-target
    uses: ./.github/workflows/fast-ci.yml
    with:
      expected_sha: ${{ github.sha }}

  cargo-deny:
    name: Cargo Deny (workspace, ${{ matrix.arch }})
    needs: fast-ci
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: prod-aisimulate-default-amd64-v1
            cargo_deny_target: x86_64-unknown-linux-musl
            cargo_deny_sha256: 0e8c2aa59128612c90d9e09c02204e912f29a5b8d9a64671b94608cbe09e064f
          - arch: arm64
            runner: prod-aisimulate-default-arm64-v1
            cargo_deny_target: aarch64-unknown-linux-musl
            cargo_deny_sha256: 2b3567a60b7491c159d1cef8b7d8479d1ad2a31e29ef49462634ad4552fcc77d
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    container:
      image: ${{ vars.CI_JOB_CONTAINER_IMAGE }}
      env:
        HOME: /__w/aisimulate/aisimulate
        USER: runner
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      - name: Install cargo-deny 0.19.0
        env:
          CARGO_DENY_SHA256: ${{ matrix.cargo_deny_sha256 }}
        run: |
          package="cargo-deny-0.19.0-${{ matrix.cargo_deny_target }}"
          archive="${RUNNER_TEMP}/${package}.tar.gz"
          curl --fail --location --silent --show-error \
            --output "${archive}" \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/0.19.0/${package}.tar.gz"
          echo "${CARGO_DENY_SHA256}  ${archive}" | sha256sum --check
          tar -xzf "${archive}" -C "${RUNNER_TEMP}"
          install -m 0755 "${RUNNER_TEMP}/${package}/cargo-deny" "${RUNNER_TEMP}/cargo-deny"
          echo "${RUNNER_TEMP}" >> "${GITHUB_PATH}"
          "${RUNNER_TEMP}/cargo-deny" --version
      - name: Check dependency policy
        run: |
          cargo-deny -L error --all-features --manifest-path Cargo.toml \
            check licenses bans --config deny.toml
          cargo-deny -L error --all-features \
            --manifest-path crates/tests/public-api/Cargo.toml \
            check licenses bans --config deny.toml

  rust:
    name: Rust (${{ matrix.arch }})
    needs: fast-ci
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    runs-on: prod-aisimulate-default-${{ matrix.arch }}-v1
    container:
      image: ${{ vars.CI_JOB_CONTAINER_IMAGE }}
      env:
        HOME: /__w/aisimulate/aisimulate
        USER: runner
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-python-rust
        with:
          python-version: "3.12"
          rust-components: rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace

  rust-feature-modes:
    name: Rust feature modes
    needs: fast-ci
    runs-on: prod-aisimulate-default-amd64-v1
    timeout-minutes: 30
    container:
      image: ${{ vars.CI_JOB_CONTAINER_IMAGE }}
      env:
        HOME: /__w/aisimulate/aisimulate
        USER: runner
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-python-rust
        with:
          python-version: "3.13"
      - name: Install the unified Python package
        run: python -m pip install './python/aisimulate[dev]'
      - name: Test with Python embedding enabled
        run: |
          export AIC_REQUIRE_EMBEDDED_ROUND_TRIP=1
          export PYO3_PYTHON="${pythonLocation}/bin/python"
          cargo test --workspace --features embed-python,replay-bench

  public-api-rust:
    name: Public API Rust (${{ matrix.arch }})
    needs: fast-ci
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    runs-on: prod-aisimulate-default-${{ matrix.arch }}-v1
    container:
      image: ${{ vars.CI_JOB_CONTAINER_IMAGE }}
      env:
        HOME: /__w/aisimulate/aisimulate
        USER: runner
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-python-rust
        with:
          python-version: "3.12"
      - run: cargo test --manifest-path crates/tests/public-api/Cargo.toml

  application-wheel:
    name: Application Wheel (${{ matrix.arch }})
    needs:
      - fast-ci
      - cargo-deny
      - rust
      - rust-feature-modes
      - public-api-rust
      - application-tests
      - python-compatibility
      - engine-golden-regression
      - release-artifact-contract
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    runs-on: prod-aisimulate-default-${{ matrix.arch }}-v1
    container:
      image: ${{ vars.CI_JOB_CONTAINER_IMAGE }}
      env:
        HOME: /__w/aisimulate/aisimulate
        USER: runner
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-python-rust
        with:
          python-version: "3.12"
      - run: python -m pip install 'maturin>=1.12,<2'
      - name: Build application wheel
        run: python -m maturin build --release --out ../../dist
        working-directory: python/aisimulate
      - name: Verify exact staged wheel
        run: python python/aisimulate/tools/verify_release_wheels.py dist
      - name: Smoke-test exact staged wheel
        run: |
          python -m venv staged-wheel-smoke
          staged-wheel-smoke/bin/python -m pip install --no-deps dist/aisimulate-*.whl
          staged-wheel-smoke/bin/python -c \
            "import aisimulate, aisimulate_core, aiconfigurator, aiconfigurator_core; \
            assert aisimulate_core._build_smoke() > 0"
      - name: Preserve wheel for trusted staging
        if: github.event_name == 'push'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: application-wheel-${{ matrix.arch }}
          path: dist/*.whl

  stage-application-wheel:
    name: Stage Application Wheel (${{ matrix.arch }})
    needs: application-wheel
    # Manual PR validation builds and verifies wheels without acquiring release
    # credentials. Only post-merge and release lifecycle pushes may stage them.
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' ||
       startsWith(github.ref, 'refs/heads/release/'))
    environment: automated-release
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    runs-on: prod-aisimulate-default-${{ matrix.arch }}-v1
    container:
      image: ${{ vars.CI_JOB_CONTAINER_IMAGE }}
      env:
        HOME: /__w/aisimulate/aisimulate
        USER: runner
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: application-wheel-${{ matrix.arch }}
          path: dist
      - name: Stage wheel in Artifactory
        shell: bash
        env:
          ARTIFACTORY_URL: ${{ secrets.ARTIFACTORY_URL }}
          ARTIFACTORY_PYPI_REPO: ${{ secrets.ARTIFACTORY_PYPI_REPO_NAME }}
          ARTIFACTORY_TOKEN: ${{ secrets.ARTIFACTORY_TOKEN }}
        run: |
          set -euo pipefail

          for name in ARTIFACTORY_URL ARTIFACTORY_PYPI_REPO ARTIFACTORY_TOKEN; do
            [ -n "${!name}" ] || {
              echo "::error::environment secret ${name} is not configured"
              exit 1
            }
          done
          case "${ARTIFACTORY_URL}" in
            https://*) ;;
            *)
              echo "::error::ARTIFACTORY_URL must use HTTPS"
              exit 1
              ;;
          esac
          case "${ARTIFACTORY_PYPI_REPO}" in
            ""|*/*|*..*)
              echo "::error::invalid ARTIFACTORY_PYPI_REPO_NAME"
              exit 1
              ;;
          esac

          case "${GITHUB_REF}" in
            refs/heads/main|refs/heads/release/*)
              subpath="post-merge/${GITHUB_SHA}/${GITHUB_RUN_ID}"
              ;;
            *)
              echo "::error::ref is not permitted to stage wheels: ${GITHUB_REF}"
              exit 1
              ;;
          esac

          shopt -s nullglob
          wheels=(dist/*.whl)
          [ "${#wheels[@]}" -eq 1 ] || {
            echo "::error::expected exactly one wheel, found ${#wheels[@]}"
            exit 1
          }
          wheel="${wheels[0]}"
          wheel_name="$(basename "${wheel}")"
          sha="$(sha256sum "${wheel}" | cut -d' ' -f1)"
          url="${ARTIFACTORY_URL%/}/${ARTIFACTORY_PYPI_REPO}/${subpath}/${wheel_name}"
          headers="$(mktemp "${RUNNER_TEMP}/artifactory-head.XXXXXX")"
          trap 'rm -f "${headers}"' EXIT

          probe() {
            curl -q --silent --show-error \
              --head \
              --output /dev/null \
              --dump-header "${headers}" \
              --write-out '%{http_code}' \
              -H "Authorization: Bearer ${ARTIFACTORY_TOKEN}" \
              "${url}"
          }

          status="$(probe)"
          case "${status}" in
            200)
              existing="$(
                awk 'tolower($1) == "x-checksum-sha256:" {gsub("\\r", "", $2); print tolower($2)}' \
                  "${headers}" | tail -n 1
              )"
              [ -n "${existing}" ] || {
                echo "::error::existing wheel did not return an X-Checksum-Sha256 header"
                exit 1
              }
              [ "${existing}" = "${sha}" ] || {
                echo "::error::wheel already exists with a different checksum: ${wheel_name}"
                exit 1
              }
              echo "already staged: ${wheel_name}"
              ;;
            404)
              curl -q --fail --silent --show-error --retry 3 \
                --output /dev/null \
                -H "Authorization: Bearer ${ARTIFACTORY_TOKEN}" \
                -H "X-Checksum-Sha256: ${sha}" \
                --upload-file "${wheel}" \
                "${url}"
              status="$(probe)"
              [ "${status}" = 200 ] || {
                echo "::error::wheel upload could not be read back (HTTP ${status})"
                exit 1
              }
              uploaded="$(
                awk 'tolower($1) == "x-checksum-sha256:" {gsub("\\r", "", $2); print tolower($2)}' \
                  "${headers}" | tail -n 1
              )"
              [ "${uploaded}" = "${sha}" ] || {
                echo "::error::uploaded wheel checksum does not match: ${wheel_name}"
                exit 1
              }
              echo "staged: ${wheel_name}"
              ;;
            *)
              echo "::error::Artifactory probe failed with HTTP ${status}"
              exit 1
              ;;
          esac

          {
            echo "### Wheel staged to Artifactory"
            echo "Path: \`${subpath}/${wheel_name}\`"
            echo "SHA256: \`${sha}\`"
            echo "Run attempt: \`${GITHUB_RUN_ATTEMPT}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

  application-tests:
    name: Application Tests (${{ matrix.arch }})
    needs: fast-ci
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    runs-on: prod-aisimulate-default-${{ matrix.arch }}-v1
    container:
      image: ${{ vars.CI_JOB_CONTAINER_IMAGE }}
      env:
        HOME: /__w/aisimulate/aisimulate
        USER: runner
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-python-rust
        with:
          python-version: "3.12"
      - run: python -m pip install maturin pytest pytest-asyncio
      - run: python -m pip install './python/aisimulate[dev]'
      - run: >-
          python -m pytest -q
          python/aisimulate/tests/unit/cli/test_aisimulate_compatibility.py
          python/aisimulate/tests/cross_package
      - run: aiconfigurator version
      - run: python -m pytest -q -c pytest.ini tests
      - name: Run recommendation E2E without parallel resource contention
        run: python -m pytest -q tests/e2e/cli/test_cli_recommend.py --timeout=180
        working-directory: python/aisimulate
      - run: >-
          python -m pytest -q
          tests
          -m 'unit or build'
          --ignore=tests/unit/sdk/database/test_moe_dispatch.py
          --ignore=tests/e2e/cli/test_cli_recommend.py
          -n auto
          --timeout=180
        working-directory: python/aisimulate

  python-compatibility:
    name: Python ${{ matrix.python-version }} compatibility
    needs: fast-ci
    runs-on: prod-aisimulate-default-amd64-v1
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    container:
      image: ${{ vars.CI_JOB_CONTAINER_IMAGE }}
      env:
        HOME: /__w/aisimulate/aisimulate
        USER: runner
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-python-rust
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install AISimulate and development dependencies
        run: python -m pip install './python/aisimulate[dev]'
      - name: Verify interpreter and dependency compatibility
        run: |
          python -m pip check
          python -c 'import sys, numpy; from packaging.version import Version; assert f"{sys.version_info.major}.{sys.version_info.minor}" == "${{ matrix.python-version }}"; assert Version("2.1") <= Version(numpy.__version__) < Version("3")'
      - name: Test unified-package contracts
        run: >-
          python -m pytest -q
          python/aisimulate/tests/cross_package

  engine-golden-regression:
    name: Engine golden regression
    needs: fast-ci
    runs-on: prod-aisimulate-default-amd64-v1
    timeout-minutes: 45
    container:
      image: ${{ vars.CI_JOB_CONTAINER_IMAGE }}
      env:
        HOME: /__w/aisimulate/aisimulate
        USER: runner
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-python-rust
        with:
          python-version: "3.13"
      - name: Install AISimulate and development dependencies
        run: python -m pip install './python/aisimulate[dev]'
      - name: Run engine-step golden regression suite
        run: >-
          python -m pytest -q -rx -n 4
          -c python/aisimulate/pytest.ini
          crates/core/parity_tests/perfmodel/test_engine_step_parity.py
      - name: Run compiled-engine golden regression suite
        run: >-
          python -m pytest -q -rx -n 4
          -c python/aisimulate/pytest.ini
          crates/core/parity_tests/perfmodel/test_compile_engine_parity.py

  release-artifact-contract:
    name: Release Artifact Contract (${{ matrix.arch }})
    needs: fast-ci
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    runs-on: prod-aisimulate-default-${{ matrix.arch }}-v1
    container:
      image: ${{ vars.CI_JOB_CONTAINER_IMAGE }}
      env:
        HOME: /__w/aisimulate/aisimulate
        USER: runner
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-python-rust
        with:
          python-version: "3.12"
      - run: python -m pip install build maturin
      - run: python scripts/build_release_artifacts.py --check-only
      - run: python scripts/build_release_artifacts.py --output-dir dist
      - run: python -m venv release-smoke
      - run: >-
          release-smoke/bin/python -m pip install
          dist/aisimulate-*.whl
      - run: release-smoke/bin/python -m pip check
      - run: >-
          release-smoke/bin/python -c
          "import importlib.metadata as metadata;
          import aisimulate, aisimulate_core, aiconfigurator, aiconfigurator_core;
          assert aisimulate.__version__ == aisimulate_core.__version__ == '0.12.0';
          assert metadata.version('aisimulate') == '0.12.0';
          installed = {dist.metadata['Name'].lower() for dist in metadata.distributions()};
          forbidden = {'aisimulate-core', 'aiconfigurator', 'aiconfigurator-core'};
          assert installed.isdisjoint(forbidden), installed & forbidden"
      - run: release-smoke/bin/aisimulate --help
      - run: release-smoke/bin/aiconfigurator version

  ci-success:
    name: CI Success
    if: always()
    needs:
      - verify-target
      - fast-ci
      - cargo-deny
      - rust
      - rust-feature-modes
      - public-api-rust
      - application-wheel
      - stage-application-wheel
      - application-tests
      - python-compatibility
      - engine-golden-regression
      - release-artifact-contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report and require every Full CI job
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          EXPECTED_STAGE_RESULT: >-
            ${{ github.event_name == 'push' &&
                (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/')) &&
                'success' || 'skipped' }}
        run: |
          python - <<'PY'
          import json
          import os

          needs = json.loads(os.environ["NEEDS_JSON"])
          expected = {name: "success" for name in needs}
          expected["stage-application-wheel"] = os.environ["EXPECTED_STAGE_RESULT"]
          failures = []
          for name, payload in sorted(needs.items()):
              result = payload["result"]
              wanted = expected[name]
              print(f"{name}: {result} (expected {wanted})")
              if result != wanted:
                  failures.append(f"{name}={result}, expected {wanted}")
          if failures:
              print("::error::Full CI did not pass: " + "; ".join(failures))
              raise SystemExit(1)
          PY
