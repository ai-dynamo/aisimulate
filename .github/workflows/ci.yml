name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  cargo-deny:
    name: Cargo Deny (workspace)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Install cargo-deny 0.19.0
        env:
          CARGO_DENY_SHA256: 0e8c2aa59128612c90d9e09c02204e912f29a5b8d9a64671b94608cbe09e064f
        run: |
          package="cargo-deny-0.19.0-x86_64-unknown-linux-musl"
          archive="${RUNNER_TEMP}/${package}.tar.gz"
          curl --fail --location --silent --show-error \
            --output "${archive}" \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/0.19.0/${package}.tar.gz"
          echo "${CARGO_DENY_SHA256}  ${archive}" | sha256sum --check
          tar -xzf "${archive}" -C "${RUNNER_TEMP}"
          install -m 0755 "${RUNNER_TEMP}/${package}/cargo-deny" "${RUNNER_TEMP}/cargo-deny"
          echo "${RUNNER_TEMP}" >> "${GITHUB_PATH}"
          "${RUNNER_TEMP}/cargo-deny" --version
      - name: Check dependency policy
        run: |
          cargo-deny -L error --all-features --manifest-path Cargo.toml \
            check licenses bans --config deny.toml
          cargo-deny -L error --all-features \
            --manifest-path crates/aisimulate-core/Cargo.toml \
            check licenses bans --config crates/aisimulate-core/deny.toml
          cargo-deny -L error --all-features \
            --manifest-path crates/tests/public-api/Cargo.toml \
            check licenses bans --config deny.toml

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install stable Rust toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt
      - run: rustup default stable
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace

  aic-core-rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install stable Rust toolchain
        run: rustup toolchain install stable --profile minimal
      - run: rustup default stable
      - run: cargo test --manifest-path crates/aisimulate-core/Cargo.toml
      - run: cargo test --manifest-path crates/tests/public-api/Cargo.toml

  application-wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install stable Rust toolchain
        run: rustup toolchain install stable --profile minimal
      - run: rustup default stable
      - run: python -m pip install 'maturin>=1.12,<2'
      - run: python -m maturin build --release --out ../../dist
        working-directory: python/aisimulate
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aisimulate-wheel
          path: dist/*.whl

  core-wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install stable Rust toolchain
        run: rustup toolchain install stable --profile minimal
      - run: rustup default stable
      - run: python -m pip install maturin pytest pytest-asyncio
      - run: python -m maturin build --release --out ../../dist/core
        working-directory: python/aisimulate-core
      - run: python -m pip install dist/core/aisimulate_core-*.whl
      - run: python -m pytest -c pytest.ini python/aisimulate-core/tests

  application-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install stable Rust toolchain
        run: rustup toolchain install stable --profile minimal
      - run: rustup default stable
      - run: python -m pip install maturin pytest pytest-asyncio
      - run: python -m maturin build --release --out ../../dist/core
        working-directory: python/aisimulate-core
      - run: python -m pip install dist/core/aisimulate_core-*.whl
      - run: python -m pip install './python/aisimulate[dev]'
      - run: >-
          python -m pytest -q
          python/aisimulate/tests/unit/cli/test_aisimulate_compatibility.py
          python/aisimulate/tests/cross_package/test_core_version_contract.py
      - run: python -m aisimulate version
      - run: aiconfigurator version
      - run: python -m pytest -q -c pytest.ini tests
      - run: >-
          python -m pytest -q
          tests
          -m 'unit or build'
          --ignore=tests/unit/sdk/database/test_moe_dispatch.py
          -n auto
          --timeout=180
        working-directory: python/aisimulate

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install ruff==0.14.1
      - run: >-
          ruff check
          --config python/aisimulate/pyproject.toml
          python/aisimulate/src/aisimulate
          python/aisimulate/tests/e2e/cli/test_cli_experiments.py
          tests

  release-artifact-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install stable Rust toolchain
        run: rustup toolchain install stable --profile minimal
      - run: rustup default stable
      - run: python -m pip install build maturin
      - run: python scripts/build_release_artifacts.py --check-only
      - run: python scripts/build_release_artifacts.py --output-dir dist
      - run: python -m venv release-smoke
      - run: >-
          release-smoke/bin/python -m pip install
          dist/aisimulate_core-*.whl
          dist/aisimulate-*.whl
      - run: release-smoke/bin/python -m pip check
      - run: >-
          release-smoke/bin/python -c
          "import aisimulate, aisimulate_core, aiconfigurator, aiconfigurator_core;
          assert aisimulate.__version__ == aisimulate_core.__version__ == '0.12.0'"
      - run: release-smoke/bin/aisimulate version
      - run: release-smoke/bin/aiconfigurator version
