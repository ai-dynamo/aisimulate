name: GitHub Pages

on:
  workflow_dispatch:
  workflow_run:
    workflows: [E2E Accuracy Matrix]
    types: [completed]
    branches: [main]
  schedule:
    # Pick up release-branch snapshots using the main-branch publisher.
    - cron: "17 6 * * *"
  pull_request:
    paths:
      - ".github/workflows/pages.yml"
      - "scripts/build_pages_site.py"
      - "tests/test_pages_site.py"
      - "scripts/build_e2e_accuracy_overview.py"
      - "scripts/prepare_e2e_accuracy_pages.py"
      - "scripts/run_e2e_accuracy.py"
      - "scripts/fetch_accuracy_measurements.py"
      - "tests/test_e2e_accuracy_nightly.py"
      - "tests/test_e2e_accuracy_overview.py"
      - "tests/test_e2e_accuracy_ui.mjs"
      - "tests/test_e2e_accuracy_workflow.mjs"
      - "python/aisimulate/docs/index.html"
      - "python/aisimulate/docs/support-matrix/**"
      - "python/aisimulate/docs/e2e-accuracy/**"
      - "python/aisimulate/docs/fpe-support-matrix/**"
      - "python/aisimulate/src/aiconfigurator_core/systems/support_matrix/**"
      - "python/aisimulate/src/aiconfigurator_core/systems/fpe_support_matrix/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/pages.yml"
      - "scripts/build_pages_site.py"
      - "scripts/build_e2e_accuracy_overview.py"
      - "scripts/prepare_e2e_accuracy_pages.py"
      - "scripts/run_e2e_accuracy.py"
      - "scripts/fetch_accuracy_measurements.py"
      - "python/aisimulate/docs/index.html"
      - "python/aisimulate/docs/support-matrix/**"
      - "python/aisimulate/docs/e2e-accuracy/**"
      - "python/aisimulate/docs/fpe-support-matrix/**"
      - "python/aisimulate/src/aiconfigurator_core/systems/support_matrix/**"
      - "python/aisimulate/src/aiconfigurator_core/systems/fpe_support_matrix/**"

permissions:
  # Build and validate repository content without Pages access.
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
          # workflow_run consumes data only; publisher code always comes from main.
          ref: ${{ github.event_name == 'workflow_run' && 'main' || github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Prepare qualified accuracy snapshots
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/prepare_e2e_accuracy_pages.py --output "${RUNNER_TEMP}/qualified-accuracy"
      - name: Build allowlisted public site
        run: |
          python scripts/build_pages_site.py --accuracy-refs \
            --accuracy-artifacts "${RUNNER_TEMP}/qualified-accuracy" --output-dir _site
      - name: Test accuracy publication and public artifact contracts
        run: |
          python -m pip install pytest==8.4.2 pyyaml==6.0.3
          python -m pytest -c /dev/null tests/test_pages_site.py tests/test_e2e_accuracy_overview.py tests/test_e2e_accuracy_nightly.py -q
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Test accuracy interactions
        run: node --test tests/test_e2e_accuracy_ui.mjs tests/test_e2e_accuracy_workflow.mjs
      - name: Upload GitHub Pages artifact
        if: >-
          github.event_name != 'pull_request' &&
          github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: >-
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      # Read the private Pages configuration and publish the site.
      pages: write
      # Authenticate the deployment to GitHub Pages.
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
