name: GitHub Pages

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/pages.yml"
      - "scripts/build_pages_site.py"
      - "tests/test_pages_site.py"
      - "python/aisimulate/docs/index.html"
      - "python/aisimulate/docs/support-matrix/**"
      - "python/aisimulate/docs/e2e-accuracy/**"
      - "python/aisimulate/docs/fpe-support-matrix/**"
      - "python/aisimulate/src/aiconfigurator_core/systems/support_matrix/**"
      - "python/aisimulate/src/aiconfigurator_core/systems/fpe_support_matrix/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/pages.yml"
      - "scripts/build_pages_site.py"
      - "python/aisimulate/docs/index.html"
      - "python/aisimulate/docs/support-matrix/**"
      - "python/aisimulate/docs/e2e-accuracy/**"
      - "python/aisimulate/docs/fpe-support-matrix/**"
      - "python/aisimulate/src/aiconfigurator_core/systems/support_matrix/**"
      - "python/aisimulate/src/aiconfigurator_core/systems/fpe_support_matrix/**"

permissions:
  # Build and validate repository content without Pages access.
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build allowlisted public site
        run: python scripts/build_pages_site.py --output-dir _site
      - name: Test public artifact contract
        run: python -m unittest discover -s tests -p test_pages_site.py
      - name: Upload GitHub Pages artifact
        if: >-
          github.event_name != 'pull_request' &&
          github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: >-
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      # Read the private Pages configuration and publish the site.
      pages: write
      # Authenticate the deployment to GitHub Pages.
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
