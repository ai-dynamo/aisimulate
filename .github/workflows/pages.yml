name: GitHub Pages

on:
  workflow_dispatch:
  workflow_run:
    # Retain the old main workflow name for runs started before the rename.
    workflows: ["FPE Support Matrix", "Main branch nightly CI", "Release branch nightly CI", "Nightly CI"]
    types: [completed]
    branches: [main, 'release/**']
  pull_request:
    paths:
      - ".github/workflows/pages.yml"
      - "scripts/build_pages_site.py"
      - "scripts/prepare_fpe_pages.py"
      - "scripts/run_release_fpe.py"
      - ".github/workflows/release-nightly-ci.yml"
      - ".github/workflows/fpe-release-qualify.yml"
      - "tests/test_pages_site.py"
      - "python/aisimulate/docs/index.html"
      - "python/aisimulate/docs/support-matrix/**"
      - "python/aisimulate/docs/e2e-accuracy/**"
      - "python/aisimulate/docs/fpe-support-matrix/**"
      - "python/aisimulate/src/aiconfigurator_core/systems/support_matrix/**"
      - "python/aisimulate/src/aiconfigurator_core/systems/fpe_support_matrix/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/pages.yml"
      - "scripts/build_pages_site.py"
      - "scripts/prepare_fpe_pages.py"
      - "scripts/run_release_fpe.py"
      - ".github/workflows/release-nightly-ci.yml"
      - ".github/workflows/fpe-release-qualify.yml"
      - "python/aisimulate/docs/index.html"
      - "python/aisimulate/docs/support-matrix/**"
      - "python/aisimulate/docs/e2e-accuracy/**"
      - "python/aisimulate/docs/fpe-support-matrix/**"
      - "python/aisimulate/src/aiconfigurator_core/systems/support_matrix/**"
      - "python/aisimulate/src/aiconfigurator_core/systems/fpe_support_matrix/**"

permissions:
  # Build and validate repository content without Pages access.
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.event_name == 'pull_request' ||
      (github.ref == 'refs/heads/main' &&
      (github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository)))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          # workflow_run payloads never choose executable repository content.
          ref: ${{ github.event_name == 'pull_request' && github.ref || 'main' }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Prepare qualified main and release FPE snapshots
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: python scripts/prepare_fpe_pages.py --repository "$GH_REPOSITORY" --output-dir fpe-pages-data
      - name: Build public deployment with qualified FPE data
        if: github.event_name != 'pull_request'
        run: python scripts/build_pages_site.py --output-dir _site --fpe-data-dir fpe-pages-data
      - name: Build pull request preview from repository data
        if: github.event_name == 'pull_request'
        run: python scripts/build_pages_site.py --output-dir _site
      - name: Test public artifact contract
        run: python -m unittest discover -s tests -p test_pages_site.py
      - name: Upload GitHub Pages artifact
        if: >-
          github.event_name != 'pull_request' &&
          github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: >-
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      # Read the private Pages configuration and publish the site.
      pages: write
      # Authenticate the deployment to GitHub Pages.
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
