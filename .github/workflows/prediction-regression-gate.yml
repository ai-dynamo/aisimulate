# Adapted from ai-dynamo/AIConfigurator at commit
# 77fd0773407b3683d8a671fe24a30a7110651b64; modified as a reusable AISimulate Full CI gate.

name: Prediction Regression Gate

on:
  workflow_call:
    inputs:
      expected_sha:
        description: Exact commit that Full CI expects this workflow to validate
        required: false
        type: string
        default: ""
      old-ref:
        description: Old revision to compare against
        required: false
        type: string
        default: main
  workflow_dispatch:
    inputs:
      old-ref:
        description: "Old revision to compare against (default: main)"
        required: false
        default: ""

permissions:
  contents: read
  pull-requests: read

concurrency:
  # Manual and reusable invocations must not cancel another comparison run.
  group: prediction-regression-${{ github.run_id }}
  cancel-in-progress: true

jobs:
  refs:
    name: Resolve comparison revisions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      old: ${{ steps.resolve.outputs.old }}
    steps:
      - name: Resolve comparison base
        id: resolve
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          OLD_REF_INPUT: ${{ inputs.old-ref }}
        with:
          script: |
            // A reusable workflow retains its caller's event name. Resolve the
            // explicit input for trusted-copy pushes as well as manual runs.
            core.setOutput("old", process.env.OLD_REF_INPUT || "main");

  collect:
    name: Collect prediction snapshot (${{ matrix.side }})
    needs: refs
    runs-on: prod-aisimulate-default-amd64-v1
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        side: [old, new]
    container:
      image: ${{ vars.CI_JOB_CONTAINER_IMAGE }}
      env:
        HOME: /__w/aisimulate/aisimulate
        USER: runner
    steps:
      - name: Checkout comparison revision
        uses: actions/checkout@v7
        with:
          ref: ${{ matrix.side == 'old' && needs.refs.outputs.old || inputs.expected_sha || github.sha }}
          fetch-depth: 0
      - name: Verify comparison target
        env:
          TARGET_SHA: ${{ matrix.side == 'old' && needs.refs.outputs.old || inputs.expected_sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$(git rev-parse "${TARGET_SHA}^{commit}")"
      - name: Detect prediction-regression harness
        id: harness
        shell: bash
        run: |
          if [[ -f python/aisimulate/tools/prediction_regression_gate/collect_static.py ]]; then
            echo "present=true" >> "${GITHUB_OUTPUT}"
          else
            echo "present=false" >> "${GITHUB_OUTPUT}"
          fi
      - uses: actions/setup-python@v7
        if: steps.harness.outputs.present == 'true'
        with:
          python-version: "3.13"
      - name: Configure Python linker path
        if: steps.harness.outputs.present == 'true'
        run: echo "LIBRARY_PATH=${pythonLocation}/lib" >> "${GITHUB_ENV}"
      - name: Install native build toolchain
        if: steps.harness.outputs.present == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends build-essential
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        if: steps.harness.outputs.present == 'true'
      - name: Install AISimulate and development dependencies
        if: steps.harness.outputs.present == 'true'
        run: python -m pip install './python/aisimulate[dev]'
      - name: Collect static, scheduling, and silicon snapshots
        if: steps.harness.outputs.present == 'true'
        working-directory: python/aisimulate
        run: |
          python tools/prediction_regression_gate/collect_static.py \
            --output-dir /tmp/gate-snapshot \
            --jobs "$(nproc)"
          python tools/prediction_regression_gate/run_tier2.py \
            --output-dir /tmp/gate-snapshot
          python tools/accuracy_tracking/run_silicon.py \
            --output-dir /tmp/gate-snapshot
      - name: Record a pre-harness comparison revision
        if: steps.harness.outputs.present != 'true'
        run: |
          mkdir -p /tmp/gate-snapshot
          touch /tmp/gate-snapshot/NO_HARNESS.txt
          echo "::notice::comparison revision predates the prediction-regression harness"
      - name: Upload prediction snapshot
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: prediction-gate-${{ matrix.side }}
          path: /tmp/gate-snapshot
          retention-days: 30

  report:
    name: Prediction Regression Gate
    needs: collect
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fail closed if snapshot collection failed
        if: needs.collect.result != 'success'
        run: |
          echo "::error::prediction snapshot collection result: ${{ needs.collect.result }}"
          exit 1
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.expected_sha || github.sha }}
      - name: Verify exact target
        run: test "$(git rev-parse HEAD)" = "${{ inputs.expected_sha || github.sha }}"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
      - name: Install report dependencies
        run: python -m pip install pyyaml==6.0.3
      - name: Download prediction snapshots
        uses: actions/download-artifact@v8
        with:
          pattern: prediction-gate-*
          path: /tmp/prediction-snapshots
      - name: Compare predictions and enforce the gate
        working-directory: python/aisimulate
        run: |
          python tools/prediction_regression_gate/report.py \
            --old /tmp/prediction-snapshots/prediction-gate-old \
            --new /tmp/prediction-snapshots/prediction-gate-new \
            --report-dir /tmp/prediction-gate-report
      - name: Add report to job summary
        if: always()
        run: |
          if [ -f /tmp/prediction-gate-report/summary.md ]; then
            cat /tmp/prediction-gate-report/summary.md >> "${GITHUB_STEP_SUMMARY}"
          fi
      - name: Upload prediction report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: prediction-regression-gate-report
          path: /tmp/prediction-gate-report
          if-no-files-found: ignore
          retention-days: 30
