#
# Definition of the validator CI for the private mirror ai-dynamo/aisim-data-internal
# (DEP #435, Phase 7, AISIM-2343). It is a TEMPLATE: copy it unchanged to
# .github/workflows/validate.yml in the mirror repository when that repository exists.
# It does not run in this repository (it is outside .github/workflows).
#
# The mirror has the public layout and runs the same validator, from a pinned checkout of
# ai-dynamo/aisim, so a tree the public CI would reject fails here too. Bump
# AISIM_VALIDATOR_REF through a reviewed change; the public dataset CI pins the same SHA.
# No secrets are used: the checkout of the validator is public and the mirror checkout uses
# the workflow's read-only token. The validator never imports code from the mirror.
name: Validate mirror

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

env:
  # Full commit SHA of ai-dynamo/aisim that provides aisim_core.data.mirror.
  AISIM_VALIDATOR_REF: "0000000000000000000000000000000000000000"
  MIRROR_REPO: ai-dynamo/aisim-data-internal

jobs:
  validate:
    if: github.repository == 'ai-dynamo/aisim-data-internal'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the mirror (data only)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: mirror
          persist-credentials: false

      - name: Check out the pinned validator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ai-dynamo/aisim
          ref: ${{ env.AISIM_VALIDATOR_REF }}
          path: validator
          sparse-checkout: python/aisim/src
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Install validator dependencies
        run: pip install pydantic==2.12.5 pyarrow==24.0.0 pyyaml

      - name: Validate with the shared validator
        env:
          PYTHONPATH: validator/python/aisim/src
        run: |
          [[ "${AISIM_VALIDATOR_REF}" =~ ^[0-9a-f]{40}$ && "${AISIM_VALIDATOR_REF}" != 0000* ]] \
            || { echo "::error::AISIM_VALIDATOR_REF must be a real full commit SHA"; exit 1; }
          python -m aisim_core.data.mirror validate \
            --root mirror --repo "${MIRROR_REPO}" --profile mirror \
            --output "${RUNNER_TEMP}/mirror-report.json"

      - name: Summarize
        if: always()
        run: |
          [[ -f "${RUNNER_TEMP}/mirror-report.json" ]] && jq '{ok, validator_fingerprint, configurations, eval_records, findings: (.findings | length)}' \
            "${RUNNER_TEMP}/mirror-report.json" >> "${GITHUB_STEP_SUMMARY}" || true
