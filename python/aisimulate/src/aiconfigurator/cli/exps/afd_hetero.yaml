# AFD heterogeneous pools.
#
# AFD deploys up to three pools:
#
#   * the static prefill pool -- present when afd_combined_with_pd is true
#   * the A pool (attention)  -- memory-bandwidth bound, owns the KV cache
#   * the F pool (FFN/MoE)    -- compute bound
#
# The A pool IS the top-level system_name (it is the primary side and owns the
# KV cache, so "A on different hardware" is spelled by moving the top level).
# Per-pool keys: afd_prefill_system_name / afd_f_system_name. Any key left
# unset inherits the top-level system_name, so exp_homogeneous below behaves
# exactly like a plain AFD run. All pools share the single top-level
# backend_name; a pool on a different system resolves its own latest
# perf-database version. Cross-pool A2F/F2A transfers are priced at the
# slower of the two endpoints (bandwidth = min of both sides).
#
# Pools differ in *hardware only* -- the model and framework are shared.

exps:
- exp_homogeneous
- exp_hetero_a_f
- exp_hetero_prefill

# Baseline: everything on H200. Reference point for the two hetero runs.
exp_homogeneous:
  serving_mode: afd
  model_path: Qwen/Qwen3-32B
  system_name: h200_sxm
  backend_name: sglang
  total_gpus: 32
  isl: 4000
  osl: 1000
  ttft: 4000.0
  tpot: 50.0
  # AFD covers the decode phase only; no static prefill pool in this example.
  afd_combined_with_pd: false

# Keep attention on H200 (large HBM per GPU for the KV cache) and move the
# FFN/MoE pool to B200 (higher FLOPS). This is the pairing AFD hetero exists
# for: the two pools have opposite bottlenecks.
exp_hetero_a_f:
  serving_mode: afd
  model_path: Qwen/Qwen3-32B
  system_name: h200_sxm
  backend_name: sglang
  total_gpus: 32
  isl: 4000
  osl: 1000
  ttft: 4000.0
  tpot: 50.0
  afd_combined_with_pd: false
  afd_f_system_name: b200_sxm

# Only the static prefill pool moves: B200 prefill (high FLOPS for the
# compute-bound context phase) in front of an H200 AFD decode pool. This is the
# AFD analogue of hetero-disagg's B200-prefill + H200-decode split.
exp_hetero_prefill:
  serving_mode: afd
  model_path: Qwen/Qwen3-32B
  system_name: h200_sxm
  backend_name: sglang
  total_gpus: 32
  isl: 4000
  osl: 1000
  ttft: 4000.0
  tpot: 50.0
  afd_combined_with_pd: true
  afd_prefill_system_name: b200_sxm
