name: Build copied-PR platform wheels

on:
  push:
    branches:
      # copy-pr-bot is the approval boundary for privileged pull-request builds.
      - "pull-request/*"
    paths:
      - "Cargo.lock"
      - "Cargo.toml"
      - "crates/**"
      - "python/aisimulate/.github/actions/build-platform-wheel/**"
      - "python/aisimulate/.github/workflows/build-platform-wheels-copied-pr.yml"
      - "python/aisimulate/.github/workflows/validate-platform-wheels.yml"
      - "python/aisimulate/docker/Dockerfile"
      - "python/aisimulate/LICENSE"
      - "python/aisimulate/pyproject.toml"
      - "python/aisimulate/src/**"
      - "python/aisimulate/tools/build_legacy_monolith_fixture.py"
      - "python/aisimulate/tools/verify_installed_package_layers.py"
      - "python/aisimulate/tools/verify_release_wheels.py"

permissions:
  contents: read

jobs:
  build:
    name: Build copied-PR platform wheels
    uses: ./python/aisimulate/.github/workflows/validate-platform-wheels.yml
