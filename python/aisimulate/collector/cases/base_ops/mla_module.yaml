schema_version: 1
op: mla_module
description: Shared collector v2 micro-sweeps for full MLA/DSA module collectors.
common_case_values:
  mla_module:
    batch_sizes:
      - 1
      - 2
      - 4
      - 8
      - 16
      - 32
      - 64
      - 128
      - 256
      - 512
      - 1024
    sequence_lengths:
      - 1
      - 4
      - 8
      - 16
      - 32
      - 64
      - 128
      - 256
      - 512
      - 1024
      - 2048
      - 4096
      - 8192
      - 16384
    inner_sweep_head_counts:
      - 128
      - 64
      - 32
      - 16
      - 8
    module_tp_sizes:
      - 1
    module_precision_combos:
      - compute_dtype: bfloat16
        kv_cache_dtype: bfloat16
        gemm_type: bfloat16
    context:
      max_tokens: 131072
      large_sequence_min: 8192
      large_sequence_max_batch_size: 8
    generation:
      max_tokens: 262144
      large_sequence_min: 8192
      large_sequence_max_batch_size: 16
    constraints:
      - 'context: batch_size * sequence_length <= 131072'
      - 'context: sequence_length >= 8192 requires batch_size <= 8'
      - 'generation: batch_size * sequence_length <= 262144'
      - 'generation: sequence_length >= 8192 requires batch_size <= 16'
    # top_level_head_counts keep ModelRunner-loading subprocess counts manageable.
  # The sweep the module op plans (collector/op_plans.py) share across backends:
  # the MLA and DSA context and generation modules. collector/skips.py leaves
  # out what a backend or SM does not run. The per-backend sections below serve
  # the module ops still on their own getters.
  mla_module_plan:
    description: Shared MLA and DSA module sweep of the op plans.
    context_batch_sizes: [1, 2, 4, 8, 16, 32, 64, 128, 256]
    context_sequence_lengths: [1, 16, 32, 64, 128, 256, 512, 1024, 1536, 2048, 3072, 4096, 6144, 8192, 10240, 12288, 16384, 32768]
    generation_batch_sizes: [1, 2, 4, 8, 16, 32, 64, 128, 256, 512, 1024]
    generation_sequence_lengths: [2, 4, 8, 16, 32, 64, 128, 256, 512, 1024, 2048, 4096, 8192, 16384, 32768, 65536, 131072]
    # Per-rank heads of the canonical DeepSeek-V3 module: its TP shards (128 to
    # 1) and Kimi-K3's (96, 48, 24, 12).
    head_counts: [128, 96, 64, 48, 32, 24, 16, 12, 8, 4, 2, 1]
    module_precision_combos:
      - {compute_dtype: bfloat16, kv_cache_dtype: bfloat16, gemm_type: bfloat16, attention_types: [mla, dsa]}
      - {compute_dtype: bfloat16, kv_cache_dtype: fp8, gemm_type: bfloat16, attention_types: [mla, dsa]}
      - {compute_dtype: fp8, kv_cache_dtype: fp8, gemm_type: bfloat16, phases: [context], attention_types: [mla]}
      - {compute_dtype: bfloat16, kv_cache_dtype: bfloat16, gemm_type: fp8_block, attention_types: [mla, dsa]}
      - {compute_dtype: bfloat16, kv_cache_dtype: fp8, gemm_type: fp8_block, attention_types: [mla, dsa]}
      - {compute_dtype: fp8, kv_cache_dtype: fp8, gemm_type: fp8_block, phases: [context], attention_types: [mla]}
      - {compute_dtype: bfloat16, kv_cache_dtype: bfloat16, gemm_type: nvfp4, attention_types: [mla, dsa]}
      - {compute_dtype: bfloat16, kv_cache_dtype: fp8, gemm_type: nvfp4, attention_types: [mla, dsa]}
      - {compute_dtype: fp8, kv_cache_dtype: fp8, gemm_type: nvfp4, phases: [context], attention_types: [mla]}
    context:
      max_tokens: 131072
      # DSA context follows serving's chunked prefill. A forward takes at most
      # dsa_chunk_prefill_size new tokens (batch x isl) and dsa_max_full_sequence_length
      # KV tokens (batch x (isl + prefix)), and the long context enters through the
      # prefix. A point also stays within the model's max_position_embeddings.
      dsa_chunk_prefill_size: 16384
      dsa_max_full_sequence_length: 1048576
      # Prefix anchors at x2 spacing, to GLM-5.2's 1M context. 2048 is the
      # index_topk of DeepSeek-V3.2 and GLM-5.x: the sparse attention cost turns
      # nearly linear in the prefix above it.
      dsa_prefix_lengths: [0, 512, 1024, 2048, 4096, 8192, 16384, 32768, 65536, 131072, 262144, 524288, 1048575]
      # From this prefix on, only the sequence lengths serving's chunked prefill
      # issues there: full chunks and a partial one.
      dsa_long_prefix_min: 16384
      dsa_long_prefix_sequence_lengths: [1, 512, 2048, 8192, 16384]
    generation:
      max_tokens: 33554432
      # DSA decode beyond the generation grid, to GLM-5.2's context, at small batch.
      dsa_long_kv_lengths: [262144, 524288, 1048575]
      dsa_long_kv_batch_sizes: [1, 2, 4]
  mla_module_sglang:
    description: SGLang MLA, MSA and GLM-5 sparse-kernel module sweep.
    module_tp_sizes:
      - 1
      - 2
      - 4
      - 8
    module_precision_combos:
      - compute_dtype: bfloat16
        kv_cache_dtype: bfloat16
        gemm_type: bfloat16
      - compute_dtype: bfloat16
        kv_cache_dtype: fp8
        gemm_type: bfloat16
        min_sm: 90
      # fp8_block projections exist for MLA checkpoints only; the M3 (msa)
      # BF16 artifact has no quantized projections in SGLang serving (its
      # quantized-M3 flow is MXFP8) — scope these away from msa at the
      # declaration instead of filtering in the collector.
      - compute_dtype: bfloat16
        kv_cache_dtype: bfloat16
        gemm_type: fp8_block
        min_sm: 89
        attention_types: [mla]
      - compute_dtype: bfloat16
        kv_cache_dtype: fp8
        gemm_type: fp8_block
        min_sm: 90
        attention_types: [mla]
    context_sequence_lengths:
      - 1
      - 4
      - 8
      - 16
      - 32
      - 64
      - 128
      - 256
      - 512
      - 1024
      - 2048
      - 4096
      - 8192
      - 16384
    generation_sequence_lengths:
      - 1
      - 4
      - 8
      - 16
      - 32
      - 64
      - 128
      - 256
      - 512
      - 1024
      - 2048
      - 4096
      - 8192
      - 16384
      - 32768
      - 65536
      - 131072
    context:
      max_tokens: 131072
      large_sequence_min: 8192
      large_sequence_max_batch_size: 8
      prefix_lengths:
        - 0
        - 1
        - 4
        - 8
        - 16
        - 32
        - 64
        - 128
        - 256
        - 512
        - 1024
        - 1536
        - 2048
        - 3072
        - 4096
        - 6144
        - 8192
        - 10000
        - 10240
        - 12288
        - 16384
        - 32768
        - 65536
        - 131072
        - 262144
        - 524288
        - 1000000
        - 1048575
    generation:
      # max_tokens is the MLA/DSA collectors' decode memory contract
      # (b*kv <= 256K; their guard tests pin it). The MSA decode sweep needs
      # the large-batch x long-kv corner, so it carries its own budget below
      # (2026-08-09 raise, spot-measured on hardware; documented in the
      # b200_sxm msa collection_meta coverage note) — scoped to msa so the
      # MLA/DSA plans keep their contract.
      max_tokens: 262144
      msa_max_tokens: 33554432
      large_sequence_min: 8192
      large_sequence_max_batch_size: 1024
  mla_module_trtllm:
    description: TRT-LLM MSA module micro-benchmark sweep.
    # Declared TRT-LLM module precision policy (review 4969690316 S4: the
    # collectors consume these specs instead of re-implementing SM gates in
    # Python). MSA (MiniMax-M3, 1.3.0rc23): attention/KV are bf16-only end to
    # end (sparse backend gathers K/V in the cache dtype, index-K side cache is
    # bf16 — collect_msa_module docstring citations); the projection GEMM
    # sweeps bf16 everywhere, fp8_block from SM89 (Ada/Hopper/Blackwell
    # blockwise-FP8 path), nvfp4 from SM100.
    module_precision_combos:
      - compute_dtype: bfloat16
        kv_cache_dtype: bfloat16
        gemm_type: bfloat16
        attention_types: [msa]
      - compute_dtype: bfloat16
        kv_cache_dtype: bfloat16
        gemm_type: fp8_block
        min_sm: 89
        attention_types: [msa]
      - compute_dtype: bfloat16
        kv_cache_dtype: bfloat16
        gemm_type: nvfp4
        min_sm: 100
        attention_types: [msa]
    context_batch_sizes:
      - 1
      - 2
      - 4
      - 8
      - 16
      - 32
      - 64
      - 128
      - 256
    context_sequence_lengths:
      - 1
      - 16
      - 32
      - 64
      - 128
      - 256
      - 512
      - 1024
      - 1536
      - 2048
      - 3072
      - 4096
      - 6144
      - 8192
      - 10240
      - 12288
      - 16384
      - 32768
    generation_batch_sizes:
      - 1
      - 2
      - 4
      - 8
      - 16
      - 32
      - 64
      - 128
      - 256
      - 512
      - 1024
    generation_sequence_lengths:
      - 2
      - 4
      - 8
      - 16
      - 32
      - 64
      - 128
      - 256
      - 512
      - 1024
      - 2048
      - 4096
      - 8192
      - 16384
      - 32768
      - 65536
      - 131072
    context:
      max_tokens: 131072
      # MSA (MiniMax-M3) on TRT-LLM has two implementations: the fmha_sm100
      # kernels (implementation="msa", SM100/103 only — msa_availability.py
      # ensure_msa_available@1.3.0rc29 raises everywhere else, SM120 included)
      # and the Triton reference (implementation="triton", the only path on
      # SM89/SM90/SM120). The reference computes the block-sparse GQA as a
      # masked DENSE FP32 attention with per-query K/V expansion
      # (triton_backend.py:_sparse_gqa_masked@1.3.0rc29), so its context cost
      # is quadratic per sequence: 64 heads, isl 32768, b=1 takes 24.5 s per
      # forward on rtxpro6000 and 18 s on h200_sxm (fmha_sm100 on gb200: 9 ms),
      # and b*isl=131072 OOMs on the unchunked FP32 index-score slab (64 GiB).
      # Owner decision 2026-10-11: on the Triton reference path cap context at
      # batch*isl <= 32768 (isl 32768 itself stays, at b=1); the fmha_sm100
      # systems keep the shared 131072. Applied by collect_msa_module's
      # context getter where the collector resolves implementation="triton";
      # re-verify on every TRT-LLM version bump (a real sparse prefill kernel
      # for these SMs lifts it).
      msa_triton_max_tokens: 32768
      prefix_lengths:
        - 0
        - 128
    generation:
      max_tokens: 33554432
  mla_module_vllm:
    description: vLLM MSA module micro-benchmark sweep.
    context_batch_sizes:
      - 1
      - 2
      - 4
      - 8
      - 16
      - 32
      - 64
      - 128
      - 256
    context_sequence_lengths:
      - 1
      - 16
      - 32
      - 64
      - 128
      - 256
      - 512
      - 1024
      - 1536
      - 2048
      - 3072
      - 4096
      - 6144
      - 8192
      - 10240
      - 12288
      - 16384
      - 32768
    generation_batch_sizes:
      - 1
      - 2
      - 4
      - 8
      - 16
      - 32
      - 64
      - 128
      - 256
      - 512
      - 1024
    generation_sequence_lengths:
      - 2
      - 4
      - 8
      - 16
      - 32
      - 64
      - 128
      - 256
      - 512
      - 1024
      - 2048
      - 4096
      - 8192
      - 16384
      - 32768
      - 65536
      - 131072
    module_precision_combos:
      # MSA (MiniMax-M3) precision policy — declared here so the collector
      # consumes YAML instead of re-implementing SM gates (review 4969690316
      # S4). vLLM's M3 sparse backend accepts an fp8 (e4m3) main KV cache on
      # EVERY SM this op runs on (supported_kv_cache_dtypes, common/
      # sparse_attention.py:56-62@v0.24.0; Triton in-kernel dequant off the
      # SM100 family, MSA attend on it), so fp8-KV carries no SM floor.
      # GEMM tiers: fp8_block from SM89
      # (blockwise-FP8 checkpoint path), nvfp4 from SM100 (ModelOpt NVFP4),
      # both through the generic linear quant dispatch.
      - compute_dtype: bfloat16
        kv_cache_dtype: bfloat16
        gemm_type: bfloat16
        attention_types: [msa]
      - compute_dtype: bfloat16
        kv_cache_dtype: fp8
        gemm_type: bfloat16
        attention_types: [msa]
      - compute_dtype: bfloat16
        kv_cache_dtype: bfloat16
        gemm_type: fp8_block
        min_sm: 89
        attention_types: [msa]
      - compute_dtype: bfloat16
        kv_cache_dtype: fp8
        gemm_type: fp8_block
        min_sm: 89
        attention_types: [msa]
      - compute_dtype: bfloat16
        kv_cache_dtype: bfloat16
        gemm_type: nvfp4
        min_sm: 100
        attention_types: [msa]
      - compute_dtype: bfloat16
        kv_cache_dtype: fp8
        gemm_type: nvfp4
        min_sm: 100
        attention_types: [msa]
    context:
      max_tokens: 131072
      prefix_lengths:
        - 0
        - 128
    generation:
      max_tokens: 33554432
