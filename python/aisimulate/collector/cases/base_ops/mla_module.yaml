schema_version: 1
op: mla_module
description: Shared collector v2 micro-sweeps for full MLA/DSA module collectors.
common_case_values:
  mla_module:
    batch_sizes:
      - 1
      - 2
      - 4
      - 8
      - 16
      - 32
      - 64
      - 128
      - 256
      - 512
      - 1024
    sequence_lengths:
      - 1
      - 4
      - 8
      - 16
      - 32
      - 64
      - 128
      - 256
      - 512
      - 1024
      - 2048
      - 4096
      - 8192
      - 16384
    inner_sweep_head_counts:
      - 128
      - 64
      - 32
      - 16
      - 8
    module_tp_sizes:
      - 1
    module_precision_combos:
      - compute_dtype: bfloat16
        kv_cache_dtype: bfloat16
        gemm_type: bfloat16
    context:
      max_tokens: 131072
      large_sequence_min: 8192
      large_sequence_max_batch_size: 8
    generation:
      max_tokens: 262144
      large_sequence_min: 8192
      large_sequence_max_batch_size: 16
    constraints:
      - 'context: batch_size * sequence_length <= 131072'
      - 'context: sequence_length >= 8192 requires batch_size <= 8'
      - 'generation: batch_size * sequence_length <= 262144'
      - 'generation: sequence_length >= 8192 requires batch_size <= 16'
    # top_level_head_counts keep ModelRunner-loading subprocess counts manageable.
  # The sweep the module op plans (collector/op_plans.py) share across backends:
  # the MLA, DSA and MSA context and generation modules. collector/skips.py
  # leaves out what a backend or SM does not run. The SGLang section below
  # serves the SGLang MLA module collector's direct runs.
  mla_module_plan:
    description: Shared MLA, DSA and MSA module sweep of the op plans.
    context_batch_sizes: [1, 2, 4, 8, 16, 32, 64, 128, 256]
    context_sequence_lengths: [1, 16, 32, 64, 128, 256, 512, 1024, 1536, 2048, 3072, 4096, 6144, 8192, 10240, 12288, 16384, 32768]
    generation_batch_sizes: [1, 2, 4, 8, 16, 32, 64, 128, 256, 512, 1024]
    generation_sequence_lengths: [2, 4, 8, 16, 32, 64, 128, 256, 512, 1024, 2048, 4096, 8192, 16384, 32768, 65536, 131072]
    # Per-rank heads of the canonical DeepSeek-V3 module: its TP shards (128 to
    # 1) and Kimi-K3's (96, 48, 24, 12).
    head_counts: [128, 96, 64, 48, 32, 24, 16, 12, 8, 4, 2, 1]
    module_precision_combos:
      - {compute_dtype: bfloat16, kv_cache_dtype: bfloat16, gemm_type: bfloat16, attention_types: [mla, dsa, msa]}
      - {compute_dtype: bfloat16, kv_cache_dtype: fp8, gemm_type: bfloat16, attention_types: [mla, dsa, msa]}
      - {compute_dtype: fp8, kv_cache_dtype: fp8, gemm_type: bfloat16, phases: [context], attention_types: [mla]}
      - {compute_dtype: bfloat16, kv_cache_dtype: bfloat16, gemm_type: fp8_block, attention_types: [mla, dsa, msa]}
      - {compute_dtype: bfloat16, kv_cache_dtype: fp8, gemm_type: fp8_block, attention_types: [mla, dsa, msa]}
      - {compute_dtype: fp8, kv_cache_dtype: fp8, gemm_type: fp8_block, phases: [context], attention_types: [mla]}
      - {compute_dtype: bfloat16, kv_cache_dtype: bfloat16, gemm_type: nvfp4, attention_types: [mla, dsa, msa]}
      - {compute_dtype: bfloat16, kv_cache_dtype: fp8, gemm_type: nvfp4, attention_types: [mla, dsa, msa]}
      - {compute_dtype: fp8, kv_cache_dtype: fp8, gemm_type: nvfp4, phases: [context], attention_types: [mla]}
    context:
      max_tokens: 131072
      # DSA and MSA context follow serving's chunked prefill. A forward takes at
      # most chunk_prefill_size new tokens (batch x isl) and max_full_sequence_length
      # KV tokens (batch x (isl + prefix)), and the long context enters through the
      # prefix. A point also stays within the model's max_position_embeddings.
      chunk_prefill_size: 16384
      max_full_sequence_length: 1048576
      # Prefix anchors to the 1M context of GLM-5.2 and MiniMax-M3, x2 apart from
      # 16k on and 1.25-1.5x apart from 1k to 16k. 2048 is the tokens a query
      # attends to in DeepSeek-V3.2 and GLM-5.x (index_topk) and in MiniMax-M3
      # (16 top-k blocks of 128): the cost bends where prefix + isl crosses it.
      # Leaving one prefix out of the vLLM 0.30.0 DSA tables (B200, H200) and
      # interpolating it with the SDK: x2 spacing from 1k to 16k missed by more
      # than 10% on 11-13% of the points (p90 13-16%); 1536, 3072, 6144, 10240
      # and 12288 keep that region as dense as those tables. Every sequence length
      # runs at every prefix: a subset at prefixes from 16k on (chunk sizes and
      # short turns only) missed by more than 10% on 10-12% of the points. Prefix
      # 1 marks the step from no cached context to some: a 1-256 token prefix
      # costs 5-7.5% more than prefix 0 at isl 1k-2k, which interpolating from 0
      # to 512 underpredicts; between 1 and 512 the p90 error is 1-4%.
      prefix_lengths: [0, 1, 512, 1024, 1536, 2048, 3072, 4096, 6144, 8192, 10240, 12288, 16384, 32768, 65536, 131072, 262144, 524288, 1048575]
    generation:
      max_tokens: 33554432
      # DSA and MSA decode beyond the generation grid, to the 1M context, at small batch.
      long_kv_lengths: [262144, 524288, 1048575]
      long_kv_batch_sizes: [1, 2, 4]
  mla_module_sglang:
    description: SGLang MLA module sweep of the collector's direct runs.
    module_tp_sizes:
      - 1
      - 2
      - 4
      - 8
    module_precision_combos:
      - compute_dtype: bfloat16
        kv_cache_dtype: bfloat16
        gemm_type: bfloat16
      - compute_dtype: bfloat16
        kv_cache_dtype: fp8
        gemm_type: bfloat16
        min_sm: 90
      # fp8_block projections exist for MLA checkpoints only.
      - compute_dtype: bfloat16
        kv_cache_dtype: bfloat16
        gemm_type: fp8_block
        min_sm: 89
        attention_types: [mla]
      - compute_dtype: bfloat16
        kv_cache_dtype: fp8
        gemm_type: fp8_block
        min_sm: 90
        attention_types: [mla]
    context_sequence_lengths:
      - 1
      - 4
      - 8
      - 16
      - 32
      - 64
      - 128
      - 256
      - 512
      - 1024
      - 2048
      - 4096
      - 8192
      - 16384
    generation_sequence_lengths:
      - 1
      - 4
      - 8
      - 16
      - 32
      - 64
      - 128
      - 256
      - 512
      - 1024
      - 2048
      - 4096
      - 8192
      - 16384
      - 32768
      - 65536
      - 131072
    context:
      max_tokens: 131072
      large_sequence_min: 8192
      large_sequence_max_batch_size: 8
      prefix_lengths:
        - 0
        - 1
        - 4
        - 8
        - 16
        - 32
        - 64
        - 128
        - 256
        - 512
        - 1024
        - 1536
        - 2048
        - 3072
        - 4096
        - 6144
        - 8192
        - 10000
        - 10240
        - 12288
        - 16384
        - 32768
        - 65536
        - 131072
        - 262144
        - 524288
        - 1000000
        - 1048575
    generation:
      max_tokens: 262144
      large_sequence_min: 8192
      large_sequence_max_batch_size: 1024
