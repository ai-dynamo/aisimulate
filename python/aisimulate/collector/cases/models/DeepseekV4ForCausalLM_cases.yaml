schema_version: 1
architecture: DeepseekV4ForCausalLM
model_path: sgl-project/DeepSeek-V4-Flash-FP8
model_paths:
  - deepseek-ai/DeepSeek-V4-Flash
  - deepseek-ai/DeepSeek-V4-Pro
  - sgl-project/DeepSeek-V4-Flash-FP8
  - sgl-project/DeepSeek-V4-Pro-FP8
  - nvidia/DeepSeek-V4-Flash-NVFP4
  - nvidia/DeepSeek-V4-Pro-NVFP4
include_base: true
base_ops:
  - gemm
description: >
  DeepSeek-V4 model-centric collection plan. DSV4 attention and sparse kernel
  cases use the upstream DeepSeek-V4 op names and can target any listed V4
  model path; shared mHC and MoE cases cover the V4 family.

model_case_values:
  gemm:
    # Shared-expert MLP geometry: hidden=7168, intermediate=3072, TP=1/2/4/8.
    # Keep up/gate and down projections as separate correlated rows. In
    # particular (N,K)=(7168,384) is absent from the generic feature grid.
    - model_path: deepseek-ai/DeepSeek-V4-Pro
      model_aliases:
        - sgl-project/DeepSeek-V4-Pro-FP8
        - nvidia/DeepSeek-V4-Pro-NVFP4
      output_feature_sizes: [768, 1536, 3072, 6144]
      input_feature_sizes: [7168]
    - model_path: deepseek-ai/DeepSeek-V4-Pro
      model_aliases:
        - sgl-project/DeepSeek-V4-Pro-FP8
        - nvidia/DeepSeek-V4-Pro-NVFP4
      output_feature_sizes: [7168]
      input_feature_sizes: [384, 768, 1536, 3072]
  moe:
    - model_path: deepseek-ai/DeepSeek-V4-Flash
      hidden_size: 4096
      inter_size: 2048
      topk: 6
      num_experts: 256
      sglang_moe_swiglu_limit: 10.0
      sglang_moe_scoring_func: sqrtsoftplus
      sglang_moe_routing_method_type: DeepSeekV3
      sglang_moe_routed_scaling_factor: 1.5
      sglang_moe_renormalize: true
      sglang_moe_has_correction_bias: true
      sglang_moe_backends:
        w4a8_mxfp4_mxfp8: {100: flashinfer_mxfp4, 103: flashinfer_mxfp4}
      wideep: true
      # Native-FP4 checkpoint: MXFP4 routed experts, served with MXFP8
      # activations (trtllm-gen) on the SM100 family. The label's floor is
      # SM100 (collector/skips.py); below it serving runs the experts as W4A16,
      # a different label this row does not plan.
      quantization_modes: [w4a8_mxfp4_mxfp8]
    - model_path: sgl-project/DeepSeek-V4-Flash-FP8
      hidden_size: 4096
      inter_size: 2048
      topk: 6
      num_experts: 256
      sglang_moe_swiglu_limit: 10.0
      sglang_moe_scoring_func: sqrtsoftplus
      sglang_moe_routing_method_type: DeepSeekV3
      sglang_moe_routed_scaling_factor: 1.5
      sglang_moe_renormalize: true
      sglang_moe_has_correction_bias: true
      wideep: true
      # vLLM: the artifact config omits expert_dtype and vLLM defaults it to
      # FP4, but vLLM 0.24's DeepSeek-V4 quant config has a native
      # fp8-expert branch — serving works with the documented override
      # `--hf-overrides '{"expert_dtype": "fp8"}'` (models/deepseek_v4/
      # quant_config.py). The benchmark constructs Fp8Config from
      # the label with synthetic weights, matching that serving path.
      quantization_modes: [fp8_block]
    - model_path: deepseek-ai/DeepSeek-V4-Pro
      hidden_size: 7168
      inter_size: 3072
      topk: 6
      num_experts: 384
      sglang_moe_swiglu_limit: 10.0
      sglang_moe_scoring_func: sqrtsoftplus
      sglang_moe_routing_method_type: DeepSeekV3
      sglang_moe_routed_scaling_factor: 2.5
      sglang_moe_renormalize: true
      sglang_moe_has_correction_bias: true
      sglang_moe_backends:
        w4a8_mxfp4_mxfp8: {100: flashinfer_mxfp4, 103: flashinfer_mxfp4}
      wideep: true
      # Owner decision: do not collect the native-FP4 Pro
      # artifact as w4a16_mxfp4. The shared SM90 w4a16 backend map is
      # triton (GPT-OSS truth), under which SGLang 0.5.14 constructs plain
      # Fp8MoEMethod for is_fp4_experts and every case fails closed;
      # SM100/103 production scheduling uses the w4a8 TRTLLM-gen path
      # kept below. To restore support, re-add w4a16_mxfp4 here and pin
      # sglang_moe_backends w4a16_mxfp4 {90: flashinfer_mxfp4} (the native
      # cutlass mixed-input path, FlashInfer #3084). Otherwise as the native
      # Flash row above.
      quantization_modes: [w4a8_mxfp4_mxfp8]
    - model_path: sgl-project/DeepSeek-V4-Pro-FP8
      hidden_size: 7168
      inter_size: 3072
      topk: 6
      num_experts: 384
      sglang_moe_swiglu_limit: 10.0
      sglang_moe_scoring_func: sqrtsoftplus
      sglang_moe_routing_method_type: DeepSeekV3
      sglang_moe_routed_scaling_factor: 2.5
      sglang_moe_renormalize: true
      sglang_moe_has_correction_bias: true
      wideep: true
      # See the Flash converted-artifact note above (same expert_dtype
      # omission; same `--hf-overrides` serving path).
      quantization_modes: [fp8_block]
    - model_path: nvidia/DeepSeek-V4-Flash-NVFP4
      hidden_size: 4096
      inter_size: 2048
      topk: 6
      num_experts: 256
      sglang_moe_swiglu_limit: 10.0
      sglang_moe_scoring_func: sqrtsoftplus
      sglang_moe_routing_method_type: DeepSeekV3
      sglang_moe_routed_scaling_factor: 1.5
      sglang_moe_renormalize: true
      sglang_moe_has_correction_bias: true
      wideep: true
      # Real ModelOpt export (nvidia/DeepSeek-V4-Flash-NVFP4, verified via its
      # published config.json/hf_quant_config.json): quant_algo
      # MIXED_PRECISION, routed-expert layers at NVFP4 (moe_quant_algo
      # NVFP4), attention/shared-experts/head/mtp excluded. This is a new,
      # quant-distinct artifact row (case_authoring.md) — never merged into
      # the deepseek-ai/DeepSeek-V4-Flash row above. vLLM times the generic
      # CompressedTensorsConfig nvfp4-pack-quantized path
      # (collector/vllm/collect_moe.py moe_type == "nvfp4"); no
      # DeepSeek-V4-specific dispatch is needed.
      # SGLang serves this hybrid FP8 + NVFP4 checkpoint (nvfp4_moe_meta,
      # configs/model_config.py:774-794) on flashinfer_trtllm_routed
      # (arg_groups/model_overrides/deepseek_v4.py:66-74 at v0.5.23).
      sglang_moe_backends:
        nvfp4: {100: flashinfer_trtllm_routed, 103: flashinfer_trtllm_routed}
      quantization_modes: [nvfp4]
    - model_path: nvidia/DeepSeek-V4-Pro-NVFP4
      hidden_size: 7168
      inter_size: 3072
      topk: 6
      num_experts: 384
      sglang_moe_swiglu_limit: 10.0
      sglang_moe_scoring_func: sqrtsoftplus
      sglang_moe_routing_method_type: DeepSeekV3
      sglang_moe_routed_scaling_factor: 2.5
      sglang_moe_renormalize: true
      sglang_moe_has_correction_bias: true
      wideep: true
      # See the Flash-NVFP4 note above (same real ModelOpt MIXED_PRECISION
      # export shape, verified against nvidia/DeepSeek-V4-Pro-NVFP4's own
      # published config.json/hf_quant_config.json).
      # SGLang serves this hybrid FP8 + NVFP4 checkpoint (nvfp4_moe_meta,
      # configs/model_config.py:774-794) on flashinfer_trtllm_routed
      # (arg_groups/model_overrides/deepseek_v4.py:66-74 at v0.5.23).
      sglang_moe_backends:
        nvfp4: {100: flashinfer_trtllm_routed, 103: flashinfer_trtllm_routed}
      quantization_modes: [nvfp4]
  mhc:
    - model_paths:
        - deepseek-ai/DeepSeek-V4-Flash
        - sgl-project/DeepSeek-V4-Flash-FP8
      hidden_size: 4096
      hc_mult: 4
    - model_paths:
        - deepseek-ai/DeepSeek-V4-Pro
        - sgl-project/DeepSeek-V4-Pro-FP8
      hidden_size: 7168
      hc_mult: 4
  dsv4:
    # Module tables key [native][local], so full/raw plans
    # collect Flash and Pro together (distinct native head counts cannot
    # collide). Artifacts stay uniform (sgl-project FP8 builds, matching every
    # shipped module table) because the persisted module key carries no
    # artifact dimension — one artifact per geometry per plan; Blackwell
    # platform-native collection uses targeted deepseek-ai/* runs. The first
    # entry is the canonical artifact (manual-CLI default model).
    # collector/skips.py keeps the top-k calibration on the Flash artifact.
    # nvidia/DeepSeek-V4-{Flash,Pro}-NVFP4 are deliberately NOT
    # listed for module collection at all: the module gemm_type sweep is
    # bfloat16/fp8_block only (module_gemm_types below), and the persisted
    # module key carries no artifact dimension — so even a targeted run
    # against these paths could only stamp rows with a label that
    # misrepresents the artifact ("cases that carry the wrong identity are
    # worse than no cases", case_authoring.md). They join
    # supported_model_paths together with the collector gemm-label work.
    default_model_paths:
      - sgl-project/DeepSeek-V4-Flash-FP8
      - sgl-project/DeepSeek-V4-Pro-FP8
    supported_model_paths:
      - deepseek-ai/DeepSeek-V4-Flash
      - deepseek-ai/DeepSeek-V4-Pro
      - sgl-project/DeepSeek-V4-Flash-FP8
      - sgl-project/DeepSeek-V4-Pro-FP8
    attention_kinds:
      - csa
      - hca
    # The module plans (collector/op_plans.py). Projection GEMMs: fp8_block is
    # the checkpoints' own, bfloat16 the BF16-projection modules SGLang
    # collects (collector/skips.py keeps each backend's set). Context points
    # follow the shared long-context grid (mla_module_plan in
    # cases/base_ops/mla_module.yaml); decode points are module_batch_sizes x
    # module_sequence_lengths within the decode budget of
    # cases/base_ops/dsv4_attention.yaml.
    module_gemm_types:
      - bfloat16
      - fp8_block
    module_batch_sizes:
      - 1
      - 2
      - 4
      - 8
      - 16
      - 32
      - 64
      - 128
      - 256
      - 512
      - 1024
    module_sequence_lengths:
      - 1
      - 4
      - 8
      - 16
      - 32
      - 64
      - 128
      - 256
      - 512
      - 1024
      - 1536
      - 2048
      - 3072
      - 4096
      - 6144
      - 8192
      - 10240
      - 12288
      - 16384
      - 32768
      - 65536
      - 131072
      - 262144
      - 524288
      - 1048575
    module_tp_sizes:
      - 1
      - 2
      - 4
      - 8
    # The paged MQA logits kernel (the CSA indexer's scoring GEMM): batch x
    # isl within sparse_chunk_prefill_size and batch x (isl + past KV) within
    # sparse_max_full_sequence_length.
    sparse_batch_sizes:
      - 1
      - 2
      - 4
      - 8
      - 16
      - 32
      - 64
      - 128
      - 256
      - 512
      - 1024
    sparse_input_lengths:
      - 1
      - 4
      - 8
      - 16
      - 32
      - 64
      - 128
      - 256
      - 512
      - 1024
      - 1536
      - 2048
      - 3072
      - 4096
      - 6144
      - 8192
    sparse_past_kv_lengths:
      - 0
      - 1
      - 4
      - 8
      - 16
      - 32
      - 64
      - 128
      - 256
      - 512
      - 1024
      - 1536
      - 2048
      - 3072
      - 4096
      - 6144
      - 8192
      - 10240
      - 12288
      - 16384
      - 32768
      - 65536
      - 131072
      - 262144
      - 524288
      - 1048575
    sparse_chunk_prefill_size: 8192
    sparse_max_full_sequence_length: 1048576
    sparse_tp_sizes:
      paged_mqa_logits:
        - 1

all_frameworks_op_cases:
  moe:
    cases: all

framework_specific_op_cases:
  sglang:
    dsv4_csa_context_module:
      cases: all
    dsv4_hca_context_module:
      cases: all
    dsv4_csa_generation_module:
      cases: all
    dsv4_hca_generation_module:
      cases: all
    # topK DELTA calibration on the CSA module plan's points (v1 top-k on the
    # context points, v2 on the decode points) of each planned checkpoint.
    dsv4_csa_topk_calib:
      cases: all
    # paged_mqa_logits IS consumed: it is the only sparse-kernel sidecar with a
    # live SDK query path (sdk/operations/dsv4.py: the CP chunk walk loads
    # PerfDataFilename.dsv4_paged_mqa_logits_module) and every shipped platform
    # carries the table. The b200 shard run lost it because this
    # file still called it experimental (job 469988017). The hca_attn /
    # csa_attn sidecars were removed from the collector and SDK:
    # their SDK readers had been retired (csa_attn never shipped data) and the
    # registry-only ops failed every sm100 shard plan generated from the
    # registry.
    dsv4_paged_mqa_logits_module:
      cases: all
    mhc_module:
      cases: all
  vllm:
    # These four full-module paths are consumed by the production DSV4 model.
    # hca_attn / csa_attn were removed (see the sglang note above);
    # paged_mqa_logits is consumed (see the sglang note above) and shipped for
    # vllm 0.24/0.25. mHC is scheduled again: the SDK queries
    # mhc pre/post rows on every backend, collector/vllm/collect_mhc_module.py
    # measures vLLM's own mhc_pre_tilelang / mhc_post_tilelang (qualified on
    # B200 0.25, shipped 0.22/0.24/0.25) and documents why pre(no-norm)+post
    # tracks serving's fused post+pre+norm boundary within 1-2%; the earlier
    # "contract does not represent the fused TileLang path" note predated that
    # measurement. Without this row vLLM 0.30 priced mHC from the 0.25 table
    # through the nearest-earlier fallback.
    dsv4_csa_context_module:
      cases: all
    dsv4_hca_context_module:
      cases: all
    dsv4_csa_generation_module:
      cases: all
    dsv4_hca_generation_module:
      cases: all
    dsv4_paged_mqa_logits_module:
      cases: all
    mhc_module:
      cases: all
  trtllm:
    # The SDK DeepSeekV4 model queries mhc pre/post rows on every backend
    # (src/aisimulate_core/sdk/models/deepseek_v4.py DeepSeekV4MHCModule);
    # collector/trtllm/collect_mhc_module.py times them on sites built by
    # serving's DeepseekV4DecoderLayer._make_mhc (its docstring holds the
    # fused_hc deviation note) — schedule it.
    mhc_module:
      cases: all
    # The four DSV4 attention module tables the SDK queries on every backend.
    # collector/trtllm/collect_dsv4_attn.py
    # requires trtllm>=1.3.0rc21 (__compat__); TRT-LLM rejects pre-Blackwell
    # GPUs inside the module forward, which surfaces as classified failures
    # on SM<100 systems rather than being pre-gated here.
    dsv4_csa_context_module:
      cases: all
    dsv4_hca_context_module:
      cases: all
    dsv4_csa_generation_module:
      cases: all
    dsv4_hca_generation_module:
      cases: all
