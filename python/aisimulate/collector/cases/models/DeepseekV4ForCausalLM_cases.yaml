schema_version: 1
architecture: DeepseekV4ForCausalLM
model_path: sgl-project/DeepSeek-V4-Flash-FP8
model_paths:
  - deepseek-ai/DeepSeek-V4-Flash
  - deepseek-ai/DeepSeek-V4-Pro
  - sgl-project/DeepSeek-V4-Flash-FP8
  - sgl-project/DeepSeek-V4-Pro-FP8
  - nvidia/DeepSeek-V4-Flash-NVFP4
  - nvidia/DeepSeek-V4-Pro-NVFP4
include_base: true
base_ops:
  - gemm
description: >
  DeepSeek-V4 model-centric collection plan. DSV4 attention and sparse kernel
  cases use the upstream DeepSeek-V4 op names and can target any listed V4
  model path; shared mHC and MoE cases cover the V4 family.

model_case_values:
  gemm:
    # Shared-expert MLP geometry: hidden=7168, intermediate=3072, TP=1/2/4/8.
    # Keep up/gate and down projections as separate correlated rows. In
    # particular (N,K)=(7168,384) is absent from the generic feature grid.
    - model_path: deepseek-ai/DeepSeek-V4-Pro
      model_aliases:
        - sgl-project/DeepSeek-V4-Pro-FP8
        - nvidia/DeepSeek-V4-Pro-NVFP4
      output_feature_sizes: [768, 1536, 3072, 6144]
      input_feature_sizes: [7168]
    - model_path: deepseek-ai/DeepSeek-V4-Pro
      model_aliases:
        - sgl-project/DeepSeek-V4-Pro-FP8
        - nvidia/DeepSeek-V4-Pro-NVFP4
      output_feature_sizes: [7168]
      input_feature_sizes: [384, 768, 1536, 3072]
  moe:
    - model_path: deepseek-ai/DeepSeek-V4-Flash
      hidden_size: 4096
      inter_size: 2048
      topk: 6
      num_experts: 256
      sglang_moe_swiglu_limit: 10.0
      sglang_moe_scoring_func: sqrtsoftplus
      sglang_moe_routing_method_type: DeepSeekV3
      sglang_moe_routed_scaling_factor: 1.5
      sglang_moe_renormalize: true
      sglang_moe_has_correction_bias: true
      sglang_moe_backends:
        w4a8_mxfp4_mxfp8: {100: flashinfer_mxfp4, 103: flashinfer_mxfp4}
      wideep: true
      # Native-FP4 checkpoint: MXFP4 routed experts, served with MXFP8
      # activations (trtllm-gen) on the SM100 family. The label's floor is
      # SM100 (capabilities.yaml); below it serving runs the experts as W4A16,
      # a different label this row does not plan.
      quantization_modes: [w4a8_mxfp4_mxfp8]
    - model_path: sgl-project/DeepSeek-V4-Flash-FP8
      hidden_size: 4096
      inter_size: 2048
      topk: 6
      num_experts: 256
      sglang_moe_swiglu_limit: 10.0
      sglang_moe_scoring_func: sqrtsoftplus
      sglang_moe_routing_method_type: DeepSeekV3
      sglang_moe_routed_scaling_factor: 1.5
      sglang_moe_renormalize: true
      sglang_moe_has_correction_bias: true
      wideep: true
      # vLLM: the artifact config omits expert_dtype and vLLM defaults it to
      # FP4, but vLLM 0.24's DeepSeek-V4 quant config has a native
      # fp8-expert branch — serving works with the documented override
      # `--hf-overrides '{"expert_dtype": "fp8"}'` (models/deepseek_v4/
      # quant_config.py @0.24.0). The benchmark constructs Fp8Config from
      # the label with synthetic weights, matching that serving path.
      quantization_modes: [fp8_block]
    - model_path: deepseek-ai/DeepSeek-V4-Pro
      hidden_size: 7168
      inter_size: 3072
      topk: 6
      num_experts: 384
      sglang_moe_swiglu_limit: 10.0
      sglang_moe_scoring_func: sqrtsoftplus
      sglang_moe_routing_method_type: DeepSeekV3
      sglang_moe_routed_scaling_factor: 2.5
      sglang_moe_renormalize: true
      sglang_moe_has_correction_bias: true
      sglang_moe_backends:
        w4a8_mxfp4_mxfp8: {100: flashinfer_mxfp4, 103: flashinfer_mxfp4}
      wideep: true
      # Owner decision (2026-07-05): do not collect the native-FP4 Pro
      # artifact as w4a16_mxfp4. The shared SM90 w4a16 backend map is
      # triton (GPT-OSS truth), under which SGLang 0.5.14 constructs plain
      # Fp8MoEMethod for is_fp4_experts and every case fails closed;
      # SM100/103 production scheduling uses the w4a8 TRTLLM-gen path
      # kept below. To restore support, re-add w4a16_mxfp4 here and pin
      # sglang_moe_backends w4a16_mxfp4 {90: flashinfer_mxfp4} (the native
      # cutlass mixed-input path, FlashInfer #3084). Otherwise as the native
      # Flash row above.
      quantization_modes: [w4a8_mxfp4_mxfp8]
    - model_path: sgl-project/DeepSeek-V4-Pro-FP8
      hidden_size: 7168
      inter_size: 3072
      topk: 6
      num_experts: 384
      sglang_moe_swiglu_limit: 10.0
      sglang_moe_scoring_func: sqrtsoftplus
      sglang_moe_routing_method_type: DeepSeekV3
      sglang_moe_routed_scaling_factor: 2.5
      sglang_moe_renormalize: true
      sglang_moe_has_correction_bias: true
      wideep: true
      # See the Flash converted-artifact note above (same expert_dtype
      # omission; same `--hf-overrides` serving path).
      quantization_modes: [fp8_block]
    - model_path: nvidia/DeepSeek-V4-Flash-NVFP4
      hidden_size: 4096
      inter_size: 2048
      topk: 6
      num_experts: 256
      sglang_moe_swiglu_limit: 10.0
      sglang_moe_scoring_func: sqrtsoftplus
      sglang_moe_routing_method_type: DeepSeekV3
      sglang_moe_routed_scaling_factor: 1.5
      sglang_moe_renormalize: true
      sglang_moe_has_correction_bias: true
      wideep: true
      # Real ModelOpt export (nvidia/DeepSeek-V4-Flash-NVFP4, verified via its
      # published config.json/hf_quant_config.json, AIC-1749): quant_algo
      # MIXED_PRECISION, routed-expert layers at NVFP4 (moe_quant_algo
      # NVFP4), attention/shared-experts/head/mtp excluded. This is a new,
      # quant-distinct artifact row (case_authoring.md) — never merged into
      # the deepseek-ai/DeepSeek-V4-Flash row above. vLLM times the generic
      # CompressedTensorsConfig nvfp4-pack-quantized path
      # (collector/vllm/collect_moe.py moe_type == "nvfp4"); no
      # DeepSeek-V4-specific dispatch is needed.
      quantization_modes: [nvfp4]
    - model_path: nvidia/DeepSeek-V4-Pro-NVFP4
      hidden_size: 7168
      inter_size: 3072
      topk: 6
      num_experts: 384
      sglang_moe_swiglu_limit: 10.0
      sglang_moe_scoring_func: sqrtsoftplus
      sglang_moe_routing_method_type: DeepSeekV3
      sglang_moe_routed_scaling_factor: 2.5
      sglang_moe_renormalize: true
      sglang_moe_has_correction_bias: true
      wideep: true
      # See the Flash-NVFP4 note above (same real ModelOpt MIXED_PRECISION
      # export shape, verified against nvidia/DeepSeek-V4-Pro-NVFP4's own
      # published config.json/hf_quant_config.json).
      quantization_modes: [nvfp4]
  mhc:
    - model_paths:
        - deepseek-ai/DeepSeek-V4-Flash
        - sgl-project/DeepSeek-V4-Flash-FP8
      hidden_size: 4096
      hc_mult: 4
    - model_paths:
        - deepseek-ai/DeepSeek-V4-Pro
        - sgl-project/DeepSeek-V4-Pro-FP8
      hidden_size: 7168
      hc_mult: 4
  dsv4:
    # Module tables key [native][local] since #1423/#1431, so full/raw plans
    # collect Flash and Pro together (distinct native head counts cannot
    # collide). Artifacts stay uniform (sgl-project FP8 builds, matching every
    # shipped module table) because the persisted module key carries no
    # artifact dimension — one artifact per geometry per plan; Blackwell
    # platform-native collection uses targeted deepseek-ai/* runs. The first
    # entry is the canonical artifact (manual-CLI default model).
    # Default calib collection stays on the canonical artifact via
    # calib_model_paths (cost policy); targeted runs may collect any supported
    # model's calibration — consumers key the DELTA per native geometry (#1460).
    # nvidia/DeepSeek-V4-{Flash,Pro}-NVFP4 (AIC-1749) are deliberately NOT
    # listed for module collection at all: the module collectors' gemm_type
    # sweep is bfloat16/fp8_block only (case_generator.py
    # _dsv4_module_precision_combos; collector/vllm/collect_dsv4_attn.py
    # SUPPORTED_GEMM_TYPES), and the persisted module key carries no artifact
    # dimension — so even a targeted run against these paths could only stamp
    # rows with a label that misrepresents the artifact ("cases that carry
    # the wrong identity are worse than no cases", case_authoring.md). They
    # join supported_model_paths together with the collector gemm-label work
    # tracked on AIC-1749.
    default_model_paths:
      - sgl-project/DeepSeek-V4-Flash-FP8
      - sgl-project/DeepSeek-V4-Pro-FP8
    calib_model_paths:
      - sgl-project/DeepSeek-V4-Flash-FP8
    supported_model_paths:
      - deepseek-ai/DeepSeek-V4-Flash
      - deepseek-ai/DeepSeek-V4-Pro
      - sgl-project/DeepSeek-V4-Flash-FP8
      - sgl-project/DeepSeek-V4-Pro-FP8
    attention_kinds:
      - csa
      - hca
    module_batch_sizes:
      - 1
      - 2
      - 4
      - 8
      - 16
      - 32
      - 64
      - 128
      - 256
      - 512
      - 1024
    module_sequence_lengths:
