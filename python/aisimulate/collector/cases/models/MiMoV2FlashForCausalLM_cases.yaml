schema_version: 1
architecture: MiMoV2FlashForCausalLM
model_path: XiaomiMiMo/MiMo-V2-Flash
model_paths:
  - XiaomiMiMo/MiMo-V2-Flash
include_base: true
base_ops:
  - gemm
framework_specific_base_ops:
  # Model runs leave vLLM's attention out: serving runs DiffKV (QK=192, V=128,
  # plus sinks on the SWA layers), while vLLM's attention collector takes one
  # head_dim and no sinks, so its rows time QK=V=192 without sinks. Full
  # collections still time these shapes on vLLM. TRT-LLM cannot serve
  # MiMo-V2-Flash (collector/skips.py).
  sglang:
    - attention_context
    - attention_generation
  trtllm:
    - attention_context
    - attention_generation
description: >
  MiMo-V2-Flash hybrid model-centric collection plan. Starts with shared base
  cases and includes the hybrid MoE shape used by the support matrix.

model_case_values:
  attention:
    - id: mimo_v2_global_attention
      model_path: XiaomiMiMo/MiMo-V2-Flash
      num_attention_heads: 64
      num_key_value_heads: 4
      head_dim: 192
      v_head_dim: 128
      window_size: 0
      # SGLang serves MiMo-V2 on fa4 on SM100/103 (arg_groups/model_overrides/
      # mimo_v2.py _mimo_v2_overrides; the generic default also picks fa4 for
      # asymmetric K/V, model_override_base.py get_default_attn_backend), on fa3
      # on SM90, and on triton on SM89/SM120: MiMo-V2-Flash sets the sink-bias
      # flags, so the generic default skips flashinfer (model_config.py
      # _detect_attention_sinks), which also rejects the 192/128 K/V pool (L40S
      # and RTX 6000 Pro probes: prefill reshape '[-1, 4, 192]' on the 128-wide
      # V pool, decode paged K/V stride check 768 vs 512).
      sglang_backends: {89: triton, 90: fa3, 100: fa4, 103: fa4, 120: triton}
      tensor_parallel_sizes: [1, 2, 4, 8, 16, 32, 64]
    - id: mimo_v2_swa_attention
      model_path: XiaomiMiMo/MiMo-V2-Flash
      num_attention_heads: 64
      num_key_value_heads: 8
      head_dim: 192
      v_head_dim: 128
      window_size: 128
      has_attention_sink: true
      sglang_backends: {89: triton, 90: fa3, 100: fa4, 103: fa4, 120: triton}
      tensor_parallel_sizes: [1, 2, 4, 8, 16, 32, 64]
  moe:
    - model_path: XiaomiMiMo/MiMo-V2-Flash
      hidden_size: 4096
      inter_size: 2048
      topk: 8
      num_experts: 256
      sglang_moe_scoring_func: sigmoid
      # MiMoV2MoE passes DeepSeekV3 routing to FusedMoE when the gate has a
      # correction bias (noaux_tc) and norm_topk_prob is set
      # (models/mimo_v2.py:446-450 at SGLang v0.5.23).
      sglang_moe_routing_method_type: DeepSeekV3
      sglang_moe_routed_scaling_factor: 1.0
      sglang_moe_renormalize: true
      sglang_moe_has_correction_bias: true
      sglang_moe_num_expert_group: 1
      sglang_moe_topk_group: 1
      sglang_moe_backends:
        # An FP8 checkpoint without FP4 experts runs flashinfer_trtllm on
        # SM100/103 (arg_groups/model_overrides/mimo_v2.py:33-49) and the auto
        # Triton runner elsewhere.
        fp8_block: {default: triton, 100: flashinfer_trtllm, 103: flashinfer_trtllm}

all_frameworks_op_cases:
  moe:
    cases: all
