#
# Known gaps between what the TRT-LLM collector measures and what TRT-LLM
# serving runs. Code, data and docs cite a note by its id instead of restating
# it. Schema and lifecycle: .claude/rules/collector/overview.md ("Note");
# tools/perf_database/check_collector_data.py R8 validates this file.

schema_version: 1
notes:
  - id: D-trtllm-mhc-unfused
    kind: deviation
    summary: >-
      On SM100/103, serving defaults to the fused_hc mHC path, but the table
      times the standalone pre_mapping and post_mapping kernels, which
      over-charges the mHC boundary. mHC is 9-14% of the DSV4 per-layer cost
      on b200, an upper bound on the error; the actual fused/unfused delta is
      unmeasured.
    direction: over
    scope:
      tables: [mhc_module_perf]
      systems: [b200_sxm, b300_sxm, gb200, gb300]
    verified_on: "1.3.0rc29"
    sources:
      - tensorrt_llm models/modeling_deepseekv4.py:292-297 @1.3.0rc29 (serving defaults to fused_hc)
    retire_via: >-
      https://github.com/ai-dynamo/aiconfigurator/issues/1580 (collect fused_hc
      on SM100/103 and switch the SDK consumer)
    approved_by: tianhaox
  - id: G-trtllm-moe-int4-wo-no-implementation
    kind: guard
    summary: >-
      TensorRT-LLM 1.3.0rc29 has no MoE implementation for W4A16 (int4_wo) on
      SM100/103: MoE resolution rejects every candidate ("CutlassFusedMoE:
      quant_unsupported (quant_algo=W4A16)") and raises. All 114 int4_wo
      cases failed on b200 (job 469988228), and serving cannot load the W4A16
      Kimi-K2.5 checkpoint either. capabilities.yaml backend_gaps leaves the
      region out instead of building weights for cases that cannot run.
    reason: expensive
    scope:
      tables: [moe_perf]
      systems: [b200_sxm, b300_sxm, gb200, gb300]
    verified_on: "1.3.0rc29"
    sources:
      - tensorrt_llm/_torch/moe/fused_moe/moe_resolution.py:659-667 @v1.3.0rc29 (impl_class_for)
      - aisimulate benchmarks/evidence/collector/op-probe-2026-10/results/sm100/trtllm-1.3.0rc29.yaml (Kimi-K2.5 serving probe)
    retire_via: >-
      Re-test int4_wo at the next TensorRT-LLM pin and delete the backend gap
      once MoE resolution accepts W4A16.
    approved_by: tianhaox
  - id: G-trtllm-mhc-glm5next-not-served
    kind: guard
    summary: >-
      TensorRT-LLM has no GLM-5.3-Flash serving lane, and its mHC collector
      drives only the DeepSeek-V4 module API (pre and post). GLM pre/post cases
      would time that API under GLM's call sites, and its fused_post_pre,
      expand and contract sites have no TensorRT-LLM module, so
      capabilities.yaml backend_gaps leaves the
      architecture=Glm5NextForConditionalGeneration region out.
    reason: mismeasure
    scope:
      tables: [mhc_module_perf]
      systems: [l40s, h100_sxm, h200_sxm, b200_sxm, b300_sxm, gb200, gb300, rtx_pro_6000_server]
    verified_on: "1.3.0rc29"
    sources:
      - aisimulate python/aisimulate/collector/trtllm/collect_mhc_module.py (ARCHITECTURE, run_mhc_module)
      - aisimulate python/aisimulate/collector/cases/models/Glm5NextForConditionalGeneration_cases.yaml (no TRT-LLM serving lane)
    retire_via: >-
      Add a GLM-5.3-Flash route once TensorRT-LLM serves the model, then
      delete the backend gap.
    approved_by: tianhaox
