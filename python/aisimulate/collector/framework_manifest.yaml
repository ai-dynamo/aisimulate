#
# Collector V3 manifest (schema v2): one `default` runtime per framework plus
# explicit per-family overrides (design: docs/perf_database/
# collector-v3-op-centric-design.md §4), plus optional per-model overrides
# (`models:`) that pin one model's entire run regardless of family. Public
# images are digest-pinned; bare internal image names are exempt. WideEP
# runtimes are peer framework entries (wideep_<base>) so per-op resolution is
# uniform.

schema_version: 2

frameworks:
  sglang:
    source_repo: "https://github.com/sgl-project/sglang.git"
    # 2026-10-01 (H20/sm90 upgrade audit, benchmarks/evidence/collector/op-probe-2026-10/findings.yaml
    # hopper_sglang_collector_port_0514_to_0521_2026_10_01): default pin moved
    # 0.5.14 -> 0.5.21 (newest release tag). Both tags resolve to the same
    # multi-arch index digest, as the 0.5.17 model pins below do. The former
    # kda (kimi-k3 branch build, 0.5.16) and msa (official v0.5.16) family pins
    # are gone: 0.5.21 ships models/kimi_linear.py + the KDA Triton lanes and
    # models/minimax_m3.py, and both op families were smoked/gated on it.
    default:
      version: "0.5.21"
      images:
        default: "lmsysorg/sglang:v0.5.21@sha256:b1259f3ea3275f66237c498ea388919729018bc9f01c3d638391e06e2cf3f469"
        cu130: "lmsysorg/sglang:v0.5.21-cu130@sha256:b1259f3ea3275f66237c498ea388919729018bc9f01c3d638391e06e2cf3f469"
    # Model-scoped collector runtime pins: when the resolved run model_path
    # exactly equals one of these keys, the pin overrides BOTH the family
    # pins above and the framework default for every op in the run — the
    # whole run moves to this runtime, not just the ops that would otherwise
    # resolve here. A run with no model identity, or one that does not match
    # a key, resolves exactly as before (family/default), so this section is
    # purely additive. Precedence: a model pin beats a family pin even for an
    # op that has one (e.g. a hypothetical model-pinned run requesting a kda
    # op still gets the model's runtime, not 0.5.16) — unlike the family pins
    # above, which move a whole op family for every model, a model pin moves
    # one model's entire run and leaves every other model's resolution (and
    # every other op's family/default resolution) unchanged.
    #
    # Qwen3.8-2.4T model pins (0.5.17) folded into the 0.5.21 default
    # 2026-10-30 per the pin-consolidation rule (pins below the target version
    # upgrade with it): the 0.5.21 tables already carry the Qwen3.8 MoE and GDN
    # shapes from the unfiltered campaign, and the op-probe serving matrix boots
    # Qwen3.8-2.4T-A95B on SM90/SM100 and -FP8 on SM90 under 0.5.21
    # (benchmarks/evidence/collector/op-probe-2026-10). The 0.5.17 tables stay
    # under their version key.
    #
    # Scope: the override is selected only when collect.py resolves a single
    # exact model_path (normally through --model-path, or through an
    # architecture case file with one primary model). A full/unfiltered plan
    # has no single model identity and therefore uses the framework/family
    # runtime; run these model-pinned campaigns separately at their declared
    # runtime rather than mixing them into an unfiltered invocation.
    # GLM-5.3-Flash SGLang 0.5.20 model pin retired 2026-10-30 (owner decision:
    # one release per collector file; 0.5.20 is below the 0.5.21 target). The
    # 0.5.20 tables stay under their version key; re-collect them from
    # main at c540ff90a (before #649). Moving the lane to 0.5.21 needs the GLM
    # attention runner, KDA, mHC and GEMM ports listed in the 2026-10-30
    # source audit, then a re-collection.
    models: {}
  trtllm:
    source_repo: "https://github.com/NVIDIA/TensorRT-LLM.git"
    # 2026-10-02 (H20/sm90 upgrade audit, benchmarks/evidence/collector/op-probe-2026-10/findings.yaml
    # hopper_trtllm_collector_pin_rc20_to_rc29_2026_10_02): default pin moved
    # 1.3.0rc20 -> 1.3.0rc29 (newest release container). The rc23 moe /
    # sparse_attention / msa family pins are retired: every trtllm registry op
    # smokes on rc29 (21/23 clean; moe's first plan case and mamba2's largest
    # cells fail by their own classified raises) and all 17 path gates align on
    # it, DSV4 included. Retired-pin history, kept for the data it explains:
    #   * rc23 moe (2026-08-08): FP4 w4a8_mxfp4_mxfp8 rows show reproducible
    #     non-monotonic num_tokens segments on Blackwell (median ratio vs rc20
    #     1.003-1.013; per-bucket tactic/tile-wave quantization, not a campaign
    #     artifact; GitLab aic-auto-collector pipelines 61692150-61692160,
    #     61771569-61838704). Existing moe shapes still reuse rc20 data through
    #     the declared reuse.yaml channel; the rc23 evidence exception in
    #     evidence_exceptions.yaml keeps its own scope.
    #   * rc23 sparse_attention: DSV4 attention needed trtllm>=1.3.0rc21 and the
    #     DSA modules travelled with it (SM90 smoke at bring-up).
    #   * rc23 msa: the true-sparse fmha_sm100 backend (SM100/103) landed in rc23;
    #     SM90 msa data stayed at rc20 (Triton reference path, identical-or-worse
    #     measured at rc23).
    default:
      version: "1.3.0rc29"
      images:
        default: "nvcr.io/nvidia/tensorrt-llm/release:1.3.0rc29@sha256:124da3f10b73afbf4242f5c68fb04b48736c61fbe662e715202371fd7f046f43"
  vllm:
    source_repo: "https://github.com/vllm-project/vllm.git"
    default:
      version: "0.30.0"
      images:
        default: "vllm/vllm-openai:v0.30.0@sha256:8a69ffad015f138d7170c4ddc429e230a3bc1c1719f67e14324749df200a4b90"
    # gemm / moe / kda / mhc move to vLLM 0.31.0 (owner decision 2026-10-30):
    # GLM-5.3-Flash collects these families on 0.31.0, and each collector file
    # targets exactly one release, so the families upgrade instead of carrying
    # 0.30.0 and 0.31.0 side by side. A family pin moves the family for every
    # model. The 0.30.0 tables stay under their version key; the 0.30.0
    # collectors are `git log` away. Same stock image as the GLM-5.3-Flash
    # model pin below (multi-arch index; amd64 a4a4c043..., arm64 3f7dd5b7...).
    families:
      gemm: &vllm_0310_runtime
        version: "0.31.0"
        source_commit: "db9527a46873454610df6dbedf79a36d6bf1a7f6"
        images:
          default: "vllm/vllm-openai:v0.31.0@sha256:c1c9f6fd5c109ba7f0546a59f5b2f15fb87f64c77782e90a27b648b42a8e67c3"
      moe: *vllm_0310_runtime
      kda: *vllm_0310_runtime
      mhc: *vllm_0310_runtime
    # kda family pin RETIRED (owner decision 2026-09-28): the family ran on the
    # kimi-k3 preview image (0.1.dev19262) while the consumer's fused-decode
    # pricing did not match 0.27's packed-decode serving path (review #1559).
    # On 0.30.0 the opharness framework-mode probe of Kimi-K3 runs the fused
    # decode kernel (kda_decode_fusion_many_heads_kernel) and FlashKDA prefill
    # (opharness findings vllm_0300_upgrade_2026_09_27), and the kda collector
    # follows 0.30's is_flashkda_supported contract — so kda resolves to the
    # default 0.30.0 like every other vllm op.
      # mla / mla_bmm family pins (0.27.0) were folded into the 0.29.0
      # default 2026-09-20 per the pin-consolidation rule: pins BELOW the
      # target version upgrade with it; the kda preview pin (an odd dev-build
      # pin) was revisited at the 0.30.0 move and retired, see above.
      # moe: the 0.31.0 family pin above is a stock release (2026-10-30).
      # History: NO family pin (owner decision 2026-08-02, reverting the
      # 2026-08-01 family-wide preview pin — a temporary preview build must
      # not own a family default; a family pin here hijacks image selection
      # for every model). ALL vllm moe collection — including K3 — runs on
      # the stock v0.24.0 default image: K3 SITU cases use the
      # owner-approved situ-as-silu Marlin approximation in collect_moe
      # (serving truth is MarlinExperts W4A16 on every SM — the preview's
      # CUTLASS whitelist rejects SITU; stock's device-only gate is forced
      # off so Blackwell doesn't drift into CUTLASS W4A4, a kernel K3
      # serving never runs; rows are marked kernel_source *_situ_as_silu,
      # epilogue delta <~3%). Already-collected K3 rows (b200/b300,
      # preview-native situ) stay merged in the 0.24.0 moe table with
      # their honest runtime version column. Retire the approximation when
      # upstream wires SITU into a quantized-activation kernel (kernel
      # class flips) — re-audit at every tag bump.
      # (2026-08-02 audit note kept for the preview image: the kimi-k3
      # tag's amd64 image is IDENTICAL to the pin digest —
      # 0.1.dev19262+gb6bbf29dd, no deep_gemm; the earlier "drift to
      # sha256:d61e062d" observation was the manifest list's arm64 entry,
      # not a new build. On aarch64 hosts (gb200/gb300) resolve the arm64
      # entry of the same tag and re-verify the version string before use.)
    # Model-scoped collector runtime pins use the same precedence as
    # frameworks.sglang.models above: an exact run model_path overrides both
    # family pins and the framework default for every op in that run.
    #
    # Qwen3.8-2.4T model pins (0.27.1) folded into the 0.30.0 default
    # 2026-10-30 per the pin-consolidation rule: v0.30.0 registers
    # Qwen3_5MoeForCausalLM, the 0.30.0 tables already carry the Qwen3.8 MoE
    # and GDN shapes, and the op-probe serving matrix boots -FP8 (SM90) and
    # nvidia's NVFP4 checkpoint (SM90/SM100) under 0.30.0
    # (benchmarks/evidence/collector/op-probe-2026-10).
    # The 0.27.1 tables stay under their version key.
    #
    # Scope: the override is selected only when collect.py resolves one exact
    # model_path. A full/unfiltered plan has no single model identity and uses
    # the normal framework/family runtime; run these campaigns separately at
    # their declared runtime.
    models:
      # GLM-5.3-Flash (Glm5NextForConditionalGeneration) standalone per-op
      # collection runs on the stock official v0.31.0 release (no overlay),
      # tag commit db9527a46873454610df6dbedf79a36d6bf1a7f6. v0.31.0 moves
      # the GLM layers from vllm/models/glm5next/nvidia/ to
      # vllm/models/glm5next/common/ and the KPool indexer from
      # model_executor/layers/sparse_attn_indexer_kpool.py to
      # models/glm5next/nvidia/sparse_indexer.py; it also carries the KPool
      # tail slot-mapping fix (v1/kv_cache_interface.py:1036-1038). Docker Hub reported the
      # multi-arch index digest below for v0.31.0 on 2026-10-07; its
      # linux/arm64 child (also tag v0.31.0-aarch64; the GB300 platform
      # image, imported for collection as 3f7dd5b7...2b971.sqsh) is
      # sha256:3f7dd5b777d34d1724456ce71f87385dca288c3bb23029ab27dee358f5d2b971
      # and the linux/amd64 child is
      # sha256:a4a4c0437bf7240089da5f08aa370c4aee17ae5290f7a3b468825ee26c4c3a6b.
      "zai-org/GLM-5.3-Flash": &glm53flash_vllm_runtime
        version: "0.31.0"
        source_commit: "db9527a46873454610df6dbedf79a36d6bf1a7f6"
        images:
          default: "vllm/vllm-openai:v0.31.0@sha256:c1c9f6fd5c109ba7f0546a59f5b2f15fb87f64c77782e90a27b648b42a8e67c3"
      "nvidia/GLM-5.3-Flash-NVFP4": *glm53flash_vllm_runtime
  vllm_xpu:
    base_framework: vllm
    data_backend: vllm
    notes: >
      Intel XPU collector runtime, separate from stock CUDA vLLM.
    default:
      version: "0.28.0"
      images:
        default: "vllm/vllm-openai-xpu:v0.28.0@sha256:4756b66a077627133cee653b551f6f5eaa1b9a981b5eea13edd33fcd3b0d3ca3"
  wideep_sglang:
    base_framework: sglang
    collector_dir: "collector/wideep/sglang"
    data_backend: sglang
    default:
      version: "0.5.10"
      images:
        default: "deepseek-v4-blackwell"
        grace_blackwell: "deepseek-v4-grace-blackwell"
    families:
      # DeepEP dispatch/combine only. The DeepSeek-V4 images ship deep_ep 1.1.0
      # (kNumMaxTopK 9), which cannot run topk=10 shapes such as
      # (4096, 512, 10); this image ships deep_ep 1.2.1+d28bd67 (kNumMaxTopK 11)
      # and collects them, verified on GB200. It is a multi-arch index (amd64 +
      # arm64), so one entry serves every system and no grace_blackwell variant
      # is needed. `moe` (wideep_moe) deliberately stays on the DeepSeek-V4
      # default: its DSv4 module support on this image is unverified.
      comm:
        version: "0.5.12"
        images:
          default: "lmsysorg/sglang:v0.5.12-cu130@sha256:42194170546745092e74cd5f81ad32a7c6e944c7111fe7bf13588152277ff356"
    notes: >
      Requires an SGLang image with DeepSeek-V4/DeepEP modules; stock
      lmsysorg/sglang images may not include them.
  wideep_vllm:
    base_framework: vllm
    collector_dir: "collector/wideep/vllm"
    data_backend: vllm
    default:
      version: "0.24.0"
      source_commit: "ee0da84ab9e04ac7610e28580af62c365e898389"
      abi:
        build_mode: "official-v0.24.0-image"
        torch: "2.11.0"
        cuda: "13.0.2"
        deep_ep: "73b6ea4a439ba03a695563f9fd242c8e4b02b37c"
        nvshmem: "3.3.24"
      backend_abi:
        deepep_ht:
          deep_ep_api: "Buffer"
        deepep_ll:
          deep_ep_api: "Buffer"
        deepep_v2:
          build_mode: "official-v0.24.0-image+deepep-v2-overlay"
          deep_ep: "b306af06afd412c88e51e71802951606e40b7358"
          deep_ep_api: "ElasticBuffer"
          nccl: "2.30.4"
      images:
        default: "vllm/vllm-openai:v0.24.0@sha256:251eba5cc7c12fed0b75da22a9240e582b1c9e39f6fbc064f86781b963bd814f"
    notes: >
      The official multi-arch v0.24.0 index is the configured image identity;
      launchers resolve and attest its platform child at runtime. HT/LL use the
      legacy Buffer API. V2 uses the separately attested b306af0 ElasticBuffer
      overlay and NCCL 2.30.4. Four-GPU GB scale-up groups additionally require
      the checked-in legacy topology patch; every overlay records its wheel and
      patch SHA256.
  wideep_trtllm:
    base_framework: trtllm
    collector_dir: "collector/wideep/trtllm"
    data_backend: trtllm
    default:
      version: "1.3.0rc20"
      images:
        default: "nvcr.io/nvidia/tensorrt-llm/release:1.3.0rc20@sha256:1532b38814b3faf2affdb5ef01ca91468685d314ffb7e8926a0567595355ed88"
  trtllm_a2a:
    source_repo: "https://github.com/NVIDIA/TensorRT-LLM.git"
    default:
      version: "1.3.0rc11"
      source_commit: "14efb6ac673c0cbe828e1206cc5c7d5748d05ffa"
      abi:
        build_mode: "source-wheel-over-pinned-base"
        deep_ep: "5be51b228a7c82dbdb213ea58e77bffd12b38af8"
        nvshmem: "3.2.5-1"
        nvshmem_archive_sha256: "eb2c8fb3b7084c2db86bd9fd905387909f1dfd483e7b45f7b3c3d5fcf5374b5a"
      images:
        default: "nvcr.io/nvidia/tensorrt-llm/release:1.3.0rc20@sha256:1532b38814b3faf2affdb5ef01ca91468685d314ffb7e8926a0567595355ed88"
    notes: >
      The rc20 image is an immutable build base only. Collection must build
      and attest source_commit 14efb6ac (package version 1.3.0rc11), including
      its vendored DeepEP/NVSHMEM ABI; rows from the bundled rc20 package are
      rejected for this workload.
