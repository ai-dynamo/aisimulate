# Machine-checked steps of workflows/upgrade_op.md (components/workflow_check.py).
# Params: fw, version (the new pin), sm (default: the box's), ops (optional: a family pin's ops,
# narrows the rule-7 recheck to their skips.py entries).
workflow: upgrade_op
steps:
- id: pin_bumped
  actor: owner
  done_when: {check: pin_is}
- id: case_set_no_regression
  actor: script
  done_when: {check: case_set_no_regression}
- id: path_aligned
  actor: script
  done_when: {check: gates_aligned}
- id: skips_rechecked
  actor: ai
  done_when: {check: skips_rechecked}
