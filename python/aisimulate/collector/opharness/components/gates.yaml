# Path gates: each names ONE planned collector case, traced on a GPU by
#   collect.py --ops probe.trace_case --case-filter backend=..,op=..,<select>
# and graded by path_diff against the serving record of `repo` at kv `kv`, on the kernels
# of the roles and phase the op decides (gates.gate_target). A gate runs at the release its
# op is collected with (the manifest's default or family pin, gates.gate_version). A gate
# whose select matches no planned case on an SM is not a gate there (the plan decides).
# `no_serving` names SMs where serving cannot run the model at all (a serving fact, not a
# plan fact); `also` traces further planned cases into the same verdict; `env` is a
# capture-only switch the collector reads; `isl` grades against a serving record probed at
# that prompt length (default 4096; a prefill case's length must match it).
gates:
- gate: gemm_fp8block_DeepSeek-V3.2
  backend: vllm
  op: gemm
  select: {gemm_type: fp8_block, m: 4096, n: 7168, k: 16384}
  no_serving: {sm89: 'Ada: vLLM 0.30.0 has no sparse (DSA) MLA attention backend below SM90 — DeepSeek-V3.2 fails at attention-backend selection with kv auto AND
      fp8; no serving record can exist'}
  repo: deepseek-ai/DeepSeek-V3.2
  kv: fp8
- gate: gemm_bf16_Llama-3.1-8B
  backend: vllm
  op: gemm
  select: {gemm_type: bfloat16, m: 4096, n: 4096, k: 4096}
  repo: meta-llama/Meta-Llama-3.1-8B
  kv: auto
- gate: moe_fp8block_DeepSeek-V3.2
