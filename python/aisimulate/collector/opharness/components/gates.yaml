# Path gates: each names ONE planned collector case, traced on a GPU by
#   collect.py --ops probe.trace_case --case-filter backend=..,op=..,<select>
# and graded by path_diff against the serving record of `repo` at kv `kv`, scoped by the
# backend's `hint` regex. A gate whose select matches no planned case on an SM is not a gate
# there (the plan decides). `no_serving` names SMs where serving cannot run the model at all
# (a probe-box fact, not a plan fact); `also` traces further planned cases into the same
# verdict; `env` is a capture-only switch the collector reads; `isl` grades against a serving
# record probed at that prompt length (probe_driver.py --isl). The version graded is the
# manifest's framework default.
hints:
  vllm: {GEMM: gemm|linear|proj|nvjet|gemvx|cublas|deepgemm|scaled_mm|quant|cutlass, MOE: moe|expert|grouped|fused_moe|deepgemm|topk|marlin|routing, MLA: mla|attn|flash|bmm|proj|indexer|rope|concat|gemm|gemvx|cutlass|deepgemm|quant,
    GDN: gdn|delta|conv1d|linear|mamba|gated|recurrent, DSV4: dsv4|dsa|csa|hca|compress|indexer|mqa|sparse|flash|attn|mla|topk|gemm|deepgemm|quant, ATTN: attn|attention|flash|fwd|unified,
    ENC: vision|vit|patch|encoder|flash|attn, DSA: mla|dsa|attn|indexer|flash|mqa|sparse|gemm|proj|deepgemm|quant, GEMM_M1: gemm|linear|proj|nvjet|gemvx|cublas|cutlass|skinny,
    KDA: kda|delta|conv1d|linear|attn_res|gated|recurr, MSA: attn|sparse|msa|topk|index|score|merge}
  sglang: {ATT: attn|attention|flash|fwd|triton, DSA: mla|dsa|nsa|attn|indexer|flash|mqa|sparse|gemm|deepgemm|quant|topk, MSA: attn|sparse|msa|topk|index|score|merge|block,
    GEMM: gemm|linear|proj|deepgemm|cutlass|cublas|quant, MOE: moe|expert|grouped|fused_moe|deepgemm|topk|marlin|routing|ep_, GDN: gdn|delta|conv1d|linear|mamba|gated|recurr,
    DSV4: dsv4|dsa|csa|hca|compress|indexer|mqa|sparse|flash|attn|mla|topk|gemm|deepgemm|quant, GLM5: mla|dsa|nsa|attn|indexer|flash|mqa|sparse|gemm|deepgemm|quant|topk,
    KDA: kda|delta|conv1d|linear|attn_res|gated|recurr, MLA: mla|attn|flash|bmm|proj|indexer|rope|concat|gemm|gemvx|cutlass|deepgemm|quant, ENC: vision|vit|patch|encoder|flash|attn}
  trtllm: {ATT: attn|attention|fmha|mha|flash|xqa, DSA: mla|dsa|nsa|attn|indexer|flash|mqa|sparse|gemm|deepgemm|quant|topk|fmha, GEMM: gemm|linear|proj|deepgemm|cutlass|cublas|quant,
    MOE: moe|expert|grouped|fused_moe|deepgemm|topk|routing|cutlass, GDN: gdn|delta|conv1d|linear|mamba|gated|recurr, DSV4: dsv4|dsa|csa|hca|compress|indexer|mqa|sparse|flash|attn|mla|topk|gemm|deepgemm|quant|fmha,
    ENC: vision|vit|patch|encoder|flash|attn|fmha, MLA: mla|attn|flash|bmm|proj|indexer|rope|concat|gemm|gemvx|cutlass|deepgemm|quant|nvjet|cublas, MAMBA: mamba|ssm|chunk|scan|conv1d|selective|causal|state,
    MSA: attn|sparse|msa|topk|index|score|merge|block}
