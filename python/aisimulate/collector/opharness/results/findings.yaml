  sm120_dsa_head_axis_failures_accepted:
    statement: 'OWNER DECISION (tianhaox, 2026-09-30) on the sm120 vllm 0.30.0 collection: the dsa_context/generation_module
      failures for per-rank head counts 96/48/24/12 (and 4/2/1) are ACCEPTED as classified failures — no sm120-specific
      axis pruning, no skip. Facts: mla_module_vllm.head_counts is a shared grid [128,96,64,48,32,24,16,12,8,4,2,1]; the
      96/48/24/12 values are Kimi-K3 (96 heads) TP1/2/4/8 shards and are REAL for the dense mla module, but no DSA model
      (DeepSeek-V3.2 128 heads, GLM-5 64 heads) produces them at any TP. sm90 FlashMLA-sparse and sm100 FlashInfer-sparse
      pad heads, so those rows collect as fabricated configurations there; sm120 FlashInfer sparse-MLA supports only
      h_q in {8,16,32,64,128} and refuses ("Unsupported sparse-MLA prefill configuration" / "no decode kernel for this
      shape"), so on sm120 the rows fail at metadata build in ~0.3 s each (~37% of dsa_context cases together with the
      prefix >= 262144 max_model_len group; ~40 min per 21.8k-case shard). Shipped vllm 0.24.0 dsa tables on every system
      carry heads {8,16,32,64,128} (+1/2/4 on Hopper) only, so nothing regresses. Rationale: layer_permissions offers no
      head-axis negative gate (max_sm_exclusive is quant-mode only) and failure_handling wants framework gaps to fail and
      re-test on the next pin. FOLLOW-UP (low priority, arch-neutral, for the H20 owner at the next bump): derive the
      mla/dsa head axis per model row from declared tensor_parallel_sizes like get_msa_head_counts does (mla keeps
      {128,96,64,48,32,24,16,12,8} via Kimi-K3, dsa drops to {128,64,32,16,8}), and cap dsa_prefix_lengths by the model
      row''s max_position_embeddings (262144/524288/1048575 exceed DeepSeek-V3.2 163840 / GLM-5 202752 on every SM).'
    applies_to:
    - platform:sm120
    - framework:vllm-0.30.0
    - instrument:collect_mla_module
  sm120_vllm_0300_collection_2026_10_01:
    statement: 'FULL PERF-DATA COLLECTION on the RTX PRO 5000 (sm120) box, vllm 0.30.0, --model-cases-full --sm 120:
      20 ops / 634,878 planned cases / 41 case-filter shards on 8 GPUs, ~12 h wall time incl. clean-GPU retries;
      launcher = tools/perf_database/collect_campaign.py (written during this run, see aic-auto-collect skill).
      DATA (rows, after retries): gemm 144,142 (bf16 37,472 / fp8 37,518 / fp8_block 31,598 / nvfp4 37,518);
      attention_context bf16 27,218; attention_generation bf16 33,785; dsa_context 106,020 (12 x 8,835);
      dsa_generation 10,862; mla_context 8,487; mla_generation 7,059; msa 7,320 + 5,511; dsv4 csa/hca ctx 5,718 /
      5,789, gen 1,544 / 1,544; encoder_attention 7,679; moe 76,947; compute_scale 3,256 (2 tables); mla_bmm 300 +
      336; gdn 10,284; kda 1,247. attention fp8-KV ctx/gen re-collected from scratch after the collector fix below: context 27,144 / generation 32,370 rows (labels fiprefill / trtllmapidecode_xqa / triton_attn), 90 + 1,448 XQA power-of-2 failures left; campaign total 524,972 rows.
      FAILURE GROUPS, all classified, none hidden: (1) dsa heads 96/48/24/12/4/2/1 + prefix >= 262144 — owner
      decision sm120_dsa_head_axis_failures_accepted (~60% of dsa_context cases, fail at metadata build);
      (2) TRITON_MLA fp8-KV smem 102400 > 101376 (mla_generation 6,036; the platform limit from the probe campaign);
      (3) fp8 prefill query on FA2 (mla_context compute=fp8 4,392: FA2 cannot take fp8 Q, collector refuses to
      mislabel — declared min_sm 100 but SM120 is >= 100 by number while lacking the SM100 path: the combo axis
      needs a family gate, not a floor); (4) sparse-MLA sm120 decode shape table (dsa_generation 9,996);
      (5) gemm fp8_block: cutlass c3x "Invalid status" 4,491 (documented SM120 gap) + triton_scaled_mm scale-shape
      assert 546 at N in {4, 8}; (6) XQA JIT static_assert isPowerOf2 for MQA group size 48/24 (attention fp8-KV,
      n_kv=1, ~1,450 cases; the same shapes IMA under bf16 FA2 decode: 3 cases); (7) large-shape CUDA faults —
      dsv4_csa_context b*s = 262144 fp8-KV (IMA / capture "unjoined work" / aten::new_empty ~50), mla_generation
      b*s = 16.7M tokens (3 IMA per gemm type; int32-index class); (8) moe: NVFP4 w1/w3 intermediate padding
      unsupported 69, gate/up not divisible by block 128: 36, inter_size % alignment 3; (9) gdn packed recurrent
      grid-y limit 4, kda strict-completeness 1; (10) residual OOMs: 30 -> 19 (attention_generation bf16), 16 -> 5
      (attention_context bf16), 46 -> 10 (gemm bf16 32768 x 65536 x 51200-class, 6 weight copies ~40 GB) after
      a clean-GPU --resume-retry-failed pass; the ones that reproduce are genuine 72 GB capacity limits.
      COLLECTOR FIXES that came out of it (branch tianhaox/aisimulate:sm120-collect-campaign): collect_attn lays
      the paged KV cache out in the framework-resolved kv_cache_layout (NHD on FlashInfer outside SM100; the fixed
      HND memory failed every fp8-KV GQA decode on sm120, 20,458 + 1,354 cases, while serving passed) and the
      FlashInfer decode kernel_source names the kernel (…trtllmapidecode_xqa / _trtllm_gen; 0.30 merged both into
      one metadata class); collector/helper _merge_perf_rows treats string/large_string as one type (the third
      finalize of a table used to OVERWRITE it — 27,303 rows silently replaced by 5,067; mechanism change flagged
      for owner review). DELIVERY BLOCKER: no SDK system definition for the RTX PRO 5000 (playbook §8 forbids the
      rtx_pro_6000_server relabel); data stays in the workspace until systems/<name>.yaml exists.'
    applies_to:
    - platform:sm120
    - framework:vllm-0.30.0
    - instrument:collect.py
    - instrument:collect_campaign
  sm120_dsa_kv_dtype_axis_collapses:
    statement: 'DSA module rows on sm120 carry kv_cache_dtype=fp8 for BOTH declared KV variants: vLLM 0.30.0''s
      FLASHINFER_MLA_SPARSE_SM120 path resolves the cache to fp8_ds_mla regardless of the requested dtype (opharness
      serving probes of DeepSeek-V3.2 and GLM-5.2: kv None and kv fp8 both -> cache_config_dtype fp8_ds_mla), and the
      collector records the RESOLVED dtype (serving truth). Consequence: the bf16-KV and fp8-KV shards of dsa_context /
      dsa_generation produce identical identity keys (8,835 of 8,835 per shard pair, latency ratio 1.01), so half of
      the sm120 DSA collection (~4 h x 8 GPUs) re-measured the same physical configuration; the merged tables hold
      53,010 + 5,432 unique rows (106,020 + 10,862 collected). Not a data defect — the rows are truthful — but the
      case plan''s kv axis is not a real axis for DSA on this SM. Candidate: dedup DSA cases on the resolved kv dtype at
      plan time (the collector already collapses physical keys for mla specs), or declare the DSA kv axis per SM.'
    applies_to:
    - platform:sm120
    - framework:vllm-0.30.0
    - instrument:collect_mla_module
  dsv41_dummy_cut_and_vllm_block_size_2026_10_01:
    statement: 'CORRECTION of the DeepSeek-V4.1 rows in vllm_0300_upgrade_2026_09_27 and of the 09-30 support probe: the
      V4.1 dummy those verdicts ran on was not V4.1. The generic depth cut kept original layers [0,1] — two sliding-window
      layers (compress_ratio 0) — with kv_source_layer_ids / index_source_layer_ids / candidate_source_layer_id /
      engram_layer_ids left verbatim (keys end in `_layer_ids`; the stale-ref post-check only knew `layers`), so no
      compressor, indexer, compressed-KV attention or candidate path was ever exercised. FIX (owner request 2026-09-30,
      "put the engram shrink in the dummy handling, no need for full size"): dummies.py `dsv41` adapter, routed by
      targets.yaml dummy_overrides.family. Rep cut = original layers [0,1,2,3,20,21,24] (swa; engram swa; ratio-2 kv/index
      source + consumer; candidate/ratio-1 source + consumer; candidate-masked indexer), rep_min = [1,2,3,20,21] as the
      capacity fallback. Every pointer is renumbered (kv sources [2,4], index sources [2,4,6], candidate 4, engram [1]) and
      the adapter raises if a compressed layer has no source at or below it (the frameworks assert exactly that:
      vllm 0.30.0 models/deepseek_v41/attention.py:283-299, sglang main models/deepseek_v4.py:4316-4322). Engram hash
      tables shrink by lowering engram_vocab_size 16000000 -> 100000 and recomputing engram_num_embeddings with the
      frameworks'' prime-sum rule (vllm common/engram.py:186-199, sglang layers/engram.py:158-175; reproduces the
      shipped 384006168/384016682 exactly): 2.4M rows = 0.6 GB per layer instead of 98 GB. Row count is memory only —
      hash/gather/gate kernels and per-token work are unchanged; 100000 keeps buckets-per-head above the compressed
      vocab (99092). The stale-ref check now covers `*_layer_id(s)` keys and checks nested sub-configs against their own
      depth (vision_config, Inkling mtp_config). SIDE EFFECT: Inkling''s local_layer_ids (55 of 66) is a layer-kind
      axis, so its generic variants became all_kinds [0,5] + single-kind with the list remapped (Inkling is a
      generator reject on every backend, no record changed). RESULTS on the faithful cut (H20/sm90): vllm 0.30.0
      deepseek-ai/DeepSeek-V4.1-Flash FAILS at load on its golden render — the generator''s deepseek_v4 fact
      (facts/models.yaml, matched through the `deepseek-ai/DeepSeek-V4*` path glob) renders block-size 256, and V4.1''s
      compressed layers use 64-token kernel blocks, so the 256-token manager block must split 4-way, which the BLHNC
      layout cannot do once a KV tensor is shared by several layers ("block stride 275904 != page 74752",
      kv_cache_interface.py:373). Depth-independent: the real 40-layer deployment fails the same way. Rescue as the
      framework''s own message suggests: `--generator-set params.agg.tokens_per_block=64` -> PASS (rendered and fp8-KV;
      A/B in facts/../archive/superseded_dummies/2026-10-01_dsv41_inkling/raws_block256). The nvidia NVFP4 sibling is
      NOT matched by that fact (arch DeepseekV41 / model_type deepseek_v41 / nvidia path), renders no block-size and
      passes at vllm''s default — an inconsistency between two artifacts of one model that is the generator''s to
      resolve. Matrix vllm-0.30.0: 110/1/13 -> 109/2/13 (V4.1 fp8 pass -> pass+custom). Identity now includes
      DeepseekCompressor, DeepseekV4Indexer (deep_gemm sm90_fp8_mqa_logits / paged + sched metadata,
      cp_gather_indexer_k_quant_cache, topKPerRowPrefill, cooperative_topk) and the candidate filter
      (_block_scores / _candidate_flags / _mask_candidates / _store_candidates). RESIDUE for the owner''s granularity
      call (unlabeled by the sm90 taxonomy on purpose): compressor glue (_fused_save_compress_norm, _rope_quant_insert,
      _ring_slot_mapping), indexer-K store (_indexer_k_norm_rope_quant_store), the candidate kernels, engram
      (_hash_ids / _engram_lookup / _fused_engram_post_wkv / _gather_lookback) and the cute-DSL LL bf16 router-gate
      GEMM. sglang main (nightly-dev-20260930-cae69be5, exploratory, not a pin): all four V4.1 runs PASS (fp8 rendered,
      fp8_e4m3 KV, NVFP4 x2 with the dsv4 marlin customization — runner=auto refuses NVFP4 on SM90 as for V4): backend
      DeepseekV4AttnBackend, pool DeepSeekV4TokenToKVPool fp8, sparse_prefill_fwd + FlashMLA sparse decode (same sm90
      sparse kernels as vllm), but the indexer runs an fp4 index-K path (_quantize_fp4_indexer / _fp4_index_logits /
      _store_fp4_index_k_cache) instead of vllm''s DeepGEMM fp8 mqa_logits, engram as _engram_hash/_gather/_gate. Before
      the dummy fix the same run OOMed allocating the full engram table (183 GiB fp16 temp in initialize_dummy_weights).
      sglang 0.5.20 (newest release) and trtllm 1.3.0rc29 do not support V4.1 (no model/config class), unchanged.
      Probe-side compatibility for sglang main (probe_sglang.py): ServerArgs is a msgspec Struct, bench_one_batch moved
      to sglang.benchmark.one_batch, config initializers take no args after publish(server_args); the generator still
      renders `--cuda-graph-bs` which main splits into -decode/-prefill (one-off queue patch, argv stale vs plan by
      design). COLLECTOR GAPS (unchanged): dsv4 case declarations for compress ratio 2/1 source/consumer layers and the
      candidate filter; engram op; SDK composition by source/consumer layer counts.'
    applies_to:
    - deepseek-ai/DeepSeek-V4.1-Flash
    - nvidia/DeepSeek-V4.1-Flash-NVFP4
    - baerquant/Inkling
    - framework:vllm-0.30.0
    - framework:sglang-main-2026-09-30
    - instrument:dummies
    - platform:sm90
  dsv41_generator_profile_block_size_2026_10_01:
    statement: 'FOLLOW-UP to dsv41_dummy_cut_and_vllm_block_size_2026_10_01 (owner request: fix the generator default
      instead of carrying a harness override). facts/models.yaml now has a `deepseek-v4.1` profile (match
      deepseek-ai/DeepSeek-V4.1*, nvidia/DeepSeek-V4.1*; arch DeepseekV41ForCausalLM; model_type deepseek_v41) whose
      vllm defaults are trust-remote-code + block-size 64 + no-enable-flashinfer-autotune and whose sglang defaults
