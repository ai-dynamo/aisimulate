  unalignable_ops_followup_2026_09_24:
    statement: |
      Follow-up on the "no serving reference" ops (owner 2026-09-24: "if running
      it produces evidence, run it; if load crashes, try to fix it").
      - encoder_attention: FIXED without a multimodal prompt. Engine construction
        runs vLLM's own profile_run (full-model dummy forward; for VL models it
        pushes max-size dummy images through the vision tower). probe_vllm now
        records that run as profile_run_kernels and build_ops counts it as
        identity evidence. Qwen3-VL-2B ViT: FlashAttnFwdSm90 x24 layers in
        serving; collector encoder_attention (FLASH_ATTN for vit attention,
        head_dim 64) -> ALIGNED.
      - DeepSeek-V4 on vllm: the load crash is the rendered
        --max-num-batched-tokens 6012 (cutedsl compress asserts 64-byte
        slot-mapping alignment). The harness golden renderer runs the aic/
        checkout of aiconfigurator, not aisimulate, so the fix branch
        (fix/generator-round-vllm-batched-tokens) never reached it. Mirrored
        the rounding into aic/ (a71f27955: rule_plugin/vllm.rule,
        benchmark/vllm.rule, backend_config_mapping.yaml); the 24 planned DSV4
        goldens re-render at 6016 and are being re-probed. Planning via
        probe_driver is currently blocked by the roster gate ("no fetched
        config for zai-org/GLM-5.3-FP8 — OWNER DECISION NEEDED"); the goldens
        were rendered through render_golden() on the existing plan entries.
        The product fix still needs the aisimulate branch merged.
      - Kimi-K3: vllm 0.29.0 ships K3 natively (KimiK3ForConditionalGeneration,
        vllm/models/kimi_k3/nvidia/kda importable) — the collect_kda docstring
        ("kimi-k3 preview image") is stale. K3 0.29 records exist with kernel
        tables; their kernels were unlabeled (FlashKDA _flash_kda_fwd_*,
        kda_decode_fusion_many_heads, attn_res, layer_norm_gated, situ_and_mul)
        — taxonomy rules added under the vocabulary names (flashkda,
        vllm_kernel). K3 records are being re-probed cache-cold; the kda op
        capture follows.
      - bf16-gemm MLA cells: CONSUMED. The MLA module tables carry a gemm_quant
        axis (crates/core/src/perfmodel/perf_database/mla.rs: query_context_module /
        query_generation_module take GemmQuantMode); any aisimulate run that
        models an MLA architecture with gemm_quant_mode=bfloat16 reads them
        (readiness.rs even tests DeepseekV4 + bfloat16). They measure vLLM's
        own bf16-weight dispatch (fused_a_gemm at num_tokens<=16) — faithful
        to what vLLM would run, just with no deployed checkpoint to cross-check.
      RESULTS (same day): 24 DSV4 vllm records + 6 K3 records re-probed clean
      (6016 budget; first DSV4 serving evidence on vllm: sparse_attn_fwd,
      cute-DSL compressor/indexer, mHC TileLang). Verdicts: dsv4_csa/hca
      context+generation, dsv4_hca_attn, dsv4_paged_mqa_logits -> ALIGNED vs
      sgl-project/DeepSeek-V4-Flash-FP8 fp8; kda_ctx -> ALIGNED after fixing
      the collector's FlashKDA prefill call (0.29 takes caller-owned
      out/final_state/workspace buffers, kda.py:193-215/536-547; the
      preview-era call raised TypeError on every context cell). Two
      divergences are EXPLAINED and deliberately kept out of the gate:
        - mhc_module: serving runs mhc_pre_big_fuse_WITH_NORM (norm_weight
          passed, tilelang.py:90) and mhc_fused_post_pre for middle layers;
          the collector measures the norm_weight=None pre + separate post
          because the SDK bills attn_norm separately (collect_mhc_module.py:
          118-134, measured 1-2% off the fused path). Row-semantics contract;
          switching needs a producer+consumer decision.
        - kda_gen: the collector measures BOTH the fused decode
          (ops.fused_kda_decode = kda_decode_fusion_many_heads, serving's
          pure-decode path, kda.py:686-695) and the Triton fallback lane
          (causal_conv1d_update + fused_recurrent_kda_packed_decode, taken by
          serving only for spec-decode / mixed batches). The fused row matches
          serving kernel-for-kernel; the fallback rows are collector-only by
          construction. A verdict per kernel_source lane would express this;
          today's subset semantics cannot.
      sglang/trtllm evidence: 45 length-conditional records re-probed with the
      fixed probes (isl 4096, cache-cold, phase tables). sglang DSA prefill at
      isl 32 was dense FA3 (SGLANG_DSA_PREFILL_DENSE_ATTN_KV_LEN_THRESHOLD:
      use_mha when max_kv_len is short, dsa_backend.py:2999-3012 @0.5.16);
      at 4096 it is sparse_attn_fwd — the old sglang prefill evidence was
      the dense fallback. The old sglang fp8-KV decode evidence (flashmla_kv)
      came from a retired probe injection (--kv-dtype fp8_e4m3): the golden
      sglang CLI for fp8 profiles renders NO kv dtype, so current serving
      truth is bf16 KV (dsa prefill flashmla_sparse, decode fa3). Added the
      kv variant to sglang planning (fp8_e4m3) so the fp8-KV DSA/MLA paths are
      probed as a separate, labeled config. 5 trtllm records were probed on
      trtllm-probe:1.3.0rc20-onnxfix, an image no longer present — not
      re-probed. 8 DSV4 sglang runs exhausted the probe's fixed 16384-token
      KV pool at isl 4096 (multi-cache-group) — pool now scales with isl;
      rerun in progress.
    applies_to:
    - instrument:probe_vllm
    - instrument:probe_sglang
    - instrument:render_golden
    - framework:vllm-0.29.0
    - framework:sglang-0.5.16
    - platform:sm90
    - family:dsv4
    - moonshotai/Kimi-K3
    - Qwen/Qwen3-VL-2B-Instruct
  taxonomy_dsa_nsa_family_covers_m3:
    statement: 'RESOLVED 2026-09-23: M3 sparse-attention kernels now label `triton` (the vocabulary name of
      MiniMaxM3SparseTritonImpl), dsa_nsa is DeepSeek-DSA only; see probe_prefill_prefix_cache_contamination.
      Original: NAMING DEBT: the kernel_taxonomy family "dsa_nsa" matches MiniMax-M3 sparse-attention kernels
      too (sparse_attn_fwd/_gqa_share_sparse/_merge_topk_attn_out/_decode_score are models/minimax_m3 Triton
      kernels, ops/sparse_attn.py). Verdicts are computed within-family by kernel-name overlap so the lumping
      is functionally harmless today, but the family name misleads readers of verdict files. Rename (e.g.
      block_sparse_attn) or split when the owner next touches the taxonomy.'
    applies_to:
    - instrument:kernel_taxonomy
    - MiniMaxAI/MiniMax-M3
    - deepseek-ai/DeepSeek-V3.2
  cross_sm_evidence_contamination:
    statement: 'HARNESS STRUCTURAL LESSON (B300 first run outside H20, 2026-09-20): gate evidence keyed by
      (fw, version) alone let a fresh arch INHERIT another arch''s green checks — with zero B300 jobs run,
      workflow_check --param sm=sm103 reported path_aligned (7 sm90 verdicts) and customizations_retested (9 sm90
      records), and saving B300 verdicts would have OVERWRITTEN the sm90 files. Same class: kernel_taxonomy was a
      de-facto SM90 vocabulary (Blackwell fmhaSm103a*/fmhaSm100f*/sm100 cutlass/deepgemm-sm100/fp4 kernels all
      unmatched -> attn path_diff went "empty vs empty" ALIGNED, a false green; missing serving kernels made dsa
      falsely diverged); per-checkpoint customizations keyed (repo, fw) carried a 143GB-H20 memory workaround to a
      275GB B300. Fixes landed on H20: results/pathdiff/<sm>/<fw>-<ver>/ + results/retests/<sm>/<fw>-<ver>.yaml
      (sm90 evidence git-mv''d; sm103 view now shows honest todos), and path_diff emits "inconclusive" when the
      collector signal set is empty (B300 patch, pending). Rule going forward: SM is a first-class dimension of
      gate evidence, taxonomy rules (arch-anchored + audited against other arches'' records before merge),
      customization facts, and case plans; editing a shared file re-opens verdicts for every SM with shipped data
      (unverified_sms when no box is available). Collectors do NOT fork per arch — dispatch stays the framework''s.'
    applies_to:
    - instrument:workflow_check
    - instrument:kernel_taxonomy
    - instrument:path_diff
    - platform:sm90
    - platform:sm103
  vllm_0290_full_op_sweep:
    statement: 'FULL-GRID VALIDATION of the in-place 0.29 upgrade (H20, 4 GPUs, 2026-09-20/21, ~290k perf rows,
      15 op tables finalized to parquet; evidence workspace facts/opsweep_full_0290/ incl. TRIAGE.md + staging_patch.diff
      — the staging rehearsal that became commit 993f9cdf). Row parity vs 0.24/0.25 baselines: gemm 111444 (exact),
      attention ctx/gen 53777/66708 (exact), computescale/scale_matrix/encoder/mla_bmm exact, msa+gdn above baseline,
      moe 58k. ALL four failure clusters root-caused, ZERO 0.29 regressions and ZERO upgrade-code bugs: (1) msa
      Triton CompilationError 1616x = kernel domain boundary — sparse_num_index_heads shards to non-power-of-2 at
      collector heads 48/96, unreachable in serving (real tp gives 4/2/1); (2+3) attention fp8-KV 1625x = HISTORICAL
      blank: 0.24/0.25 baselines contain zero fp8 rows (100% bfloat16), the grid always swept an unsupported region,
      only the error text changed; (4a) dsa ctx fp8-KV 776x = flashmla int64_stride_to_int input constraint on the
      NEW fp8 collection key — FIXME(kernel-limit) class; (4b) dsa gen IMA ~4% = RACE, audit complete
      2026-09-22: bisect exonerated the block-table fix (22 vs 19 fails on identical 300 cases) AND cudagraph
      (eager 21/300) AND the topk buffer (allocation parity with serving — both torch.empty; poison prefill 2e9
      and -1 both pass); CUDA_LAUNCH_BLOCKING pins the faulting kernel to vllm-flash-attn Hopper flash_fwd
      (flash_fwd_launch_template.h:205); compute-sanitizer memcheck serializes and the fault VANISHES (8/8, 0
      errors) — a timing race in the 0.29 FA3 sparse-MLA decode chain, worth reporting upstream. Recovery is
      operational: failures are stochastic with ~75%/round retry recovery, geometric to near-zero
      (GLM gen 300->70->17->5->2 of 8832; DeepSeek 346->106->28->8) — --resume-retry-failed sweeps recover the
      rows without touching measurement semantics. ADDENDA: (2+3) VERDICT FLIPPED AGAIN 2026-09-22 via live-engine
      probe — collector-specific, NOT a framework selector gap. head_dim=512 dense attention comes only from
      Gemma-4 (global layers: global_head_dim=512, num_global_key_value_heads=2). Real vllm serving of Gemma-4 with
      --kv-cache-dtype fp8 on SM90 GENERATES fine: Gemma4Config.verify_and_update_config
      (model_executor/models/config.py:209-256) is a model-level hook that, for heterogeneous head dims (256/512),
      forces FA4 for all layers (or TRITON_ATTN fallback) because default FA3 on Hopper cannot handle head_dim>256
      — so serving NEVER routes Gemma-4 head512 to FlashInfer (resolved backend TRITON_ATTN, candidate list
      [TRITON_ATTN]). collect_attn constructs the attention in isolation and calls the bare platform selector
      (get_attn_backend_cls) WITHOUT running that model hook, so it picks FlashInfer whose SM90 JIT cannot compile
      fp8+head512 -> the 1625 dsa... i.e. attention fp8 failures. Same class as DSA 4a / Gemma monolithic: the
      collector reproduces a backend serving never selects. Fix: the collector must select the backend serving
      actually uses for head_dim>256 (apply the Gemma4 heterogeneous-head override: FA4/Triton, never FlashInfer),
      with the config.py:209-256 citation. Evidence facts/gemma4_fp8_probe (GENERATE OK, TRITON_ATTN). (4a) VERDICT FLIPPED 2026-09-22 via live-engine probe:
      collector-specific, NOT a framework limit. fp8-KV + num_heads<32 (the collector head-sweep emulating TP>=5)
      selects fp8 mixed mode (MIN_HEADS_FOR_BF16_PREFILL=32, flashmla_sparse.py:63/307), which runs the whole batch
      as one MQA batch through the fp8 decode kernel (head padding 16->64); the collector builds the prefill as a
      SINGLE monolithic forward so num_actual_tokens=isl(32768) and stride = tokens*padded_heads*576 breaks int32.
      Real-engine tests (8 GPUs idle): TP=1 native-128-heads isl=32k fp8 runs (separate bf16 splitkv path); TP=8
      (16 heads/rank -> the SAME mixed fp8 decode kernel, padding 16->64) fed a 32768-token prompt -> GENERATE OK.
      Serving chunks the prefill (max_num_batched_tokens), keeping per-forward num_actual_tokens well under 29k;
      the collector does not chunk. Fix: the collector context construction should mirror serving''s chunked prefill
      (split at max_num_batched_tokens) -- this both removes the 776 failures AND makes large-isl context rows
      faithful to how serving actually invokes the kernel (the monolithic measurement is itself non-faithful for
      large isl; even the passing large-isl context rows warrant review). Evidence
      facts/ab_dsa_stride_{oneshot,tp8}.json.
      (1) msa kernel limit converted to an invocation-site guard raising a classified error with the framework
      citation (commit c0f7f035). dsv4 full-grid rerun on the merged lane, FINAL:
      22589/22604 collected (99.93%) across 6 ops — generation 3088/3088, paged_mqa_logits + hca_attn 3918/3918
      each, hca ctx 5840/5840 after retries; the sole residual is a DETERMINISTIC 15-case subcluster in csa ctx,
      all one shape family (seq=16 chunk + batch=64 + fp8-KV + prefix=4096, both FP8 checkpoints, heads 1-8) —
      the fp8 csa large-prefix small-tail-chunk path; classified, re-tested free on the next version bump.
      Harness lessons banked: PerfFile.SCALE_MATRIX enum gap (fixed), measurement containers must never share host
      network (setup_distributed port collisions), collection images need deps pre-baked, executor ignores --ops
      CLI order, sharding is manual via --case-filter.'
    applies_to:
    - framework:vllm-0.29.0
    - platform:sm90
    - instrument:collect.py
