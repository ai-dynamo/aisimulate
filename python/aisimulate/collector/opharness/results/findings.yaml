  sm120_config_ab_2026_09_30:
    statement: 'CONFIG-OR-FRAMEWORK A/B for every non-SDK-gap fail cell on sm120 (owner question: is the rendered config
      wrong, and does the framework hint at a backend/flag that makes it boot). Method: the rendered run.sh with ONE
      extra engine arg appended, same dummy, same image, same probe (facts/ab_sm120/<id>_<suffix>.{sh,json}).
      RESULTS. (a) NVFP4 MLA checkpoints (nvidia/Kimi-K2.5-NVFP4 691d6cce3327, nvidia/DeepSeek-V3.1-NVFP4 f157c1c39890, nvidia/Kimi-K2.6-NVFP4 9c912acc9024, nvidia/Kimi-K2.7-Code-NVFP4 c91c53ea605c):
      + --kv-cache-dtype bfloat16 -> PASS on all four (identity TRITON_MLA bf16 KV, DeepGEMM sm120 linears). So the cell IS
      config-rescuable: the checkpoint''s hf_quant pins fp8 KV, and on cc 12.0 the only non-sparse MLA backend that
      declares support is TRITON_MLA (enumerated: FLASHINFER_MLA / CUTLASS_MLA / FLASHMLA / FLASH_ATTN_MLA /
      TOKENSPEED_MLA all report cc12=False), whose fp8-KV decode kernel overflows smem — bf16 KV is the only route.
      GENERATOR GAP: params.agg.kv_cache_dtype=bfloat16 renders `--kv-cache-dtype auto` (backend_config_mapping.yaml
      kv_cache_dtype guard "vLLM doesn''t accept bfloat16") and auto re-resolves to the checkpoint''s fp8 -> the
      rescue cannot be expressed through the generator today; vllm 0.30.0 accepts the literal bfloat16 (this A/B).
      Bucket-1 candidate: drop/condition the guard, and an SM120 rule "MLA + quantized KV -> kv_cache_dtype bfloat16".
      (b) DeepSeek-V3 / R1 / Kimi-K2 fp8-KV probe variants: + --max-num-seqs 64 --max-num-batched-tokens 4608 -> same
      smem failure (kernel tile config, not batch); no alternative backend exists (see a). Not a config issue; the
      rendered default (bf16 KV) passes.
      (c) DeepSeek-V4.1-Flash (both repos): + --attention-backend FLASHINFER_MLA_SPARSE_DSV41 / TRITON_MLA, + --max-num-seqs
      32, + --block-size 64 / 128 / 256 -> all FAIL with the same "no decode kernel ... page_block_size=32". Root: the DSV41 sm120
      backend pins kernel block size [128] (models/deepseek_v41/nvidia/flashinfer_sparse.py:112) and computes the
      compressed-layer page as block_size // compress_ratio = 128 // 4 = 32 (:759, :839), while FlashInfer''s sm120 DSV4
      decode requires page 64 (_DECODE_DSV4_PAGE_BLOCK_SIZE = 64; (64,128) IS in _DECODE_DSV4_DISPATCH). No engine flag
      reaches that arithmetic -> framework gap, upstream-report candidate (vllm/flashinfer sm120 DSV4.1 decode).
      (d) Kimi-K3 fp8-KV variant: + --attention-config {"use_prefill_query_quantization": true} (the flag vLLM''s own
      assertion names) -> same AssertionError: on sm120 the prefill backend is FA2, which cannot consume fp8 queries
      (mla_attention.py determine_prefill_query_data_type -> backend_supports_prefill_query_quantization False), so the
      flag is silently ignored and the K3 assert fires. fp8 KV for Kimi-K3 is not reachable on sm120 by any flag; bf16 KV
      (the rendered default) passes. Arch-neutral half of this is already in findings (0.29 K3 followups).
      (e) nvidia/Nemotron-H-56B-Base-8K: bare render OOMs on 72GB too; + --max-num-seqs 64 (no gpu-memory-utilization)
      -> PASS, confirming the root knob is max_num_seqs on sm120 as on sm90; the generator still floors max_batch_size
      at 512 (vllm.rule) so the expressible rescue stays extra_cli_args gpu-memory-utilization 0.6 (retest: still_needed).
      (f) capacity cells (Qwen3.8-2.4T x3, Llama-4-Maverick, Nemotron-Ultra-NVFP4 single-kind cut): dummy weights do not
      fit 72GB — not a config question; no A/B.'
    applies_to:
    - platform:sm120
    - framework:vllm-0.30.0
    - nvidia/Kimi-K2.5-NVFP4
    - nvidia/Kimi-K2.6-NVFP4
    - nvidia/Kimi-K2.7-Code-NVFP4
    - nvidia/DeepSeek-V3.1-NVFP4
    - deepseek-ai/DeepSeek-V4.1-Flash
    - nvidia/DeepSeek-V4.1-Flash-NVFP4
    - moonshotai/Kimi-K3
    - nvidia/Nemotron-H-56B-Base-8K
  sm120_collector_gemm_fp8_static_row:
    statement: 'COLLECTOR-SIDE DISPOSITION of the gemm_fp8 divergence (serving-parity audit + owner decision, 2026-09-30).
      Audit: vLLM 0.30.0 selects the fp8 scaled-mm kernel by activation scheme — FlashInferFP8ScaledMMLinearKernel is
      first in _POSSIBLE_FP8_KERNELS (kernels/linear/__init__.py:421-430), is_supported needs CC >= 100
      (scaled_mm/flashinfer.py:50-51), can_implement needs per-tensor activation AND weight scales (:56-63). ModelOpt
      FP8 checkpoints (quant_algo FP8, static input_scale; modelopt.py:2333) satisfy it -> serving log "Selected
      FlashInferFP8ScaledMMLinearKernel for QKVParallelLinear/RowParallelLinear/MergedColumnParallelLinear"
      (facts/ab_sm120/da1900656836_baseline_log.log) -> cutlass MainloopSm120TmaWarpSpecializedBlockwiseScaling +
      cuBLAS sm89_xmma at M=1. The collector''s `fp8` row is Fp8Config(activation_scheme="dynamic") -> can_implement
      False -> CutlassFP8ScaledMMLinearKernel (op_smoke confirms). Reproduced in isolation: static vs dynamic Fp8Config
      on one shape selects FlashInfer vs Cutlass (facts/ab_sm120/opcov_gemm_fp8_static_probe.json). fp8_static was NEVER
      a collected row: the SDK derives it from the dynamic fp8 row + compute_scale + scale_matrix
      (perf_database._gemm_key_names), which presumes one shared GEMM kernel — true below CC 100, false on SM100/103/120.
      Every per-tensor FP8 checkpoint in the roster is ModelOpt static, so the gemm_fp8 gate never had a faithful
      serving reference (sm90 aligned by coincidence). OWNER DECISION (tianhaox): do NOT add a collected fp8_static row
      (a trial implementation was validated — op_smoke kernel_source=FlashInferFP8ScaledMMLinearKernel, gate aligned —
      and then reverted); handle it as a governed approximation: collector/evidence_exceptions.yaml standards_exceptions
      entry "fp8_static derived ... CC>=100" (scope gemm_perf / vllm 0.30.0 / CC>=100 systems, expires 2026-12-31),
      gemm_fp8_Llama-3.1-70B-FP8 stays an explained deviation (facts/pathdiff/explained_0300). MLA fp8-KV on sm120
      (mla_gen_fp8 capture crashes like serving) is a framework-version gap with no YAML home (failure_handling.md): the
      case fails classified and re-tests on the next pin bump; no registry unverified_sms mark since the bf16-KV rows
