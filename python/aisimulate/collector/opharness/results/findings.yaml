        Capture precision must match serving: gemm_type=bfloat16 shows a false
        fused_a-projection drift (cutlass vs fp8_blockscale); use fp8_block.
      FOLLOW-UP RESOLVED 2026-09-24 (measured, not read): the Gemma-4 case
      file declares sglang_backends {90: triton, ...} on every attention
      profile (head_dim 256 and 512), which overrides collect_attn's default
      SM90->fa3 table; op_smoke case 168 (Gemma4ForConditionalGeneration,
      head_dim 512, triton) captured _fwd_kernel/_fwd_kernel_stage2 = the
      serving record's TritonAttnBackend kernels -> ALIGNED
      (attn_ctx_hd512_gemma-4-26B-A4B). Original: (unconfirmed, needs an
