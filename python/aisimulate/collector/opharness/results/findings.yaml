    - instrument:path_diff
    - instrument:kernel_taxonomy
    - platform:sm90
  trtllm_kv_dtype_variants_2026_09_24:
    statement: |
      trtllm was the only backend whose fp8-KV path was never compared. Now:
      probe_trtllm --kv-dtype overrides the rendered kv_cache_config.dtype
      (recorded as probe_kv_cache_dtype + probe_overrides; the KV manager's
      resolved dtype is the ground truth), probe_driver plans a `fp8` variant
      per trtllm run (rid tag kvfp8), and the verdict helper pins the bf16
      entries to kv auto so a variant record can never be picked for them.
      Four fp8-KV records probed (framework mode): Llama-3.1-8B, DeepSeek-V3,
      Qwen3.5-0.8B (KV manager DataType.FP8 on all three), DeepSeek-V3.2 —
      which FAILS at load: `RuntimeError: Expected kv.dtype() ==
      torch::kBFloat16` inside flash_mla_interface (mla.py forward_sparse ->
      flash_mla). trtllm 1.3.0rc23 sparse MLA (DSA) requires bf16 KV; there is
      no fp8-KV DSV3.2 serving instance on this pin, so the collector's DSA
      fp8-KV rows (_get_precision_combos adds ('bfloat16','fp8') for dsa on
      SM>=89) measure a path serving cannot run. Kept OUT of the gate (no
      serving record); the collector rows are not wrong data, they are
      unreachable data — flag to the trtllm collector owner, retest on the
      next pin.
      Single-cell captures at the bf16 gate cells with fp8 KV
      (components/captures/trt_kv/): attention context and generation
      (Llama, use_fp8_kv_cache=True) ALIGNED — serving keeps the bf16
      context FMHA and writes fp8 KV; the use_fp8_context_fmha=True cell
      (e4m3 FMHA) is NOT Llama's serving path but IS DeepSeek-V3's
      (fp8 weights + fp8 KV -> fmha_v2_flash_attention_e4m3 in the record);
      MLA context + generation (DeepSeek-V3, kv 'fp8' + gemm fp8_block)
      ALIGNED. Lesson repeated: a substring --case-filter picked a head_dim
      64 sliding-window cell first; the captures use --case-prefix with the
      full leading tuple.
      Also fixed on the way: the archived sglang MiniMax-M3 bf16 record was
      the eager run (the graph-mode raw had only been used via
      --serving-raw); superseded by the graph-mode raw so msa_gen holds
      under kv auto. Gates: vllm 33 / sglang 16 / trtllm 13 aligned.
      A/B (GLM-5.2-NVFP4, trtllm rc23, KV forced to bfloat16 to escape the
      sparse-FlashMLA bf16-KV assert): llmapi REFUSES it — "Overriding KV
      cache quantization with an invalid type ... Accepted types are
      ('fp8', 'nvfp4', 'auto')" (facts/trt_kv/glm52nvfp4_kvbf16.json). So an
      NVFP4 DSA artifact (hf_quant kv_cache_quant_algo FP8) has NO servable
      KV dtype on trtllm rc23 / SM90: auto and fp8 hit the kernel assert,
      bf16 is rejected at config validation. Every NVFP4 DSA cell in the
      trtllm matrix (GLM-5 / 5.1 / 5.2 / 5.3-NVFP4, DeepSeek-V3.2-NVFP4) fails
      for this one reason; upstream item 4 in facts/upstream_reports_2026-09-24.md.
    applies_to:
    - instrument:probe_trtllm
    - instrument:probe_driver
    - instrument:path_diff
    - framework:trtllm-1.3.0rc23
    - platform:sm90
    - deepseek-ai/DeepSeek-V3.2
    - deepseek-ai/DeepSeek-V3
    - meta-llama/Meta-Llama-3.1-8B
  glm53_onboarding_2026_09_24:
    statement: |
      GLM-5.3 trio probed on all three backends after the rename (18 runs:
      rendered + kv variant per backend; owner: "5.3 吧"). Matrix cells
      (rendered config, framework mode):
        vllm 0.29.0   GLM-5.3 (fp8) PASS FlashMLASparseImpl / Fp8MoE->triton_fused_moe;
                      GLM-5.3-BF16 PASS FlashMLASparseImpl / UnquantizedFusedMoE->triton_fused_moe;
                      GLM-5.3-NVFP4 FAIL (kv auto -> fp8_e4m3, no MLA backend; the
                      explicit fp8 variant PASSES with FlashMLASparseImpl — see the
                      vllm_fp8kv 0.29 addendum; generator should render
                      --kv-cache-dtype fp8 for NVFP4 DSA on vllm 0.29).
        sglang 0.5.16 all three PASS (DeepseekSparseAttnBackend; NVFP4 MoE ->
                      ModelOptNvFp4FusedMoE->marlin on SM90); fp8_e4m3 variants
                      pass too.
        trtllm rc23   GLM-5.3 PASS (DeepSeekFP8BlockScalesFusedMoE), GLM-5.3-BF16
                      PASS; GLM-5.3-NVFP4 FAIL: the artifact is modelopt
                      MIXED_PRECISION (87 per-layer entries: FP8 dense mlp
                      projections + NVFP4 experts — GLM-5.2-NVFP4 was pure NVFP4)
                      and modeling_deepseekv3.py:1298 asserts "MIXED_PRECISION is
                      ambiguous" for every decoder layer -> unloadable on this
                      pin (real artifact property, not a dummy artifact; the
                      dummy keeps the top-level algo). fp8-KV variants of all
                      three fail at load like every DSA model on trtllm rc23
                      (sparse FlashMLA asserts bf16 KV, see trtllm_kv_dtype_variants).
      HARNESS GAP found: gen_dummy_models writes config.json only; the
      tokenizer files every dummy dir needs were provisioned once by hand
      (2026-09-19) and NO script does it for a new roster repo. GLM-5.3-BF16's
      six runs first failed on "Couldn't instantiate the backend tokenizer"
      (vllm/sglang at load, trtllm at generate: end_id needs a tokenizer);
      fixed by copying tokenizer.json / tokenizer_config.json /
      generation_config.json / chat_template.jinja from the GLM-5.3 sibling,
      then re-probed. workflow_check already flags bare dirs ("variants
      missing tokenizer"); onboard_model step 1 should own the copy.
      MATRIX BUILDER DEFECT found and fixed the same hour: build_matrix took
      ONE plan file per backend (the newest carrying the pin) and the version
      from whichever backend's run came last in that file — the 18-run GLM-5.3
      plan produced an 18-cell matrix named *-1.3.0rc23.yaml for all three
      backends. Now every plan file carrying (backend, pin) contributes, only
      rendered (non-kv-variant) runs define cells, a passed cell is never
      overwritten by a later crash/no-raw run, counts are recomputed, and the
      cell's identity/kv_allocated comes from the rendered record (variant
      records exist for the same repo x backend). Matrix: 98 models per
      backend (95 + the trio); vllm 84 pass / 9 pass+custom / 5 fail (DSV4
      cells flipped fail -> pass+custom from the 6016-budget re-render),
      sglang 86 / 6 / 6, trtllm 62 / 0 / 36.
    applies_to:
    - zai-org/GLM-5.3
    - zai-org/GLM-5.3-BF16
    - nvidia/GLM-5.3-NVFP4
    - instrument:probe_driver
    - instrument:dummies
    - framework:vllm-0.29.0
    - framework:sglang-0.5.16
    - framework:trtllm-1.3.0rc23
