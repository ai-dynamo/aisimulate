  vllm_0290_dsa_attention_swap:
    statement: 'vllm 0.29.0/SM90: the sparse-MLA/DSA attention path changed implementation — probes now record FlashAttnMLASparseImpl
      and the 0.24-era dsa_nsa/triton kernel-family mix no longer appears for DeepSeek-V3.2 and the GLM-5.x family
      (7 models, all still pass). Consequences: (1) attention perf data for these models must be recollected on
      0.29; (2) kernel_taxonomy.yaml needs rules for the new kernel names before attention identity is machine-adjudicable
      again (backlog). Also observed: Kimi-K2.5 W4A16 MoE binding class renamed (CompressedTensorsWNA16MarlinMoEMethod
      -> CompressedTensorsWNA16MoEMethod) while the executed kernel is unchanged (marlin_moe_wna16::Marlin) — class
      names alone are not identity. Evidence: records.jsonl 0.24-vs-0.29 diff, 2026-09-19.'
    applies_to:
    - deepseek-ai/DeepSeek-V3.2
    - zai-org/GLM-5
    - zai-org/GLM-5-FP8
    - zai-org/GLM-5.1
    - zai-org/GLM-5.1-FP8
    - zai-org/GLM-5.2
    - zai-org/GLM-5.2-FP8
    - moonshotai/Kimi-K2.5
  vllm_0290_dsa_blackwell_paths_unvalidated:
    statement: 'HARDWARE-VALIDATED on B300/SM103 2026-09-20 (upgrades the source-derived pre-read; evidence
      results/pathdiff/sm103/vllm-0.29.0/*.json in the B300 workspace, pending its patch landing): backend selection
      matched the pre-read — DSA ctx bf16 -> FLASHMLA_SPARSE (2.42ms b1 s512), fp8 -> FLASHINFER_MLA_SPARSE (1.58ms);
      MSA -> MiniMaxM3SparseMSAImpl; dense attn -> flashinfer trtllm prefill/decode. The 029 lane construction
      carried over with ZERO arch edits — the one bug found was arch-NEUTRAL: the lane handed the indexer builder
      block_table_width=get_block_table_width(max_model_len)=64 while its own block_table_tensor had ceil(seq/block)=32
      columns; serving allocates the table AT the width (v1/worker/block_table.py) so builders assume equality, and
      only the family-100 decode path reads the expanded buffer (indexer.py:609,745) — latent on SM90. Fixed by
      zero-padding the table to the width; SM90 re-smoke green (gen bf16 0.190ms FLASH_ATTN_MLA_SPARSE, fp8 0.187ms
      FLASHMLA_SPARSE, ctx 1.97ms) and all 3 sm90 dsa verdicts re-emitted aligned. CORRECTION to the pre-read:
      "B200 = B300 on the vllm chain" holds only at DISPATCH level (family-100, no 103 special-case) — at kernel
      identity level B300 prefill runs fmhaSm103a* cubins while decode runs fmhaSm100f* (B300 probe evidence), so
      SM100 and SM103 need separate perf rows. Prior pre-read kept for the record: FLASH_ATTN_MLA_SPARSE is
      major==9-only (flashattn_mla_sparse.py:71-72); indexer family-100 uses varlen_paged_mqa_logits
      (indexer.py:475-503); SM120: TRITON_MLA + FLASHINFER_MLA_SPARSE_SM120 (cuda.py:130-134). DSA attention perf
      rows remain strictly per-SM.'
    applies_to:
    - family:sparse_attention
    - platform:sm100
    - platform:sm103
    - platform:sm120
  vllm_0290_dsa_lane_indexer_drift:
    statement: 'RESOLVED 2026-09-19 (same day): the 029 lane now constructs the serving-same DeepseekV32Attention
      (vllm.models.deepseek_v32.attention:118 — 0.29 routes DeepseekV32ForCausalLM to the DSV32-specific fused implementation,
      registry.py:94) instead of the generic DeepseekV2MLAAttention the 0.24 collector used. Adaptations, each serving-cited:
      forward arity (positions, hidden_states — no residual arg), forward_context.slot_mapping dict populated per
      layer name (attention.py:303-306), perf-log layer accessor (DSV32Attention IS the MLAAttention layer, no .mla_attn
      nesting). path_diff verdicts ALL ALIGNED (bf16 s512, bf16 s4096 sparse branch, fp8-kv) with zero kernel drift
      — the fused prelude (fused_norm_rope) now matches serving, and the short-seq dense/sparse branch puzzle dissolved
      with the module swap (same class, same branch logic). Perf delta of construction parity (H20, same GPU, back-to-back):
      context b1 s512 1.76→1.97 ms (+12% — the fused serving prelude is SLOWER at tiny seq here), context b1 s4096
      26.25→26.88 ms (+2.4%), generation b4 s2048 0.209→0.189 ms (-9.6%). Non-trivial deltas = the old construction
      was mispricing the module; serving-parity rows are the only trustworthy ones. Legacy construction remains
      behind AIC_DSA_LEGACY_MODULE=1 for A/B only (loud banner, never for data).'
    applies_to:
    - family:sparse_attention
    - collector.vllm.collect_mla_module_029
  vllm_0290_dsv4_cutedsl:
    statement: 'CORRECTED 2026-09-19 (retracts the same-day ''framework regression, family dead'' verdict): DSV4
      RUNS on vllm 0.29.0/SM90 — the crash is a CONFIG-TRIGGERED alignment bug, single-variable isolated. Trigger:
      the generator renders --max-num-batched-tokens 6012; the runner slices per-group slot mappings as rows of a
      2D buffer with row width = max_num_batched_tokens, so a non-multiple-of-8 budget puts every row after the
      first at a 64B-misaligned int64 offset (6012*8=48096 bytes, not /64), and DSV4 is multi-cache-group (MLA main
      + compressor state + indexer) so its state-cache slot_mapping lands on a misaligned row — cutedsl''s tvm_ffi
      wrapper asserts 64B alignment on argument #3 (slot_mapping, NOT state_cache as first written). A/B on the
      pristine 0.29 image, same dummy: minimal args PASS (full request, whole DSV4 path executes: cutedsl compress,
      fused indexer_q, dsv4_topk, FlashMLA decode metadata, deep_gemm fp8 — facts/ab_dsv4_minargs_trace_0290.json,
      probe_isl 4096); minimal + 6012 reproduces the Misaligned error verbatim (ab_dsv4_tok6012_0290.json); minimal
      + 6016 (=64*94) PASSES (ab_dsv4_tok6016_0290.json). Routing is SM-agnostic (compressor.py:402 is_cuda &
      head=512 -> cutedsl on every SM; triton only for AMD/XPU/head-128), so B200 would crash identically under
      6012 — not a Hopper-specific kernel bug. Dual attribution: vllm robustness bug (pad slot-mapping rows or
      relax the assert; worth reporting upstream) + generator trigger (odd token budget). REPRODUCED ON B300/SM103 2026-09-20
      (same Misaligned crash on all 8 DSV4 checkpoints, same single-variable flip: 6012->6016 makes
      DSV4-Pro-0813 serve with native fp4 kernels). Birthplace located: the vllm rule plugin''s agg formula
      max_batch_size + isl + 1500 (generator/rule_plugin/vllm.rule) — and the rule runs AFTER --generator-set,
      silently overriding a user-supplied params.agg.max_num_tokens (separate defect, still open). FIX SHIPPED on
      branch fix/generator-round-vllm-batched-tokens: rule budgets rounded up to 64 at the source + the render-layer
      mapping rounds as last-line guard; 6 unit tests. Consequence: the
      sparse_attention family split is NO LONGER FORCED by dsv4 (see vllm_0290_sparse_family_split_needed).'
    applies_to:
    - deepseek-ai/DeepSeek-V4-Flash
    - deepseek-ai/DeepSeek-V4-Pro
    - deepseek-ai/DeepSeek-V4-Flash-0731
    - deepseek-ai/DeepSeek-V4-Pro-0813
    - nvidia/DeepSeek-V4-Flash-NVFP4
    - nvidia/DeepSeek-V4-Pro-NVFP4
    - sgl-project/DeepSeek-V4-Flash-FP8
    - sgl-project/DeepSeek-V4-Pro-FP8
  vllm_0290_nemoh_profile_oom:
    statement: 'vllm 0.29.0/SM90: Nemotron-H mamba profile run OOMs under the generator-rendered default (_state_passing_fwd
      allocates 8GiB with ~4GiB free on 143GB). Root knob is max_num_seqs (64 alone passes; batched-tokens reduction
      alone does not) but TWO generator walls block the direct fix: the rule engine floors max_batch_size at 512
      (pipeline.py ''512 if x<512 else x*2'') and unknown params.agg keys are SILENTLY IGNORED instead of rejected.
      Expressible rescue: gpu-memory-utilization 0.6 via extra_cli_args (now the checkpoint''s cli_extra_args).
      Evidence facts/ab_nemoh_{seq,tok,small,mem}_0290.json, 2026-09-19.'
    applies_to:
    - nvidia/Nemotron-H-56B-Base-8K
    - generator:rule-engine
  vllm_0290_op_sweep_triage:
    statement: 'vllm 0.29.0 op-collector sweep, first pass (H20, quick smokes in the official container, 2026-09-19).
      WORK AS-IS on 0.29 (perf rows produced, no code change): gemm (incl. fp8 CutlassFP8ScaledMM kernel_source),
      moe (108 cases), encoder_attention (long sweep, no errors), gdn (4k rows), mhc_module. WORK VIA THE 029 LANE''s
      generic registry construction: dsa (aligned, done) AND plain mla — DeepSeek-V3 runs unmodified through collect_mla_module_029
      (registry resolves DeepseekV3ForCausalLM -> generic deepseek_v2 model -> serving-same DeepseekV2MLAAttention;
      FLASH_ATTN_MLA, 1.81ms ctx b1 s512), i.e. the config-in construction generalizes across architectures with
