    - Qwen/Qwen3-VL-2B-Instruct
  probe_execution_mode_is_the_framework_default_2026_09_24:
    statement: |
      OWNER DECISION 2026-09-24: the identity probes run the framework's OWN
      execution mode — torch.compile + piecewise/full CUDA graphs exactly as
      the rendered config asks — for prefill AND decode; `--eager` is an A/B
      switch only (records carry runtime.probe_eager / probe_cuda_graph;
      None = a pre-2026-09-24 eager record). Why they ran eager before: a
      kernel-visibility shortcut from before the device-stream tables existed
      (graph-replayed kernels have no CPU launch event) plus capture time /
      capture failures on dummies. It had become a fidelity liability: any
      dispatch that reads capture-time static shapes is mis-identified by an
      eager probe (sglang MiniMax-M3 top-k was the proven case), and eager
      prefill is not serving's prefill.
      A/B (9 records re-probed in framework mode, eager raws kept under
      facts/raw_superseded/eager_2026-09-24/): vllm Llama-3.1-8B,
      DeepSeek-V3.2 bf16-KV + fp8-KV, MiniMax-M3 bf16-KV + fp8-KV; sglang
      DeepSeek-V3.2 bf16, MiniMax-M3 fp8-KV; trtllm Llama-3.1-8B,
      DeepSeek-V3.2. Attention / GEMM / MoE / indexer kernel sets are
      IDENTICAL to the eager records on every one of them (trtllm: same
      14+16 and 36+32 kernels; vllm DSV3.2 prefill 46/46, M3 38/38; sglang
      DSV3.2 prefill 61/61). What changes is what the profiler SEES and the
      glue: (a) the Python API spans (AIC::attn::*, AIC::quant_apply::*)
      that attributed GEMM/quant/attention kernels to ops vanish under graph
      replay and under torch.compile (vllm Llama: both phases) — the kernels
      arrive as orphans; (b) vLLM compile replaces its custom elementwise
      ops (act_and_mul, rms_norm, rotary_embedding, _typeConvert) with
      Inductor triton_{poi,red}_fused_* kernels on Llama (not on DSV3.2/M3,
      whose rendered configs keep them); (c) sglang M3 fp8-KV decode under
      graphs runs _topk_index_partial/_merge (topk_split = the collector's
      path) — the eager fp8-KV record had hidden it and diff_sgl picked that
      record over the graph-mode bf16 one, so msa_gen read DIVERGED until
      the re-probe. sglang graph mode adds _fused_dsa_decode_metadata_kernel
      / _fused_metadata_kernel_general (metadata glue, framework_native).
      HARNESS CONSEQUENCES (all landed): probe_driver keeps every
      taxonomy-labeled orphan (cublas/vllm_kernel/sgl_kernel/torch were
      previously capped as noise — under graphs they are the ONLY place
      GEMM and quant kernels appear); identity.attn_backend falls back to
      the attention kernel family when no span exists; taxonomy gained the
      Inductor and sglang-metadata rules. path_diff: the first recompute
      after the no-collector-signal rule flipped FOUR gemm-class verdicts
      (gemm_bf16 Llama, gemm_fp8 Qwen3-32B, mla_bmm_gen DSV3, compute_scale)
      that had been graded "aligned" BEFORE the rule existed — their only
      families (cublas, vllm_kernel) are infra by design, so they can never
      have a signal family. Rule refined: no signal family -> grade on
      kernel-NAME overlap inside the infra families (infra_family_name_matches
      in the report). Three re-align on names (the collector's nvjet /
      scaled_fp8_quant instantiations are ones serving launched);
      compute_scale did not — it had been paired with fp8-BLOCK DeepSeek-V3.2
      (per_token_group_quant), never a valid instance of scaled_fp8_quant;
      re-paired with per-tensor Qwen3-32B-FP8 -> aligned. Gates after all of
      it: vllm 33 / sglang 15 / trtllm 9 aligned, zero non-aligned files.
      sglang DSA prefill is LENGTH-CONDITIONAL and the collector mirrors it:
      at isl 512 (framework mode, fp8-KV and bf16-KV alike — both probed)
      serving runs dense FA3 with NO indexer logits or top-k (only
      _quantize_k_cache); at isl 4096 the
      indexer (sm90_fp8_mqa_logits) + fp8 sparse decode kernel. The
      whole-sweep fp8 ctx capture unions both regimes and read DIVERGED
      (fa3 collector-only vs the 4096 record; mqa_logits collector-only vs
      the 512 record — the prefix>0 cells push kv_len over the threshold).
      Single-cell captures (frozen sweep spec replaced; AIC_DSA_CONTEXT_*
      env filters do the same): s=4096 vs the framework-mode fp8-KV isl-4096
      record -> ALIGNED (dsa_ctx_fp8_DeepSeek-V3.2); s=512 prefix-0 vs the
      isl-512 record -> ALIGNED (dsa_ctx_fp8_s512_DeepSeek-V3.2: FA3 only,
      no indexer on either side). sglang gate: 15 aligned.
      NOT DONE: the other ~600 records are still eager-probed (identity-safe
      per the A/B, but their op attribution differs from framework-mode
      records); re-probe them when a verdict needs one, not wholesale.
    applies_to:
    - instrument:probe_vllm
    - instrument:probe_sglang
    - instrument:probe_trtllm
    - instrument:probe_driver
    - instrument:path_diff
    - instrument:kernel_taxonomy
    - framework:vllm-0.29.0
    - framework:sglang-0.5.16
    - framework:trtllm-1.3.0rc23
    - platform:sm90
  harness_hygiene_2026_09_24:
    statement: |
      Owner asked for the open-issue list after the framework-mode change and
      told me to fix the harness items ("别搞复杂问题"). Landed:
      - probe_driver --matrix: the moe column read only API spans; framework-
        mode records carry MoE kernels as orphans -> orphans are scanned too.
      - First unit tests for the harness: tests/unit/collector/opharness/
