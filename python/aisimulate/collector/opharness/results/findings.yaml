  probe_cudagraph_kernel_blindness_fixed:
    statement: 'INSTRUMENT FIX (probe_vllm, 2026-09-19): the whole-run kernel tables were built by walking
      torch.profiler CPU function_events — kernels replayed inside CUDA graphs have no CPU launch event and
      were INVISIBLE. Consequence: vllm 0.29 MiniMax-M3 serving evidence showed ZERO attend/indexer kernels
      (M3''s graph-safe attend runs under full cudagraph), and Llama FA evidence missed the in-graph
      FlashAttnFwdCombine + prepare_varlen_num_blocks — path_diff produced FALSE "diverged" verdicts against
      collector captures (collectors run eager, so their kernels were all visible). Fix in code, generic
      (no per-model case): tables now come from the kineto DEVICE event stream (every executed kernel appears
      there, graph-replayed or not), CPU-tree walk kept as fallback. Second generalized knob from the same
      episode: probe prompt length is now --isl / AIC_PROBE_ISL (default 4096, owner-set 2026-09-19; the
      historical implicit value was 32; recorded per-record as probe_isl) because
      shape-conditional serving paths (M3 sparse threshold at topk_blocks*block_size tokens, FA split-KV)
      are invisible below their thresholds — coverage is a parameter, never a per-model special case.
      MiniMax-M3 and Meta-Llama-3.1-8B 0.29 raws re-probed at isl 4096 and superseded (old raws kept in
      workspace facts/raw_superseded/); after the fix all four attn/msa 029-lane path_diff verdicts flipped
      to aligned with zero collector changes.'
    applies_to:
    - instrument:probe_vllm
    - framework:vllm-0.29.0
    - MiniMaxAI/MiniMax-M3
    - meta-llama/Meta-Llama-3.1-8B
  pathdiff_fp8kv_coverage_complete:
    statement: |
      HARNESS COMPLETENESS (2026-09-23, driven by "fp8-KV must be probed and
      compared, not skipped"; REVISED the same day after a second review found
      four defects in the first pass — see probe_prefill_prefix_cache_contamination
      for the largest). fp8-KV is a first-class path_diff dimension and the fp8
      attention paths are verified aligned with matched evidence:
        (a) probe fp8-KV as a config axis: probe_vllm --kv-cache-dtype +
            probe_driver kv_variants=[None,fp8] (vllm), path_diff --kv-dtype
            selects the same-kv serving record (commit a2076196).
        (b) build_ops orphan keep-rule is STRUCTURAL: every orphan the taxonomy
            labels with an identity-bearing backend is kept; only unlabeled/
            noise orphans are capped (24, by device time). The first fix
            (top-40 by time) was still a count; the original alphabetical
            [:15] had truncated half the records (137/274 raws exceed 15).
        (c) taxonomy: vllm kernel_unified_attention / reduce_segments
            (TRITON_ATTN, the only fp8 head_dim>256 Gemma-4 path) labeled
            `triton` — the shared vocabulary's name for the Triton attention
            backend (kernel_source_backends.yaml: sglang `triton`, vllm
            `vllm_triton_attn` -> triton). The first pass invented
            `triton_attn`, breaking the one-vocabulary contract. Routing
            kernels moved triton -> framework_native, so `triton` now means
            attention only and left path_diff's infra set.
        (d) verdict artifacts are reproducible: reports carry capture_file,
            capture_cmd, op_hint, kv_dtype and the serving record (id, tp, kv,
            isl, prefix_caching, candidate count); records carry runtime.isl;
            path_diff --isl selects by prompt length and --serving-raw diffs
            against explicit A/B evidence. The first pass saved verdicts to
            results/pathdiff/sm90/ where the gate never reads them (it reads
            sm90/<fw>-<version>/).
      VERDICTS (sm90, vllm 0.29.0, kv=fp8, results/pathdiff/sm90/vllm-0.29.0/):
        - Gemma-4 head512 fp8 -> ALIGNED (triton both sides).
        - DSV3.2 DSA fp8 GENERATION -> ALIGNED (flashmla sparse_fp8 decode +
          dsa_nsa paged_mqa_logits + deepgemm). The first pass called this
          capture "ctx": run_mla_module picks the phase from
          `"context" in perf_filename` (collect_mla_module.py:920) and the
