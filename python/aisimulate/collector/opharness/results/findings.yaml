  sm100_smoke_vs_perfdb_regressions_2026_10_04:
    statement: 'REGRESSION CHECK, new pins vs the shipped B200 perf database (umbriel-b200-037, 2026-10-04; every smoke perf row
      joined on the full case key — and on the kernel lane where an op writes one row per kernel — against the newest b200_sxm
      parquet of the same framework: vllm 0.25.0/0.27.1, sglang 0.5.14/0.5.16/0.5.17, trtllm 1.3.0rc20/rc23; compare_perfdb.py +
      compare_perfdb_report.txt in the handoff dir). Calibration: this box runs compute-bound GEMMs 5-10% slower than the database
      box (40 bf16 gemm cases, ratio 1.05-1.10), and sub-10 us kernels carry a ~2 us launch offset here (mla_bmm 1-token, dsv4
      paged_mqa_logits, topk calib) — ratios <= 1.15 and tiny-kernel deltas are environment, not framework. FUNCTIONAL: every lane
      the database has rows for runs on sm100 at the new pins (final per-cell smoke on 037: vllm 54/55, trtllm 58/58, sglang 51/56 —
      the sglang misses are the collector gaps of sm100_precision_smoke_2026_10_04 plus kda/gdn guards; vllm kda OOM). IDENTITY
      CHANGES: vllm attention decode kernel_source -> flashinfertrtllmapidecode_trtllm_gen (trtllm-gen decode, x1.22 single cell);
      trtllm mamba2 conv -> causal_conv1d_fn_token_major (rc29; collector mirrors it, mamba2 gates ALIGNED; per-case ratios 0.03-2.5
      = a different kernel, not comparable). LATENCY REGRESSIONS (same kernel_source): (1) vllm 0.30 moe nvfp4, DeepSeek shape
      (hidden 7168, inter 2048, top-8, 256 experts, tp1 ep1, flashinfer trtllm nvfp4 experts): 8192 tokens 1.86 -> 4.05/4.15/4.13 ms
      (x2.2, three repeats) while 6144 (1.57 -> 1.46) and 12288 (2.75 -> 2.74) are unchanged and 16384 is x1.14 — an isolated,
      reproducible spike at exactly 8192 tokens (8192 slower than 12288): a bad tactic/tile pick at that token count. (2) vllm 0.30 gdn
      context, chunk_gated_delta_rule_flashinfer lane, every small shape (seq <= 256, d_model 1024): ~20 us -> ~40 us (x2.0 across 21
      cases), large shapes x0.9 — a fixed per-call overhead added in the 0.30 lane. (3) sglang 0.5.21 vs 0.5.14 DSA (DeepSeek-V3.2,
      bf16 KV): context dense_mha_trtllm_ragged lane median x1.23, up to x2.07 (bs 1, isl 16-64, past_kv 1-1.5k); generation
      dsa_indexer_trtllm at bs 1024: 1.3 -> 1.8-2.3 ms (x1.4-1.8); sparse/indexer context lanes x1.04-1.13; GLM-5.2 lanes x1.0-1.12
      — REPEATED (two more full sweeps each): generation bs 1024 is x1.37 / x1.39 / x1.39 (systematic ~x1.4; the x1.77 was a single-shot
      outlier); context dense_mha_trtllm_ragged lane median x1.21 / x1.23 / x1.23 with max x1.35-1.47 (systematic ~x1.2, i.e. ~x1.1
      after the 5-10% box offset — borderline); sparse/indexer context lanes x1.02-1.05 (environment). NOT regressions: trtllm bf16 512-expert moe_torch_flow_nongated x1.3-1.7
      at 4-16 tokens (a torch reference flow, noisy), sglang dsv4 paged_mqa_logits / topk_calib x1.1-1.2 (3-60 us kernels).
