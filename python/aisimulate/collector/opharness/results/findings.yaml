  followups_after_full_reprobe_2026_09_24:
    statement: |
      Owner directives after the full re-probe report:
      (1) "统一所有的都对齐到64整数倍，别case by case了": the 64-alignment of
      token budgets is now ONE rule in backend_config_mapping.yaml applied to
      every backend (vllm max-num-batched-tokens, trtllm max_num_tokens,
      sglang max-prefill-tokens and chunked-prefill-size); the vllm rule
      formulas are plain again (commit 2446f6cc, mirrored into the aic
      checkout the golden CLI renders with). Verified: sglang 5500 -> 5504,
      trtllm 4500 -> 4544, vllm 6012 -> 6016.
      (2) "关于hf config的quant，能不能看看其他字段": the KV fact is not in
      config.json for the modelopt NVFP4 artifacts at all — the SDK loader
      attaches the bundled hf_quant_config.json (kv_cache_quant_algo: FP8)
      to the loaded config, so vllm_dsa_kv_cache_dtype now reads that merged
      view. All five NVFP4 DSA artifacts (GLM-5 / 5.1 / 5.2 / 5.3, DeepSeek-
      V3.2) render --kv-cache-dtype fp8; GLM-5-NVFP4 and DeepSeek-V3.2-NVFP4
      re-probed with the new render (see the matrix).
      (3) "关于kimi k3，我感觉可能还有其他构造问题": the construction was
      audited twice. Kimi-K3 names its layer kinds by 1-BASED index lists
      (configuration_kimi_k3.is_kda_layer: `layer_idx + 1 in kda_layers`).
      The depth cut kept the lists verbatim; by luck the 2-layer "rep" dummy
      (original layers 1,2 -> 1-based 2,3, both KDA) still resolved to two
      KDA layers, so the records' KDA evidence was real. My first remap
      assumed 0-based lists and produced an all_kinds dummy whose two layers
      both resolved to FULL attention — that variant "passed" the
      framework-mode probe while running no KDA kernel at all (false pass,
      caught by the record's kernel families). The generator now detects
      the base from the config data (commits 85d1dd32 + 51158047):
      all_kinds = one KDA (1) + one full-attention layer (2), no stale refs.
      The crash itself: eleven A/Bs on the rendered config (max-num-seqs
      512) — every variant that runs a KDA layer fails (rep, 3-layer with
      the dense layer, kda+kda, full+kda); CUDA graphs off passes; compile
      off (graphs on) fails; piecewise-only graphs fail; text-only
      (limit-mm image 0) fails; max-num-seqs 64 and 256 PASS. CUDA_LAUNCH_
      BLOCKING places the illegal memory access after graph capture, in
      warmup_kernels -> _run_decode_step -> run_fullgraph — the decode
      warm-up step at the generator's max_num_seqs=512 with CUDA graphs and
      a KDA layer present. So: a real dummy defect existed and is fixed, and
      independently vLLM 0.29's K3 (KDA) decode warm-up faults at batch 512
      on SM90 (256 passes) — the generator's 512 is what real deployments
      get. Upstream draft 7 updated. The corrected all_kinds dummy (one KDA
      + one full-attention layer) re-probed: the same warm-up crash —
      attribution stands; kda_ctx keeps the eager A/B evidence (verdict
      helper passes it explicitly). Side fact: the K3 fp8-KV variant is
      rejected by vLLM at load — "Kimi-K3 fp8 KV cache requires an fp8
      prefill query; enable --attention-config use_prefill_q..." — an
      extra flag the generator would have to render if fp8 KV were ever
      chosen for K3 (it is not today).
      (4) Dummy dirs: no step provisioned the tokenizer / custom-code files
      (Kimi needs tiktoken.model + tokenization_kimi.py + modeling_*.py).
      dummies.py now copies every auxiliary artifact file from
      configs/aux_files/<org>_<name>/ (exported once from the existing dirs,
      100 repos), else an earlier variant of the repo, else the declared
      targets.yaml dummy_overrides.tokenizer_from sibling; otherwise a loud
      MISSING caveat. A fresh regeneration of all 196 variants from configs/
      is complete without hand copies (commit a2f34f3c).
      (5) NVIDIA-Nemotron-3-Ultra-550B-A55B-NVFP4 on trtllm rc23 ("no raw"):
      the engine aborts right after model init — "CUDA runtime error in
      ::cudaStreamDestroy(stream): an illegal memory access was encountered"
      (tensorrt_llm TllmException, SIGABRT, so the probe cannot dump).
      Same SM90 NVFP4 wall class as the other NVFP4 trtllm cells; log
      facts/full_reprobe/nemotron_ultra_nvfp4_trt.full.log.
      (6) Golden renderer switched from the aic checkout to THIS repository's
      generator (venv_ais, `aiconfigurator cli generate` console script,
      stamp = this repo's HEAD): vllm/trtllm renders byte-identical to the
      aic ones for Llama-3.1-8B, sglang flags identical; Qwen3.8-2.4T-A95B
      now renders (was "generator rejects" on aic). No more aic mirroring.
    applies_to:
    - instrument:dummies
    - instrument:probe_vllm
    - moonshotai/Kimi-K3
    - nvidia/Kimi-K3-NVFP4
    - framework:vllm-0.29.0
    - platform:sm90
  onboarding_recent_releases_2026_09_25:
    statement: |
      Owner request (2026-09-25): "再试试 qwen3.8 和 glm5.3-flash … 把这些模型也
      弄进我们的列表 … inkling 啥的，最近这 1-2 月的模型 … probe 一把，增加对应的
      config". 33 Hub repos were surveyed and fetched with the new
      components/fetch_inputs.py (config, hf_quant, every non-weight file into
      configs/aux_files/); 31 have a transformers config, 2 do not
      (mistralai/Leanstral-1.5-119B-A6B, MiniMaxAI/MiniMax-H3 — no config.json
      on the Hub; recorded in targets.yaml roster.excluded, decided_by
      pending-owner). The 30 not yet in the roster were added to
      configs/repos.txt + roster.extra_repos; dummies for all 30 generated
      without hand edits (tokenizer/custom code provisioned from aux_files).
      Three gates decide whether a checkpoint yields an identity record, and
      each of them rejected part of the list:
      (1) THE GENERATOR (this repo's SDK) parses the architecture — rejected
      9 architectures / 19 repos, now recorded as "generator rejects" matrix
      cells: Glm5NextForConditionalGeneration (GLM-5.3-Flash, -BF16, nvidia
      -NVFP4), Qwen4ExpForConditionalGeneration (Qwen3.8-Flash-Next, -FP8,
      -NVFP4), InklingForConditionalGeneration (Inkling, Inkling-Small and the
      two baerquants NVFP4 artifacts), MiMoV2ForCausalLM (MiMo-V2.6-Pro-RL,
      -Flash-RL; note the SDK knows MiMoV2FlashForCausalLM only),
      Xing4_0ForCausalLM (x2), AliceAIForCausalLM, K2HorizonForCausalLM,
      Spark2_5ForCausalLM. A tenth, Qwen3_5ForCausalLM (text-only dense
      Qwen3.5: Altworld/Hemmingway-1, TokenRhythm/NeoHorse-1-9B), was the
      flat-config twin of an already-supported class and is now mapped
      (commit 8d8e154d) — both rendered and were probed in pass 2;
      Hemmingway-1 was then DROPPED by owner decision (CC-BY-NC-4.0, see
      below), its inputs/raws live in facts/dropped/.
      (2) THE PINNED FRAMEWORKS know the architecture — checked in the three
      images: vllm 0.29.0 lacks Glm5Next and DeepseekV41; sglang 0.5.16 lacks
      Glm5Next, Qwen4Exp, Qwen3_5MoeForCausalLM, DeepseekV41, MuseGlimmer;
      trtllm 1.3.0rc23 lacks Glm5Next, Qwen4Exp, DeepseekV41, MuseGlimmer,
      Inkling, MiMoV2. Consequence for the owner's two named targets:
      GLM-5.3-Flash is unservable on EVERY pinned framework AND unparsed by
      the SDK; Qwen3.8-Flash-Next (Qwen4Exp) loads only under vllm 0.29.
      Both need a framework pin bump before any identity can be recorded.
      DeepSeek-V4.1-Flash (SDK-supported) fails on all three pins at the
      transformers config stage ("model type deepseek_v41 … Transformers does
      not recognize"); Muse-Glimmer-30B (+NVFP4) the same on sglang/trtllm
      (`muse_glimmer`) but passes on vllm.
      (3) THE PROBE GPU holds the dummy cut — Qwen3.8-2.4T-A95B: the driver
      only ever queued dummy variant index 0 (depth8 = 8 x 26B params), a
      permanent OOM. New driver rule (commit 4447cf41): a raw whose LOAD
      stage failed with CUDA OOM / trtllm "insufficient GPU memory" advances
      the representative to the next smaller faithful cut, recorded as
      capacity_fallback_from on the run — observed, never predicted; the
      smallest cut stays queued when everything OOMs. Outcome: bf16 and FP8
      2.4T OOM even at depth4 (one full period, 4 x 26B params ~ 194 / 104
      GiB of weights on a 139.8 GiB GPU) on vllm and trtllm — no faithful
      single-GPU cut exists, the cells stay honest OOM fails; sglang rejects
      Qwen3_5MoeForCausalLM outright. NVFP4 2.4T: depth8 OOMs, depth4 result
      in pass 2 (below); trtllm rc23 additionally fails NVFP4 MoE on SM90
      ("No supported MoE GEMM tactic remains after replacing unsupported
      NO_SMEM epilogues") — the same NVFP4-on-Hopper wall class as the other
      trtllm NVFP4 cells.
      Identity records landed (framework mode, tp1, rendered + fp8-KV
      variants) for: Qwen3.8-27B / -FP8 / nvidia -NVFP4 (all three backends;
      vllm ChunkGatedDeltaRule + fla_triton/causal_conv1d + fa3, sglang
      HybridLinearAttnBackend, trtllm fmha), NVIDIA-Nemotron-3.5-Lightning-
      30B-A3B-BF16 (all three), Ornith-1.5-35B-A3B (Qwen3_5MoeForConditional
      Generation; all three), openbmb/MiniCPM5-2B (Llama; all three),
      Muse-Glimmer-30B / -NVFP4 (vllm), plus the pass-2 additions. Taxonomy:
      every vllm kernel of the new models is already labeled; the only
      unlabeled sglang orphans were the per-variant metadata builder
      (_fused_metadata_kernel_ps1_no_swa) and raw memcpy128/memset32 runtime
      copies — both glue, rules added (commit 995c7430). No new op family
      appeared: GDN/KDA/mamba/MoE/attention kernel families of the onboarded
      models are all in the existing taxonomy.
      Configs bundled into the SDK (byte-for-byte at pinned revisions,
      THIRD_PARTY_NOTICES updated; commits 97bce88f, 8d8e154d, 895586de):
      Qwen3.8-27B / -FP8, Qwen3.8-2.4T-A95B-NVFP4, DeepSeek-V4.1-Flash-NVFP4,
      Nemotron-3.5-Lightning-BF16, Ornith-1.5, MiniCPM5-2B, NeoHorse-1-9B.
      NOT bundled: every generator-rejected architecture (dead weight until
      modeled), and the two modelopt mixed_precision NVFP4 artifacts
      (Qwen3.8-27B-NVFP4, Muse-Glimmer-30B-NVFP4) — the SDK quant inference
      maps mixed_precision to fp8_static for dense models and the support
      matrix then reports FAIL instead of HW_INCOMPATIBLE on non-FP4
      systems (TODO.md); they stay in the probe roster and render from the
      Hub. The other eight classify like their bundled siblings in a
      tools/support_matrix dry run on h200_sxm.
      Side answers: Kimi-K3 max-num-seqs bisection completed — 64, 256, 384,
      448, 480, 496 all pass framework-mode; only the generator's 512 fails,
      i.e. the fault is the 512-batch CUDA-graph decode warm-up itself, not a
      threshold "above 256" (facts/k3_ab/seqs*.json). The compute_scale
      standalone-kernel deviation is now a governed standards exception
      (collector/evidence_exceptions.yaml, expires 2026-12-31).
      Pass 2 (after the Qwen3_5ForCausalLM alias and the capacity rule):
      NeoHorse-1-9B (and Hemmingway-1 before its removal) pass on vllm and
      trtllm, sglang 0.5.16 has no Qwen3_5ForCausalLM implementation
      (framework gap);
      Qwen3.8-2.4T-A95B-NVFP4 passes on vllm at depth4 (capacity_fallback_from
      depth8; ModelOptNvFp4FusedMoE -> marlin W4A16 on SM90, as for the other
      NVFP4 MoE checkpoints), sglang framework gap, trtllm NVFP4 MoE wall.
      Matrix after onboarding (Hemmingway-1 removed): 129 rows per backend
      — vllm 97 pass / 9 pass+custom / 23 fail, sglang 93 / 6 / 30, trtllm
      69 / 0 / 60; of the 29 new rows: vllm 10 pass, sglang 6 pass, trtllm
      7 pass, 19 rows
      "generator rejects" on every backend, the rest framework gaps / walls
      named above. Note (display, pre-existing): NemotronH rows on vllm show
      attention "ReLUSquaredActivation" and the text-only Qwen3.5 rows show
      the fa3 kernel family instead of ChunkGatedDeltaRule — the identity
      fallback reads the first wrapped/attention span; kernel families in the
      records are correct.
      Evidence: facts/onboard_2026-09-25_repos.txt (33 surveyed repos),
      facts/onboard_render/arch_support*.txt (framework registry checks),
      facts/onboard_render/{plan.log,plan_onboard_pass1.json,queues*/}.
      OWNER DECISIONS (tianhaox, 2026-09-25): (a) Leanstral-1.5 / MiniMax-H3
      dropped (params.json-only; roster scope = language models and models
      with a vision module, no diffusion/DiT — none of the 30 was DiT);
      (b) models with license problems are dropped: Hemmingway-1
      (CC-BY-NC-4.0) removed from roster, configs, dummies, plan and matrix
      (raws in facts/dropped/); every other new repo is Apache-2.0 / MIT /
      NVIDIA Open Model / OpenMDW / Qwen-community (Qwen3.8-Flash-Next only,
      not bundled anyway); (c) framework gaps and walls stay as recorded —
      no pin bumps now; (d) SDK modeling of the 9 rejected architectures
      stays open. Structural notes for (d), from the Hub configs: Glm5Next
      = GLM-5.3 DSA (kv_lora 512, indexer topk 2048, mHC fields) with 34/45
      layers swapped to KDA linear attention (linear_attn_config as in
      Kimi-K3, 0-based lists) + 288-expert MoE + MTP — closest existing
      families DEEPSEEKV32/GLM-5.3 + KIMIK3; Qwen4Exp = Qwen3.5 GDN hybrid
      (interval 4, 512 experts x 640, MTP) plus new n-gram embedding
      (ngram_*, ple_*) and indexer_* fields — extends QWEN35; AliceAI =
      Qwen3.5-style GDN/KDA hybrid MoE (512 x 512, interval-4 layer_types)
      with block attention residual — QWEN35-like; Inkling = 66-layer
      GQA MoE (256 experts top-6, 2 shared) with SWA layers (local_layer_ids,
      swa_* heads), short conv, vision hmlp encoder + audio — new; MiMoV2 =
      MiMo-V2-Flash lineage (hybrid SWA 128 + full attention, 384-expert
      MoE, head_dim 192/v 128, vision + audio configs) — extends HYBRIDMOE;
      Xing4_0 = DeepSeek-V3-style MLA (q_lora 768, kv_lora 512, nope 128 /
      rope 64) + 64-expert MoE + mHC + MTP — DEEPSEEK-like; K2Horizon =
      GQA MoE (100 experts top-8 + MoVA expert set) — MOE-like; Spark2_5 =
      dense 36-layer with 27 SWA(512)/9 full layers, per-kind rope —
      Gemma-like SWA hybrid. Framework side: vllm 0.29 loads Qwen4Exp,
      Inkling, MiMoV2 natively; none of the pins knows Glm5Next, Xing4_0,
      AliceAI, K2Horizon or Spark2_5 (custom auto_map code only).
      FOLLOW-UP DECISION (tianhaox, 2026-09-25, later the same day): AliceAI,
      Xing4.0 (both artifacts), Spark-X2.5 and K2-Horizon are dropped from
      the roster altogether (custom-code-only architectures no pinned
      framework or the SDK knows); inputs, dummies and plan rows moved to
      facts/dropped/. Remaining unmodeled architectures in the roster: 4
      (Glm5Next, Qwen4Exp, Inkling, MiMoV2 — 12 repos). Matrix after the
      drops: 124 rows per backend — vllm 97 / 9 / 18, sglang 93 / 6 / 25,
      trtllm 69 / 0 / 55.
      DECISIONS CLOSED 2026-09-25 (tianhaox): the NVFP4 DSA artifacts on
      trtllm rc23 / SM90 stay modeled as bf16-KV (rc23's sparse FlashMLA
      asserts bf16 KV; the perf task keeps that dtype) — continue as is.
      compute_scale rows are an approximation by design (governed exception
      stands, no further follow-up). SDK modeling of the four remaining
      unmodeled architectures is out of this work — see TODO.md.
      DECOMPOSE (step 5, component landed 2026-09-25): every passing record
      on the three pins decomposes with EMPTY residue after six glue rules
      (torch xmma f32/tf32 GEMM, fa3 split-kv combine, vision-encoder
      attention/conv glue, trtllm MoE tactic-profiler buffers, trtllm GDN
      layout transposes). One identity fact surfaced: sglang 0.5.16 serves
      MiniMax-M2 / M2.5 (block-fp8 checkpoints) through the Triton
      _w8a8_block_fp8_matmul GEMM, while the collector's fp8_block gemm lane
      is DeepGEMM (kernel_source_backends gemm_dtype fp8_block) — labeled
      triton_block_fp8 so a gemm path_diff on those repos reads diverged
      instead of hiding under the DeepGEMM label. No capture exists yet for
      that cell; recorded, not graded.
      KDA DECODE-BATCH CAP (owner decision 2026-09-25, "带kda的模型覆盖max num
      seq到256"): vllm.rule caps max_batch_size at 256 for checkpoints with
      linear_attn_config.kda_layers (generator commit a0820789; Kimi-K3 now
      renders --max-num-seqs 256 --max-num-batched-tokens 5760). Re-probed
      under the capped render in framework mode: moonshotai/Kimi-K3 and
      nvidia/Kimi-K3-NVFP4 PASS on vllm 0.29.0 (prefill 63/70, decode 51/55
      kernels; identity KimiK3DeltaAttention + kda_decode_fusion_many_heads
      + flash_kda prefill, MoE Mxfp4MoE->marlin / ModelOptNvFp4FusedMoE->
      marlin); the fp8-KV variants still fail at load with the known
      "fp8 KV cache requires an fp8 prefill query" requirement (not
      rendered). kda_ctx path_diff now grades against the framework-mode
      record (default selection, --serving-raw dropped): ALIGNED. The old
      512 raws are kept in facts/k3_ab/pre_cap/. vllm matrix: 99 / 9 / 16.
      NORMALIZER FACT (2026-09-25): "(anonymous namespace)::" was never
      stripped, so every kernel defined in an anonymous namespace — ALL of
      sgl_kernel's C++ kernels (store_kvcache, concat_mla_*, fused_*norm_rope*,
      flash_c4/c128 DSV4 attention, topk_* indexer helpers, per-tensor fp8
      quant, act/silu) plus torch's at::native helpers and K3's KDA decode
      kernel — collapsed into one bogus name "namespace" and was invisible
      to the taxonomy, the identity column and the gates. Stripping it
      exposed 26 sglang kernels, now labeled by role (flash_c4_*/flash_c128_*
      = dsa_nsa attention; the DSA indexer top-k helpers dispatch by batch
      — topk_small_batch_kernel in the probe's decode vs topk_main_kernel in
      the collector's case — so they carry the sgl_kernel infra label and
      are not name-graded). Every saved gate verdict stays aligned (61),
      residue is empty on all pins, no pass row lost its attention identity.
    applies_to: [zai-org/GLM-5.3-Flash, Qwen/Qwen3.8-27B, Qwen/Qwen3.8-Flash-Next, nvidia/Qwen3.8-2.4T-A95B-NVFP4,
      deepseek-ai/DeepSeek-V4.1-Flash, meta-models/Muse-Glimmer-30B, baerquant/Inkling, Altworld/Hemmingway-1,
      TokenRhythm/NeoHorse-1-9B, ornith-ai/Ornith-1.5-35B-A3B, openbmb/MiniCPM5-2B,
      'instrument:fetch_inputs', 'instrument:probe_driver', 'instrument:dummies', 'framework:vllm-0.29.0',
      'framework:sglang-0.5.16', 'framework:trtllm-1.3.0rc23', 'platform:sm90']
  codex_review_evidence_contracts_2026_09_25:
    statement: |
      Codex review of 17ee75c2 (workspace file "Review Comment Codex.md")
      reproduced six ways the harness turned stale, missing or insufficient
      evidence into "pass"; all six reproduced on HEAD 9d860284 and are
      closed by contract changes, each with a regression test:
      (1) TARGET-OP GRADING. path_diff graded a gate with no signal family
      on ANY infra-kernel overlap, so a capture sharing only a quant helper
      with serving "proved" a GEMM path (the committed fp8 GEMM verdict had
      exactly that: only scaled_fp8_quant in infra_family_name_matches;
      the real reason was the launcher filter dropping
      vllm::cutlass_3x_gemm_sm90_fp8 — a kernel, not a launcher). grade()
      now takes the gate's TARGET ROLES (taxonomy role axis; inferred from
      the gate name, or --target-roles) and requires every collector kernel
      of each target role to name-match a serving kernel of the same role;
      a role the collector ran but serving did not, or a collector-only
      backend family inside a target role, is diverged; auxiliary roles are
      reported, never graded; explicit role-scoped equivalences only (GEMM
      tile blobs with layout kept; sgl_kernel top-k small_batch/main batch
      dispatch).
      (2) PHASE. prefill/decode/profile-run orphans were one set, and span
      attribution by NAME across phases hid a kernel from the phase whose
      span did not cover it. Records carry kernel_phases (every device-table
      kernel by phase) and orphan_phases; select_serving picks serving
      evidence by the gate's phase; vllm api_trace ops carry phase None (was
      a borrowed "decode"); trtllm's flat table stays unscoped and the
      verdict says so (phase_scoped). Re-derivation under (1)+(2): 60 gates
      aligned, 1 diverged — trtllm rc23 DeepSeek-V3 MoE routing: the
      collector routes with customMoeRoutingKernel, serving with
      deepseek_v3_topk_kernel + dsv3MinLatencyKernels::router_gemm_kernel
      (a collector serving-parity finding, left red); the sglang DSV3.2 DSA
      context gate needed a single-cell capture (the whole-sweep capture
      unions short cells that run dense FA3 — opcov_sgl_dsa_ctx_s4096);
      compute_scale moved to the explained set (governed approximation);
      the two trtllm fp8-KV DSA gate lines are retired (rc23 cannot serve
      fp8 KV for DSA — a recorded wall, not an alignment question).
      (3) EXECUTION IDENTITY. The run id names the case only; a raw probed
      under an older render counted as done. Every plan run now carries an
      execution fingerprint (engine tokens from the render — first flag on,
      deployment-wrapper values dropped —, dummy config, probe code, image,
      kv); the queue writes it as a .fp sidecar next to the raw and skips a
      run only when the sidecar matches; records carry evidence_status
      current | stale | unverified (sidecar decisive; without one, vllm /
      sglang raws are checked on the argv they recorded, trtllm on its
      engine yaml semantically); the matrix is derived from the NEWEST plan
      per cell, reads the record of ITS run id (never a sibling version's),
      and shows stale evidence as a fail cell. First run over the archive:
      sglang 216 current / 12 unverified (retired pins), trtllm 222 / 37,
      vllm 121 current / 103 stale (mostly fp8-KV variant raws from before
      the 64-alignment) / 98 unverified; exactly ONE current-pin matrix
      cell rested on stale evidence — MiniMax-M3 on vllm, probed at
      max-num-batched-tokens 6012 before the alignment rule, re-probed at
      6016 (the review's own counterexample, found by the mechanism).
      (4) PLAN-RELATIVE PROGRESS. matrix_complete now requires every repo
      the plan declares for (fw, version) to have a verdict (an empty
      matrix is not complete; stale cells are not complete);
      path_verdicts_aligned requires every gate the verdict scripts declare
      to have a verdict naming this framework/version and reading aligned
      (declared_gates parses components/captures/verdicts_*.sh);
      component_pending never completes a step (implemented -> todo "no
      completion predicate", unimplemented -> blocked); new_op_collector
      steps got artifact predicates (family_observed / family_unit_defined /
      family_collector_exists / family_gates_aligned) and onboard_model's
      path_aligned became model_gates_aligned. A nonexistent op family now
      shows four todo steps, not four done ones.
      (5) ONE CODE SOURCE. Queues invoke the probes from this checkout
      (components/probes, visible under the workspace mount or mounted at
      /harness); build_images.sh builds venv_ais from the checkout; the
      workspace holds data only (configs, dummies, archive with raw + .fp,
      facts, jitcache). The workspace's twin probe scripts are retired.
      (6) THIRD_PARTY_NOTICES root copy synced (check_packaged_legal_files
      passes).
      FOLLOW-THROUGH (same day): the 102 vllm fp8-KV variant raws that read
      stale (probed before the 64-alignment) were re-probed through the new
      queue lines — every record on the three pinned versions is now
      'current' (remaining 'unverified' = retired pins only); the six sglang
      0.5.16 customizations (DSV4 moe_backend=marlin) were A/B'd bare in a
      separate workspace and all still_needed (results/retests/sm90/
      sglang-0.5.16.yaml); the clean-checkout acceptance ran end to end in a
      fresh workspace (build_images.sh -> venv_ais -> fetch_inputs ->
      dummies -> emit with the /harness read-only mount -> probe -> record
      'current' -> matrix pass for Qwen3-0.6B). Harness unit tests: 73.
      EVIDENCE LAYERING (owner decision 2026-09-26, "facts 太多进 repo 不是好
      practice"): the PR had 33k lines of kernel-level decompositions and
      5k lines of verdict kernel lists committed as results. Consumers were
      checked: the workflow predicates read role/backend SETS, residue and
      verdict/framework/version only; kernel names are debugging evidence.
      decompose.py now commits a summary (role -> backend -> count, residue,
      ops, record id) and writes kernel names to <ws>/archive/evidence/;
      path_diff commits a verdict summary (both inputs' identity: record id,
      exec fingerprint, capture sha256; roles, phase, per-role counts; the
      deciding names only when red) and writes the full report to the
      evidence dir; evidence_bundle.py packs a campaign's raw + .fp,
      records, plans, rendered engine configs, captures and full reports
      into one content-addressed tar.gz (first bundle 2026-09-26_sm90:
      856 raws, 6.2 MB) indexed in results/evidence_index.yaml with sha256
      and location. Committed results shrink from ~44k to ~9k lines; LFS
      was rejected for the evidence (it hides content without making it
      reviewable); the bundle's storage location is the owner's call and
      is recorded per campaign.
    applies_to: ['instrument:path_diff', 'instrument:probe_driver', 'instrument:workflow_check',
      'instrument:build_images', 'framework:vllm-0.29.0', 'framework:sglang-0.5.16',
      'framework:trtllm-1.3.0rc23', 'platform:sm90', MiniMaxAI/MiniMax-M3, deepseek-ai/DeepSeek-V3,
      deepseek-ai/DeepSeek-V3.2]
  vllm_0300_upgrade_2026_09_27:
    statement: |
      Owner decision 2026-09-27: move the vllm pin from 0.29.0 straight to
      0.30.0 (vllm/vllm-openai:v0.30.0, the newest image; 0.29.x patches do
      not exist), collector included — the 0.29 pin upgrade is abandoned and
      its records left the PR (kept in the workspace, facts/local_only_results).
      The upgrade_op workflow ran end to end as the stability test of the
      harness; every step's evidence:
      PROBES (224 vllm runs, framework mode, rendered + fp8-KV variants,
      ~1.1 min median per run on the dummies, 50 min on six GPUs): 124-cell
      final matrix 110 pass / 1 pass+custom / 13 fail (12 generator rejects,
      1 capacity: Qwen3.8-2.4T-A95B bf16 — no faithful cut fits one 139.8 GiB
      GPU; its FP8 and NVFP4 artifacts pass at depth4). Two first-pass OOMs
      on the fp8/NVFP4 2.4T cuts and on two fp8-KV variants were transient
      GPU sharing with the concurrent capture wave and cleared on re-probe —
      probes and captures must not share a GPU. Verdict changes vs 0.29:
      DeepSeek-V4.1-Flash and its NVFP4 artifact now PASS (0.30 registers
      DeepseekV41); Qwen3.8-2.4T-A95B-FP8 capacity -> pass (depth4 fits). IDENTITY: across the 94 repos
      probed on both versions the identity-role (backend, role) sets are
      IDENTICAL — no attention / gemm / moe / linear-attention / dsa / quant /
      mhc kernel family changed between 0.29.0 and 0.30.0; 47 repos differ
      only in sampler / scheduler glue kernels (0.30 drops
      _convert_req_index_to_global_index / _compute_slot_mappings /
      _get_num_sampled_and_rejected, adds cute-DSL cu_blocks conversion and a
      symbol literally named "kernel"). New kernels labeled: DSV4
      _token_request_mapping_kernel (infra), Nemotron fused
      _relu_squared_static_fp8_quant_kernel (0.30 fuses the activation into
      the quant), DSV4.1 _hc_head_reduce_store_kernel (mhc). RESIDUE left on
      purpose for the owner's granularity call: DSV4.1's engram module
      (_engram_lookup_kernel, _hash_ids_kernel, _fused_engram_post_wkv_kernel)
      and a DSV4 cute-DSL kernel_cutlass_device_kernel_tensorptrf32... whose
      role is unattributed. The Qwen3.5 rows' attention column reads FA3 +
      the GDN decode kernel instead of ChunkGatedDeltaRule + the same kernel:
      0.30 emits no wrapped attention span there, kernels unchanged.
      COLLECTOR ON 0.30 (the harness's reason to exist): 21 captures re-taken
      in the 0.30 image with versioned names (opcov_<cap>@0.30.0.json). The
      first wave found the collector broken in two places — exactly the
      metadata-parity class layer_permissions.md warns about: (a)
      CommonAttentionMetadata lost the private _seq_lens_cpu /
      _num_computed_tokens_cpu fields, the seq_lens_cpu property and the
      num_computed_tokens_cpu property (10 MLA/DSV4 captures invalid); (b)
      is_flashkda_supported() gained recurrent_state_dtype (kda_ctx invalid).
      Fixed in collector/vllm/utils.py, collect_kda.py, collect_msa_module.py
      with citations to the 0.30 population sites (v1/worker/gpu/attn_utils.py
      :456-475, CommonAttentionMetadata.compute_num_computed_tokens,
      models/kimi_k3/nvidia/kda.py:455-495 + :665, MambaStateDtypeCalculator.
      kda_state_dtype -> float32 for the default mamba_ssm_cache_dtype);
      framework_manifest vllm default -> 0.30.0 (digest recorded); the
      __compat__ upper bound of all 11 vllm collector modules -> 0.30.0;
      manifest tests updated. Re-captured: 19/19 declared gates ALIGNED
      (compute_scale stays explained: the quant is still fused on 0.30, the
      governed exception now scopes 0.30.0). Citation audit debt: only the
      three broken sites were re-verified against 0.30 source; the other
      @0.29.0 citations in the collector still hold by behaviour (their
      captures align) but were not re-read.
      CUSTOMIZATIONS (bare-default A/B at 0.30.0, results/retests/sm90/
      vllm-0.30.0.yaml): Nemotron-H-56B gpu-memory-utilization 0.6 still
      needed (bare OOMs in the mamba profile run as on 0.29); the DSV4
      moe_backend=marlin prescription for the four fp4-experts checkpoints
      is now DROPPABLE — 0.30's runner auto selects the same
      marlin_moe_wna16 kernels the prescription forced (identity identical),
      so all eight DSV4 vllm prescriptions were dropped from targets.yaml and
      the eight repos re-probed under the bare render (their cells move from
      pass+custom to pass).
      KDA PIN RETIRED (owner 2026-09-28, "kda可以到0.30吗，不pin了"): the
      manifest's kda family pin on the kimi-k3 preview image is gone; the
      family resolves to the 0.30.0 default like every other vllm op
      (collect_kda __compat__ 0.30.0). SMOKE ON 0.30 (collect.py --backend
      vllm --smoke, one vllm/vllm-openai:v0.30.0 container, 4 random cases
      per op, evidence facts/collector_smoke_0300/{main,kda0300,mini,full}):
      the first passes exposed three more breaks, all fixed: (a)
      is_fused_kda_decode_supported() also gained recurrent_state_dtype
      (kda.py:665-680@v0.30.0; float32 as for the prefill probe) — kda decode
      cases failed with TypeError; (b) finalize rejected the run — "staged
      table scale_matrix_perf.txt has no selected producer": collect.py binds
      every staged table to the registry entries declaring it and a producer
      checkpoint owns exactly one table, while the compute_scale collectors
      hard-coded a second table (PerfFile.SCALE_MATRIX registered 2026-09-21
      never fixed that). First fix (863bfc75) split the op into a
      `scale_matrix` registry producer; OWNER DECISION 2026-09-28 ("做兼容
      多表"): the executor supports MULTI-TABLE PRODUCERS instead —
      OpEntry.extra_perf_filenames declares every further table one run_func
      writes, the executor hands them in (run_computescale(...,
      extra_perf_filenames)), provenance collections carry them, and every
      finalize/transaction binding (_registered_checkpoint_tables,
      producer plan, perf-transaction journal `tables`, sidecar table
      ownership, collection_meta) treats a checkpoint as owning a SET of
      tables. compute_scale is back to one op writing both tables from one
      measurement; the split op and its YAML activations are gone. Verified:
      mini smoke — one checkpoint vllm.compute_scale.json, computescale_perf
      + scale_matrix_perf finalized with the same case_plan_hash, exit 0;
      (c) the vllm image ships no pyarrow — the launchers pip-install it
      before finalize. Full smoke (24 ops incl. the interim split op): 95/96
      cases pass (the one failure is the classified kernel-limit raise for
      msa_generation_module at 6 indexer heads), 23 tables finalized as
      parquet with a provenance sidecar, exit 0.
      DATA: the collector default is 0.30.0 now and the collector finalizes
      end to end on 0.30, but no 0.30 perf data campaign has run — the SDK
      still ships vllm 0.24.0 rows; the campaign is the next (collector-side)
      step.
    applies_to: ['framework:vllm-0.30.0', 'instrument:probe_driver', 'instrument:path_diff',
      'instrument:workflow_check', 'collector:vllm', 'platform:sm90', deepseek-ai/DeepSeek-V4.1-Flash,
      nvidia/Qwen3.8-2.4T-A95B-NVFP4, moonshotai/Kimi-K3, deepseek-ai/DeepSeek-V4-Flash, nvidia/Nemotron-H-56B-Base-8K]
  vllm_0300_full_op_sweep_2026_09_28:
    statement: |
      Owner request 2026-09-28: sweep every vllm op except gemm on 0.30.0
      (H20, SM90) and look for new large-scale failures. Code frozen at
      863bfc75 (workspace staging_0300), one container per GPU, ops split
      by --case-filter as GPUs freed; ~22 h wall, ~48 GPU-hours, 23 tables
      finalized (evidence: workspace facts/opsweep_full_0300/{TRIAGE.md,
      SUMMARY.txt,PARTITION.txt,logs/}, parquet under staging_0300/runs/).
      VERDICT: no deterministic 0.29.0 -> 0.30.0 regression. Row parity with
      the 0.29 sweep on every table except where 0.30 is BETTER:
      context/generation attention +697/+928 rows (the fp8-KV x head512
      Gemma-4 cells now run vllm_triton_attn, the head_dim>256 + fp8 fix
      verified at full grid); dsa_generation +406 rows and 0/17664 failures
      (the 0.29 sparse-MLA decode IMA race is gone); moe +27 rows (the
      Llama-4 fp8 128E power_law_1.01 OOM seen in the sweep reproduced
      clean 3/3 on an idle GPU -> worker-history transient, not a
      regression). Every other failure cluster matched 0.29 cell by cell:
      msa_generation 1472 (heads 48/96 kernel-limit), gdn 5 (grid-y guard +
      one OOM cell empty on 0.29 too), moe 40 (fp8_block block_n / K3 mxfp4
      tp32, no 0.29 rows either), dsv4 csa_context 16 + hca_context 4 (the
      0.29 residual IMA family and the same aten::new_empty cells at 262144
      tokens per forward on fp8 DSV4-Pro). NEW on 0.30 with no baseline:
      kda full grid 12 tasks, 4 failed on Kimi-K3 TP1 shapes — decode
      bs1024 hits the CUDA grid-y limit (fused_recurrent.py:645 grid =
      (cdiv(V,BV), B*H); the kda collector lacks gdn's classified guard),
      three context OOMs on the batch x heads = 1536 boundary at isl 32768
      (no generation-time memory filter in the kda context grid).
      COLLECTOR DEFECT FOUND (mine): the msa index-head kernel-limit guard
      of 2026-09-22 keyed on the head count alone and rejected 1808
      msa_context prefill rows the 0.29 sweep had collected — the limit is
      the DECODE scorer's (0.29 evidence: context failed only at isl=1,
      904/976 rows per head otherwise). Fixed in c7269391
      (msa_decode_scorer_kernel_limit, query_len-scoped) and re-run: 904 +
      904 rows recovered, exactly 144 isl=1 cells classified. FOLLOW-UP
      (owner 2026-09-29): MSA is one fixed geometry (M3 64q/4kv/4idx,
      GQA-style sharding, index heads = kv heads per rank), so the shared
      12-value head grid was replaced by the model row's declared shards —
      tensor_parallel_sizes [1,2,4,8,16] -> heads 64/32/16/8/4
      (a22e4553; case_generator.get_msa_head_counts). msa_context 11712 ->
      4880 cases, msa_generation 8826 -> 3680; the 128/96/48/24/12-head
      rows were unreachable points and, per the owner ("数据别放这种临时
      的了"), the 0.30 msa tables were re-collected on the new axis:
      4880 + 3680 rows, zero failures; the sweep's shared-grid msa tables
      are superseded (workspace staging_0300/superseded/). dsa_context
      grew from 22640 to 169512 rows (the 2026-09-22 chunked-prefill prefix
      axis: 2 models x 4 combos x 12 heads x 1816 tuples = 174336 cases);
      4827 tasks failed, 2.7% deterministic ModelConfig rejects (prefix
      262144+ over DeepSeek-V3.2's 163840 context) plus ~20 largest-shape
      OOMs. OWNER DECISION 2026-09-28: the dsa grid stays as declared
      (over-collection + classified failures). Lessons: split large-grid
      ops by (model x precision combo) from the start; the case order is
      model-major; a producer's checkpoint can be finalized after an early
      stop by a zero-work --resume with the slice's own filters.
    applies_to: ['framework:vllm-0.30.0', 'collector:vllm', 'platform:sm90', 'instrument:opsweep',
      meta-llama/Llama-4-Maverick-17B-128E-Instruct, moonshotai/Kimi-K3, MiniMaxAI/MiniMax-M3,
      deepseek-ai/DeepSeek-V3.2, zai-org/GLM-5, sgl-project/DeepSeek-V4-Pro-FP8, google/gemma-4-26B-A4B]
  vllm_0300_gate_set_restored_2026_09_29:
    statement: |
      Owner question 2026-09-29 ("msa 的 kernel 和 probe 的 align 吗") exposed
      that the vllm 0.30.0 gate set I rebuilt kept only 19 of the 32 gates
      the 0.29.0 set had — attention ctx/gen (Llama-3.1-8B), encoder_attn
      (Qwen3-VL-2B), dsa ctx x4 + gen (DeepSeek-V3.2), gemm m=1 x2, msa
      ctx/gen (MiniMax-M3) and kda decode were silently missing, and
      path_verdicts_aligned reported 19/19. Restored: every family
      re-captured in the 0.30 image with the current collectors and graded;
      RESULT 32 declared gates, 32 ALIGNED (msa ctx 3/3 and gen 5/5 attention
      kernels matched; dsa fp8 isl-512 graded against a dedicated isl-512
      serving raw of the same record as on 0.29, because isl 512 is below the
      sparse threshold and runs dense FA3). Two deviations are EXPLAINED, not
      gates: mhc (collector measures the no-norm mhc_pre variant by
      producer/consumer contract — the SDK bills attn_norm separately,
      collect_mhc_module._mhc_pre — while 0.30 serving selects the
      with_norm big_fuse variant via MhcPreBigFuseTileLangKernel.CompileKey
      .use_norm_weight) and compute_scale (governed approximation). kda
      decode: the collector measures both the fused non-spec kernel and the
      packed conv-update + recurrence pair (serving's spec-decode path); the
      gate captures a non-spec probe, so the capture sets
      AIS_KDA_DECODE_PATHS=fused (collect_kda._decode_paths, recorded in
      capture_env) and the fused path is ALIGNED with
      kda_decode_fusion_many_heads_kernel. MECHANISM: workflow_check gained
      gates_cover_registry_ops (upgrade_op step gates_declared before
      path_aligned): every backend registry op must map to a declared gate
      family (_OP_GATE_FAMILIES) or be listed gate-free with a reason; an
      unmapped op is a finding. It flagged mhc_module immediately (now
      explained-by-contract). Lesson: a gate set is checked against the
      registry, never against what the script happens to declare.
    applies_to: ['framework:vllm-0.30.0', 'instrument:workflow_check', 'instrument:path_diff', 'platform:sm90',
      MiniMaxAI/MiniMax-M3, deepseek-ai/DeepSeek-V3.2, moonshotai/Kimi-K3, sgl-project/DeepSeek-V4-Flash-FP8,
      meta-llama/Meta-Llama-3.1-8B, Qwen/Qwen3-VL-2B-Instruct]
  blackwell_handoffs_absorbed_2026_09_30:
    statement: |
      Three off-box campaigns handed back to the H20 harness owner on
      2026-09-30 — B300/sm103 (0.29.0, 2026-09-20), B200/sm100 (0.30.0,
      2026-09-29, 109/1/14, 32 gates 27 aligned) and two sm120 boxes (RTX PRO
      6000 96GB: 101/7/16, 30 gates 29 aligned; RTX PRO 5000 72GB: 100/1/23,
      31 gates 29 aligned + 2 platform floors). ABSORBED into pr-228 here:
      the RTX 5000 bundle as delivered (patch + captures + sm120 results,
      taxonomy_sm120, 8 sm120 findings, gemm_fp8 fp8_static governed
      exception per the owner's 2026-09-30 decision, verdict script
      parametrized by AIS_SM, --matrix single-backend + writes to the harness
      results dir, sm120 fail causes, kv 'auto' declared on bf16 gates,
      gemvx/cutlass hints); plus, re-implemented from the B200 / RTX 6000
      notes whose patches are not on this box: render_golden runs the
      generator with cwd = workspace (aic-core safe_mkdir; a workspace on
      another mount rendered 124/124 as generator rejects on B300 and B200),
      path_diff prefers the RENDERED (kv None/auto) record when no
      --kv-dtype is asked, and per-SM platform-floor gate markers
      (FLOOR_SM= / FLOOR_NOTE= on a verdict line -> platform-floor verdict
      file, excluded from path_aligned on that SM, still declared coverage):
      sm120's two fp8-KV dense-MLA gates are floors (TRITON_MLA smem), so the
      sm120 upgrade_op view is all done honestly and the sm90 view stays
      32/32. The 5000 bundle's platform pin (rtx5000_sm120) was NOT taken —
      targets.platform stays the H20. NOT YET ABSORBED (need the patches or
      real work): B200's collector fix for the block_size = 64 literal in
      collect_attn.py / collect_mla_module.py (ask the framework per case;
      re-grade attn/mla gates on sm90 AND sm100), kernel_taxonomy_sm100.yaml
      seed and the b200-opharness-fixes.patch (on umb-b200-238), RTX 6000's
      platform-scoped cli_extra_args and no-baseline fails_root_caused
      semantics (sm120-opharness-fixes.patch on the 6000 box),
      fetch_inputs gated-repo mirror fallback (both), identity.attention
      column via taxonomy backend labels, platform-blind run ids, the sm120
      generator rule (bf16 KV for NVFP4 MLA on CC 12.0) and the silently
      ignored --generator-set kv_cache_dtype (generator module, separate PR).
    applies_to: ['platform:sm120', 'platform:sm100', 'platform:sm103', 'framework:vllm-0.30.0',
      'instrument:probe_driver', 'instrument:path_diff', 'instrument:workflow_check']
  taxonomy_dsa_nsa_family_covers_m3:
    statement: 'RESOLVED 2026-09-23: M3 sparse-attention kernels now label `triton` (the vocabulary name of
      MiniMaxM3SparseTritonImpl), dsa_nsa is DeepSeek-DSA only; see probe_prefill_prefix_cache_contamination.
      Original: NAMING DEBT: the kernel_taxonomy family "dsa_nsa" matches MiniMax-M3 sparse-attention kernels
      too (sparse_attn_fwd/_gqa_share_sparse/_merge_topk_attn_out/_decode_score are models/minimax_m3 Triton
      kernels, ops/sparse_attn.py). Verdicts are computed within-family by kernel-name overlap so the lumping
      is functionally harmless today, but the family name misleads readers of verdict files. Rename (e.g.
      block_sparse_attn) or split when the owner next touches the taxonomy.'
    applies_to:
    - instrument:kernel_taxonomy
    - MiniMaxAI/MiniMax-M3
    - deepseek-ai/DeepSeek-V3.2
  cross_sm_evidence_contamination:
    statement: 'HARNESS STRUCTURAL LESSON (B300 first run outside H20, 2026-09-20): gate evidence keyed by
      (fw, version) alone let a fresh arch INHERIT another arch''s green checks — with zero B300 jobs run,
      workflow_check --param sm=sm103 reported path_aligned (7 sm90 verdicts) and customizations_retested (9 sm90
      records), and saving B300 verdicts would have OVERWRITTEN the sm90 files. Same class: kernel_taxonomy was a
      de-facto SM90 vocabulary (Blackwell fmhaSm103a*/fmhaSm100f*/sm100 cutlass/deepgemm-sm100/fp4 kernels all
      unmatched -> attn path_diff went "empty vs empty" ALIGNED, a false green; missing serving kernels made dsa
      falsely diverged); per-checkpoint customizations keyed (repo, fw) carried a 143GB-H20 memory workaround to a
      275GB B300. Fixes landed on H20: results/pathdiff/<sm>/<fw>-<ver>/ + results/retests/<sm>/<fw>-<ver>.yaml
      (sm90 evidence git-mv''d; sm103 view now shows honest todos), and path_diff emits "inconclusive" when the
      collector signal set is empty (B300 patch, pending). Rule going forward: SM is a first-class dimension of
      gate evidence, taxonomy rules (arch-anchored + audited against other arches'' records before merge),
      customization facts, and case plans; editing a shared file re-opens verdicts for every SM with shipped data
      (unverified_sms when no box is available). Collectors do NOT fork per arch — dispatch stays the framework''s.'
    applies_to:
    - instrument:workflow_check
    - instrument:kernel_taxonomy
    - instrument:path_diff
    - platform:sm90
    - platform:sm103
  vllm_0290_full_op_sweep:
    statement: 'FULL-GRID VALIDATION of the in-place 0.29 upgrade (H20, 4 GPUs, 2026-09-20/21, ~290k perf rows,
      15 op tables finalized to parquet; evidence workspace facts/opsweep_full_0290/ incl. TRIAGE.md + staging_patch.diff
      — the staging rehearsal that became commit 993f9cdf). Row parity vs 0.24/0.25 baselines: gemm 111444 (exact),
      attention ctx/gen 53777/66708 (exact), computescale/scale_matrix/encoder/mla_bmm exact, msa+gdn above baseline,
      moe 58k. ALL four failure clusters root-caused, ZERO 0.29 regressions and ZERO upgrade-code bugs: (1) msa
      Triton CompilationError 1616x = kernel domain boundary — sparse_num_index_heads shards to non-power-of-2 at
      collector heads 48/96, unreachable in serving (real tp gives 4/2/1); (2+3) attention fp8-KV 1625x = HISTORICAL
      blank: 0.24/0.25 baselines contain zero fp8 rows (100% bfloat16), the grid always swept an unsupported region,
      only the error text changed; (4a) dsa ctx fp8-KV 776x = flashmla int64_stride_to_int input constraint on the
      NEW fp8 collection key — FIXME(kernel-limit) class; (4b) dsa gen IMA ~4% = RACE, audit complete
      2026-09-22: bisect exonerated the block-table fix (22 vs 19 fails on identical 300 cases) AND cudagraph
      (eager 21/300) AND the topk buffer (allocation parity with serving — both torch.empty; poison prefill 2e9
      and -1 both pass); CUDA_LAUNCH_BLOCKING pins the faulting kernel to vllm-flash-attn Hopper flash_fwd
      (flash_fwd_launch_template.h:205); compute-sanitizer memcheck serializes and the fault VANISHES (8/8, 0
      errors) — a timing race in the 0.29 FA3 sparse-MLA decode chain, worth reporting upstream. Recovery is
      operational: failures are stochastic with ~75%/round retry recovery, geometric to near-zero
      (GLM gen 300->70->17->5->2 of 8832; DeepSeek 346->106->28->8) — --resume-retry-failed sweeps recover the
      rows without touching measurement semantics. ADDENDA: (2+3) VERDICT FLIPPED AGAIN 2026-09-22 via live-engine
      probe — collector-specific, NOT a framework selector gap. head_dim=512 dense attention comes only from
      Gemma-4 (global layers: global_head_dim=512, num_global_key_value_heads=2). Real vllm serving of Gemma-4 with
      --kv-cache-dtype fp8 on SM90 GENERATES fine: Gemma4Config.verify_and_update_config
      (model_executor/models/config.py:209-256) is a model-level hook that, for heterogeneous head dims (256/512),
      forces FA4 for all layers (or TRITON_ATTN fallback) because default FA3 on Hopper cannot handle head_dim>256
      — so serving NEVER routes Gemma-4 head512 to FlashInfer (resolved backend TRITON_ATTN, candidate list
      [TRITON_ATTN]). collect_attn constructs the attention in isolation and calls the bare platform selector
      (get_attn_backend_cls) WITHOUT running that model hook, so it picks FlashInfer whose SM90 JIT cannot compile
      fp8+head512 -> the 1625 dsa... i.e. attention fp8 failures. Same class as DSA 4a / Gemma monolithic: the
      collector reproduces a backend serving never selects. Fix: the collector must select the backend serving
      actually uses for head_dim>256 (apply the Gemma4 heterogeneous-head override: FA4/Triton, never FlashInfer),
      with the config.py:209-256 citation. Evidence facts/gemma4_fp8_probe (GENERATE OK, TRITON_ATTN). (4a) VERDICT FLIPPED 2026-09-22 via live-engine probe:
      collector-specific, NOT a framework limit. fp8-KV + num_heads<32 (the collector head-sweep emulating TP>=5)
      selects fp8 mixed mode (MIN_HEADS_FOR_BF16_PREFILL=32, flashmla_sparse.py:63/307), which runs the whole batch
      as one MQA batch through the fp8 decode kernel (head padding 16->64); the collector builds the prefill as a
      SINGLE monolithic forward so num_actual_tokens=isl(32768) and stride = tokens*padded_heads*576 breaks int32.
      Real-engine tests (8 GPUs idle): TP=1 native-128-heads isl=32k fp8 runs (separate bf16 splitkv path); TP=8
      (16 heads/rank -> the SAME mixed fp8 decode kernel, padding 16->64) fed a 32768-token prompt -> GENERATE OK.
      Serving chunks the prefill (max_num_batched_tokens), keeping per-forward num_actual_tokens well under 29k;
      the collector does not chunk. Fix: the collector context construction should mirror serving''s chunked prefill
      (split at max_num_batched_tokens) -- this both removes the 776 failures AND makes large-isl context rows
      faithful to how serving actually invokes the kernel (the monolithic measurement is itself non-faithful for
      large isl; even the passing large-isl context rows warrant review). Evidence
      facts/ab_dsa_stride_{oneshot,tp8}.json.
      (1) msa kernel limit converted to an invocation-site guard raising a classified error with the framework
      citation (commit c0f7f035). dsv4 full-grid rerun on the merged lane, FINAL:
      22589/22604 collected (99.93%) across 6 ops — generation 3088/3088, paged_mqa_logits + hca_attn 3918/3918
      each, hca ctx 5840/5840 after retries; the sole residual is a DETERMINISTIC 15-case subcluster in csa ctx,
      all one shape family (seq=16 chunk + batch=64 + fp8-KV + prefix=4096, both FP8 checkpoints, heads 1-8) —
      the fp8 csa large-prefix small-tail-chunk path; classified, re-tested free on the next version bump.
      Harness lessons banked: PerfFile.SCALE_MATRIX enum gap (fixed), measurement containers must never share host
      network (setup_distributed port collisions), collection images need deps pre-baked, executor ignores --ops
      CLI order, sharding is manual via --case-filter.'
    applies_to:
    - framework:vllm-0.29.0
    - platform:sm90
    - instrument:collect.py
