  trtllm_sparse_config:
    statement: 'MiniMax-M3 on trtllm REQUIRES llmapi sparse_attention_config (algorithm: minimax_m3) to get MiniMaxM3KVCacheManagerV2
      — the generator does not render it (needs_flags). With it set, rc23/SM90 still fails deeper (MiniMaxM3SparseRuntimeBackend.forward
      missing cache args — framework gap, recheck on rc24/Blackwell). Evidence facts/trt_ab_m3_sparse.json.'
    applies_to:
    - family:m3
  trtllm_tokens_per_block:
    statement: DeepseekV4CacheManager requires tokens_per_block in [128,256]; the generator renders 64 (FPM example
