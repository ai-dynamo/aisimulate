  vllm_024:
    statement: 'NotImplementedError at load: checkpoint hf_quant excludes lm_head but NOT model.embed_tokens while
      weights are tied; vllm''s ModelOpt NVFP4 config has no embedding quant method. Real-artifact metadata x framework
