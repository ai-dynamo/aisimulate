      no harness cli_extra_args): vllm 0.30.0 rendered + fp8-KV PASS x4; sglang main (nightly 0930) PASS x4 (the
      nvidia artifact now also renders trust-remote-code / disable-flashinfer-autotune). Matrix vllm-0.30.0 back to
