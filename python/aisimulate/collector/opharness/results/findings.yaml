  probe_prefill_prefix_cache_contamination:
    statement: |
      INSTRUMENT FIX (probe_vllm, 2026-09-23): the profiled request reused the
      warmup prompt (list(range(isl))) and vllm enables prefix caching by
      default, so every "prefill" step the probe profiled was a near-total
      cache hit recomputing only the last block — a query of <= block_size
      tokens with a full-length KV. ALL 173 vllm serving records with prefill
      tables carried this residual, not an isl-token prefill. Identity verdicts
      survived wherever the residual still routes to the same kernel family
      (FA3, TRITON_ATTN), which is why it stayed invisible; DSA fp8 exposed it:
      FlashMLASparse's builder classifies query_len <= 256 (128 heads) as
      decode (flashmla_sparse.py:244 @0.29.0), so serving "prefill" evidence
      showed the fp8 DECODE kernel and path_diff flagged the collector's
      correct separate-path prefill (sparse_attn_fwd_kernel) as kernel drift.
      Cache-cold re-probes confirm: DSV3.2 fp8 prefill 688us decode kernel ->
      26.9ms sparse_attn_fwd (+cp_gather_and_upconvert); Gemma-4 fp8
      kernel_unified_attention 863us -> 10.5ms; Llama-3.1-8B FA3 41us ->
      2.08ms. Fix: ea.enable_prefix_caching=False (same policy as the sglang
      probe's --disable-radix-cache); records carry runtime.prefix_caching.
      TARGETED RE-PROBE (owner decision 2026-09-23: no full re-sweep; GEMM/MoE
      identity is not length-conditional, so only attention classes whose
      DISPATCH changes with query length were redone). Triage over the 173
      records by mechanism, then 37 + 3 records re-probed cache-cold (all ok):
        - DSA family (DSV3.2 variants, GLM-5/5.1/5.2 + FP8/NVFP4; 18): fp8-KV
          prefill evidence flipped from the fp8 DECODE kernel to
          sparse_attn_fwd_kernel (the separate-path bf16-workspace prefill),
          matching the collector; bf16-KV DSV3.2 stayed FA3.
        - MLA + fp8-KV (DeepSeek-R1/V3 fp8, Kimi-K2/K2.5, DSV3.1/K2.5/K2.6/
          K2.7 NVFP4; 12): flipped from flash_fwd_splitkv_mla (FlashMLA
          decode) to FA3 prefill — the residual query had been routed through
          the MLA decode path, so every MLA fp8 prefill row was wrong.
        - MiniMax-M3 (7): prefill still showed NO labeled attention kernel —
          that was a taxonomy gap, not the probe: 0.29 renamed the M3 Triton
          kernels (_gqa_sparse_fwd/_decode, _index_block_score,
          _decode_index_score, _topk_index_{partial,merge}); labeled `triton`
          (kernel_source_backends.yaml: MiniMaxM3SparseTritonImpl -> triton),
          closing the dsa_nsa-covers-M3 naming debt. msa029_m3_{ctx,gen} were
          previously aligned on an EMPTY attention set; now kernel-matched.
        - Dense FA3 / TRITON_ATTN / linear-attention (133 records): same
          family before and after in the three cache-cold controls (Llama,
          Gemma-4, DSV3.2 MoE/quant/routing identical; GEMM differs only in
          cuBLAS nvjet tile shape) — identity verdicts are trustworthy, prefill
          MAGNITUDES are not. build_records prints the count of such records
          on every rebuild ("NOTE: N vllm records still carry cached-residual
          prefill evidence"). Superseded raws: facts/raw_superseded/prefixcache_2026-09-23/.
      DSV4 on vllm has NO serving evidence at all (36 records, mostly `load`
      errors from the --max-num-batched-tokens 6012 trigger; the generator fix
      lives on its own branch) — unrelated to this contamination.
      The trtllm probe has the same shape (warmup and profiled prompt both
      [[1]*16], block reuse on) plus no --isl and no phase tables — a weaker
      lane that needs the same treatment. Evidence facts/reprobe_nopc/
      (candidates.json, postprocess.py), facts/pathdiff/cap_dsa_ctx_fp8_s4096_fp8gemm.json.
    applies_to:
    - instrument:probe_vllm
    - instrument:probe_trtllm
    - framework:vllm-0.29.0
    - platform:sm90
  op_coverage_vllm_0290:
    statement: |
      OP-LEVEL ALIGNMENT SWEEP (2026-09-23, after the probes were fixed): every
      vllm registry op with a serving reference now has a path_diff verdict in
      results/pathdiff/sm90/vllm-0.29.0/ (23 files, gate aligned). Captures are
      one representative cell per op at a serving model's real shape, run via
      the collector's own run_* entry (op_smoke semantics), diffed against
      cache-cold serving records (re-probed for DSV3 bf16 and Qwen3.5-0.8B).
        aligned: gemm {fp8_block/deepgemm vs DSV3.2, bf16/cublas vs Llama,
        fp8 per-tensor vs Qwen3-32B-FP8}; moe {fp8_block DSV3.2, bf16 Gemma-4,
        mxfp4 gpt-oss-120b}; mla_context {bf16 DSV3, fp8 R1}; mla_generation
        {fp8 R1}; mla_bmm_gen_pre/post; gdn {ctx: flashinfer GDN + conv1d,
        gen: fla_triton fused_recurrent} vs Qwen3.5-0.8B; compute_scale;
        plus the earlier attention/dsa/msa set.
      REAL DIVERGENCE FOUND AND FIXED — moe w4a16_mxfp4 (gpt-oss): the
      collector built a bare Mxfp4Config -> Mxfp4MoEMethod -> MARLIN, while
      vllm 0.29 overrides OCP "mxfp4" checkpoints of model_type gpt_oss to
      GptOssMxfp4Config/GptOssMxfp4MoEMethod (quantization/mxfp4.py:119-139),
      whose gpt-oss priority list (fused_moe/oracle/mxfp4.py:584-602) picks
      TRITON matmul_ogs on SM90 — exactly what the gpt-oss-120b serving probe
      shows. Same class as the Gemma-4 attention override: the collector
      constructed the generic config and lost the model-specific method.
      collect_moe.py now mirrors the override (commit in this series).
      HARNESS FIXES surfaced by the sweep: (1) path_diff picked the LAST
      matching serving record; a decode-only Qwen3.5 record beat the
      cache-cold one and produced a false collector-only `flashinfer` — records
      are now ranked by evidence quality (prefix_caching False > phase tables >
      known isl); (2) Triton autotune tile suffixes (_matmul_ogs_..._16x256x128x1
      vs _128x256x128x1, BLOCK_M from the token count) are stripped by
      normalize_kernel so kernel-drift compares kernels, not tiles;
      (3) FlashInfer GDN kernels relabeled trtllm_internal -> flashinfer (the
      vocabulary name; vllm runs them on SM90 @0.29).
      NOT ALIGNED-ABLE TODAY (no serving reference, not a collector defect):
        - mla_generation bf16-gemm cells: every DeepSeek/Kimi checkpoint is fp8
          or NVFP4, so the bf16-weight grid has no serving instance; the
          collector's fused_a_gemm there is vllm's own small-M dispatch
          (deepseek_v2.py:~915-925, num_tokens <= 16). Verdict file removed;
          the fp8 cell is the reference comparison.
        - dsv4_* (6 ops) and mhc_module: vllm DSV4 serving has no evidence
          (load errors from the 6012 token-budget trigger; generator fix on
          its own branch).
        - kda: Kimi-K3 runs only on the vllm kimi-k3 preview image; its
          records carry no kernels.
        - encoder_attention: the probe prompt is text-only, so vision-encoder
          kernels never execute in the profiled window (Qwen3-VL records have
          none) — needs a multimodal probe request.
      FOLLOW-UP: sglang (91 records at isl 32) and trtllm (74 at 16 tokens,
      block reuse on) serving evidence predates their probe fixes; their
      length-conditional classes (DSA/NSA, M3) need the same targeted
      re-probe before sglang/trtllm op verdicts are drawn.
    applies_to:
    - instrument:path_diff
    - instrument:probe_driver
    - framework:vllm-0.29.0
    - platform:sm90
    - openai/gpt-oss-120b
    - Qwen/Qwen3.5-0.8B
    - deepseek-ai/DeepSeek-V3
    - deepseek-ai/DeepSeek-R1
  op_coverage_sglang_trtllm_2026_09_24:
    statement: |
      OP-LEVEL ALIGNMENT SWEEP, sglang 0.5.16 and trtllm 1.3.0rc23 on SM90, after
      both probes were brought to the vllm standard (isl 4096, cache-cold, phase
      tables) and their length-conditional records re-probed. Captures run the
      collector through op_smoke (--case-filter/--case-prefix) or the module
      CLI's --quick / in-process entry (the sglang DSA/MSA module collectors run
      each case in a SUBPROCESS, which the parent profiler cannot see — a
      capture of the worker wrapper is silently empty).
      HARNESS DEFECT found first: path_diff graded a crashed or empty capture
      "aligned" (empty set is a subset of everything) — six broken sglang
      captures passed. Verdicts are now invalid-capture / no-collector-signal.
      COLLECTOR DRIFT ON THE PINNED VERSIONS (all fixed, each surfaced as a
      zero-kernel capture; 286 sglang + 114 vllm collector unit tests pass):
        sglang 0.5.16 — ModelRunner takes ps: ParallelState (mla_module built
        it with tp_rank/tp_size...), attention backends read model_runner.ps /
        server_args.enable_prefill_cp / enable_dp_attention /
        model_config.linear_attn_registry_result / hf_config.get_text_config()
        / is_draft_worker (attention + MLA mocks lacked them),
        Req.set_extend_input_len -> set_extend_range (mla_module, dsv4),
        ForwardBatch.init_new requires return_hidden_states_before_norm
        (mla_module context+generation, dsv4). The sglang collector had not
        run on its own pin since the bump.
        trtllm — gemm/computescale/mla_bmm imported case_generator and helper
        as bare modules (only works from collector/ cwd); GDN prefill/decode
        imported the vendored FLA Triton kernels directly while serving
        dispatches to FlashInfer's cute-DSL GDN chunk + bf16-state decode on
        SM90/SM100 (gdn_mixer.py:57-70,670; fused_sigmoid_gating_recurrent.py:
        205-238). The collector now calls the mixer's resolver for prefill
        (packed [1,T,H,D] + cu_seqlens, fp32 g — FlashInfer's contract) and
        serving's fused_sigmoid_gating_delta_rule_update for decode, labeling
        rows by the dispatch that actually ran (new kernel_source values in
        kernel_source_backends.yaml).
        path_diff/normalize — cute-DSL symbols carry tensor specs
        (…_kernel_tensorptrbf16gmemalign32o1291…): identity cut at
        _tensorptr/_object; `trtllm::` launchers excluded like vllm/sglang;
        collector EXIT_CODE_RESTART (10) is a protocol signal, not a failure.
      VERDICTS (results/pathdiff/sm90/{sglang-0.5.16,trtllm-1.3.0rc23}/):
        sglang ALIGNED: attn ctx+gen (Llama-3.1-8B shape, fa3), dsa ctx+gen
        (DSV3.2 bf16: sparse_attn_fwd/FA3 + indexer), mla ctx+gen (DSV3, fa3),
        msa ctx (M3), gemm fp8_block, moe fp8_block, gdn ctx+gen (Qwen3.5).
        trtllm ALIGNED: attn ctx (Llama, fmha_v2 causal), dsa ctx+gen (DSV3.2),
        mla ctx+gen (DSV3), gemm fp8_block, moe fp8_block, gdn ctx (FlashInfer
        chunk + trtllm conv1d).
        RESOLVED (2026-09-24, owner asked for these one at a time):
        - trtllm attention_generation (Llama-3.1-8B): NOT a collector bug —
          a cell mismatch. The first capture took the kv_len=1 cell, where
          trtllm's own heuristic declines XQA (TLLM debug: "JIT XQA is not
          used: maybe no performance gain" -> MMHA); the serving probe's
          warmup does the same at short KV (8 of 424 decisions) and selects
          XQA (kernel_mha) for the 4096-token decode. At the grid point that
          matches the probe (batch 1, kv 4095) the collector selects XQA too
          -> ALIGNED. TRTLLM_ENABLE_XQA_JIT no longer exists in rc23 binaries
          (only TRTLLM_FORCE_XQA / TRTLLM_XQA_BLOCKS_PER_SEQUENCE); the
          collector's toggle is documented as inert. Rule reinforced: capture
          the collector cell at the probe's kv length, never the first cell.
        - sglang msa_generation (MiniMax-M3): the PROBE is the unfaithful side.
          The gate (flash_with_topk_idx.py:822-826) uses score.shape[2], which
          under CUDA-graph capture is ceil(max_context_len / 128) (static
          shapes, minimax_sparse_backend.py:175-178) and the live KV length in
          eager. Production decodes under graphs; M3's context_len makes the
          static block count exceed 4096 -> topk_split, which is what the
          collector models (collect_msa_module.py:892-897, use_graph). The
          identity probe disables CUDA graphs, so it saw the eager radix path.
          probe_sglang gained --cuda-graph (recorded as probe_cuda_graph);
          M3 re-probed with graphs on: decode now runs _topk_index_partial /
          _topk_index_merge (topk_split), matching the collector -> ALIGNED
          (verdict computed with --serving-raw against that record). All
          three gates green (vllm 33, sglang 12, trtllm 9).
          HARNESS FOLLOW-UP this opens (RESOLVED 2026-09-24, owner decision:
          probes now run the framework's own mode for prefill AND decode —
          see probe_execution_mode_is_the_framework_default_2026_09_24):
          the identity probes ran eager on every backend. Any op whose
          kernel choice reads capture-time static shapes (not just M3 top-k:
          FlashMLA/FA split-KV planning, XQA multi-block, trtllm-gen decode
          scheduling are candidates) is mis-identified by an eager probe.
          The device-stream tables already see graph-replayed kernels, so the
          probes can run decode under graphs; the question for the owner is
          whether to make graph-mode the default decode evidence (production
          truth) and keep eager only for prefill.
        ROSTER GATE — RESOLVED 2026-09-24 (owner: "fp8 就用 zai-org/GLM-5.3"):
        rename landed in ac274b36 — case YAML model_paths + both alias rows,
        packaged model_configs (GLM-5.3 = Hub fp8 config, GLM-5.3-BF16 = the
