[project]
name = "aisimulate-dynamo-policy"
version = "0.13.0"
description = "Optional native Dynamo routing adapter for AISimulate"
requires-python = ">=3.11,<3.14"
license = "Apache-2.0"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
readme = "README.md"
dependencies = ["aisimulate==0.13.0"]

[project.entry-points."aisimulate.runner_factories"]
dynamo-policy = "aisimulate_dynamo_policy.runner:DynamoPolicyRunnerFactory"

[project.entry-points."aisimulate.config_adapters"]
"dynamo-policy.router" = "aisimulate_dynamo_policy.provider:DynamoPolicyConfigAdapter"

[build-system]
requires = ["maturin>=1.12,<2"]
build-backend = "maturin"

[tool.maturin]
manifest-path = "../../crates/dynamo-policy/Cargo.toml"
module-name = "aisimulate_dynamo_policy._native"
python-source = "src"
features = ["extension-module"]
exclude = ["**/__pycache__/**", "**/*.pyc"]
