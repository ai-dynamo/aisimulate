#
# Queryable-version slots, per (system, framework).
#
# Each (system, framework) exposes at most THREE queryable versions:
#   current  — the newest completed FULL collection (authored here): a
#              systematic campaign over the whole case plan on the fleet.
#   previous — the full collection this one replaced (authored here; move
#              on every bump).
#   next     — NOT authored: derived at load time as the highest data-backed
#              version newer than current. That is the in-development
#              version: single-op / single-model drops for new models land
#              there, and ops the next version lacks are served by backward
#              fill from current/older data (never forward). When nothing
#              newer than current has data, next resolves to current.
#
# The literal aliases current / previous / next are accepted anywhere a
# version is requested. Any other version is rejected loudly (test fixtures
# pinning raw data coordinates pass allow_unlisted_version=True).
# Data directories outside the slots are backward-fill / cross-backend
# sources only — deliberately kept data (multi-node comm curves, hardware
# baselines, small-heads dsa) keeps serving queries without being a version.
#
# Maintenance: a systematic upgrade PR bumps `current` (old current moves to
# `previous`) — that PR's data diff is the review surface for which families
# were recollected vs ride backward fill. ~30 lines, touched every 2-3 months.
schema_version: 1
defaults:
  # 2026-11 campaign: full collection on b200/b300/gb200/gb300/h100/h200/
  # l40s/rtx_pro_6000_server for all three frameworks promotes these to
  # current; the 2026-10 full collections move to previous. No framework has
  # data newer than its new current, so every next resolves to current.
  trtllm: {current: "1.4.0rc2", previous: "1.3.0rc29"}   # nothing newer has data -> next = current
  sglang: {current: "0.5.23", previous: "0.5.21"}        # nothing newer has data -> next = current; 0.5.20 (GLM-5.3-Flash ops drop) stays outside the slots
  vllm: {current: "0.32.0", previous: "0.30.0"}          # nothing newer has data -> next = current; 0.31.0 (GLM-5.3-Flash ops drop) is now older than current and outside the slots
overrides:
  a100_sxm:
    trtllm: {current: "1.0.0", previous: null}
    sglang: {current: "0.5.10", previous: null}
    vllm: {current: "0.14.0", previous: null}
  b60:
    # 2026-09-26: complete b60/vLLM 0.28.0 collection (attention/gemm/moe/comm)
    # promotes 0.28.0 to current; 0.26.0 moves to previous. Override systems
    # stay out of the fleet next derivation.
    vllm: {current: "0.28.0", previous: "0.26.0"}
