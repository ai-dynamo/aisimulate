name: Collector Data Check

# Fail-closed CI enforcement for the Collector V3 design
# (docs/perf_database/collector-v3-op-centric-design.md §8): every PR
# touching the perf data tree, the collector, or the perf-database tools runs
# tools/perf_database/check_collector_data.py, which fails the job on any
# provenance/reuse/placement/identity violation.
# tools/perf_database/backend_facts.py --check also runs fail-closed (AIC-1675): registry drift fails the PR.

on:
  pull_request:
    paths:
      - "src/aisim_core/systems/data/**"
      - "collector/**"
      - "tools/perf_database/**"
  workflow_dispatch:

jobs:
  check:
    name: Check collector data
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
          # No `lfs: true`: the check step only ever reads
          # parquet filenames/stems and the YAML sidecars beside them, never
          # parquet content, so LFS smudging is unneeded weight -- and would
          # fail checkout for fork PRs that can't authenticate to LFS.
          # Exception: the op-backend facts step reads parquet content via
          # pq.read_table; this is safe because the data tree's parquet is
          # plain git (no LFS) -- an LFS-pointer parquet would crash the read
          # and fail the job (still fail-closed).
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.13"

      - name: Install AIC and test dependencies
        run: |
          python -m pip install uv
          uv sync --extra dev

      - name: Check collector data (fail-closed)
        run: uv run python tools/perf_database/check_collector_data.py

      - name: Check op-backend facts registry (fail-closed)
        # AIC-1675: a data PR that lands perf rows without updating
        # collector/op_backend_facts.yaml (or mislabels kernel_source)
        # fails here instead of silently drifting the registry.
        run: uv run python tools/perf_database/backend_facts.py --check

  # Informational (never blocks the PR): full-tree perf-data sanity sweep
  # (~4 min) — flags suspicious measurements for human double-checking.
  # Unlike the check job above, this reads parquet CONTENT and therefore
  # pulls LFS (the whole data tree is ~124 MB compressed).
  # continue-on-error also covers fork PRs that cannot authenticate to LFS.
  # Gate mode (--fail-on-anomalies with per-kind thresholds) is deliberately
  # NOT enabled until the existing finding backlog is triaged.
  cross-backend-consistency:
    name: Perf data sanity (informational)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - name: Checkout code (with LFS)
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          lfs: true
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.13"

      - name: Install check script dependencies
        run: pip install pandas pyarrow numpy pyyaml "tqdm>=4.0.0"

      - name: Perf data sanity check
        run: |
          python3 tools/perf_database/check_cross_backend.py \
            --out-md cross-backend-consistency.md \
            --out-json cross-backend-consistency.json

      - name: Post triage section to job summary
        run: |
          {
            sed -n '/^# Perf data sanity/,/^## Layer 1/p' cross-backend-consistency.md | sed '$d'
            echo ""
            echo "_Full report in the \`cross-backend-consistency\` artifact._"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload consistency report artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cross-backend-consistency
          path: |
            cross-backend-consistency.md
            cross-backend-consistency.json
          retention-days: 30
