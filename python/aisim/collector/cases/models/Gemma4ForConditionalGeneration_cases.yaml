schema_version: 1
architecture: Gemma4ForConditionalGeneration
model_path: google/gemma-4-26B-A4B
model_paths:
  - google/gemma-4-26B-A4B
  - nvidia/Gemma-4-26B-A4B-NVFP4
  - nvidia/Gemma-4-31B-IT-NVFP4
include_base: true
base_ops:
  - gemm
framework_specific_base_ops:
  # Model runs leave vLLM's attention out: vLLM's Gemma 4 path adds
  # multimodal-prefix masks (image tokens attend to each other in both
  # directions) that the attention rows, which time causal requests, cannot
  # express. Full collections still time the text (causal) shapes on vLLM,
  # under this model's config (op_plans._vllm_attention_rows).
  sglang:
    - attention_context
    - attention_generation
  trtllm:
    - attention_context
    - attention_generation
description: >
  Gemma 4 hybrid SWA/global attention plus routed-MoE collection plan.

model_case_values:
  attention:
    # TRT-LLM serves Gemma 4 on its default TRTLLM attention backend
    # (Gemma4ForCausalLM.get_model_defaults, models/modeling_gemma4.py), so
    # these rows run there like every other model's.
    - id: gemma4_swa_attention
      model_path: google/gemma-4-26B-A4B
      model_aliases:
        - nvidia/Gemma-4-26B-A4B-NVFP4
      num_attention_heads: 16
      num_key_value_heads: 8
      head_dim: 256
      window_size: 1024
      sglang_runtime_window_size: 1023
      sglang_scaling: 1.0
      tensor_parallel_sizes: [1, 2, 4, 8, 16]
    - id: gemma4_global_attention
      model_path: google/gemma-4-26B-A4B
      model_aliases:
        - nvidia/Gemma-4-26B-A4B-NVFP4
      num_attention_heads: 16
      num_key_value_heads: 2
      head_dim: 512
      window_size: 0
      sglang_scaling: 1.0
      tensor_parallel_sizes: [1, 2, 4, 8, 16]
    - id: gemma4_31b_swa_attention
      model_path: nvidia/Gemma-4-31B-IT-NVFP4
      num_attention_heads: 32
      num_key_value_heads: 16
      head_dim: 256
      window_size: 1024
      sglang_runtime_window_size: 1023
      sglang_scaling: 1.0
      tensor_parallel_sizes: [1, 2, 4, 8, 16, 32]
    - id: gemma4_31b_global_attention
      model_path: nvidia/Gemma-4-31B-IT-NVFP4
      num_attention_heads: 32
      num_key_value_heads: 4
      head_dim: 512
      window_size: 0
      sglang_scaling: 1.0
      tensor_parallel_sizes: [1, 2, 4, 8, 16, 32]
  moe:
    - model_path: google/gemma-4-26B-A4B
      hidden_size: 2816
      inter_size: 704
      topk: 8
      num_experts: 128
      sglang_moe_activation: gelu
    - model_path: nvidia/Gemma-4-26B-A4B-NVFP4
      hidden_size: 2816
      inter_size: 704
      topk: 8
      num_experts: 128
      sglang_moe_activation: gelu
      quantization_modes: [bfloat16]

all_frameworks_op_cases:
  moe:
    cases: all
