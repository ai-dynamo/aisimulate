  - {backend: trtllm_gen_moe, role: moe_gemm, sms: [sm100, sm103],
     match: "^bmm_(MxE4m3|Bfloat16|E4m3|E2m1)_(MxE2m1|E2m1E2m1|E4m3E4m3)|^moe::dev::"}
  - {backend: torch_sdpa, role: attention, sms: [sm89],
     match: "^pytorch_flash::flash_fwd_kernel$"}
  # CuTe DSL dense GEMM / activation quant on Blackwell (2026-11-08, gemm gates at the new pins):
  # SGLang's TGV bf16 GEMM (unquant.py cutedsl lane), FlashInfer's NVFP4 activation quant, and
  # TRT-LLM's CuTe DSL FP4 dense GEMM with its block-size quant (NVFP4GemmUnifiedRunner tactic)
  - {backend: cutlass, role: gemm, sms: [sm100, sm103],
     match: "^kernel_cutlass_kernel_TgvGemmCuteExtKernel|^kernel_cutlass_kernel_tensorrt_llm_torchkernelsblackwelldense_blockscaled_gemm"}
  - {backend: flashinfer, role: quant, sms: [sm100, sm103],
     match: "^kernel_cutlass_kernel_flashinferquantizationkernelsnvfp4_quantize"}
  - {backend: trtllm_internal, role: quant,
     match: "^tensorrt_llm::_v1::kernels::quantize_with_block_size"}
  # vLLM's DeepSeek-V4 CuTe DSL ops (models/deepseek_v4/nvidia/ops: dequant_gather_k,
  # fused_indexer_q, sparse_attn_compress) all define `device_kernel`, so they normalize to
  # one name once the tensor-spec suffix is dropped
  - {backend: vllm_kernel, role: dsa_indexer,
     match: "^kernel_cutlass_device_kernel$"}
  # TRT-LLM rc2 (tensorrt_llm::_v1::kernels): the DeepSeek-V4 compressor, its Q norm and
  # RoPE, the FP8 KV scatter and the top-k local-to-global remap; the FP8 MLA input copy
  - {backend: trtllm_internal, role: attention,
     match: "^tensorrt_llm::(_v1::)?kernels::compressor::"}
  - {backend: trtllm_internal, role: norm_rope,
     match: "^tensorrt_llm::(_v1::)?kernels::(deepseekV4QNorm(Fused)?Kernel|mlaRoPEInplaceKernel|inverseRopeFp8QuantKernel(Pipelined)?)$"}
  - {backend: trtllm_internal, role: kvcache,
     match: "^_quant_scatter_kernel$"}
  - {backend: trtllm_internal, role: dsa_indexer,
     match: "^_deepseek_v4_local_to_global_kernel$"}
  - {backend: trtllm_internal, role: quant,
     match: "^tensorrt_llm::(_v1::)?kernels::quantizeCopyInputToFp8Kernel$"}
  - {backend: torch, role: infra,
     match: "searchsorted_cuda_kernel"}
  # SM100 DSA / DeepSeek-V4: FlashInfer's fused RoPE + FP8 Q quantization, SGLang 0.5.23's
  # wo_a activation quant and MLA KV-set + Q concat, cuBLAS GEMV, and TRT-LLM rc2's CuTe DSL
  # Blackwell paged MQA logits
  - {backend: flashinfer, role: norm_rope,
     match: "^flashinfer::RopeQuantizeKernel"}
  - {backend: sgl_kernel, role: quant,
     match: "^(sglang::)?fp8_wo_a_group_major_quant_ue8m0_kernel$"}
  - {backend: sgl_kernel, role: kvcache,
     match: "^(sglang::)?set_mla_kv_concat_q_kernel$"}
  - {backend: cublas, role: gemm,
     match: "^gemv2[NT]_kernel"}
  - {backend: trtllm_internal, role: dsa_indexer, sms: [sm100, sm103],
     match: "^kernel_cutlass_kernel_tensorrt_llm_torchattentionkernelsblackwellpaged_mqa_logit"}
  # TRT-LLM rc2 DeepSeek-V4 on Blackwell: the fused KV norm + RoPE + quant cache write, and the
  # CuTe DSL blockwise FP8 GEMM
  - {backend: trtllm_internal, role: kvcache,
     match: "^tensorrt_llm::(_v1::)?kernels::mlaKvNormRopeQuant(Context|Generation)Kernel$"}
  - {backend: cutlass, role: gemm, sms: [sm100, sm103],
     match: "^kernel_cutlass_kernel_tensorrt_llm_torchkernelsblackwellblockwise_gemm"}
  # MiniMax-M3 MSA: SGLang 0.5.23's decode block top-k; TRT-LLM rc2's Triton reference
  # (block max score, sparse softmax), FP8/BF16 paged scatter and block selection; the
  # fmha_sm100 MSA package (k2q CSR build, sparse forward + combine) as TRT-LLM and vLLM
  # vendor it, and their CuTe DSL index scorers; cuBLAS small-N GEMM
  - {backend: sgl_kernel, role: attention,
     match: "^(sglang::)?minimax_decode_topk_block_kernel"}
  - {backend: triton, role: attention,
     match: "^_block_max_score_kernel$|^_sparse_softmax_kernel$"}
  - {backend: trtllm_internal, role: kvcache,
     match: "^_fused_paged_scatter_kernel$"}
  - {backend: trtllm_internal, role: attention,
     match: "^tensorrt_llm::(_v1::)?kernels::minimaxM3SelectBlocks\\d*Kernel$|^kernel_cutlass_kernel_srcsm100fwd|^kernel_cutlass_kernel_tensorrt_llm_torchattentionkernelsblackwellminimax_m3"}
  - {backend: vllm_kernel, role: attention,
     match: "^k2q_(build_row_map|hist|row_prefix|scatter|tile_prefix_smem)_kernel$|^kernel_cutlass_kernel_srcblackwell_prefill|^kernel_cutlass_kernel_vllmmodelsminimax_m3nvidiaops"}
  - {backend: cublas, role: gemm,
     match: "^gemmSN_[NT]{2}_kernel"}
