     match: "FlatKernelTmaWarpSpecializedDeltaRule|kernel_cutlass_gdn_decode|flashinfergdn_kernels(delta_rule|blackwell)"}
  - {backend: fla_triton, role: linear_attention,
     match: "_fused_gdn_post_conv_kernel"}
