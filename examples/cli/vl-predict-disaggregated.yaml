# Native SGLang VL prediction on a disaggregated deployment: the prefill worker hosts the
# scheduler loop, the frontend stages and the vision encoder; the decode worker is a plain
# PD decode rank. Measure the frontend stages on the prefill serving host with
#   python -m aisimulate.vl.collect --config vl-predict-disaggregated.yaml --sglang-python <serving venv python>
traffic:
  source:
    type: synthetic
    input_tokens: 128
    output_tokens: 32
    images: {height: 1024, width: 1024, count: 1, encoding: png, identity: unique}
  load: {type: concurrency, concurrency: 4}
  stop: {requests: 32}
engine:
  model: Qwen/Qwen3-VL-8B-Instruct
  hardware: h200_sxm
  backend: sglang
  backend_version: 0.5.14
  mode: disaggregated
  kv_transfer: {bandwidth_gb_per_second: 50}
  workers:
    prefill:
      parallelism: {tensor: 1, replicas: 1}
      scheduler: {max_batched_tokens: 8192, max_sequences: 1}
      host_profile: {path: ./host-costs.json, frontend: python}
      vision: {cache_mib: 100, encoder_parallel: tp}
    decode:
      parallelism: {tensor: 1, replicas: 1}
      scheduler: {max_batched_tokens: 8192, max_sequences: 64}
