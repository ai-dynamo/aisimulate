# Cluster-shared G2 for two replicas with attention DP 2: four DP ranks share
# one host pool. Fixed timing isolates cache ownership from performance data.
# Compare with one private G2 cache per DP rank:
#   aisimulate predict --stack engine --config examples/cli/shared-g2-predict.yaml \
#     --set engine.workers.aggregated.kv_cache.host_offload.scope=dp_rank_local
traffic:
  source: {type: synthetic, input_tokens: 1024, output_tokens: 8, cached_prefix_tokens: 896}
  load: {type: concurrency, concurrency: 8}
  stop: {requests: 64}
engine:
  model: Qwen/Qwen3-32B-FP8
  hardware: h200_sxm
  backend: vllm
  backend_version: "0.24.0"
  context_length: 4096
  mode: aggregated
  workers:
    aggregated:
      parallelism: {replicas: 2, tensor: 1, pipeline: 1, attention_data: 2, moe_tensor: 1, moe_expert: 1}
      scheduler: {max_batched_tokens: 8192, max_sequences: 2}
      kv_cache:
        block_size: 16
        bytes_per_token: 131072
        capacity: {type: fixed, blocks: 160}
        host_offload:
          scope: cluster_shared
          num_host_blocks: 1024
          d2h_bandwidth_gbps: 32
          h2d_bandwidth_gbps: 32
          shared_d2h_bandwidth_gbps: 80
          shared_h2d_bandwidth_gbps: 80
      timing: {type: fixed, prefill_ms: 20.0, decode_ms: 5.0}
