  suggestions_per_study: 256
  algorithm: native_vizier_bayesian
  seed: 20260929
  parallel_evaluations: 8
  native_evaluation_timeout_seconds: 7200
  whole_study_timeout_seconds: null
  stop: native_budget_or_native_projection_stall
  scenario_2_engine_space: identical_to_scenario_1_not_its_winner
  scenario_3_engine_and_router_space: identical_to_scenario_2_not_its_winner
