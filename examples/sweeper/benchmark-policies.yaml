# Small, deterministic policy-regression fixture. Production qualification should
# add representative model/system/mode matrices rather than widening this smoke case.
search_space:
  model_name: meta-llama/Meta-Llama-3.1-8B
  hardware_sku: gb200
  backend: [trtllm]
  deployment_mode: [agg]
  gpu_budget: 1
  parallel_configs:
    - tp: 1
      replicas: 1
  agg_max_num_batched_tokens: [8192]
  agg_max_num_seqs: [256, 512, 1024]

workload:
  isl: 1024
  osl: 128
  request_rate: 4
  num_request_ratio: 2

goal:
  target: throughput

sweep:
  policy: rapid
  seed: 0
  max_rounds: 1
  candidates_per_round: 2
  parallel_evals: 1
