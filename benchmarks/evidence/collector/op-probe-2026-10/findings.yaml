  sm89_harness_lessons_2026_10_04:
    statement: 'HARNESS LESSONS from the first Ada campaign (each fixed in code unless marked OPEN): (1) the SDK system has
      no generator hardware profile -> resolve_facts raised and the pipeline swallowed it (l40s profile added, product-keyed
      like h100/h200; same class as sm120); (2) golden-render cache keyed on git HEAD only: an uncommitted generator edit
      re-rendered nothing (_generator_stamp = HEAD + hash of the dirty generator diff; B200 defect 3); (3) probes that die
      by a native abort (trtllm attentionOp asserts, sglang argparse) wrote no raw and the matrix said only ''crashed before
      dump'': the queue now keeps each probe''s console tail (archive/logs/<id>.tail, 400 lines) and build_matrix classifies
      from it (B200 defect 1); (4) tp>1 cells are emitted with the first N GPUs hard-coded (device=0,1,2,3) while other queues
      run on those GPUs: sglang''s tp memory-balance check and trtllm''s executor then fail for reasons that are not the model''s.
      Rerun alone on an idle group, the sglang Qwen3.8-2.4T cells show their real cause (CUDA OOM, capacity) and trtllm''s
      ''Executor worker returned error'' still carries no cause in the raw (OPEN: the server probe does not surface the worker''s
      message); a whole-group reservation in the queue plan is still needed (B200 defect 5, OPEN); (5) _fail_cause classified
      on a 200-char slice of the last line: vllm''s selector error is cut before use_sparse=True and sglang/trtllm wrap the
      real cause in epilogues, so the matrix filed DSA cells under a config cause and Nemotron under ''framework gap''. Now:
      full last line first, then a deep pass over the whole traceback ONLY for unmatched causes; (6) FLOOR_SM took one SM,
      and only the vllm verdict script had the floor mechanism (sglang / trtllm scripts now have it; comma lists everywhere,
      workflow_check understands them); (7) 4 sglang and 4 trtllm gate recipes were never checked in (sgl_attn_ctx/gen/gemma4_hd512,
      sgl_gdn_gen, trt_attn ctx/gen + fp8-KV) - written; (8) taxonomy: seeding sm89 from sm120 left 100+ kernel names unlabelled
      on Ada (cuBLAS ampere_* GEMMs, flashinfer merge-states, FLA chunk kernels): collect/unlabeled.py style scan over raws
      + captures is how the vocabulary was built and is worth promoting to a component option; (9) encoder_attn gates ask
      phase profile_run, which only probe_vllm recorded: FIXED - probe_sglang / probe_trtllm run a synthetic image through
      the vision module and record profile_run_kernels (sglang: inside the `trace` dict, where the record builder reads kernel
      tables from; the first attempt wrote it top-level and was invisible); the probe file is part of the fingerprint, so
      this costs a full sglang + trtllm re-probe (~2 h on 8 GPUs) and will on every SM that adopts it; (10) dummy staging
      for gated repos needs preprocessor_config.json for Llama-4 (vllm builds the vision tower in its profile run) and the
      tokenizer files: stage_tok.py in the workspace pulls them from unsloth / sibling mirrors - fetch_inputs.py''s bundled-config
      fallback still stops short of that (OPEN); (11) workflow_check gates_declared is red for trtllm rc29 on EVERY SM (msa_context_module
      / msa_generation_module have no trtllm gate; pre-existing on this branch, sm90 shows the same, OPEN); (12) tooling:
      pkill -f / pgrep -f patterns match the invoking shell''s own command line - kill queue wrappers by pid. (13) `--emit-queues
      --only X --plan-name P` REPLACES plan P with X''s runs only; build_records/build_matrix then resolve the dropped runs
      from older plan files whose fingerprints no longer match the raws, and whole cells turn ''stale evidence'' (hit twice
      on sm89). Either keep one plan file per --only set or re-emit the full set into it.'
    applies_to:
    - platform:sm89
    - instrument:probe_driver
    - instrument:workflow_check
    - instrument:fetch_inputs
    - instrument:path_diff
    - component:captures
  minimax_m3_dummy_dense_head_2026_10_05:
    statement: 'MINIMAX-M3 ON TRTLLM WAS NEVER A FRAMEWORK GAP - the harness dummy was. Diagnosis (L40, trtllm 1.3.0rc29,
      2026-10-05): a sitecustomize shim around MiniMaxM3SparseRuntimeBackend.forward showed the ONLY None argument is idx_k_cache;
      MiniMaxM3KVCacheManagerV2.__init__ derives its sparse layer ids from explicit kwargs (no call site passes them), else
      the executor''s sparse_attention_config (has no layer-id field), else the checkpoint convention `range(3, num_layers)`
      (sparse/minimax_m3/cache_manager.py:275-303), while the model layer follows the config''s sparse_attention_freq. The
      old m3 dummy cut kept two sparse/MoE layers renumbered 0..1 (freq [1, 1]) -> every layer sparse for the model, index-K
      cache for no layer -> the ValueError the sm90 session (findings trtllm_sparse_config, hopper_trtllm_collector_pin_rc20_to_rc29_2026_10_02)
      and the first sm89 pass both filed as a framework gap. Six config variants (no CUDA graph, no overlap scheduler, attn_backend
      FLASHINFER, tokens_per_block 64/128) fail identically, because the cut, not the config, is wrong. FIX (dummies.variants_m3):
      the sparse variant keeps the checkpoint''s 3-layer dense head in front of the first sparse layer (4 layers, freq [0,
      0, 0, 1]; same class as _ARCH_IMPLICIT_PERIODS - a framework constant the config cannot express). RESULT: MiniMaxAI/MiniMax-M3
      boots on trtllm rc29 on sm89 (kv auto and fp8), serving sparse attention = Triton `_block_max_score_kernel` + `_sparse_softmax_kernel`
      (the MSA fmha_sm100 backend is SM100-only), collector trt_msa_ctx/gen captures match: msa_ctx/gen_MiniMax-M3 gates ALIGNED
      on sm89; the msa FLOOR on the trtllm verdict script is now a re-probe request for sm90/sm100/sm103/sm120, not a framework
      fact. SIDE EFFECT, vLLM: the all-sparse dummy had also been a FALSE PASS there - with a dense head present vllm 0.30.0
      dies at ''No common block size for 16'' (v1/worker/utils.py:386): the KV manager defaults to 16, FlashAttention accepts
      MultipleOf(16), MiniMaxM3SparseBackend / MiniMaxM3IndexerBackend accept exactly [128] (models/minimax_m3/common/sparse_attention.py).
      A/B on the L40: --block-size 128 boots (facts/ab_vllm_m3/bs128), 64 fails the same way. Generator fact added: models.yaml
      profile `minimax-m3` with vllm block-size 128 (platform-neutral; the sm90 M3 vllm pass rests on the same all-sparse
      dummy and the real 60-layer checkpoint has the dense head). sglang: with the 4-layer dummy MiniMax-M3 boots on sm89
      as well (pass+custom with the sm90 `cuda_graph_backend_prefill=breakable` customization; the bare default fails the
      same mixed-chunk-prefill assertion as on sm90, facts/ab_sgl_m3/bare.json) - the earlier sm89 ''capacity'' verdict was
      the 2-layer dummy''s. NVFP4 / MXFP8 M3 variants: platform floors on sm89 as before (trtllm Marlin: ''does not support
      swiglu_gptoss_style''; sglang MXFP8 dense GEMM needs Blackwell).'
    applies_to:
    - platform:sm89
    - platform:sm90
    - framework:trtllm-1.3.0rc29
    - framework:vllm-0.30.0
    - MiniMaxAI/MiniMax-M3
    - MiniMaxAI/MiniMax-M3-MXFP8
    - nvidia/MiniMax-M3-NVFP4
    - instrument:dummies
    - component:generator_facts
    - family:m3
