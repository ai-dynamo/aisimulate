  hopper_trtllm_collector_pin_rc20_to_rc29_2026_10_02:
    statement: 'TRTLLM COLLECTOR PIN 1.3.0rc20 -> 1.3.0rc29 + MOE ROUTING PARITY (H20/sm90, 2026-10-02; owner asked whether
