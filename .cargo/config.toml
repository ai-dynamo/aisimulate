[env]
# Build jemalloc for 64 KiB pages so one aarch64 wheel runs on 4, 16 and 64 KiB page kernels.
AARCH64_UNKNOWN_LINUX_GNU_JEMALLOC_SYS_WITH_LG_PAGE = { value = "16", force = true }
