[workspace]
resolver = "3"

[package]
name = "aisim-aiperf-workload-runner"
version = "0.0.0"
edition = "2024"
publish = false
autobins = false
license = "Apache-2.0"

[features]
real-gpu-proof = ["aisimulate-core/embed-python"]

[lib]
name = "aisim_aiperf_workload_runner"
path = "src/lib.rs"

[dependencies]
aisimulate-core = { package = "aisim-core", path = "../../core", default-features = false }
anyhow = "1"
async-trait = "0.1"
blake3 = "1"
serde_json = "1"
tokio = { version = "1", features = ["rt", "sync", "macros"] }
tokio-util = "0.7"
uuid = { version = "1", features = ["v4"] }
aiperf-agentx = { path = "../../../../../../../aiperf-rs/.worktrees/prove-simple-execution/crates/graph/agentx" }
aiperf-timing = { path = "../../../../../../../aiperf-rs/.worktrees/prove-simple-execution/crates/scheduling/timing" }
aiperf-registry = { path = "../../../../../../../aiperf-rs/.worktrees/prove-simple-execution/crates/libs/registry" }
aiperf-clock = { path = "../../../../../../../aiperf-rs/.worktrees/prove-simple-execution/crates/libs/clock" }
aiperf-clock-runtime = { path = "../../../../../../../aiperf-rs/.worktrees/prove-simple-execution/crates/libs/clock-runtime" }
aiperf-config = { path = "../../../../../../../aiperf-rs/.worktrees/prove-simple-execution/crates/config/config" }
aiperf-dataset = { path = "../../../../../../../aiperf-rs/.worktrees/prove-simple-execution/crates/dataset/dataset" }
aiperf-dataset-loaders = { path = "../../../../../../../aiperf-rs/.worktrees/prove-simple-execution/crates/dataset/loaders" }
aiperf-dataset-synthesis = { path = "../../../../../../../aiperf-rs/.worktrees/prove-simple-execution/crates/dataset/synthesis" }
aiperf-dispatch = { path = "../../../../../../../aiperf-rs/.worktrees/prove-simple-execution/crates/inference/dispatch" }
aiperf-distributed-model = { path = "../../../../../../../aiperf-rs/.worktrees/prove-simple-execution/crates/engine/distributed/model" }
aiperf-endpoints = { path = "../../../../../../../aiperf-rs/.worktrees/prove-simple-execution/crates/inference/endpoints" }
aiperf-engine-input = { path = "../../../../../../../aiperf-rs/.worktrees/prove-simple-execution/crates/engine/input" }
aiperf-engine-kernel = { path = "../../../../../../../aiperf-rs/.worktrees/prove-simple-execution/crates/engine/kernel" }
aiperf-engine-phase = { path = "../../../../../../../aiperf-rs/.worktrees/prove-simple-execution/crates/engine/phase" }
aiperf-exchange-model = { path = "../../../../../../../aiperf-rs/.worktrees/prove-simple-execution/crates/inference/exchange-model" }
aiperf-multiturn = { path = "../../../../../../../aiperf-rs/.worktrees/prove-simple-execution/crates/dataset/multiturn" }
aiperf-protocol = { path = "../../../../../../../aiperf-rs/.worktrees/prove-simple-execution/crates/config/protocol" }
aiperf-request-execution = { path = "../../../../../../../aiperf-rs/.worktrees/prove-simple-execution/crates/inference/request-execution" }
aiperf-rng = { path = "../../../../../../../aiperf-rs/.worktrees/prove-simple-execution/crates/libs/rng" }
aiperf-tokenizers = { path = "../../../../../../../aiperf-rs/.worktrees/prove-simple-execution/crates/inference/tokenizers" }
aiperf-adaptive = { path = "../../../../../../../aiperf-rs/.worktrees/prove-simple-execution/crates/scheduling/adaptive" }
aiperf-engine-graph = { path = "../../../../../../../aiperf-rs/.worktrees/prove-simple-execution/crates/engine/graph", features = ["streaming"] }
aiperf-graph = { path = "../../../../../../../aiperf-rs/.worktrees/prove-simple-execution/crates/graph/graph" }
aiperf-graph-model = { path = "../../../../../../../aiperf-rs/.worktrees/prove-simple-execution/crates/graph/model" }
aiperf-metrics = { path = "../../../../../../../aiperf-rs/.worktrees/prove-simple-execution/crates/metrics/metrics" }
aiperf-metrics-model = { path = "../../../../../../../aiperf-rs/.worktrees/prove-simple-execution/crates/metrics/model" }
aiperf-records = { path = "../../../../../../../aiperf-rs/.worktrees/prove-simple-execution/crates/metrics/records" }
aiperf-segment-store = { path = "../../../../../../../aiperf-rs/.worktrees/prove-simple-execution/crates/dataset/segment-store" }
aiperf-export = { path = "../../../../../../../aiperf-rs/.worktrees/prove-simple-execution/crates/export/export", default-features = false }
aiperf-report-model = { path = "../../../../../../../aiperf-rs/.worktrees/prove-simple-execution/crates/export/report-model" }
aiperf-report-io = { path = "../../../../../../../aiperf-rs/.worktrees/prove-simple-execution/crates/export/report-io" }

[[test]]
name = "agentx_semantics"
path = "tests/agentx_semantics.rs"

[[test]]
name = "real_gpu"
path = "tests/real_gpu.rs"
required-features = ["real-gpu-proof"]

[dev-dependencies]
aiperf-report-io = { path = "../../../../../../../aiperf-rs/.worktrees/prove-simple-execution/crates/export/report-io" }
aiperf-engine-kernel = { path = "../../../../../../../aiperf-rs/.worktrees/prove-simple-execution/crates/engine/kernel", features = ["test-support"] }
tokio = { version = "1", features = ["full"] }
tempfile = "3"
bytes = "1"
futures = "0.3"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
aiperf-engine-capture = { path = "../../../../../../../aiperf-rs/.worktrees/prove-simple-execution/crates/engine/capture" }
aiperf-engine-request = { path = "../../../../../../../aiperf-rs/.worktrees/prove-simple-execution/crates/engine/request" }
aiperf-graph = { path = "../../../../../../../aiperf-rs/.worktrees/prove-simple-execution/crates/graph/graph" }
aiperf-graph-model = { path = "../../../../../../../aiperf-rs/.worktrees/prove-simple-execution/crates/graph/model" }
aiperf-metrics = { path = "../../../../../../../aiperf-rs/.worktrees/prove-simple-execution/crates/metrics/metrics" }
aiperf-metrics-model = { path = "../../../../../../../aiperf-rs/.worktrees/prove-simple-execution/crates/metrics/model" }
aiperf-records = { path = "../../../../../../../aiperf-rs/.worktrees/prove-simple-execution/crates/metrics/records" }
aiperf-report-model = { path = "../../../../../../../aiperf-rs/.worktrees/prove-simple-execution/crates/export/report-model" }
aiperf-segment-store = { path = "../../../../../../../aiperf-rs/.worktrees/prove-simple-execution/crates/dataset/segment-store" }
aiperf-test-support = { path = "../../../../../../../aiperf-rs/.worktrees/prove-simple-execution/crates/testing/test-support", features = ["archive", "clock", "tracing"] }
aiperf-transports = { path = "../../../../../../../aiperf-rs/.worktrees/prove-simple-execution/crates/inference/transport/transports" }
