[package]
name = "aisimulate-steppable-plugin"
description = "Dynamic SteppableReplay backend for AIPerf"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
aisimulate-core = { path = "../core" }
aisimulate-placement-abi = { path = "../placement-abi" }
aiperf-steppable-abi = { path = "../../../../dynamic-simulation-abi/crates/steppable-abi" }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
aisimulate-core = { path = "../core", features = ["placement-test-fixture"] }
