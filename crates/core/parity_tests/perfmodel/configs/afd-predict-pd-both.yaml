traffic:
  source:
    type: synthetic
    input_tokens: 1024
    output_tokens: 128
  load:
    type: concurrency
    concurrency: 8
  stop:
    requests: 32
engine:
  mode: disaggregated
  model: Qwen/Qwen3-30B-A3B
  hardware: h200_sxm
  backend: sglang
  backend_version: 0.5.14
  context_length: max
  workers:
    prefill:
      type: afd
      afd:
        n_a_nodes: 1
        n_f_nodes: 1
        tp_a: 1
        a_batch_size: 12
        num_microbatches: 3
    decode:
      type: afd
      afd:
        n_a_nodes: 2
        n_f_nodes: 1
        tp_a: 1
        a_batch_size: 18
        num_microbatches: 3
  kv_transfer:
    bytes_per_token: auto
    bandwidth_gb_per_second: 50
evaluation:
  sla:
    ttft_ms: 800
    itl_ms: 30
