

traffic:
  source:
    type: synthetic
    input_tokens: 1024
    output_tokens: 128
  load:
    type: concurrency
    concurrency: 8
  stop:
    requests: 32
engine:
  mode: disaggregated
  model: Qwen/Qwen3-30B-A3B
  hardware: h200_sxm
  backend: sglang
  backend_version: 0.5.14
  context_length: max
  workers:
    prefill:
      parallelism:
        replicas: 1
        tensor: 8
        pipeline: 1
        attention_data: 1
        moe_tensor: 8
        moe_expert: 1
      scheduler:
        max_batched_tokens: 8192
        max_sequences: 18
    decode:
      type: afd
      afd:
        n_a_nodes: 1
        n_f_nodes: 1
        tp_a: 1
        a_batch_size: 18
        num_microbatches: 3
evaluation:
  sla:
    ttft_ms: 800
    itl_ms: 30
