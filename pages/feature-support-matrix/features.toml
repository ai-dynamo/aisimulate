# Feature Support Matrix: serving techniques AISimulate simulates for each engine.
#
# Update a cell in the pull request that changes the feature, and keep the
# composition boundaries in docs/replay/features.md in step. A cell reflects
# what this branch's configuration validators accept, not what is planned.
# Values:
#   "supported"      replayed event by event; limits on the linked page are edge cases.
#   "limited"        modeled, but common configurations are rejected or only an
#                    analytical estimate exists; the row's note names the limits.
#   "not_supported"  rejected, or not modeled.
#   "na"             the upstream engine has no such feature.
# Append ":<tag>" to qualify a cell, as in "limited:analytical".
# `doc` is a path under docs/, optionally with an anchor that exists there.

schema_version = 1
engines = ["vLLM", "SGLang", "TensorRT-LLM"]

[[sections]]
id = "topology"
title = "Topology and parallelism"

[[sections.rows]]
name = "Aggregated serving"
doc = "replay/engine/workers.md"
cells = ["supported", "supported", "supported"]
note = "Engine-specific scheduler and cache admission."

[[sections.rows]]
name = "Prefill/decode disaggregation"
doc = "replay/engine/kv-transfer.md"
cells = ["supported", "supported", "supported"]
note = "Independently sized prefill and decode pools."

[[sections.rows]]
name = "Tensor and expert parallelism"
doc = "perf-model/configuration.md"
cells = ["supported", "supported", "supported"]
note = "Priced by the performance model; see the FPE matrix per model and GPU."

[[sections.rows]]
name = "Attention data parallelism"
doc = "replay/engine/workers.md#replicas-and-attention-dp"
cells = ["supported", "supported", "supported"]
note = "Rank-local scheduling; a grouped pass ends at the slowest rank."

[[sections.rows]]
name = "Context parallelism"
doc = "perf-model/configuration.md#decode-context-parallelism"
# TensorRT-LLM CP has no performance data (generator/config/backend_config_mapping.yaml).
cells = ["limited", "limited", "not_supported"]
note = "Prediction only; decode CP depends on the model family."

[[sections.rows]]
name = "Attention–FFN disaggregation"
doc = "replay/engine/analytical.md#afd"
cells = ["limited:analytical", "limited:analytical", "limited:analytical"]
note = "Analytical estimate only, for fixed-length synthetic requests; no trace replay."

[[sections.rows]]
name = "Encoder disaggregation (multimodal)"
doc = "replay/engine/analytical.md#epd"
# Native encoder pools are SGLang-only; analytical pools accept every engine.
cells = ["limited:analytical", "limited", "limited:analytical"]
note = "SGLang replays static Qwen3-VL encoder pools event by event; the analytical estimate adds mean encoder latency for Qwen3-VL and Kimi K3 towers."

[[sections]]
id = "scheduling"
title = "Scheduling and batching"

[[sections.rows]]
name = "Continuous batching, chunked prefill"
doc = "replay/engine/workers.md#batch-limits"
cells = ["supported", "supported", "supported"]
note = "Engine-specific admission and token budgets; SGLang --enable-mixed-chunk (off upstream by default) is not modeled."

[[sections.rows]]
name = "Prefix caching (G1 reuse)"
doc = "replay/engine/kv-cache.md#gpu-cache-g1"
cells = ["supported", "supported", "supported"]
note = "Backend block and admission rules apply."

[[sections.rows]]
name = "Sub-block prefix reuse"
doc = "replay/engine/kv-cache.md#gpu-cache-g1"
# Upstream vLLM caches only full blocks (docs/design/prefix_caching.md); its hybrid-KV align
# mode matches at a finer unit (prefix_match_unit here). SGLang pages default to one token.
# TensorRT-LLM reuses partially matched blocks by default (enable_partial_reuse); Replay
# reuses only complete blocks.
cells = ["limited:hybrid KV", "supported", "not_supported"]
note = "vLLM reuses whole blocks, except hybrid KV models at prefix_match_unit; SGLang matches per token at page size 1; TensorRT-LLM's default partial block reuse is not modeled."

[[sections.rows]]
name = "Hybrid KV cache (per-request state)"
doc = "replay/engine/kv-cache.md#state-cache"
# config/engine.py: state_cache requires backend=vllm, aggregated or disaggregated, G1 only.
cells = ["limited", "not_supported", "not_supported"]
note = "Kimi K3 and DeepSeek V4 state in G1, aggregated and P/D; prefix reuse resumes from state snapshots. No G2/G3 or recommend."

[[sections.rows]]
name = "Frontend tokenization cost"
doc = "replay/engine/README.md#request-tokenization"
cells = ["supported", "supported", "supported"]
note = "Each worker's tokenizer servers add a fixed plus per-input-token delay."

[[sections.rows]]
name = "Response detokenization cost"
doc = "replay/engine/README.md#detokenization"
cells = ["supported", "supported", "supported"]
note = "Each emitting worker's detokenizer servers add a fixed plus per-output-token delay before the client sees tokens."

