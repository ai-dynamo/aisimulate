# Feature Support Matrix: serving techniques AISimulate simulates for each engine.
#
# Update a cell in the pull request that changes the feature. A cell reflects
# what this branch's configuration validators accept, not what is planned.
# Values: "supported", "not_supported", or "na" when the upstream engine has no
# such feature. Append ":<tag>" to qualify a cell, as in "supported:analytical".
# `doc` is a path under docs/, optionally with an anchor that exists there.

schema_version = 1
engines = ["vLLM", "SGLang", "TensorRT-LLM"]

[[sections]]
id = "topology"
title = "Topology and parallelism"

[[sections.rows]]
name = "Aggregated serving"
doc = "replay/engine/workers.md"
cells = ["supported", "supported", "supported"]
note = "Engine-specific scheduler and cache admission."

[[sections.rows]]
