# Modified topology/configuration; source references and attribution: KUBERNETES.md.
apiVersion: resource.nvidia.com/v1beta1
kind: ComputeDomain
metadata:
  name: agentx-glm52-cd
  namespace: hzhou
spec:
  numNodes: 0
  channel:
    allocationMode: Single
    resourceClaimTemplate:
      name: agentx-glm52-channel
---
apiVersion: nvidia.com/v1beta1
kind: DynamoGraphDeployment
metadata:
  name: agentx-glm52-hicache
  namespace: hzhou
  labels:
    dynamo.nvidia.com/developer: hongkuanz
    app.kubernetes.io/part-of: agentx-glm52-smoke
spec:
  backendFramework: sglang
  env:
    - {name: HF_HOME, value: /model-cache}
    - {name: HF_HUB_OFFLINE, value: '1'}
    - {name: TRANSFORMERS_OFFLINE, value: '1'}
    - {name: XDG_CACHE_HOME, value: /tmp/agentx-cache}
    - {name: FLASHINFER_WORKSPACE_BASE, value: /tmp/flashinfer}
    - {name: DYN_REQUEST_PLANE, value: tcp}
    - {name: DYN_EVENT_PLANE, value: zmq}
    - {name: NCCL_CUMEM_ENABLE, value: '1'}
    - {name: NCCL_MNNVL_ENABLE, value: '1'}
    - {name: UCX_TLS, value: 'cuda_copy,cuda_ipc,sm,self,tcp'}
    - {name: UCX_CUDA_IPC_ENABLE_MNNVL, value: 'y'}
    - {name: SGLANG_DISAGGREGATION_NIXL_BACKEND, value: UCX}
    - {name: SGLANG_DISAGGREGATION_WAITING_TIMEOUT, value: '900'}
    - {name: SGLANG_USE_MESSAGE_QUEUE_BROADCASTER, value: '0'}
    - {name: SGLANG_DISABLE_TP_MEMORY_INBALANCE_CHECK, value: '1'}
  components:
    - name: Frontend
      type: frontend
      replicas: 1
      runtimeVersionOverride: 1.5.0
      podTemplate:
        spec:
          imagePullSecrets: [{name: nvcr-secret}]
          nodeSelector:
            kubernetes.io/hostname: gke-brugdizq-dgxc-k8-customer-gpu-w0e-32ae6790-tqtb
          tolerations: &tolerations
            - {key: kubernetes.io/arch, operator: Equal, value: arm64, effect: NoSchedule}
            - {key: nvidia.com/gpu, operator: Exists, effect: NoSchedule}
          containers:
            - name: main
              image: &image nvcr.io/nvidian/dynamo-dev/sglang-agentx@sha256:a0199d04c53a54dfa6ea3d37eb7d559afb55047a1b290bb783c441b63fb72688
              command: [python3, -m, dynamo.frontend]
              args: [--router-mode, kv, --http-port, '8000', --trust-remote-code]
              resources:
                requests: {cpu: '2', memory: 8Gi}
                limits: {memory: 16Gi}
              volumeMounts: &modelMount
                - {name: model-cache, mountPath: /model-cache, readOnly: true}
          volumes: &modelVolume
            - name: model-cache
              persistentVolumeClaim: {claimName: shared-model-cache, readOnly: true}
    - name: Prefill
      type: prefill
      replicas: 1
      runtimeVersionOverride: 1.5.0
      multinode: {nodeCount: 2}
      sharedMemorySize: 64Gi
      podTemplate:
        spec:
          imagePullSecrets: [{name: nvcr-secret}]
          tolerations: *tolerations
          nodeSelector: {nvidia.com/gpu.product: NVIDIA-GB200}
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: kubernetes.io/hostname
                        operator: In
                        values:
                          - gke-brugdizq-dgxc-k8-customer-gpu-w0e-32ae6790-lv8c
                          - gke-brugdizq-dgxc-k8-customer-gpu-w0e-32ae6790-ss59
          resourceClaims: &claims
            - {name: compute-domain-channel, resourceClaimTemplateName: agentx-glm52-channel}
          terminationGracePeriodSeconds: 60
          containers:
            - name: main
              image: *image
              command: [python3, -m, dynamo.sglang]
              args:
                - --model-path
                - /model-cache/models--nvidia--GLM-5.2-NVFP4/snapshots/53e0691e21895a3863a606dfd12910c69eba94ab
                - --served-model-name
                - nvidia/GLM-5.2-NVFP4
                - --host
                - 0.0.0.0
                - --trust-remote-code
                - --tp
                - '8'
                - --dp
                - '8'
                - --ep-size
                - '8'
                - --enable-dp-attention
                - --enable-dp-lm-head
                - --quantization
                - modelopt_fp4
                - --kv-cache-dtype
                - fp8_e4m3
                - --context-length
                - '1048576'
                - --mem-fraction-static
                - '0.8'
                - --max-running-requests
                - '16'
                - --chunked-prefill-size
                - '65536'
                - --max-prefill-tokens
                - '16384'
                - --page-size
                - '64'
                - --attention-backend
                - dsa
                - --dsa-prefill-backend
                - trtllm
                - --dsa-decode-backend
                - trtllm
                - --moe-runner-backend
                - flashinfer_cutlass
                - --fp4-gemm-backend
                - flashinfer_cutlass
                - --moe-a2a-backend
                - none
                - --disable-cuda-graph
                - --speculative-algorithm
                - EAGLE
                - --speculative-num-steps
                - '1'
                - --speculative-eagle-topk
                - '1'
                - --speculative-num-draft-tokens
                - '2'
                - --speculative-moe-runner-backend
                - flashinfer_cutlass
                - --enable-hierarchical-cache
                - --hicache-size
                - '135'
                - --hicache-write-policy
                - write_back
                - --hicache-io-backend
                - direct
                - --hicache-mem-layout
                - page_first_direct
                - --disaggregation-mode
                - prefill
                - --disaggregation-transfer-backend
                - nixl
                - --disaggregation-bootstrap-port
                - '12345'
                - --enable-cache-report
                - --enable-metrics
                - --weight-loader-prefetch-checkpoints
                - --enable-flashinfer-allreduce-fusion
              env:
                - {name: SGLANG_ENABLE_UNIFIED_RADIX_TREE, value: '1'}
                - {name: SGLANG_HICACHE_DEBUG_LOG, value: '1'}
              resources:
                claims: [{name: compute-domain-channel}]
                requests: {cpu: '64', memory: 800Gi, nvidia.com/gpu: '4'}
                limits: {memory: 820Gi, nvidia.com/gpu: '4'}
              securityContext: &security
                runAsUser: 0
                capabilities: {add: [IPC_LOCK, SYS_RESOURCE]}
              startupProbe: &startup
                httpGet: {path: /live, port: 9090}
                periodSeconds: 10
                failureThreshold: 180
                timeoutSeconds: 5
              volumeMounts: *modelMount
          volumes: *modelVolume
    - name: Decode
      type: decode
      replicas: 1
      runtimeVersionOverride: 1.5.0
      sharedMemorySize: 64Gi
      podTemplate:
        spec:
          imagePullSecrets: [{name: nvcr-secret}]
          tolerations: *tolerations
          nodeSelector:
            kubernetes.io/hostname: gke-brugdizq-dgxc-k8-customer-gpu-w0e-32ae6790-tqtb
            nvidia.com/gpu.product: NVIDIA-GB200
          resourceClaims: *claims
          terminationGracePeriodSeconds: 60
          containers:
            - name: main
              image: *image
              # Nightly disagg + speculative decode FPM crashes on seq_lens_cpu=None.
              # Disable only the operator's automatic FPM opt-in, not normal metrics.
              command: [env, -u, DYN_FORWARDPASS_METRIC_PORT, python3, -m, dynamo.sglang]
              args:
                - --model-path
                - /model-cache/models--nvidia--GLM-5.2-NVFP4/snapshots/53e0691e21895a3863a606dfd12910c69eba94ab
                - --served-model-name
                - nvidia/GLM-5.2-NVFP4
                - --host
                - 0.0.0.0
                - --trust-remote-code
                - --tp
                - '4'
                - --quantization
                - modelopt_fp4
                - --kv-cache-dtype
                - fp8_e4m3
                - --context-length
                - '1048576'
                - --mem-fraction-static
                - '0.9'
                - --max-running-requests
                - '16'
                - --chunked-prefill-size
                - '64'
                - --max-prefill-tokens
                - '16384'
                - --page-size
                - '64'
                - --attention-backend
                - dsa
                - --dsa-prefill-backend
                - trtllm
                - --dsa-decode-backend
                - trtllm
                - --moe-runner-backend
                - flashinfer_trtllm
                - --fp4-gemm-backend
                - flashinfer_cutlass
                - --moe-a2a-backend
                - none
                - --cuda-graph-max-bs
                - '16'
                - --speculative-algorithm
                - EAGLE
                - --speculative-num-steps
                - '2'
                - --speculative-eagle-topk
                - '1'
                - --speculative-num-draft-tokens
                - '3'
                - --speculative-moe-runner-backend
                - flashinfer_trtllm
                - --disable-radix-cache
                - --disaggregation-decode-extra-slots
                - '0'
                - --stream-interval
                - '30'
                - --disaggregation-mode
                - decode
                - --disaggregation-transfer-backend
                - nixl
                - --disaggregation-bootstrap-port
                - '12345'
                - --enable-cache-report
                - --enable-metrics
                - --weight-loader-prefetch-checkpoints
                - --enable-flashinfer-allreduce-fusion
              env:
                - {name: SGLANG_SIMULATE_ACC_LEN, value: '2.5'}
                - {name: SGLANG_SIMULATE_ACC_METHOD, value: match-expected}
                - {name: SGLANG_SIMULATE_ACC_TOKEN_MODE, value: real-draft-token}
                - {name: SGLANG_CLIP_MAX_NEW_TOKENS_ESTIMATION, value: '8'}
                - {name: SGLANG_MOE_NVFP4_DISPATCH, value: '1'}
                - {name: SGLANG_NVFP4_CKPT_FP8_NEXTN_MOE, value: '1'}
              resources:
                claims: [{name: compute-domain-channel}]
                requests: {cpu: '64', memory: 400Gi, nvidia.com/gpu: '4'}
                limits: {memory: 600Gi, nvidia.com/gpu: '4'}
              securityContext: *security
              startupProbe: *startup
              volumeMounts: *modelMount
          volumes: *modelVolume
