traffic:
  source: {type: synthetic, input_tokens: 32, output_tokens: 4}
  load: {type: poisson, requests_per_second: 20.0, seed: 14}
  stop: {requests: 6}
engine:
  mode: disaggregated
  model: tests/e2e/configs/unified_cli/fixtures/tiny-model
  hardware: h200_sxm
  backend: vllm
  context_length: 2048
  kv_transfer: {bytes_per_token: auto, bandwidth_gb_per_second: 400.0, timing_mode: destination_missing}
  workers:
    prefill:
      parallelism:
        preset:
          - {replicas: 1, tensor: 1, pipeline: 1, attention_data: 1, moe_tensor: 1, moe_expert: 1}
      scheduler: {max_batched_tokens: 8192, max_sequences: 1}
      kv_cache: {block_size: 64, prefix_caching: true, capacity: {type: fixed, blocks: 256}}
      timing: {type: fixed, prefill_ms: 1, decode_ms: 1}
    decode:
      parallelism:
        preset: false
        replicas: {range: {min: 1, max: 2, scale: log}}
        tensor: 1
        pipeline: 1
        attention_data: 1
        moe_tensor: 1
        moe_expert: 1
      scheduler: {max_batched_tokens: 8192, max_sequences: 256}
      kv_cache: {block_size: 64, prefix_caching: true, capacity: {type: fixed, blocks: 256}}
      timing: {type: fixed, prefill_ms: 1, decode_ms: 1}
optimization:
  target: pareto
  constraints: {max_candidate_gpus: 3}
optimizer: {algorithm: random, max_trials: 4, parallelism: 1, candidate_timeout_seconds: 30.0, seed: 14}
