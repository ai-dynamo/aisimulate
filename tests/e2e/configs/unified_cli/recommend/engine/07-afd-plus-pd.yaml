traffic:
  source:
    type: synthetic
    input_tokens: 8
    output_tokens: 3
  load:
    type: concurrency
    concurrency: 2
  stop:
    requests: 4
engine:
  mode: disaggregated
  model: Qwen/Qwen3-30B-A3B
  hardware: h200_sxm
  backend: sglang
  backend_version: 0.5.14
  context_length: 2048
  workers:
    prefill:
      parallelism:
        preset:
        - replicas: 1
          tensor: 1
          pipeline: 1
          attention_data: 1
          moe_tensor: 1
          moe_expert: 1
      scheduler:
        max_batched_tokens: 8192
        max_sequences: 8
      timing:
        type: fixed
        prefill_ms: 2
        decode_ms: 2
    decode:
      type: afd
      afd:
        a_batch_size: 8
        tp_a: 1
        num_microbatches: 3
optimization:
  target: throughput_per_gpu
  constraints:
    max_candidate_gpus: 24
optimizer:
  algorithm: random
  max_trials: 1
  parallelism: 1
  candidate_timeout_seconds: 30.0
  seed: 17
