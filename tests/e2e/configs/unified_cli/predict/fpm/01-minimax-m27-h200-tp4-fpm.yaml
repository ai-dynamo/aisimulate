# Whole-forward (FPM) timing from the bundled MiniMaxAI/MiniMax-M2.7 cell at h200_sxm/vllm/0.25.1.
# That version sits outside the queryable slots, so the test that runs this file sets
# AIC_ALLOW_UNLISTED_VERSIONS=1; the generic case matrix in predict/engine does not.
engine:
  mode: aggregated
  model: MiniMaxAI/MiniMax-M2.7
  hardware: h200_sxm
  backend: vllm
  backend_version: "0.25.1"
  context_length: 8192
  workers:
    aggregated:
      parallelism: {replicas: 1, tensor: 4, pipeline: 1, attention_data: 1, moe_tensor: 4, moe_expert: 1}
      scheduler: {max_batched_tokens: 8192, max_sequences: 256}
      kv_cache: {block_size: 64, prefix_caching: false, capacity: {type: default}}
      timing: {type: default, forward_model: fpm}
traffic:
  source: {type: synthetic, input_tokens: 1024, output_tokens: 32}
  load: {type: concurrency, concurrency: 4}
  stop: {requests: 8}
