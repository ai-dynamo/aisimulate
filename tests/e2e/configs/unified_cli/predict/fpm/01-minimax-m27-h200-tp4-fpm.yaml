# Supply the external parquet below and its adjacent reviewed-fpm.metadata.json.
# The pair must cover MiniMaxAI/MiniMax-M2.7 on h200_sxm/vllm/0.25.1 at TP4.
# Set AIC_ALLOW_UNLISTED_VERSIONS=1 for this version outside the queryable slots.
engine:
  mode: aggregated
  model: MiniMaxAI/MiniMax-M2.7
  hardware: h200_sxm
  backend: vllm
  backend_version: "0.25.1"
  context_length: 8192
  workers:
    aggregated:
      parallelism: {replicas: 1, tensor: 4, pipeline: 1, attention_data: 1, moe_tensor: 4, moe_expert: 1}
      scheduler: {max_batched_tokens: 8192, max_sequences: 256}
      kv_cache: {block_size: 64, prefix_caching: false, capacity: {type: default}}
      timing:
        type: default
        forward_model: fpm
        fpm_parquet_path: /data/reviewed-fpm.parquet
traffic:
  source: {type: synthetic, input_tokens: 1024, output_tokens: 32}
  load: {type: concurrency, concurrency: 4}
  stop: {requests: 8}
